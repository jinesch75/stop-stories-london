/wiki/Rotherhithe_railway_station"}], "ll": [[51.500817, -0.052048]]}, "Royal Albert": {"name": "Royal Albert", "q": "Newham", "zone": "3", "head": "Named after the Royal Albert Dock, which honours Prince Albert, husband of Queen Victoria.", "text": "The dock opened in 1880 and was the second of the three Royal Docks. Its warehouses handled chilled meat, bananas and tobacco.", "links": [{"t": "Royal Albert Dock, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Albert_Dock,_London"}, {"t": "Royal Albert DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Albert_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.508357, 0.045935]]}, "Royal Oak": {"name": "Royal Oak", "q": "Westminster", "zone": "2", "head": "Named after a pub called the Royal Oak.", "text": "The pub name recalls the oak tree at Boscobel in Shropshire where the future Charles II hid from Parliament's soldiers in 1651. The station opened in 1871.", "links": [{"t": "Royal Oak", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Oak"}, {"t": "Royal Oak tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Oak_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.519113, -0.188748]]}, "Royal Victoria": {"name": "Royal Victoria", "q": "Newham", "zone": "3", "head": "Named after the Royal Victoria Dock, which honours Queen Victoria.", "text": "It opened in 1855 on marshland, the first of the three Royal Docks, and was built for large steamships with direct railway connections.", "links": [{"t": "Royal Victoria Dock", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Victoria_Dock"}, {"t": "Royal Victoria DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Victoria_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.509336, 0.018497]]}, "Ruislip": {"name": "Ruislip", "q": "Hillingdon", "zone": "6", "head": "'Ruislip' means the leaping place where rushes grow.", "text": "It comes from Old English rysc, rush, and hlȳp, a leap: probably a narrow spot on the River Pinn that could be jumped across. The station opened in 1904.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "Ruislip tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.571354, -0.421898]]}, "Ruislip Gardens": {"name": "Ruislip Gardens", "q": "Hillingdon", "zone": "5", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "The leap was probably a narrow crossing on the River Pinn. 'Gardens' was used for new suburban housing. The station opened in 1934; Central line trains came in 1948.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "Ruislip Gardens tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Gardens_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.560736, -0.41071]]}, "Ruislip Manor": {"name": "Ruislip Manor", "q": "Hillingdon", "zone": "6", "head": "Named after a housing estate built on land of the old manor of Ruislip.", "text": "Ruislip means the leaping place where rushes grow. The station opened as a halt in 1912, long before most of the houses.", "links": [{"t": "Ruislip Manor", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Manor"}, {"t": "Ruislip Manor tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Manor_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.573202, -0.412973]]}, "Russell Square": {"name": "Russell Square", "q": "Camden", "zone": "1", "head": "Named after the Russell family, the Dukes of Bedford.", "text": "They owned much of Bloomsbury and laid out the square around 1800. Its gardens were designed by Humphry Repton. The British Museum is just round the corner.", "links": [{"t": "Russell Square", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Russell_Square"}, {"t": "Russell Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Russell_Square_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.523073, -0.124285]]}, "Seven Kings": {"name": "Seven Kings", "q": "Redbridge", "zone": "4", "head": "Despite the legend, there were no seven kings.", "text": "A popular story says seven Saxon kings watered their horses here. The name more probably comes from the people of a man called Seofeca.", "links": [{"t": "Seven Kings", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Kings"}, {"t": "Seven Kings railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Kings_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.564026, 0.0971]]}, "Seven Sisters": {"name": "Seven Sisters", "q": "Haringey", "zone": "3", "head": "Named after a ring of seven trees on Page Green.", "text": "By local tradition they were planted by seven sisters. The first trees were elms; the ring has been replanted several times, most recently with hornbeams in 1997.", "links": [{"t": "Seven Sisters, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Sisters,_London"}, {"t": "Seven Sisters station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Sisters_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.58333, -0.072584], [51.582268, -0.07527]]}, "Shadwell": {"name": "Shadwell", "q": "Tower Hamlets", "zone": "2", "head": "'Shadwell' means the shallow spring.", "text": "It comes from Old English sceald, shallow, and wella, a spring or stream. The DLR and the Overground each have a station here.", "links": [{"t": "Shadwell", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shadwell"}, {"t": "Shadwell railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shadwell_railway_station"}], "ll": [[51.511284, -0.056934]]}, "Shenfield": {"name": "Shenfield", "q": "Essex", "zone": "", "head": "'Shenfield' probably means the beautiful open land.", "text": "It comes from Old English scēne, bright or beautiful, and feld, open country. It is in the Domesday Book of 1086 as Scenefelda. The station is the eastern end of the Elizabeth line.", "links": [{"t": "Shenfield", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shenfield"}, {"t": "Shenfield railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shenfield_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.630877, 0.329851]]}, "Shepherd's Bush": {"name": "Shepherd's Bush", "q": "Hammersmith and Fulham", "zone": "2", "head": "Nobody really knows where 'Shepherd's Bush' comes from.", "text": "One idea is that shepherds rested their flocks here on the way to Smithfield market in the City. Another is that it recalls a local man called Shepherd or Sheppard.", "links": [{"t": "Shepherd's Bush", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush"}, {"t": "Shepherd's Bush tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.504376, -0.218813], [51.505285, -0.217654]]}, "Shepherd's Bush Market": {"name": "Shepherd's Bush Market", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the street market beside the railway, in Shepherd's Bush.", "text": "The station was called Shepherd's Bush until 2008, when it was renamed to avoid confusion with the Central line station. Nobody knows for sure where 'Shepherd's Bush' comes from.", "links": [{"t": "Shepherd's Bush Market", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_Market"}, {"t": "Shepherd's Bush Market tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_Market_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.505579, -0.226375]]}, "Shoreditch High Street": {"name": "Shoreditch High Street", "q": "Tower Hamlets", "zone": "1", "head": "'Shoreditch' means the ditch by the slope.", "text": "It comes from Old English scora, a bank or slope, and dīc, ditch. A legend links it to Jane Shore, mistress of Edward IV, but that is a later invention.", "links": [{"t": "Shoreditch", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shoreditch"}, {"t": "Shoreditch High Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shoreditch_High_Street_railway_station"}], "ll": [[51.523375, -0.075246]]}, "Silver Street": {"name": "Silver Street", "q": "Enfield", "zone": "4", "head": "Named after Silver Street, an old road in Edmonton.", "text": "Silver Street is a common old street name; its origin is uncertain. The station opened in 1872.", "links": [{"t": "Edmonton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edmonton,_London"}, {"t": "Silver Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Silver_Street_railway_station"}], "ll": [[51.614688, -0.06724]]}, "Sloane Square": {"name": "Sloane Square", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Sir Hans Sloane, physician and collector.", "text": "He bought the manor of Chelsea in 1712. His huge collection of books, plants and curiosities became the start of the British Museum after his death in 1753.", "links": [{"t": "Hans Sloane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hans_Sloane"}, {"t": "Sloane Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sloane_Square_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.49227, -0.156377]]}, "Slough": {"name": "Slough", "q": "Berkshire", "zone": "", "head": "'Slough' means a muddy place, a miry marsh.", "text": "It comes from Old English slōh. The astronomer William Herschel lived here from 1786 and built his great telescope in his garden.", "links": [{"t": "Slough", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Slough"}, {"t": "William Herschel", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/William_Herschel"}, {"t": "Slough railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Slough_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.51188, -0.59151]]}, "Snaresbrook": {"name": "Snaresbrook", "q": "Redbridge", "zone": "4", "head": "Nobody knows for sure where 'Snaresbrook' comes from.", "text": "It may be a changed form of 'Sayers Brook', a small stream flowing into the River Roding. The station opened in 1856 and was called Snaresbrook & Wanstead for many years.", "links": [{"t": "Snaresbrook", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Snaresbrook"}, {"t": "Snaresbrook tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Snaresbrook_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.580678, 0.02144]]}, "South Acton": {"name": "South Acton", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. South Acton grew as an industrial area with many laundries, nicknamed 'Soapsud Island'.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "South Acton railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Acton_railway_station"}], "ll": [[51.499695, -0.270157]]}, "South Ealing": {"name": "South Ealing", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name was first recorded around 700 as Gillingas. South Ealing station opened in 1883.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "South Ealing tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ealing_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.501003, -0.307424]]}, "South Hampstead": {"name": "South Hampstead", "q": "Camden", "zone": "2", "head": "'Hampstead' simply means homestead.", "text": "It comes from Old English hām-stede. The station opened in 1879 as Loudoun Road and was renamed South Hampstead in 1922.", "links": [{"t": "South Hampstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Hampstead"}, {"t": "South Hampstead railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Hampstead_railway_station"}], "ll": [[51.541432, -0.178878]]}, "South Harrow": {"name": "South Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "Before the houses were built, this area was fields and the old hamlet of Roxeth. The station opened in 1903.", "links": [{"t": "South Harrow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Harrow"}, {"t": "South Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Harrow_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.564888, -0.352492]]}, "South Kensington": {"name": "South Kensington", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Kensington, the farm of a Saxon called Cynesige.", "text": "The area grew after the Great Exhibition of 1851, whose profits paid for the museums and colleges here. A long tunnel leads from the station to the museums.", "links": [{"t": "South Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kensington"}, {"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "South Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kensington_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.494094, -0.174138]]}, "South Kenton": {"name": "South Kenton", "q": "Brent", "zone": "4", "head": "'Kenton' probably means the farm of a man called Coena.", "text": "It ends in Old English tūn, a farm or settlement. South Kenton station opened in 1933 for new houses.", "links": [{"t": "Kenton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton,_London"}, {"t": "South Kenton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kenton_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.570232, -0.308433]]}, "South Quay": {"name": "South Quay", "q": "Tower Hamlets", "zone": "2", "head": "Named after the quays of the South Dock of the West India Docks.", "text": "The docks opened in the early 19th century. The quays are now lined with office towers.", "links": [{"t": "West India Docks", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_India_Docks"}, {"t": "South Quay DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Quay_DLR_station"}], "ll": [[51.50005, -0.015975]]}, "South Ruislip": {"name": "South Ruislip", "q": "Hillingdon", "zone": "5", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "The station opened in 1908 as Northolt Junction and only became South Ruislip in 1947. The Central line arrived in 1948.", "links": [{"t": "South Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ruislip"}, {"t": "South Ruislip station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ruislip_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.556853, -0.398915]]}, "South Tottenham": {"name": "South Tottenham", "q": "Haringey", "zone": "3", "head": "'Tottenham' means the homestead of a man called Totta.", "text": "It is in the Domesday Book of 1086 as Toteham. South Tottenham station opened in 1871.", "links": [{"t": "Tottenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham"}, {"t": "South Tottenham railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Tottenham_railway_station"}], "ll": [[51.580372, -0.072103]]}, "South Wimbledon": {"name": "South Wimbledon", "q": "Merton", "zone": "3/4", "head": "Named after Wimbledon, though the station is actually in Merton.", "text": "'Wimbledon' probably means the hill of a man called Wynnmann. For many years the station was called South Wimbledon (Merton) to make this clear.", "links": [{"t": "Wimbledon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon,_London"}, {"t": "South Wimbledon tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Wimbledon_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.415309, -0.192005]]}, "South Woodford": {"name": "South Woodford", "q": "Redbridge", "zone": "4", "head": "'Woodford' means the ford by the wood.", "text": "The ford crossed the River Roding. The station opened in 1856 as George Lane, after the road outside. It became South Woodford in 1947, when the Central line arrived.", "links": [{"t": "South Woodford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Woodford"}, {"t": "South Woodford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Woodford_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.591907, 0.027338]]}, "Southall": {"name": "Southall", "q": "Ealing", "zone": "4", "head": "'Southall' means the southern nook of land.", "text": "It comes from Old English sūth and healh, a corner or nook; its partner to the north is Northolt. Southall has a large Punjabi community, and the station signs are also written in Punjabi.", "links": [{"t": "Southall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southall"}, {"t": "Southall railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southall_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.505957, -0.37861]]}, "Southbury": {"name": "Southbury", "q": "Enfield", "zone": "5", "head": "Named after Southbury Road, which took its name from a nearby field.", "text": "The road was called Nags Head Lane until 1882. The station opened in 1891 as Churchbury and closed in 1909. It reopened in the First World War, closed again, and came back as Southbury in 1960.", "links": [{"t": "Southbury railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southbury_railway_station"}], "ll": [[51.648705, -0.052437]]}, "Southfields": {"name": "Southfields", "q": "Wandsworth", "zone": "3", "head": "Named after the south fields of Wandsworth, open farmland for centuries.", "text": "They were first recorded in the 13th century and stayed fields until about 1900. During the Wimbledon tennis championships, this is the station for the courts.", "links": [{"t": "Southfields", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southfields"}, {"t": "Southfields tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southfields_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.445073, -0.206602]]}, "Southgate": {"name": "Southgate", "q": "Enfield", "zone": "4", "head": "Named after the south gate into Enfield Chase, a royal hunting ground.", "text": "The village grew up around the gate. The round station of 1933, designed by Charles Holden, is listed as a historic building.", "links": [{"t": "Southgate, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southgate,_London"}, {"t": "Southgate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southgate_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.632315, -0.127816]]}, "Southwark": {"name": "Southwark", "q": "Southwark", "zone": "1", "head": "'Southwark' means the southern fort.", "text": "It was recorded in the early 10th century as Suthriganaweorc, the fort of the men of Surrey, defending the southern end of London Bridge. The station opened in 1999.", "links": [{"t": "Southwark", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southwark"}, {"t": "Southwark tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southwark_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.50427, -0.105331]]}, "St James Street": {"name": "St James Street", "q": "Waltham Forest", "zone": "3", "head": "Named after St James Street in Walthamstow.", "text": "The street probably takes its name from St James's Church, built in 1842 for the growing town and later pulled down. Walthamstow means the place of welcome.", "links": [{"t": "Walthamstow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow"}, {"t": "St James Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James_Street_railway_station"}], "ll": [[51.580981, -0.032918]]}, "St James's Park": {"name": "St James's Park", "q": "Westminster", "zone": "1", "head": "Named after St James's Park, which takes its name from St James's Palace.", "text": "The palace was built by Henry VIII on the site of a medieval hospital for women with leprosy, dedicated to St James the Less. The park is the oldest of London's royal parks.", "links": [{"t": "St James's Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Park"}, {"t": "St James's Palace", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Palace"}, {"t": "St James's Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Park_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.499544, -0.133608]]}, "St John's Wood": {"name": "St John's Wood", "q": "Westminster", "zone": "2", "head": "Named after the Knights of St John, who owned the woods here.", "text": "The Order of St John of Jerusalem had its priory in Clerkenwell and held this wooded land in the Middle Ages. The station opened in 1939.", "links": [{"t": "St John's Wood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_John's_Wood"}, {"t": "St John's Wood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_John's_Wood_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.534521, -0.173948]]}, "St Paul's": {"name": "St Paul's", "q": "City of London", "zone": "1", "head": "Named after St Paul's Cathedral, just to the south.", "text": "There has been a church dedicated to St Paul on this hill since 604. The station opened in 1900 as Post Office, after the head office of the Post Office nearby, and was renamed in 1937.", "links": [{"t": "St Paul's Cathedral", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Paul's_Cathedral"}, {"t": "St Paul's tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Paul's_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.514936, -0.097567]]}, "Stamford Brook": {"name": "Stamford Brook", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after a stream, now lost, between Hammersmith and Chiswick.", "text": "'Stamford' is said to mean the stony ford. The brook now runs in a pipe under the streets.", "links": [{"t": "Stamford Brook", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Brook"}, {"t": "Stamford Brook tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Brook_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.494917, -0.245704]]}, "Stamford Hill": {"name": "Stamford Hill", "q": "Hackney", "zone": "3", "head": "'Stamford' means the sandy ford.", "text": "It was recorded in 1294 as Saundfordhull, the hill by the sandy ford. The ford carried the Roman road, Ermine Street, across a brook.", "links": [{"t": "Stamford Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Hill"}, {"t": "Stamford Hill railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Hill_railway_station"}], "ll": [[51.574467, -0.076682]]}, "Stanmore": {"name": "Stanmore", "q": "Harrow", "zone": "5", "head": "'Stanmore' means the stony pool.", "text": "It comes from Old English stān, stone, and mere, a pool; the gravel soil here is very stony. The station opened in 1932.", "links": [{"t": "Stanmore", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stanmore"}, {"t": "Stanmore tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stanmore_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.619839, -0.303266]]}, "Star Lane": {"name": "Star Lane", "q": "Newham", "zone": "2/3", "head": "Named after Star Lane, the street beside the station.", "text": "The origin of the street's name is not recorded. The station opened in 2011, on a new DLR line to Stratford International.", "links": [{"t": "Star Lane DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Star_Lane_DLR_station"}], "ll": [[51.520786, 0.004156]]}, "Stepney Green": {"name": "Stepney Green", "q": "Tower Hamlets", "zone": "2", "head": "'Stepney' means the landing place of a man called Stebba.", "text": "It was recorded around 1000 as Stybbanhythe, with hythe meaning a landing place on the Thames. The green is the old village green of Stepney.", "links": [{"t": "Stepney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stepney"}, {"t": "Stepney Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stepney_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.521858, -0.046596]]}, "Stockwell": {"name": "Stockwell", "q": "Lambeth", "zone": "2", "head": "'Stockwell' means the well or spring by a tree stump.", "text": "It comes from Old English stocc, a stump or post. Outside the station is the entrance to a deep-level shelter built during the Second World War.", "links": [{"t": "Stockwell", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stockwell"}, {"t": "Stockwell tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stockwell_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.472184, -0.122644]]}, "Stoke Newington": {"name": "Stoke Newington", "q": "Hackney", "zone": "2", "head": "'Stoke Newington' probably means the new farm by the tree stumps.", "text": "The writer Daniel Defoe lived here, and Edgar Allan Poe went to school here as a boy.", "links": [{"t": "Stoke Newington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stoke_Newington"}, {"t": "Stoke Newington railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stoke_Newington_railway_station"}], "ll": [[51.565233, -0.072887]]}, "Stonebridge Park": {"name": "Stonebridge Park", "q": "Brent", "zone": "3", "head": "Named after a stone bridge over the River Brent.", "text": "The bridge was built in the 17th century to carry Harrow Road over the river. Bakerloo trains have called here since 1917.", "links": [{"t": "Stonebridge, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stonebridge,_London"}, {"t": "Stonebridge Park station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stonebridge_Park_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.543959, -0.275892]]}, "Stratford": {"name": "Stratford", "q": "Newham", "zone": "2/3", "head": "'Stratford' means the ford on the Roman road.", "text": "Old English stræt, a paved Roman road, gave us the word 'street'. Here the road from London to Colchester crossed the River Lea. The area was the centre of the 2012 Olympic Games.", "links": [{"t": "Stratford, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford,_London"}, {"t": "Stratford station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.541806, -0.003458]]}, "Stratford High Street": {"name": "Stratford High Street", "q": "Newham", "zone": "2/3", "head": "Named after Stratford's high street, the old Roman road east from London.", "text": "Stratford means the ford on the Roman road, where it crossed the River Lea. The station stands on the site of the old Stratford Market station.", "links": [{"t": "Stratford, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford,_London"}, {"t": "Stratford High Street DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_High_Street_DLR_station"}], "ll": [[51.538196, -0.001078]]}, "Stratford International": {"name": "Stratford International", "q": "Newham", "zone": "2/3", "head": "Named for the international trains that were meant to stop here.", "text": "The main line station opened in 2009 for trains through the Channel Tunnel, but Eurostar trains have never called here.", "links": [{"t": "Stratford International station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_International_station"}, {"t": "Stratford International DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_International_DLR_station"}], "ll": [[51.545265, -0.009638]]}, "Sudbury Hill": {"name": "Sudbury Hill", "q": "Harrow", "zone": "4", "head": "'Sudbury' means the southern manor.", "text": "It was south of Harrow, the main village. The station opened in 1903; its present building is by Charles Holden, from the early 1930s.", "links": [{"t": "Sudbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury,_London"}, {"t": "Sudbury Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury_Hill_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.556946, -0.336435]]}, "Sudbury Town": {"name": "Sudbury Town", "q": "Brent", "zone": "4", "head": "'Sudbury' means the southern manor.", "text": "It lay south of Harrow. The station was rebuilt in 1931 by Charles Holden as a brick and glass box, a model for many later Underground stations.", "links": [{"t": "Sudbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury,_London"}, {"t": "Sudbury Town tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury_Town_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.550815, -0.315745]]}, "Surrey Quays": {"name": "Surrey Quays", "q": "Southwark", "zone": "2", "head": "Named after the Surrey Commercial Docks, on the Surrey bank of the Thames.", "text": "The docks handled timber and grain. Greenland Dock, the oldest part, once served whaling ships. The station was called Surrey Docks until 1989.", "links": [{"t": "Surrey Commercial Docks", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Surrey_Commercial_Docks"}, {"t": "Surrey Quays railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Surrey_Quays_railway_station"}], "ll": [[51.493196, -0.047519]]}, "Swiss Cottage": {"name": "Swiss Cottage", "q": "Camden", "zone": "2", "head": "Named after a pub built to look like a Swiss chalet.", "text": "An inn has stood on this site since 1804. The pub building, Ye Olde Swiss Cottage, still stands near the station, though the pub closed in 2025.", "links": [{"t": "Swiss Cottage", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Swiss_Cottage"}, {"t": "Swiss Cottage tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Swiss_Cottage_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.543681, -0.174894]]}, "Sydenham": {"name": "Sydenham", "q": "Lewisham", "zone": "3", "head": "'Sydenham' started as Chipenham, probably the homestead of a man called Cippa.", "text": "It was recorded in 1206 as Chipenham, and as Sippenham later on. The spelling kept changing over the centuries until it became Sydenham.", "links": [{"t": "Sydenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sydenham"}, {"t": "Sydenham railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sydenham_railway_station"}], "ll": [[51.427248, -0.054244]]}, "Taplow": {"name": "Taplow", "q": "Buckinghamshire", "zone": "", "head": "'Taplow' means the burial mound of a man called Tæppa.", "text": "His mound still stands in the old churchyard. When it was dug up in 1883 it held rich Anglo-Saxon treasures, now in the British Museum.", "links": [{"t": "Taplow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Taplow"}, {"t": "Taplow burial", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Taplow_burial"}, {"t": "Taplow railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Taplow_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.523562, -0.68137]]}, "Temple": {"name": "Temple", "q": "Westminster", "zone": "1", "head": "Named after the Temple, once the home of the Knights Templar.", "text": "The knights built the round Temple Church in the 12th century. After the order was closed down in the 14th century, lawyers moved in, and the Inner and Middle Temple are still two of the Inns of Court.", "links": [{"t": "Temple, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Temple,_London"}, {"t": "Temple tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Temple_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.511006, -0.11426]]}, "Theobalds Grove": {"name": "Theobalds Grove", "q": "Hertfordshire", "zone": "7", "head": "Named after Theobalds, a great palace that belonged to William Cecil, Lord Burghley.", "text": "King James I loved the house so much that he swapped it for another palace, and he died there in 1625. Only fragments remain.", "links": [{"t": "Theobalds House", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theobalds_House"}, {"t": "Theobalds Grove railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theobalds_Grove_railway_station"}], "ll": [[51.692457, -0.034831]]}, "Theydon Bois": {"name": "Theydon Bois", "q": "Epping Forest", "zone": "6", "head": "'Bois' is the family name of medieval landowners.", "text": "The Bois family held the land in the 12th and 13th centuries. 'Theydon' is thought to mean the valley where thatch was gathered. The station opened in 1865 as Theydon.", "links": [{"t": "Theydon Bois", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theydon_Bois"}, {"t": "Theydon Bois tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theydon_Bois_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.671759, 0.103085]]}, "Tooting Bec": {"name": "Tooting Bec", "q": "Wandsworth", "zone": "3", "head": "'Bec' recalls the Abbey of Bec in Normandy, which owned land here after 1066.", "text": "Tooting probably means the people of a man called Tota. The station opened in 1926 as Trinity Road (Tooting Bec) and was renamed in 1950.", "links": [{"t": "Tooting Bec Common", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Bec_Common"}, {"t": "Tooting", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting"}, {"t": "Tooting Bec tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Bec_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.435678, -0.159736]]}, "Tooting Broadway": {"name": "Tooting Broadway", "q": "Wandsworth", "zone": "3", "head": "'Tooting' probably means the people of a man called Tota.", "text": "A 'broadway' is a wide main street. The statue of King Edward VII outside the station has stood there since 1911.", "links": [{"t": "Tooting", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting"}, {"t": "Tooting Broadway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Broadway_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.42763, -0.168374]]}, "Tottenham Court Road": {"name": "Tottenham Court Road", "q": "Camden", "zone": "1", "head": "Named after the road to the manor of Tottenhall, not Tottenham.", "text": "The manor house, near today's Euston Road, was probably named after a landowner called Tota. The road led there from the West End.", "links": [{"t": "Tottenham Court Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Court_Road"}, {"t": "Tottenham Court Road station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Court_Road_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.516426, -0.13041]]}, "Tottenham Hale": {"name": "Tottenham Hale", "q": "Haringey", "zone": "3", "head": "'Tottenham' means the homestead of a man called Totta.", "text": "'Hale' probably comes from an old word for a nook or corner of land. The station opened in 1840 as Tottenham, and took its present name when the Victoria line arrived in 1968.", "links": [{"t": "Tottenham Hale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Hale"}, {"t": "Tottenham Hale station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Hale_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.588108, -0.060241]]}, "Totteridge & Whetstone": {"name": "Totteridge & Whetstone", "q": "Barnet", "zone": "4", "head": "'Totteridge' means the ridge of a man called Tata; 'Whetstone' is a puzzle.", "text": "Legend says soldiers sharpened their swords on a whetstone here before the Battle of Barnet in 1471, but the name is older than that. It more probably means 'west town'.", "links": [{"t": "Totteridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Totteridge"}, {"t": "Whetstone, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whetstone,_London"}, {"t": "Totteridge & Whetstone tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Totteridge_&_Whetstone_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.630597, -0.17921]]}, "Tower Gateway": {"name": "Tower Gateway", "q": "City of London", "zone": "1", "head": "Named as a gateway to the Tower of London, which stands nearby.", "text": "It was the DLR's first terminus in the City when the line opened in 1987. The Tower of London was begun by William the Conqueror after 1066.", "links": [{"t": "Tower of London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_of_London"}, {"t": "Tower Gateway DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_Gateway_DLR_station"}], "ll": [[51.510617, -0.074818]]}, "Tower Hill": {"name": "Tower Hill", "q": "Tower Hamlets", "zone": "1", "head": "Named after the hill beside the Tower of London.", "text": "For centuries it was a place of public execution. The station was called Mark Lane until 1946.", "links": [{"t": "Tower Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_Hill"}, {"t": "Tower Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_Hill_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.509971, -0.076546]]}, "Tufnell Park": {"name": "Tufnell Park", "q": "Islington", "zone": "2", "head": "Named after the Tufnell family, lords of the manor of Barnsbury.", "text": "William Tufnell was given the manor in 1753. His descendant Henry Tufnell began building houses on the estate in 1845. The station opened in 1907.", "links": [{"t": "Tufnell Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tufnell_Park"}, {"t": "Tufnell Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tufnell_Park_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.556822, -0.138433]]}, "Turkey Street": {"name": "Turkey Street", "q": "Enfield", "zone": "6", "head": "Named after Turkey Street, near the Turkey Brook in Enfield.", "text": "The origin of the name is uncertain; it has nothing to do with the bird or the country, as far as anyone knows.", "links": [{"t": "Turkey Brook", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turkey_Brook"}, {"t": "Turkey Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turkey_Street_railway_station"}], "ll": [[51.672628, -0.047217]]}, "Turnham Green": {"name": "Turnham Green", "q": "Hounslow", "zone": "2/3", "head": "'Turnham' means the homestead in the river bend.", "text": "The Thames makes a large loop here. In 1642, during the Civil War, a royalist army turned back at Turnham Green instead of marching on London.", "links": [{"t": "Turnham Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnham_Green"}, {"t": "Battle of Turnham Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Turnham_Green"}, {"t": "Turnham Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnham_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.495148, -0.254555]]}, "Turnpike Lane": {"name": "Turnpike Lane", "q": "Haringey", "zone": "3", "head": "Named after a turnpike, a toll gate on the road north.", "text": "Travellers on Green Lanes had to pay here to use the road. The station opened in 1932.", "links": [{"t": "Turnpike Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnpike_Lane"}, {"t": "Turnpike Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnpike_Lane_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.590272, -0.102953]]}, "Twyford": {"name": "Twyford", "q": "Berkshire", "zone": "", "head": "'Twyford' means the double ford.", "text": "There were two fords across the River Loddon here. Many English villages share the name for the same reason.", "links": [{"t": "Twyford, Berkshire", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Twyford,_Berkshire"}, {"t": "Twyford railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Twyford_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.475534, -0.863293]]}, "Upminster": {"name": "Upminster", "q": "Havering", "zone": "6", "head": "'Upminster' means the minster, or large church, on higher ground.", "text": "The church was probably St Laurence, on the hill above the River Ingrebourne. Upminster's windmill, built in 1803, still stands. The station is the eastern end of the District line.", "links": [{"t": "Upminster", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster"}, {"t": "Upminster station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.559063, 0.250882]]}, "Upminster Bridge": {"name": "Upminster Bridge", "q": "Havering", "zone": "6", "head": "Named after the bridge over the River Ingrebourne, near Upminster.", "text": "Upminster means the large church on higher ground. The station opened in 1934.", "links": [{"t": "Upminster Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_Bridge"}, {"t": "Upminster Bridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_Bridge_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.55856, 0.235809]]}, "Upney": {"name": "Upney", "q": "Barking and Dagenham", "zone": "4", "head": "'Upney' probably means the higher island.", "text": "The 'island' was a patch of dry land among the streams and marshes near the Mayes Brook. The station opened in 1932.", "links": [{"t": "Upney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upney"}, {"t": "Upney tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upney_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.538372, 0.10153]]}, "Upper Holloway": {"name": "Upper Holloway", "q": "Islington", "zone": "2", "head": "'Holloway' means the hollow way, a road worn deep into the ground.", "text": "Cattle and carts on their way to London's markets wore the road down over centuries.", "links": [{"t": "Upper Holloway", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upper_Holloway"}, {"t": "Upper Holloway railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upper_Holloway_railway_station"}], "ll": [[51.563631, -0.129513]]}, "Upton Park": {"name": "Upton Park", "q": "Newham", "zone": "3", "head": "'Upton' means the farm on higher ground.", "text": "'Park' was added in the 1880s to sell new houses. West Ham United's old stadium, the Boleyn Ground, was often called Upton Park.", "links": [{"t": "Upton Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upton_Park,_London"}, {"t": "Upton Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upton_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.53534, 0.035263]]}, "Uxbridge": {"name": "Uxbridge", "q": "Hillingdon", "zone": "6", "head": "'Uxbridge' means the bridge of the Wixan people.", "text": "The Wixan were an Anglo-Saxon tribe who settled here, and the bridge crossed the River Colne. Uxbridge is the western end of the Metropolitan and Piccadilly lines.", "links": [{"t": "Uxbridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Uxbridge"}, {"t": "Uxbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Uxbridge_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.546565, -0.477949]]}, "Vauxhall": {"name": "Vauxhall", "q": "Lambeth", "zone": "1/2", "head": "'Vauxhall' means Falkes' Hall, the house of a medieval knight.", "text": "Falkes de Breauté owned a large house here in the 13th century. Later, Vauxhall Pleasure Gardens were famous across Europe, and the car maker took its name from the area.", "links": [{"t": "Vauxhall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Vauxhall"}, {"t": "Falkes de Breauté", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Falkes_de_Breaut%C3%A9"}, {"t": "Vauxhall station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Vauxhall_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.485743, -0.124204]]}, "Victoria": {"name": "Victoria", "q": "Westminster", "zone": "1", "head": "Named after Victoria Street, which honours Queen Victoria.", "text": "The main line station took the street's name in 1860. It stands on the site of an old basin of the Grosvenor Canal.", "links": [{"t": "London Victoria station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Victoria_station"}, {"t": "London Victoria station#London Underground station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Victoria_station%23London_Underground_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.496359, -0.143102]]}, "Walthamstow Central": {"name": "Walthamstow Central", "q": "Waltham Forest", "zone": "3", "head": "'Walthamstow' probably means the place of welcome.", "text": "It was recorded in 1075 as Wilcumestowe. 'Central' tells it apart from other stations in the town. The Victoria line arrived in 1968.", "links": [{"t": "Walthamstow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow"}, {"t": "Walthamstow Central station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow_Central_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.582965, -0.019885]]}, "Walthamstow Queen's Road": {"name": "Walthamstow Queen's Road", "q": "Waltham Forest", "zone": "3", "head": "'Walthamstow' probably means the place of welcome.", "text": "It was recorded in 1075 as Wilcumestowe. The station opened in 1894 as Walthamstow, and took its present name later.", "links": [{"t": "Walthamstow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow"}, {"t": "Walthamstow Queen's Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow_Queen's_Road_railway_station"}], "ll": [[51.581503, -0.023846]]}, "Wandsworth Road": {"name": "Wandsworth Road", "q": "Lambeth", "zone": "2", "head": "'Wandsworth' means the enclosure of a man called Wændel.", "text": "It is in the Domesday Book of 1086 as Wendelesorde. The River Wandle was later named after the town.", "links": [{"t": "Wandsworth", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wandsworth"}, {"t": "Wandsworth Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wandsworth_Road_railway_station"}], "ll": [[51.470216, -0.13852]]}, "Wanstead": {"name": "Wanstead", "q": "Redbridge", "zone": "4", "head": "'Wanstead' means a place, but nobody is sure what kind.", "text": "It was first recorded in the 11th century as Wenstede. -stead means a place or site; the first part may mean a hill, or a wagon.", "links": [{"t": "Wanstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead"}, {"t": "Wanstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.575501, 0.028527]]}, "Wanstead Park": {"name": "Wanstead Park", "q": "Newham", "zone": "3", "head": "Named after the park of Wanstead House, a vast Palladian mansion.", "text": "The house was one of the grandest in England, but it was pulled down in 1825 to pay its owner's debts. Its park survives.", "links": [{"t": "Wanstead Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead_Park,_London"}, {"t": "Wanstead House", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead_House"}, {"t": "Wanstead Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead_Park_railway_station"}], "ll": [[51.551693, 0.026213]]}, "Wapping": {"name": "Wapping", "q": "Tower Hamlets", "zone": "2", "head": "'Wapping' may mean the place of Wæppa's people, or a marshy place.", "text": "It was recorded around 1220. Pirates were hanged at Execution Dock in Wapping, among them Captain Kidd in 1701.", "links": [{"t": "Wapping", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wapping"}, {"t": "Wapping railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wapping_railway_station"}], "ll": [[51.504388, -0.055931]]}, "Warren Street": {"name": "Warren Street", "q": "Camden", "zone": "1", "head": "Named after Anne Warren, or her father Admiral Sir Peter Warren.", "text": "Anne married the landowner Charles FitzRoy, later Baron Southampton, who developed the land in the late 18th century. The station opened in 1907 as Euston Road and was renamed a year later.", "links": [{"t": "Warren Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warren_Street"}, {"t": "Warren Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warren_Street_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.524951, -0.138321]]}, "Warwick Avenue": {"name": "Warwick Avenue", "q": "Westminster", "zone": "2", "head": "Named after Jane Warwick, who married into a local landowning family.", "text": "She married in 1778. The land belonged to the Bishop of London, and the street was named after her. The station opened in 1915.", "links": [{"t": "Warwick Avenue", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warwick_Avenue"}, {"t": "Warwick Avenue tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warwick_Avenue_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.523263, -0.183783]]}, "Waterloo": {"name": "Waterloo", "q": "Lambeth", "zone": "1", "head": "Named after Waterloo Bridge, which commemorates the Battle of Waterloo.", "text": "The bridge was being built when Wellington beat Napoleon in 1815. It was meant to be called Strand Bridge but opened in 1817 as Waterloo Bridge. The road and the station followed.", "links": [{"t": "Waterloo Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Waterloo_Bridge"}, {"t": "Battle of Waterloo", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Waterloo"}, {"t": "Waterloo tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Waterloo_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.503299, -0.11478]]}, "Watford": {"name": "Watford", "q": "Watford", "zone": "7", "head": "'Watford' probably means the ford used for hunting, or the wet ford.", "text": "The ford crossed the River Colne. The Metropolitan line station opened in 1925 in Cassiobury, a long walk from the town centre.", "links": [{"t": "Watford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford"}, {"t": "Watford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.657446, -0.417377]]}, "Watford High Street": {"name": "Watford High Street", "q": "Hertfordshire", "zone": "8", "head": "'Watford' probably means the ford used for hunting, or the wet ford.", "text": "The ford crossed the River Colne. The station is just off the town's high street.", "links": [{"t": "Watford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford"}, {"t": "Watford High Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford_High_Street_railway_station"}], "ll": [[51.652655, -0.391711]]}, "Watford Junction": {"name": "Watford Junction", "q": "Hertfordshire", "zone": "", "head": "'Watford' probably means the ford used for hunting, or the wet ford.", "text": "The ford crossed the River Colne. The junction is where branch lines meet the main line from London to the north.", "links": [{"t": "Watford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford"}, {"t": "Watford Junction railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford_Junction_railway_station"}], "ll": [[51.663529, -0.396517]]}, "Wembley Central": {"name": "Wembley Central", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "It ends in Old English leah, a clearing. The station opened in 1842 as Sudbury, and became Wembley Central in 1948, the year Wembley hosted the Olympic Games.", "links": [{"t": "Wembley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley"}, {"t": "Wembley Central station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Central_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.552304, -0.296852]]}, "Wembley Park": {"name": "Wembley Park", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "In the 1890s a tower meant to rival the Eiffel Tower was started here; it was never finished. Wembley Stadium was later built on its site.", "links": [{"t": "Wembley Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Park"}, {"t": "Wembley Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Park_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.563198, -0.279262]]}, "West Acton": {"name": "West Acton", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. West Acton station opened in 1923.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "West Acton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Acton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.518001, -0.28098]]}, "West Brompton": {"name": "West Brompton", "q": "Kensington and Chelsea", "zone": "2", "head": "'Brompton' means the farm where broom grows.", "text": "Broom is a yellow-flowered shrub. The first station opened in 1866; Brompton Cemetery, one of London's 'Magnificent Seven' cemeteries, is next door.", "links": [{"t": "West Brompton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Brompton"}, {"t": "West Brompton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Brompton_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.487268, -0.195599]]}, "West Croydon": {"name": "West Croydon", "q": "Croydon", "zone": "5", "head": "'Croydon' means the valley where wild saffron grows.", "text": "It comes from Old English croh, saffron, and denu, valley. West Croydon is the end of a branch of the Windrush line.", "links": [{"t": "Croydon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Croydon"}, {"t": "West Croydon railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Croydon_railway_station"}], "ll": [[51.378428, -0.102585]]}, "West Drayton": {"name": "West Drayton", "q": "Hillingdon", "zone": "6", "head": "'Drayton' probably means a farm by a place where boats or loads were dragged.", "text": "It was recorded in 939 as Drægtun, from Old English dræg, a dragging place. 'West' was added later.", "links": [{"t": "West Drayton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Drayton"}, {"t": "West Drayton railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Drayton_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.510055, -0.472234]]}, "West Ealing": {"name": "West Ealing", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name was first recorded around 700 as Gillingas. West Ealing grew up along the Uxbridge Road after the railway station opened.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "West Ealing railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ealing_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.513506, -0.320133]]}, "West Finchley": {"name": "West Finchley", "q": "Barnet", "zone": "4", "head": "'Finchley' probably means the clearing where finches live.", "text": "It ends in Old English leah, a clearing in a wood. The Northern line has served West Finchley since 1940.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "West Finchley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Finchley_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.609426, -0.188362]]}, "West Ham": {"name": "West Ham", "q": "Newham", "zone": "2/3", "head": "'Ham' means dry land in a river bend or between rivers.", "text": "Here the land lies between the Thames, the Lea and the Roding. It was split into East Ham and West Ham in Anglo-Saxon times. The football club West Ham United took its name from the area.", "links": [{"t": "West Ham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ham"}, {"t": "West Ham station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ham_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.528136, 0.005055]]}, "West Hampstead": {"name": "West Hampstead", "q": "Camden", "zone": "2", "head": "'Hampstead' simply means homestead.", "text": "It comes from Old English hām-stede. West Hampstead grew in the late 19th century when three railway lines arrived. The station opened in 1879.", "links": [{"t": "West Hampstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Hampstead"}, {"t": "West Hampstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Hampstead_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.546638, -0.191059]]}, "West Harrow": {"name": "West Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on Harrow Hill, where St Mary's Church stands today. West Harrow station opened in 1913.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "West Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Harrow_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.57971, -0.3534]]}, "West India Quay": {"name": "West India Quay", "q": "Tower Hamlets", "zone": "2", "head": "Named after the West India Docks, opened in 1802.", "text": "They were built for ships bringing sugar, rum and coffee from the Caribbean, produced by enslaved people. Old warehouses on the quay now house the Museum of London Docklands.", "links": [{"t": "West India Docks", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_India_Docks"}, {"t": "Museum of London Docklands", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Museum_of_London_Docklands"}, {"t": "West India Quay DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_India_Quay_DLR_station"}], "ll": [[51.50703, -0.020311]]}, "West Kensington": {"name": "West Kensington", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Kensington, the farm of a Saxon called Cynesige.", "text": "The station is actually in Fulham. It opened in 1874 as North End (Fulham) and was renamed West Kensington in 1877, probably because the name sounded more attractive.", "links": [{"t": "West Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Kensington"}, {"t": "West Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Kensington_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.490459, -0.206636]]}, "West Ruislip": {"name": "West Ruislip", "q": "Hillingdon", "zone": "6", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "It opened in 1906 as Ruislip & Ickenham. West Ruislip is the western end of the Central line.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "West Ruislip station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ruislip_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.569688, -0.437886]]}, "West Silvertown": {"name": "West Silvertown", "q": "Newham", "zone": "3", "head": "Named after Silvertown, which has nothing to do with silver.", "text": "The area grew around the rubber and waterproof clothing works of S. W. Silver and Co., which moved here in 1852.", "links": [{"t": "Silvertown", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Silvertown"}, {"t": "West Silvertown DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Silvertown_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.502838, 0.02246]]}, "Westbourne Park": {"name": "Westbourne Park", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Westbourne, the place to the west of the stream.", "text": "Westbourne was recorded in 1222. The stream, which rises in Hampstead and now runs hidden in pipes, was later named the Westbourne after it.", "links": [{"t": "River Westbourne", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/River_Westbourne"}, {"t": "Westbourne Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westbourne_Park_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.52111, -0.201065]]}, "Westferry": {"name": "Westferry", "q": "Tower Hamlets", "zone": "2", "head": "Named after West Ferry Road, which led to an old ferry across the Thames.", "text": "The road runs down the western side of the Isle of Dogs. The station opened with the first DLR line in 1987.", "links": [{"t": "Isle of Dogs", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Isle_of_Dogs"}, {"t": "Westferry DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westferry_DLR_station"}], "ll": [[51.509431, -0.02675]]}, "Westminster": {"name": "Westminster", "q": "Westminster", "zone": "1", "head": "'Westminster' means the minster, or abbey church, to the west.", "text": "It was west of the City of London. The abbey was founded in the 10th century and rebuilt by Edward the Confessor, and it gave its name to the whole area, including the Houses of Parliament.", "links": [{"t": "Westminster Abbey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster_Abbey"}, {"t": "Westminster", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster"}, {"t": "Westminster tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.50132, -0.124861]]}, "White City": {"name": "White City", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the white exhibition buildings of 1908.", "text": "The Franco-British Exhibition was held here in 1908, with palaces covered in white. The stadium built at the same time hosted the 1908 Olympic Games.", "links": [{"t": "White City, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_City,_London"}, {"t": "White City tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_City_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.511959, -0.224297]]}, "White Hart Lane": {"name": "White Hart Lane", "q": "Haringey", "zone": "3", "head": "Named after White Hart Lane, a road probably named in the 1600s.", "text": "The white hart was the badge of King Richard II and a popular inn sign; the lane may be named after an inn. Tottenham Hotspur's ground nearby was long known as White Hart Lane.", "links": [{"t": "White Hart Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_Hart_Lane"}, {"t": "White Hart Lane railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_Hart_Lane_railway_station"}], "ll": [[51.605037, -0.070914]]}, "Whitechapel": {"name": "Whitechapel", "q": "Tower Hamlets", "zone": "2", "head": "Named after a white chapel, the church of St Mary Matfelon.", "text": "The chapel was built in the Middle Ages. Its walls were white, from chalk stone or whitewash, and gave the area its name.", "links": [{"t": "Whitechapel", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whitechapel"}, {"t": "Whitechapel station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whitechapel_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.519518, -0.059971]]}, "Willesden Green": {"name": "Willesden Green", "q": "Brent", "zone": "2/3", "head": "'Willesden' means the hill with a spring.", "text": "It was first recorded in 939 as Willesdune. The spring has been lost. The station opened in 1879.", "links": [{"t": "Willesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden"}, {"t": "Willesden Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden_Green_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.549146, -0.221537]]}, "Willesden Junction": {"name": "Willesden Junction", "q": "Brent", "zone": "2/3", "head": "Named after a large railway junction in Willesden.", "text": "'Willesden' means the hill with a spring. Several railway lines meet and cross here. Bakerloo trains have called since 1915.", "links": [{"t": "Willesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden"}, {"t": "Willesden Junction station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden_Junction_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.532259, -0.244283]]}, "Wimbledon": {"name": "Wimbledon", "q": "Merton", "zone": "3", "head": "'Wimbledon' probably means the hill of a man called Wynnmann.", "text": "It was recorded around 950 as Wunemannedune; 'dun' means a hill. Since 1877 the town has been home to the world's oldest tennis tournament.", "links": [{"t": "Wimbledon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon,_London"}, {"t": "Wimbledon station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.421207, -0.206573]]}, "Wimbledon Park": {"name": "Wimbledon Park", "q": "Merton", "zone": "3", "head": "Named after the park of Wimbledon House, a great estate.", "text": "The grounds and lake were landscaped by Capability Brown in the 1760s. Part of the old park is now the home of the All England Lawn Tennis Club.", "links": [{"t": "Wimbledon Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_Park"}, {"t": "Wimbledon Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.434573, -0.199719]]}, "Wood Green": {"name": "Wood Green", "q": "Haringey", "zone": "3", "head": "'Wood Green' means the green by the woods.", "text": "The village grew around an open space on the edge of Tottenham Wood. The station opened in 1932.", "links": [{"t": "Wood Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Green"}, {"t": "Wood Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Green_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.597479, -0.109886]]}, "Wood Lane": {"name": "Wood Lane", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Wood Lane, called Turvens Lane until about 1830.", "text": "Its old name came from Turvens House. The station opened in 2008, next to the old BBC Television Centre.", "links": [{"t": "Wood Lane, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Lane,_London"}, {"t": "Wood Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Lane_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.509669, -0.22453]]}, "Wood Street": {"name": "Wood Street", "q": "Waltham Forest", "zone": "4", "head": "Named after Wood Street in Walthamstow, on the way to Epping Forest.", "text": "The street led out of the town towards the forest. The station opened in 1873.", "links": [{"t": "Walthamstow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow"}, {"t": "Wood Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Street_railway_station"}], "ll": [[51.58658, -0.002405]]}, "Woodford": {"name": "Woodford", "q": "Redbridge", "zone": "4", "head": "'Woodford' means the ford by the wood.", "text": "The ford crossed the River Roding, on the edge of Epping Forest. It was later replaced by a bridge, which gave its name to Woodford Bridge.", "links": [{"t": "Woodford, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodford,_London"}, {"t": "Woodford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodford_tube_station
