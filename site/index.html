ot their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.489097, -0.133761]}, "Pinner": {"name": "Pinner", "q": "Harrow", "zone": "5", "head": "'Pinner' probably means the pin-shaped hill, or the hill of a man called Pinn.", "text": "It ends in Old English ora, a slope or hill. The River Pinn was later named after the village.", "links": [{"t": "Pinner", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pinner"}, {"t": "Pinner tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pinner_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.592901, -0.381161]}, "Plaistow": {"name": "Plaistow", "q": "Newham", "zone": "3", "head": "'Plaistow' probably means a place for play or sport.", "text": "It may come from Old English plega, play, and stōw, place, perhaps where games or miracle plays were held. Others link it to Sir Hugh de Plaiz, a medieval landowner. Locals say 'Plar-stow'.", "links": [{"t": "Plaistow, Newham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Plaistow,_Newham"}, {"t": "Plaistow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Plaistow_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.531341, 0.017451]}, "Preston Road": {"name": "Preston Road", "q": "Brent", "zone": "4", "head": "'Preston' means the priests' farm.", "text": "It comes from Old English prēost, priest, and tūn, farm. The station opened in 1908.", "links": [{"t": "Preston, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Preston,_London"}, {"t": "Preston Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Preston_Road_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.571972, -0.295107]}, "Putney Bridge": {"name": "Putney Bridge", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Putney Bridge, the crossing to Putney on the other bank.", "text": "'Putney' means the landing place of a man called Putta. The station is actually on the Fulham side of the Thames. The Oxford and Cambridge Boat Race starts near the bridge.", "links": [{"t": "Putney Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney_Bridge"}, {"t": "Putney Bridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney_Bridge_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.468262, -0.208731]}, "Queen's Park": {"name": "Queen's Park", "q": "Brent", "zone": "2", "head": "Named after Queen Victoria, who was on the throne when the area was built.", "text": "The park and housing estate date from the late 19th century. Bakerloo trains have called here since 1915.", "links": [{"t": "Queen's Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queen's_Park,_London"}, {"t": "Queen's Park (London) station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queen's_Park_(London)_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.534158, -0.204574]}, "Queensbury": {"name": "Queensbury", "q": "Brent", "zone": "4", "head": "An invented name, chosen in the 1930s as a play on neighbouring Kingsbury.", "text": "Local people were asked for ideas, and Queensbury won. The name has no historical background. The station opened in 1934.", "links": [{"t": "Queensbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensbury,_London"}, {"t": "Queensbury tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensbury_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.594188, -0.286219]}, "Queensway": {"name": "Queensway", "q": "Westminster", "zone": "1", "head": "Named in honour of Queen Victoria.", "text": "She is said to have ridden along the lane as a girl, when she lived at Kensington Palace nearby. The road was called Queen's Road, and so was the station until 1946.", "links": [{"t": "Queensway, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensway,_London"}, {"t": "Queensway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensway_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.510312, -0.187152]}, "Ravenscourt Park": {"name": "Ravenscourt Park", "q": "Hammersmith and Fulham", "zone": "2", "head": "A pun on a family name: a raven is 'corbeau' in French.", "text": "In the 18th century the owner, Thomas Corbett, renamed his house Ravenscourt; ravens were on his coat of arms. The grounds became a public park. The station opened in 1877 as Shaftesbury Road.", "links": [{"t": "Ravenscourt Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ravenscourt_Park"}, {"t": "Ravenscourt Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ravenscourt_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.494122, -0.235881]}, "Rayners Lane": {"name": "Rayners Lane", "q": "Harrow", "zone": "5", "head": "Said to be named after Daniel Rayner, a local farmer.", "text": "When the railway arrived in 1904 the area was almost empty; the station opened in 1906, and houses only followed in the 1930s.", "links": [{"t": "Rayners Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rayners_Lane"}, {"t": "Rayners Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rayners_Lane_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.575147, -0.371127]}, "Redbridge": {"name": "Redbridge", "q": "Redbridge", "zone": "4", "head": "Named after a red brick bridge over the River Roding.", "text": "The bridge was recorded from the 17th century and demolished in 1922. The station, opened in 1947, had the name before the London Borough of Redbridge, created in 1965.", "links": [{"t": "Redbridge, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Redbridge,_London"}, {"t": "Redbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Redbridge_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.576243, 0.04536]}, "Regent's Park": {"name": "Regent's Park", "q": "Westminster", "zone": "1", "head": "Named after the Prince Regent, later King George IV.", "text": "The park was laid out by John Nash in the early 19th century on what had been Henry VIII's hunting ground. Regent Street was built at the same time.", "links": [{"t": "Regent's Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Regent's_Park"}, {"t": "Regent's Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Regent's_Park_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.523344, -0.146444]}, "Richmond": {"name": "Richmond", "q": "Richmond", "zone": "4", "head": "Named after Richmond in Yorkshire, through Henry VII.", "text": "Henry was Earl of Richmond before he became king. Around 1500 he rebuilt the royal palace at Sheen and named it after his earldom. 'Richmond' is French for 'strong hill'.", "links": [{"t": "Richmond, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Richmond,_London"}, {"t": "Richmond station (London)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Richmond_station_(London)"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.463237, -0.301336]}, "Rickmansworth": {"name": "Rickmansworth", "q": "Hertfordshire", "zone": "7", "head": "'Rickmansworth' means the enclosure of a man called Ricmær.", "text": "-worth is an Old English word for an enclosure or farm. The Domesday Book of 1086 records it as Prichemareworde.", "links": [{"t": "Rickmansworth", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rickmansworth"}, {"t": "Rickmansworth station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rickmansworth_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.640207, -0.473703]}, "Roding Valley": {"name": "Roding Valley", "q": "Epping Forest", "zone": "4", "head": "Named after the River Roding, which flows through the valley.", "text": "The river takes its name from the Rodings, villages of the people of a Saxon leader called Hroda.", "links": [{"t": "River Roding", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/River_Roding"}, {"t": "Roding Valley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Roding_Valley_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.617199, 0.043647]}, "Royal Oak": {"name": "Royal Oak", "q": "Westminster", "zone": "2", "head": "Named after a pub called the Royal Oak.", "text": "The pub name recalls the oak tree at Boscobel in Shropshire where the future Charles II hid from Parliament's soldiers in 1651. The station opened in 1871.", "links": [{"t": "Royal Oak", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Oak"}, {"t": "Royal Oak tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Oak_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.519113, -0.188748]}, "Ruislip": {"name": "Ruislip", "q": "Hillingdon", "zone": "6", "head": "'Ruislip' means the leaping place where rushes grow.", "text": "It comes from Old English rysc, rush, and hlȳp, a leap: probably a narrow spot on the River Pinn that could be jumped across. The station opened in 1904.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "Ruislip tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.571354, -0.421898]}, "Ruislip Gardens": {"name": "Ruislip Gardens", "q": "Hillingdon", "zone": "5", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "The leap was probably a narrow crossing on the River Pinn. 'Gardens' was used for new suburban housing. The station opened on the Central line in 1948.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "Ruislip Gardens tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Gardens_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.560736, -0.41071]}, "Ruislip Manor": {"name": "Ruislip Manor", "q": "Hillingdon", "zone": "6", "head": "Named after a housing estate built on land of the old manor of Ruislip.", "text": "Ruislip means the leaping place where rushes grow. The station opened as a halt in 1912, long before most of the houses.", "links": [{"t": "Ruislip Manor", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Manor"}, {"t": "Ruislip Manor tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip_Manor_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.573202, -0.412973]}, "Russell Square": {"name": "Russell Square", "q": "Camden", "zone": "1", "head": "Named after the Russell family, the Dukes of Bedford.", "text": "They owned much of Bloomsbury and laid out the square around 1800.", "links": [{"t": "Russell Square", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Russell_Square"}, {"t": "Russell Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Russell_Square_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.523073, -0.124285]}, "Seven Sisters": {"name": "Seven Sisters", "q": "Haringey", "zone": "3", "head": "Named after a ring of seven trees on Page Green.", "text": "By local tradition they were planted by seven sisters. The first trees were elms; the ring has been replanted several times, most recently with hornbeams in 1996.", "links": [{"t": "Seven Sisters, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Sisters,_London"}, {"t": "Seven Sisters station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Seven_Sisters_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.58333, -0.072584]}, "Shepherd's Bush": {"name": "Shepherd's Bush", "q": "Hammersmith and Fulham", "zone": "2", "head": "Nobody really knows where 'Shepherd's Bush' comes from.", "text": "One idea is that shepherds rested their flocks here on the way to Smithfield market in the City. Another is that it recalls a local man called Shepherd or Sheppard.", "links": [{"t": "Shepherd's Bush", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush"}, {"t": "Shepherd's Bush tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.504376, -0.218813]}, "Shepherd's Bush Market": {"name": "Shepherd's Bush Market", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the street market beside the railway, in Shepherd's Bush.", "text": "The station was called Shepherd's Bush until 2008, when it was renamed to avoid confusion with the Central line station. Nobody knows for sure where 'Shepherd's Bush' comes from.", "links": [{"t": "Shepherd's Bush Market", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_Market"}, {"t": "Shepherd's Bush Market tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Shepherd's_Bush_Market_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.505579, -0.226375]}, "Sloane Square": {"name": "Sloane Square", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Sir Hans Sloane, physician and collector.", "text": "He bought the manor of Chelsea in 1712. His huge collection of books, plants and curiosities became the start of the British Museum after his death in 1753.", "links": [{"t": "Hans Sloane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hans_Sloane"}, {"t": "Sloane Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sloane_Square_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.49227, -0.156377]}, "Snaresbrook": {"name": "Snaresbrook", "q": "Redbridge", "zone": "4", "head": "Nobody knows for sure where 'Snaresbrook' comes from.", "text": "It may be a changed form of 'Sayers Brook', a small stream flowing into the River Roding. The station opened in 1856 as Snaresbrook & Wanstead.", "links": [{"t": "Snaresbrook", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Snaresbrook"}, {"t": "Snaresbrook tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Snaresbrook_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.580678, 0.02144]}, "South Ealing": {"name": "South Ealing", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name was first recorded around 700 as Gillingas. South Ealing station opened in 1883.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "South Ealing tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ealing_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.501003, -0.307424]}, "South Harrow": {"name": "South Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "Before the houses were built, this area was fields and the old hamlet of Roxeth. The station opened in 1903.", "links": [{"t": "South Harrow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Harrow"}, {"t": "South Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Harrow_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.564888, -0.352492]}, "South Kensington": {"name": "South Kensington", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Kensington, the farm of a Saxon called Cynesige.", "text": "The area grew after the Great Exhibition of 1851, whose profits paid for the museums and colleges here. A long tunnel leads from the station to the museums.", "links": [{"t": "South Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kensington"}, {"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "South Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kensington_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.494094, -0.174138]}, "South Kenton": {"name": "South Kenton", "q": "Brent", "zone": "4", "head": "'Kenton' probably means the farm of a man called Coena.", "text": "It ends in Old English tūn, a farm or settlement. South Kenton station opened in 1933 for new houses.", "links": [{"t": "Kenton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton,_London"}, {"t": "South Kenton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Kenton_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.570232, -0.308433]}, "South Ruislip": {"name": "South Ruislip", "q": "Hillingdon", "zone": "5", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "The station opened in 1908 as Northolt Junction and only became South Ruislip in 1947. The Central line arrived in 1948.", "links": [{"t": "South Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ruislip"}, {"t": "South Ruislip station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Ruislip_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.556853, -0.398915]}, "South Wimbledon": {"name": "South Wimbledon", "q": "Merton", "zone": "3/4", "head": "Named after Wimbledon, though the station is actually in Merton.", "text": "'Wimbledon' probably means the hill of a man called Wynnmann. For many years the station was called South Wimbledon (Merton) to make this clear.", "links": [{"t": "Wimbledon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon,_London"}, {"t": "South Wimbledon tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Wimbledon_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.415309, -0.192005]}, "South Woodford": {"name": "South Woodford", "q": "Redbridge", "zone": "4", "head": "'Woodford' means the ford by the wood.", "text": "The ford crossed the River Roding. The station opened in 1856 as George Lane, after the road outside, and its name changed several times before settling as South Woodford.", "links": [{"t": "South Woodford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Woodford"}, {"t": "South Woodford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Woodford_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.591907, 0.027338]}, "Southfields": {"name": "Southfields", "q": "Wandsworth", "zone": "3", "head": "Named after the south fields of Wandsworth, open farmland for centuries.", "text": "They were first recorded in the 13th century and stayed fields until about 1900. During the Wimbledon tennis championships, this is the station for the courts.", "links": [{"t": "Southfields", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southfields"}, {"t": "Southfields tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southfields_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.445073, -0.206602]}, "Southgate": {"name": "Southgate", "q": "Enfield", "zone": "4", "head": "Named after the south gate into Enfield Chase, a royal hunting ground.", "text": "The village grew up around the gate. The round station of 1933, designed by Charles Holden, is listed as a historic building.", "links": [{"t": "Southgate, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southgate,_London"}, {"t": "Southgate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southgate_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.632315, -0.127816]}, "Southwark": {"name": "Southwark", "q": "Southwark", "zone": "1", "head": "'Southwark' means the southern fort.", "text": "It was recorded in the early 10th century as Suthriganaweorc, the fort of the men of Surrey, defending the southern end of London Bridge. The station opened in 1999.", "links": [{"t": "Southwark", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southwark"}, {"t": "Southwark tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Southwark_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.50427, -0.105331]}, "St James's Park": {"name": "St James's Park", "q": "Westminster", "zone": "1", "head": "Named after St James's Park, which takes its name from St James's Palace.", "text": "The palace was built by Henry VIII on the site of a medieval hospital for women with leprosy, dedicated to St James the Less. The park is the oldest of London's royal parks.", "links": [{"t": "St James's Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Park"}, {"t": "St James's Palace", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Palace"}, {"t": "St James's Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_James's_Park_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.499544, -0.133608]}, "St John's Wood": {"name": "St John's Wood", "q": "Westminster", "zone": "2", "head": "Named after the Knights of St John, who owned the woods here.", "text": "The Order of St John of Jerusalem had its priory in Clerkenwell and held this wooded land in the Middle Ages. The station opened in 1939.", "links": [{"t": "St John's Wood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_John's_Wood"}, {"t": "St John's Wood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_John's_Wood_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.534521, -0.173948]}, "St Paul's": {"name": "St Paul's", "q": "City of London", "zone": "1", "head": "Named after St Paul's Cathedral, just to the south.", "text": "There has been a church dedicated to St Paul on this hill since 604. The station opened in 1900 as Post Office, after the head office of the Post Office nearby, and was renamed in 1937.", "links": [{"t": "St Paul's Cathedral", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Paul's_Cathedral"}, {"t": "St Paul's tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Paul's_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.514936, -0.097567]}, "Stamford Brook": {"name": "Stamford Brook", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after a stream, now lost, between Hammersmith and Chiswick.", "text": "'Stamford' is said to mean the stony ford. The brook now runs in a pipe under the streets.", "links": [{"t": "Stamford Brook", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Brook"}, {"t": "Stamford Brook tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stamford_Brook_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.494917, -0.245704]}, "Stanmore": {"name": "Stanmore", "q": "Harrow", "zone": "5", "head": "'Stanmore' means the stony pool.", "text": "It comes from Old English stān, stone, and mere, a pool; the gravel soil here is very stony. The station opened in 1932.", "links": [{"t": "Stanmore", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stanmore"}, {"t": "Stanmore tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stanmore_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.619839, -0.303266]}, "Stepney Green": {"name": "Stepney Green", "q": "Tower Hamlets", "zone": "2", "head": "'Stepney' means the landing place of a man called Stebba.", "text": "It was recorded around 1000 as Stybbanhythe, with hythe meaning a landing place on the Thames. The green is the old village green of Stepney.", "links": [{"t": "Stepney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stepney"}, {"t": "Stepney Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stepney_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.521858, -0.046596]}, "Stockwell": {"name": "Stockwell", "q": "Lambeth", "zone": "2", "head": "'Stockwell' means the well or spring by a tree stump.", "text": "It comes from Old English stocc, a stump or post. Outside the station is the entrance to a deep-level shelter built during the Second World War.", "links": [{"t": "Stockwell", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stockwell"}, {"t": "Stockwell tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stockwell_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.472184, -0.122644]}, "Stonebridge Park": {"name": "Stonebridge Park", "q": "Brent", "zone": "3", "head": "Named after a stone bridge over the River Brent.", "text": "The bridge was built in the 17th century to carry Harrow Road over the river. Bakerloo trains have called here since 1917.", "links": [{"t": "Stonebridge, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stonebridge,_London"}, {"t": "Stonebridge Park station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stonebridge_Park_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.543959, -0.275892]}, "Stratford": {"name": "Stratford", "q": "Newham", "zone": "2/3", "head": "'Stratford' means the ford on the Roman road.", "text": "Old English stræt, a paved Roman road, gave us the word 'street'. Here the road from London to Colchester crossed the River Lea. The area was the centre of the 2012 Olympic Games.", "links": [{"t": "Stratford, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford,_London"}, {"t": "Stratford station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.541806, -0.003458]}, "Sudbury Hill": {"name": "Sudbury Hill", "q": "Harrow", "zone": "4", "head": "'Sudbury' means the southern manor.", "text": "It was south of Harrow, the main village. Sudbury Hill station opened in 1903.", "links": [{"t": "Sudbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury,_London"}, {"t": "Sudbury Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury_Hill_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.556946, -0.336435]}, "Sudbury Town": {"name": "Sudbury Town", "q": "Brent", "zone": "4", "head": "'Sudbury' means the southern manor.", "text": "It lay south of Harrow. The station was rebuilt in 1931 by Charles Holden as a brick and glass box, a model for many later Underground stations.", "links": [{"t": "Sudbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury,_London"}, {"t": "Sudbury Town tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Sudbury_Town_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.550815, -0.315745]}, "Swiss Cottage": {"name": "Swiss Cottage", "q": "Camden", "zone": "2", "head": "Named after a pub built to look like a Swiss chalet.", "text": "An inn has stood on this site since the early 19th century. The pub, Ye Olde Swiss Cottage, still stands near the station.", "links": [{"t": "Swiss Cottage", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Swiss_Cottage"}, {"t": "Swiss Cottage tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Swiss_Cottage_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.543681, -0.174894]}, "Temple": {"name": "Temple", "q": "Westminster", "zone": "1", "head": "Named after the Temple, once the home of the Knights Templar.", "text": "The knights built the round Temple Church in the 12th century. After the order was closed down in the 14th century, lawyers moved in, and the Inner and Middle Temple are still two of the Inns of Court.", "links": [{"t": "Temple, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Temple,_London"}, {"t": "Temple tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Temple_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.511006, -0.11426]}, "Theydon Bois": {"name": "Theydon Bois", "q": "Epping Forest", "zone": "6", "head": "'Bois' is the family name of medieval landowners.", "text": "The Bois family held the land in the 12th and 13th centuries. 'Theydon' is thought to mean the valley where thatch was gathered. The station opened in 1865 as Theydon.", "links": [{"t": "Theydon Bois", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theydon_Bois"}, {"t": "Theydon Bois tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Theydon_Bois_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.671759, 0.103085]}, "Tooting Bec": {"name": "Tooting Bec", "q": "Wandsworth", "zone": "3", "head": "'Bec' recalls the Abbey of Bec in Normandy, which owned land here after 1066.", "text": "Tooting probably means the people of a man called Tota. The station opened in 1926 as Trinity Road (Tooting Bec) and was renamed in 1950.", "links": [{"t": "Tooting Bec Common", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Bec_Common"}, {"t": "Tooting", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting"}, {"t": "Tooting Bec tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Bec_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.435678, -0.159736]}, "Tooting Broadway": {"name": "Tooting Broadway", "q": "Wandsworth", "zone": "3", "head": "'Tooting' probably means the people of a man called Tota.", "text": "A 'broadway' is a wide main street. The statue of King Edward VII outside the station has stood there since 1911.", "links": [{"t": "Tooting", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting"}, {"t": "Tooting Broadway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tooting_Broadway_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.42763, -0.168374]}, "Tottenham Court Road": {"name": "Tottenham Court Road", "q": "Camden", "zone": "1", "head": "Named after the road to the manor of Tottenhall, not Tottenham.", "text": "The manor house, near today's Euston Road, was probably named after a landowner called Tota. The road led there from the West End.", "links": [{"t": "Tottenham Court Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Court_Road"}, {"t": "Tottenham Court Road station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Court_Road_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.516426, -0.13041]}, "Tottenham Hale": {"name": "Tottenham Hale", "q": "Haringey", "zone": "3", "head": "'Tottenham' means the homestead of a man called Totta.", "text": "'Hale' is said to come from an old word meaning to hoist or haul: goods such as timber were unloaded from the River Lea here. The station opened with the Victoria line in 1968.", "links": [{"t": "Tottenham Hale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Hale"}, {"t": "Tottenham Hale station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tottenham_Hale_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.588108, -0.060241]}, "Totteridge & Whetstone": {"name": "Totteridge & Whetstone", "q": "Barnet", "zone": "4", "head": "'Totteridge' means the ridge of a man called Tata; 'Whetstone' is a puzzle.", "text": "Legend says soldiers sharpened their swords on a whetstone here before the Battle of Barnet in 1471, but the name is older than that. It more probably means 'west town'.", "links": [{"t": "Totteridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Totteridge"}, {"t": "Whetstone, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whetstone,_London"}, {"t": "Totteridge & Whetstone tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Totteridge_&_Whetstone_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.630597, -0.17921]}, "Tower Hill": {"name": "Tower Hill", "q": "Tower Hamlets", "zone": "1", "head": "Named after the hill beside the Tower of London.", "text": "For centuries it was a place of public execution. The station was called Mark Lane until 1946.", "links": [{"t": "Tower Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_Hill"}, {"t": "Tower Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tower_Hill_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.509971, -0.076546]}, "Tufnell Park": {"name": "Tufnell Park", "q": "Islington", "zone": "2", "head": "Named after the Tufnell family, lords of the manor of Barnsbury.", "text": "William Tufnell was given the manor in 1753. His descendant Henry Tufnell began building houses on the estate in 1845. The station opened in 1907.", "links": [{"t": "Tufnell Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tufnell_Park"}, {"t": "Tufnell Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Tufnell_Park_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.556822, -0.138433]}, "Turnham Green": {"name": "Turnham Green", "q": "Hounslow", "zone": "2/3", "head": "'Turnham' means the homestead in the river bend.", "text": "The Thames makes a large loop here. In 1642, during the Civil War, a royalist army turned back at Turnham Green instead of marching on London.", "links": [{"t": "Turnham Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnham_Green"}, {"t": "Battle of Turnham Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Turnham_Green"}, {"t": "Turnham Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnham_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.495148, -0.254555]}, "Turnpike Lane": {"name": "Turnpike Lane", "q": "Haringey", "zone": "3", "head": "Named after a turnpike, a toll gate on the road north.", "text": "Travellers on Green Lanes had to pay here to use the road. The station opened in 1932.", "links": [{"t": "Turnpike Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnpike_Lane"}, {"t": "Turnpike Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Turnpike_Lane_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.590272, -0.102953]}, "Upminster": {"name": "Upminster", "q": "Havering", "zone": "6", "head": "'Upminster' means the minster, or large church, on higher ground.", "text": "Upminster is the eastern end of the District line.", "links": [{"t": "Upminster", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster"}, {"t": "Upminster station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.559063, 0.250882]}, "Upminster Bridge": {"name": "Upminster Bridge", "q": "Havering", "zone": "6", "head": "Named after the bridge over the River Ingrebourne, near Upminster.", "text": "Upminster means the large church on higher ground. The station opened in 1934.", "links": [{"t": "Upminster Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_Bridge"}, {"t": "Upminster Bridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upminster_Bridge_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.55856, 0.235809]}, "Upney": {"name": "Upney", "q": "Barking and Dagenham", "zone": "4", "head": "'Upney' probably means the higher island.", "text": "The 'island' was a patch of dry land among the streams and marshes near the Mayes Brook. The station opened in 1932.", "links": [{"t": "Upney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upney"}, {"t": "Upney tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upney_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.538372, 0.10153]}, "Upton Park": {"name": "Upton Park", "q": "Newham", "zone": "3", "head": "'Upton' means the farm on higher ground.", "text": "'Park' was added in the 1880s to sell new houses. West Ham United's old stadium, the Boleyn Ground, was often called Upton Park.", "links": [{"t": "Upton Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upton_Park,_London"}, {"t": "Upton Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Upton_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.53534, 0.035263]}, "Uxbridge": {"name": "Uxbridge", "q": "Hillingdon", "zone": "6", "head": "'Uxbridge' means the bridge of the Wixan people.", "text": "The Wixan were an Anglo-Saxon tribe who settled here, and the bridge crossed the River Colne. Uxbridge is the western end of the Metropolitan and Piccadilly lines.", "links": [{"t": "Uxbridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Uxbridge"}, {"t": "Uxbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Uxbridge_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.546565, -0.477949]}, "Vauxhall": {"name": "Vauxhall", "q": "Lambeth", "zone": "1/2", "head": "'Vauxhall' means Falkes' Hall, the house of a medieval knight.", "text": "Falkes de Breauté built it in the 13th century. Later, Vauxhall Pleasure Gardens were famous across Europe, and the car maker took its name from the area.", "links": [{"t": "Vauxhall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Vauxhall"}, {"t": "Falkes de Breauté", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Falkes_de_Breaut%C3%A9"}, {"t": "Vauxhall station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Vauxhall_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.485743, -0.124204]}, "Victoria": {"name": "Victoria", "q": "Westminster", "zone": "1", "head": "Named after Victoria Street, which honours Queen Victoria.", "text": "The main line station took the street's name in 1860. It stands on the site of an old basin of the Grosvenor Canal.", "links": [{"t": "London Victoria station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Victoria_station"}, {"t": "London Victoria station#London Underground station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Victoria_station%23London_Underground_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.496359, -0.143102]}, "Walthamstow Central": {"name": "Walthamstow Central", "q": "Waltham Forest", "zone": "3", "head": "'Walthamstow' probably means the place of welcome.", "text": "It was recorded in 1075 as Wilcumestowe. 'Central' tells it apart from other stations in the town. The Victoria line arrived in 1968.", "links": [{"t": "Walthamstow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow"}, {"t": "Walthamstow Central station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Walthamstow_Central_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.582965, -0.019885]}, "Wanstead": {"name": "Wanstead", "q": "Redbridge", "zone": "4", "head": "'Wanstead' means a place, but nobody is sure what kind.", "text": "It was first recorded in the 11th century as Wenstede. -stead means a place or site; the first part may mean a hill, or a wagon.", "links": [{"t": "Wanstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead"}, {"t": "Wanstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wanstead_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.575501, 0.028527]}, "Warren Street": {"name": "Warren Street", "q": "Camden", "zone": "1", "head": "Named after Anne Warren, wife of the landowner Charles FitzRoy.", "text": "FitzRoy, later Baron Southampton, developed the land in the late 18th century. The station opened in 1907 as Euston Road and was renamed a year later.", "links": [{"t": "Warren Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warren_Street"}, {"t": "Warren Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warren_Street_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.524951, -0.138321]}, "Warwick Avenue": {"name": "Warwick Avenue", "q": "Westminster", "zone": "2", "head": "Named after Jane Warwick, wife of Sir John Frederick.", "text": "They married in 1778; Frederick leased the land from the Bishop of London, and the avenue was named after her. The station opened in 1915.", "links": [{"t": "Warwick Avenue", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warwick_Avenue"}, {"t": "Warwick Avenue tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Warwick_Avenue_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.523263, -0.183783]}, "Waterloo": {"name": "Waterloo", "q": "Lambeth", "zone": "1", "head": "Named after Waterloo Bridge, which commemorates the Battle of Waterloo.", "text": "The bridge was being built when Wellington beat Napoleon in 1815. It was meant to be called Strand Bridge but opened in 1817 as Waterloo Bridge. The road and the station followed.", "links": [{"t": "Waterloo Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Waterloo_Bridge"}, {"t": "Battle of Waterloo", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Waterloo"}, {"t": "Waterloo tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Waterloo_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.503299, -0.11478]}, "Watford": {"name": "Watford", "q": "Watford", "zone": "7", "head": "'Watford' probably means the ford used for hunting, or the wet ford.", "text": "The ford crossed the River Colne. The Metropolitan line station opened in 1925 in Cassiobury, a long walk from the town centre.", "links": [{"t": "Watford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford"}, {"t": "Watford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watford_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.657446, -0.417377]}, "Wembley Central": {"name": "Wembley Central", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "It ends in Old English leah, a clearing. The station opened in 1842 as Sudbury, and became Wembley Central in 1948, the year Wembley hosted the Olympic Games.", "links": [{"t": "Wembley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley"}, {"t": "Wembley Central station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Central_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.552304, -0.296852]}, "Wembley Park": {"name": "Wembley Park", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "In the 1890s a tower meant to rival the Eiffel Tower was started here; it was never finished. Wembley Stadium was later built on its site.", "links": [{"t": "Wembley Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Park"}, {"t": "Wembley Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley_Park_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.563198, -0.279262]}, "West Acton": {"name": "West Acton", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. West Acton station opened in 1923.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "West Acton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Acton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.518001, -0.28098]}, "West Brompton": {"name": "West Brompton", "q": "Kensington and Chelsea", "zone": "2", "head": "'Brompton' means the farm where broom grows.", "text": "Broom is a yellow-flowered shrub. The station opened in 1869; Brompton Cemetery, one of London's 'Magnificent Seven' cemeteries, is next door.", "links": [{"t": "West Brompton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Brompton"}, {"t": "West Brompton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Brompton_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.487268, -0.195599]}, "West Finchley": {"name": "West Finchley", "q": "Barnet", "zone": "4", "head": "'Finchley' probably means the clearing where finches live.", "text": "It ends in Old English leah, a clearing in a wood. The Northern line has served West Finchley since 1940.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "West Finchley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Finchley_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.609426, -0.188362]}, "West Ham": {"name": "West Ham", "q": "Newham", "zone": "2/3", "head": "'Ham' means dry land in a river bend or between rivers.", "text": "Here the land lies between the Thames, the Lea and the Roding. It was split into East Ham and West Ham in the 12th century. The football club West Ham United took its name from the area.", "links": [{"t": "West Ham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ham"}, {"t": "West Ham station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ham_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.528136, 0.005055]}, "West Hampstead": {"name": "West Hampstead", "q": "Camden", "zone": "2", "head": "'Hampstead' simply means homestead.", "text": "It comes from Old English hām-stede. West Hampstead grew in the late 19th century when three railway lines arrived. The station opened in 1879.", "links": [{"t": "West Hampstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Hampstead"}, {"t": "West Hampstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Hampstead_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.546638, -0.191059]}, "West Harrow": {"name": "West Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on Harrow Hill, where St Mary's Church stands today. West Harrow station opened in 1913.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "West Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Harrow_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.57971, -0.3534]}, "West Kensington": {"name": "West Kensington", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Kensington, the farm of a Saxon called Cynesige.", "text": "The station is actually in Fulham. It opened in 1874 as North End (Fulham) and was renamed West Kensington in 1877, probably because the name sounded more attractive.", "links": [{"t": "West Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Kensington"}, {"t": "West Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Kensington_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.490459, -0.206636]}, "West Ruislip": {"name": "West Ruislip", "q": "Hillingdon", "zone": "6", "head": "Named after Ruislip, the leaping place where rushes grow.", "text": "It opened in 1906 as Ruislip & Ickenham. West Ruislip is the western end of the Central line.", "links": [{"t": "Ruislip", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ruislip"}, {"t": "West Ruislip station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_Ruislip_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.569688, -0.437886]}, "Westbourne Park": {"name": "Westbourne Park", "q": "Westminster", "zone": "2", "head": "Named after the River Westbourne, the 'western stream'.", "text": "The river rises in Hampstead and flows to the Thames, now hidden in pipes. In the Middle Ages the area was called Westbourne Green.", "links": [{"t": "River Westbourne", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/River_Westbourne"}, {"t": "Westbourne Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westbourne_Park_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.52111, -0.201065]}, "Westminster": {"name": "Westminster", "q": "Westminster", "zone": "1", "head": "'Westminster' means the minster, or abbey church, to the west.", "text": "It was west of the City of London. The abbey was founded in the 10th century and rebuilt by Edward the Confessor, and it gave its name to the whole area, including the Houses of Parliament.", "links": [{"t": "Westminster Abbey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster_Abbey"}, {"t": "Westminster", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster"}, {"t": "Westminster tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Westminster_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.50132, -0.124861]}, "White City": {"name": "White City", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the white exhibition buildings of 1908.", "text": "The Franco-British Exhibition was held here in 1908, with palaces covered in white. The stadium built at the same time hosted the 1908 Olympic Games.", "links": [{"t": "White City, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_City,_London"}, {"t": "White City tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/White_City_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.511959, -0.224297]}, "Whitechapel": {"name": "Whitechapel", "q": "Tower Hamlets", "zone": "2", "head": "Named after a white chapel, the church of St Mary Matfelon.", "text": "The chapel was built of white chalk stone in the 13th century, and its bright walls gave the area its name.", "links": [{"t": "Whitechapel", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whitechapel"}, {"t": "Whitechapel station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Whitechapel_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.519518, -0.059971]}, "Willesden Green": {"name": "Willesden Green", "q": "Brent", "zone": "2/3", "head": "'Willesden' means the spring by the hill.", "text": "It was first recorded in 939 as Willesdune. The spring has been lost. The station opened in 1879.", "links": [{"t": "Willesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden"}, {"t": "Willesden Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden_Green_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.549146, -0.221537]}, "Willesden Junction": {"name": "Willesden Junction", "q": "Brent", "zone": "2/3", "head": "Named after a large railway junction in Willesden.", "text": "'Willesden' means the spring by the hill. Several railway lines meet and cross here. Bakerloo trains have called since 1915.", "links": [{"t": "Willesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden"}, {"t": "Willesden Junction station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Willesden_Junction_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.532259, -0.244283]}, "Wimbledon": {"name": "Wimbledon", "q": "Merton", "zone": "3", "head": "'Wimbledon' probably means the hill of a man called Wynnmann.", "text": "It was recorded around 950 as Wunemannedune; 'dun' means a hill. Since 1877 the town has been home to the world's oldest tennis tournament.", "links": [{"t": "Wimbledon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon,_London"}, {"t": "Wimbledon station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.421207, -0.206573]}, "Wimbledon Park": {"name": "Wimbledon Park", "q": "Merton", "zone": "3", "head": "Named after the park of Wimbledon House, a great estate.", "text": "The grounds and lake were landscaped by Capability Brown in the 1760s. Part of the old park is now the home of the All England Lawn Tennis Club.", "links": [{"t": "Wimbledon Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_Park"}, {"t": "Wimbledon Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wimbledon_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.434573, -0.199719]}, "Wood Green": {"name": "Wood Green", "q": "Haringey", "zone": "3", "head": "'Wood Green' means the green by the woods.", "text": "The village grew around an open space on the edge of the forest of Enfield Chase. The station opened in 1932.", "links": [{"t": "Wood Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Green"}, {"t": "Wood Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Green_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.597479, -0.109886]}, "Wood Lane": {"name": "Wood Lane", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Wood Lane, called Turvens Lane until about 1830.", "text": "It was renamed after the woods nearby. The station opened in 2008, next to the old BBC Television Centre.", "links": [{"t": "Wood Lane, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Lane,_London"}, {"t": "Wood Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wood_Lane_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.509669, -0.22453]}, "Woodford": {"name": "Woodford", "q": "Redbridge", "zone": "4", "head": "'Woodford' means the ford by the wood.", "text": "The ford crossed the River Roding, on the edge of Epping Forest. It was later replaced by a bridge, which gave its name to Woodford Bridge.", "links": [{"t": "Woodford, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodford,_London"}, {"t": "Woodford tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodford_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.606899, 0.03397]}, "Woodside Park": {"name": "Woodside Park", "q": "Barnet", "zone": "4", "head": "Named after Woodside House, built in 1840.", "text": "A local developer took the name for his new housing estate, and the station followed. The Northern line arrived in 1940.", "links": [{"t": "Woodside Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodside_Park"}, {"t": "Woodside Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodside_Park_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.618014, -0.18542]}};

const TR = {"fr": {"Acton Town": ["« Acton » signifie la ferme près des chênes.", "Le nom vient de deux mots du vieil anglais : āc, chêne, et tūn, ferme ou village. La station a ouvert en 1879 sous le nom de Mill Hill Park et s'appelle Acton Town depuis 1910."], "Aldgate": ["Nommée d'après Aldgate, l'une des portes du mur romain et médiéval de Londres.", "Personne ne sait vraiment ce que signifie « Ald ». On a proposé « vieille porte », une « porte de la bière » avec une taverne, un Saxon nommé Ealh ou une porte ouverte à tous. La porte elle-même a été démolie en 1761."], "Aldgate East": ["Nommée d'après Aldgate, une ancienne porte du mur de la City, et située juste à l'est.", "« East » la distingue de la station Aldgate, toute proche. L'origine d'« Aldgate » est incertaine : vieille porte, porte de la bière avec une taverne ou Saxon nommé Ealh, entre autres hypothèses."], "Alperton": ["« Alperton » signifie la ferme d'un homme nommé Ealhbeorht.", "Ce nom saxon est une forme ancienne d'Albert, et l'on ne sait rien d'autre de lui. La station a ouvert en 1903 sous le nom de Perivale-Alperton et porte son nom actuel depuis 1910."], "Amersham": ["« Amersham » signifie le domaine d'un Saxon nommé Ealhmund.", "Le nom est noté à l'époque anglo-saxonne sous la forme Agmodesham, -ham désignant une ferme ou un domaine. Le Metropolitan Railway a atteint la ville en 1892."], "Angel": ["Nommée d'après l'Angel, une célèbre auberge de diligences.", "L'auberge se trouvait au croisement de la Great North Road et de Pentonville Road, où les diligences s'arrêtaient avant la dernière étape vers Londres. Elle a survécu jusqu'au XXe siècle, et la station a ouvert à proximité en 1901."], "Archway": ["Nommée d'après le pont qui fait passer Hornsey Lane au-dessus de la route du nord.", "La première arche a été construite en 1813, puis remplacée vers 1900 par le pont en fer actuel. La station s'appelait Highgate à son ouverture en 1907 et n'est devenue Archway qu'en 1947."], "Arnos Grove": ["Le nom rappelle probablement la famille Arnold, propriétaire terrien au XIVe siècle.", "Au fil des siècles, « Arnold's Grove » serait devenu Arno's Grove, puis Arnos Grove, mais le lien n'est pas certain. Le bâtiment rond de 1932 est l'une des œuvres les plus connues de l'architecte Charles Holden."], "Arsenal": ["Nommée d'après le club de football d'Arsenal, dont l'ancien stade de Highbury était tout proche.", "Le club a été fondé au Royal Arsenal de Woolwich et s'est installé à Highbury en 1913. La station a ouvert en 1906 sous le nom de Gillespie Road et a été rebaptisée en 1932, après une campagne menée par l'entraîneur du club, Herbert Chapman. L'ancien nom est encore visible sur le carrelage."], "Baker Street": ["Nommée d'après William Baker, qui a tracé la rue au XVIIIe siècle.", "La station a ouvert en 1863 sur le premier chemin de fer souterrain du monde, le Metropolitan Railway. Baker Street est aussi l'adresse fictive de Sherlock Holmes, au 221B."], "Balham": ["« Balham » signifie probablement une ferme dans un enclos arrondi.", "Le lieu figure dans le Domesday Book de 1086 sous le nom de Belgeham. La première partie viendrait d'un mot du vieil anglais désignant quelque chose de rond ou de lisse."], "Bank": ["Nommée d'après la Banque d'Angleterre, qui se dresse au-dessus de la station.", "La ligne Waterloo & City est arrivée la première, en 1898, dans une station appelée simplement City. Aujourd'hui, Bank est l'une des plus grandes stations du réseau : plusieurs lignes s'y croisent sous le vieux cœur de la City."], "Barbican": ["Une « barbacane » est une tour de guet ou un ouvrage avancé d'une ville fortifiée.", "Le nom rappelle sans doute une tour sur le mur romain et médiéval de Londres, ou près de lui. La station a ouvert en 1865 sous le nom d'Aldersgate Street, d'après une autre porte du mur, et n'est devenue Barbican qu'en 1968."], "Barking": ["« Barking » signifie le peuple de Berica, ou le village près des bouleaux.", "Le nom est noté sous la forme Berecingas au VIIIe siècle. L'abbaye de Barking, fondée au VIIe siècle, était l'un des plus importants couvents de femmes d'Angleterre."], "Barkingside": ["« Barkingside » signifie le côté de la forêt de Hainault qui appartenait à Barking.", "Le secteur se trouvait juste à l'intérieur de l'ancien domaine et de la paroisse de Barking, dont la limite traversait la forêt. Une carte de 1777 montre « Barking Side » comme une longue bande de terrain communal en bordure ouest de la forêt."], "Barons Court": ["Un nom inventé, choisi vers 1900 pour de nouveaux logements.", "Il n'a aucune origine historique connue. Il devait sans doute sonner noble et répondre à Earl's Court, la station voisine."], "Battersea Power Station": ["Nommée d'après la centrale électrique voisine, devenue boutiques, logements et bureaux.", "Battersea est l'un des plus anciens noms connus de Londres : au VIIe siècle, c'était Badrices īeg, l'île de Badric, une terre sèche dans les marais de la Tamise. La station a ouvert en 2021 au bout du prolongement de la Northern line."], "Bayswater": ["« Bayswater » rappelle Bayard's Watering, mentionné en 1380.", "La famille Bayard possédait des terres ici, au bord de la rivière Westbourne, qui coule aujourd'hui dans une canalisation sous les rues. Le « watering » était sans doute un abreuvoir pour chevaux ou bétail."], "Becontree": ["« Becontree » signifie probablement l'arbre d'un Saxon nommé Beohha.", "C'était le lieu de réunion d'une ancienne « centaine », une subdivision du comté. Après la Première Guerre mondiale, le nom a été donné à une immense cité de logements sociaux, l'une des plus grandes du monde à l'époque."], "Belsize Park": ["« Belsize » vient du français « bel assis », c'est-à-dire bien situé.", "Le nom est attesté dès le XIVe siècle pour un domaine sur les pentes au pied de Hampstead. La station a ouvert en 1907."], "Bermondsey": ["« Bermondsey » signifie l'île d'un homme nommé Beornmund.", "L'« île » était une butte de terre sèche dans les marais au sud de la Tamise. Le lieu figure dans le Domesday Book de 1086, et la station a ouvert en 1999 avec le prolongement de la Jubilee line."], "Bethnal Green": ["« Bethnal » signifie probablement le coin de terre d'un homme nommé Blitha.", "Des formes anciennes comme Blithehale renvoient au vieil anglais blithe, joyeux, ou à un nom de personne, et à healh, un coin de terre. Le « green » était le pré communal du village, qui subsiste sous forme de parc."], "Blackfriars": ["Nommée d'après les dominicains en habit noir, qui avaient un prieuré ici.", "Les frères s'y sont installés au XIIIe siècle et y sont restés jusqu'à ce qu'Henri VIII ferme les monastères. Leur nom survit dans le pont, la gare et le quartier."], "Blackhorse Road": ["Nommée d'après la rue, dont le nom est sans doute une déformation de Black House Lane.", "La « maison noire » était un manoir local ; le cheval noir des carreaux de la station est donc une idée plus tardive. La station a ouvert avec la Victoria line en 1968."], "Bond Street": ["Nommée d'après Sir Thomas Bond, qui a aménagé la rue au XVIIe siècle.", "Bond a acheté des terrains ici et y a tracé la rue. Aujourd'hui, aucune rue ne s'appelle simplement Bond Street : il y a Old Bond Street et New Bond Street."], "Borough": ["Nommée d'après le Borough of Southwark, la ville au sud du London Bridge.", "Pendant des siècles, ce fut le principal faubourg de Londres, si bien qu'on l'appelait simplement « le Borough ». La station a ouvert en 1890 sur la première ligne de métro profond."], "Boston Manor": ["Nommée d'après Boston Manor House, un manoir jacobéen proche de la station.", "Le nom n'a rien à voir avec Boston, dans le Lincolnshire ou dans le Massachusetts : il remonte sans doute à un nom médiéval désignant la ferme d'un homme nommé Bord. La station s'appelait Boston Road jusqu'en 1911."], "Bounds Green": ["Nommée d'après la famille le Bounde, qui possédait des terres ici au XIIIe siècle.", "Leur nom a survécu dans une ferme locale, et la station l'a repris à l'arrivée de la Piccadilly line en 1932."], "Bow Road": ["Nommée d'après le pont en arc qui franchit la rivière Lea.", "Ce pont voûté, construit au début du XIIe siècle, selon la tradition à la demande de la reine Mathilde, a donné son nom au village de Bow (« arc »)."], "Brent Cross": ["Nommée d'après la rivière Brent et un carrefour voisin.", "« Brent » est un nom celtique, bien plus ancien que l'anglais, qui signifierait « la sainte » ou « la haute ». La station a ouvert en 1923 sous le nom de Brent et s'appelle Brent Cross depuis 1976."], "Brixton": ["« Brixton » signifie la pierre d'un homme nommé Beorhtsige.", "La pierre servait sans doute de lieu de réunion à la « centaine » locale, une ancienne subdivision du comté. La Victoria line a atteint Brixton en 1971."], "Bromley-by-Bow": ["« Bromley » signifie une clairière où pousse le genêt.", "« By-Bow » a été ajouté en 1968 pour éviter la confusion avec Bromley, dans le Kent. Bow tire son nom d'un pont en arc sur la rivière Lea."], "Buckhurst Hill": ["« Buckhurst » signifie une colline boisée couverte de hêtres.", "Le nom apparaît au XIIe siècle sous la forme La Bocherste. La colline borde la forêt d'Epping, où les hêtres sont encore nombreux."], "Burnt Oak": ["Le nom évoque un chêne brûlé, mais son histoire est inconnue.", "Il apparaît pour la première fois en 1754 comme nom d'un champ en bordure de Watling Street, l'ancienne voie romaine. Le chêne qui a donné son nom a disparu depuis longtemps."], "Caledonian Road": ["Nommée d'après le Caledonian Asylum, un foyer pour enfants écossais.", "Cet établissement accueillait les enfants de soldats et de marins écossais tués ou blessés pendant les guerres napoléoniennes ; il s'est installé dans cette rue en 1828. « Caledonia » est l'ancien nom latin de l'Écosse."], "Camden Town": ["Nommée d'après Charles Pratt, 1er comte de Camden, propriétaire des terres.", "En 1791, il a commencé à les louer pour y bâtir des maisons. Son titre venait de Camden Place, sa demeure dans le Kent, elle-même nommée d'après l'historien William Camden."], "Canada Water": ["Nommée d'après un plan d'eau qui faisait partie du Canada Dock.", "Ce bassin des Surrey Docks devait son nom au pays d'où venaient la plupart de ses navires, chargés de bois. À la fermeture des docks, il a été en grande partie comblé, et la station a ouvert en 1999."], "Canary Wharf": ["Nommée d'après un entrepôt de fruits venus des îles Canaries.", "Des navires fruitiers des Canaries y déchargeaient à partir des années 1930. Les îles elles-mêmes tireraient leur nom des chiens (en latin canis), ce qui tombe bien : Canary Wharf se trouve sur l'Isle of Dogs, « l'île aux chiens »."], "Canning Town": ["Sans doute nommée d'après un Canning, mais on ne sait pas lequel.", "Une hypothèse désigne Charles Canning, vice-roi des Indes, mais le nom était déjà en usage avant qu'il ne devienne célèbre. D'autres pensent à son père, le Premier ministre George Canning, ou à une entreprise locale nommée Canning."], "Cannon Street": ["« Cannon » n'a rien à voir avec les canons : le nom vient des fabricants de chandelles.", "Au Moyen Âge, c'était Candelwrichtestrete, la rue des chandeliers. Avec le temps, le nom s'est raccourci en Cannon Street."], "Canons Park": ["Nommée d'après les chanoines du prieuré St Bartholomew, propriétaires des terres.", "Après la fermeture du prieuré par Henri VIII, le domaine est passé à des propriétaires privés. Au début du XVIIIe siècle, le duc de Chandos y a construit un somptueux palais appelé Cannons, démoli en 1747. Son parc est devenu Canons Park."], "Chalfont & Latimer": ["Nommée d'après les villages de Chalfont et de Latimer.", "« Chalfont » signifie probablement le ruisseau de craie, du vieil anglais cealc funta. Latimer porte le nom de la famille Latimer, qui tenait ces terres depuis le début du XIVe siècle. La station s'appelait Chalfont Road jusqu'en 1915."], "Chalk Farm": ["« Chalk » (craie) n'a rien à voir avec la craie : le nom vient de Chalcot Farm.", "Chalcot viendrait de mots du vieil anglais signifiant « cabanes froides ». La ferme était un repère local il y a environ deux cents ans."], "Chancery Lane": ["Nommée d'après la Chancellerie, administration et tribunal royal de l'Angleterre médiévale.", "La Chancellerie conservait les archives du roi et jugeait selon l'équité. La rue est toujours au cœur du Londres juridique, près des Inns of Court."], "Charing Cross": ["« Charing » désigne sans doute un tournant, et la croix est le mémorial d'une reine.", "Le nom viendrait du vieil anglais cierring, un virage, peut-être la courbe de la Tamise. Édouard Ier fit ériger ici une croix en mémoire de son épouse Éléonore, morte en 1290. Une copie victorienne se dresse devant la gare."], "Chesham": ["« Chesham » signifie le pré au bord de la rivière, près d'un tas de pierres.", "Le nom est noté un siècle environ avant la conquête normande sous la forme Cæstæleshamm. Chesham est le terminus d'une branche à voie unique de la Metropolitan line."], "Chigwell": ["Personne ne sait vraiment ce que signifie « Chigwell ».", "Ce pourrait être le puits ou la source d'un homme nommé Cicca, ou venir d'un tout autre mot. Le village est situé en bordure de la forêt d'Epping."], "Chiswick Park": ["« Chiswick » signifie la ferme du fromage.", "Le nom en vieil anglais désigne une ferme qui produisait du fromage près de la Tamise. La station a ouvert en 1879 sous le nom d'Acton Green et s'appelle Chiswick Park depuis 1910."], "Chorleywood": ["« Chorley » signifie probablement la clairière des ceorls, les paysans libres.", "Ceorl est le mot du vieil anglais qui a donné « churl » (rustre). Quant à « wood », c'est le bois. La station s'écrivait Chorley Wood, en deux mots, jusqu'en 1964."], "Clapham Common": ["Nommée d'après le pré communal de Clapham, un vaste espace ouvert.", "« Clapham » signifie probablement la ferme près d'une colline ou d'une butte, du vieil anglais clopp ; une autre hypothèse évoque un homme nommé Cloppa. An
