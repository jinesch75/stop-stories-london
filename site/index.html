"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.606899, 0.03397]]}, "Woodgrange Park": {"name": "Woodgrange Park", "q": "Newham", "zone": "3/4", "head": "Named after Woodgrange, a farm that once belonged to Stratford Langthorne Abbey.", "text": "A grange was a monastery's farm. The houses were built in the late 19th century on the farmland.", "links": [{"t": "Woodgrange Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodgrange_Park"}, {"t": "Woodgrange Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodgrange_Park_railway_station"}], "ll": [[51.549264, 0.044423]]}, "Woodside Park": {"name": "Woodside Park", "q": "Barnet", "zone": "4", "head": "Named after Woodside House, built in 1840.", "text": "A local developer took the name for his new housing estate, and the station followed. The Northern line arrived in 1940.", "links": [{"t": "Woodside Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodside_Park"}, {"t": "Woodside Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woodside_Park_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.618014, -0.18542]]}, "Woolwich": {"name": "Woolwich", "q": "Greenwich", "zone": "4", "head": "'Woolwich' means the trading place for wool.", "text": "It comes from Old English wull, wool, and wīc, a trading place, and was recorded in the 10th century. Later Woolwich became famous for its Royal Arsenal and its naval dockyard.", "links": [{"t": "Woolwich", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woolwich"}, {"t": "Woolwich railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Woolwich_railway_station"}, {"t": "How the Elizabeth line stations got their const TR = {"fr": {"Acton Town": ["« Acton » signifie la ferme près des chênes.", "Le nom vient de deux mots du vieil anglais : āc, chêne, et tūn, ferme ou village. La station a ouvert en 1879 sous le nom de Mill Hill Park et s'appelle Acton Town depuis 1910."], "Aldgate": ["Nommée d'après Aldgate, l'une des portes du mur romain et médiéval de Londres.", "Personne ne sait vraiment ce que signifie « Ald ». On a proposé « vieille porte », une « porte de la bière » avec une taverne, un Saxon nommé Ealh ou une porte ouverte à tous. La porte elle-même a été démolie en 1761."], "Aldgate East": ["Nommée d'après Aldgate, une ancienne porte du mur de la City, et située juste à l'est.", "« East » la distingue de la station Aldgate, toute proche. L'origine d'« Aldgate » est incertaine : vieille porte, porte de la bière avec une taverne ou Saxon nommé Ealh, entre autres hypothèses."], "Alperton": ["« Alperton » signifie la ferme d'un homme nommé Ealhbeorht.", "On ne sait rien d'autre de lui. La station a ouvert en 1903 sous le nom de Perivale-Alperton et porte son nom actuel depuis 1910."], "Amersham": ["« Amersham » signifie le domaine d'un Saxon nommé Ealhmund.", "Le nom est noté à l'époque anglo-saxonne sous la forme Agmodesham, -ham désignant une ferme ou un domaine. Le Metropolitan Railway a atteint la ville en 1892."], "Angel": ["Nommée d'après l'Angel, une célèbre auberge de diligences.", "L'auberge se trouvait au croisement de la Great North Road et de Pentonville Road, où les diligences s'arrêtaient avant la dernière étape vers Londres. Elle a survécu jusqu'au XXe siècle, et la station a ouvert à proximité en 1901."], "Archway": ["Nommée d'après le pont qui fait passer Hornsey Lane au-dessus de la route du nord.", "La première arche a été construite en 1813, puis remplacée vers 1900 par le pont en fer actuel. La station s'appelait Highgate à son ouverture en 1907 et n'est devenue Archway qu'en 1947."], "Arnos Grove": ["Le nom rappelle probablement la famille Arnold, propriétaire terrien au XIVe siècle.", "Au fil des siècles, « Arnold's Grove » serait devenu Arno's Grove, puis Arnos Grove, mais le lien n'est pas certain. Le bâtiment rond de 1932 est l'une des œuvres les plus connues de l'architecte Charles Holden."], "Arsenal": ["Nommée d'après le club de football d'Arsenal, dont l'ancien stade de Highbury était tout proche.", "Le club a été fondé au Royal Arsenal de Woolwich et s'est installé à Highbury en 1913. La station a ouvert en 1906 sous le nom de Gillespie Road et a été rebaptisée en 1932, après une campagne menée par l'entraîneur du club, Herbert Chapman. L'ancien nom est encore visible sur le carrelage."], "Baker Street": ["Nommée d'après William Baker, qui a tracé la rue au XVIIIe siècle.", "La station a ouvert en 1863 sur le premier chemin de fer souterrain du monde, le Metropolitan Railway. Baker Street est aussi l'adresse fictive de Sherlock Holmes, au 221B."], "Balham": ["« Balham » signifie probablement une ferme dans un enclos arrondi.", "Le lieu figure dans le Domesday Book de 1086 sous le nom de Belgeham. La première partie viendrait d'un mot du vieil anglais désignant quelque chose de rond ou de lisse."], "Bank": ["Nommée d'après la Banque d'Angleterre, qui se dresse au-dessus de la station.", "La ligne Waterloo & City est arrivée la première, en 1898, dans une station appelée simplement City. Aujourd'hui, Bank est l'une des plus grandes stations du réseau : plusieurs lignes s'y croisent sous le vieux cœur de la City."], "Barbican": ["Une « barbacane » est une tour de guet ou un ouvrage avancé d'une ville fortifiée.", "Le nom rappelle sans doute une tour sur le mur romain et médiéval de Londres, ou près de lui. La station a ouvert en 1865 sous le nom d'Aldersgate Street, d'après une autre porte du mur, et n'est devenue Barbican qu'en 1968."], "Barking": ["« Barking » signifie le peuple de Bereca, ou le village près des bouleaux.", "Le nom est noté en 735 sous la forme Berecingum. L'abbaye de Barking, fondée au VIIe siècle, était l'un des plus importants couvents de femmes d'Angleterre."], "Barkingside": ["« Barkingside » signifie le côté de la forêt de Hainault qui appartenait à Barking.", "Le secteur se trouvait juste à l'intérieur de l'ancien domaine et de la paroisse de Barking, dont la limite traversait la forêt. Une carte de 1777 montre « Barking Side » comme une longue bande de terrain communal en bordure ouest de la forêt."], "Barons Court": ["Un nom inventé, choisi vers 1900 pour de nouveaux logements.", "Il viendrait de Baronscourt, en Irlande du Nord, lié au promoteur Sir William Palliser, ou serait un clin d'œil à Earl's Court, l'arrêt suivant sur la Piccadilly line."], "Battersea Power Station": ["Nommée d'après la centrale électrique voisine, devenue boutiques, logements et bureaux.", "Battersea est l'un des plus anciens noms connus de Londres : au VIIe siècle, c'était Badrices īeg, l'île de Badric, une terre sèche dans les marais de la Tamise. La station a ouvert en 2021 au bout du prolongement de la Northern line."], "Bayswater": ["« Bayswater » rappelle Bayard's Watering, mentionné en 1380.", "« Bayard » pourrait être un nom de famille, ou un ancien mot pour un cheval. Le « watering » était un abreuvoir au bord de la Westbourne, une rivière qui coule aujourd'hui dans une canalisation sous les rues."], "Becontree": ["« Becontree » signifie probablement l'arbre d'un Saxon nommé Beohha.", "C'était le lieu de réunion d'une ancienne « centaine », une subdivision du comté. Après la Première Guerre mondiale, le nom a été donné à une immense cité de logements sociaux, l'une des plus grandes du monde à l'époque."], "Belsize Park": ["« Belsize » vient du français « bel assis », c'est-à-dire bien situé.", "Le nom est attesté dès le XIVe siècle pour un domaine sur les pentes au pied de Hampstead. La station a ouvert en 1907."], "Bermondsey": ["« Bermondsey » signifie l'île d'un homme nommé Beornmund.", "L'« île » était une butte de terre sèche dans les marais au sud de la Tamise. Le lieu figure dans le Domesday Book de 1086, et la station a ouvert en 1999 avec le prolongement de la Jubilee line."], "Bethnal Green": ["« Bethnal » signifie probablement le coin de terre d'un homme nommé Blitha.", "Des formes anciennes comme Blithehale renvoient au vieil anglais blithe, joyeux, ou à un nom de personne, et à healh, un coin de terre. Le « green » était le pré communal du village, qui subsiste sous forme de parc."], "Blackfriars": ["Nommée d'après les dominicains en habit noir, qui avaient un prieuré ici.", "Les frères s'y sont installés au XIIIe siècle et y sont restés jusqu'à ce qu'Henri VIII ferme les monastères. Leur nom survit dans le pont, la gare et le quartier."], "Blackhorse Road": ["Nommée d'après la rue, dont le nom est sans doute une déformation de Black House Lane.", "La « maison noire » était un manoir local ; le cheval noir des carreaux de la station est donc une idée plus tardive. La station a ouvert avec la Victoria line en 1968."], "Bond Street": ["Nommée d'après Sir Thomas Bond, qui a aménagé la rue au XVIIe siècle.", "Bond a acheté des terrains ici et y a tracé la rue. Aujourd'hui, aucune rue ne s'appelle simplement Bond Street : il y a Old Bond Street et New Bond Street."], "Borough": ["Nommée d'après le Borough of Southwark, la ville au sud du London Bridge.", "Pendant des siècles, ce fut le principal faubourg de Londres, si bien qu'on l'appelait simplement « le Borough ». La station a ouvert en 1890 sur la première ligne de métro profond."], "Boston Manor": ["Nommée d'après Boston Manor House, un manoir jacobéen proche de la station.", "Le nom n'a rien à voir avec Boston, dans le Lincolnshire ou dans le Massachusetts : il remonte sans doute à un nom médiéval désignant la ferme d'un homme nommé Bord. La station s'appelait Boston Road jusqu'en 1911."], "Bounds Green": ["Nommée d'après la famille le Bounde, qui possédait des terres ici au Moyen Âge.", "Leur nom a survécu dans une ferme locale, et la station l'a repris à l'arrivée de la Piccadilly line en 1932."], "Bow Road": ["Nommée d'après le pont en arc qui franchit la rivière Lea.", "Ce pont voûté, construit au début du XIIe siècle, selon la tradition à la demande de la reine Mathilde, a donné son nom au village de Bow (« arc »)."], "Brent Cross": ["Nommée d'après la rivière Brent et un carrefour voisin.", "« Brent » est un nom celtique, bien plus ancien que l'anglais, qui signifierait « la sainte » ou « la haute ». La station a ouvert en 1923 sous le nom de Brent et s'appelle Brent Cross depuis 1976."], "Brixton": ["« Brixton » signifie la pierre d'un homme nommé Beorhtsige.", "La pierre servait sans doute de lieu de réunion à la « centaine » locale, une ancienne subdivision du comté. La Victoria line a atteint Brixton en 1971."], "Bromley-by-Bow": ["« Bromley » signifie une clairière où pousse le genêt.", "« By-Bow » a été ajouté en 1968 pour éviter la confusion avec Bromley, dans le Kent. Bow tire son nom d'un pont en arc sur la rivière Lea."], "Buckhurst Hill": ["« Buckhurst » signifie une colline boisée couverte de hêtres.", "Le nom apparaît au XIIe siècle sous la forme La Bocherste. La colline borde la forêt d'Epping, où les hêtres sont encore nombreux."], "Burnt Oak": ["Nommée d'après un vieux chêne qui aurait été brûlé par la foudre.", "Le nom apparaît en 1754 pour un champ en bordure de Watling Street, l'ancienne voie romaine. Le chêne a disparu depuis longtemps."], "Caledonian Road": ["Nommée d'après le Caledonian Asylum, un foyer pour enfants écossais.", "Cet établissement accueillait les enfants de soldats et de marins écossais tués ou blessés pendant les guerres napoléoniennes ; il s'est installé dans cette rue en 1828. « Caledonia » est l'ancien nom latin de l'Écosse."], "Camden Town": ["Nommée d'après Charles Pratt, 1er comte de Camden, propriétaire des terres.", "En 1791, il a commencé à les louer pour y bâtir des maisons. Son titre venait de Camden Place, sa demeure dans le Kent, elle-même nommée d'après l'historien William Camden."], "Canada Water": ["Nommée d'après un plan d'eau qui faisait partie du Canada Dock.", "Ce bassin des Surrey Docks devait son nom au pays d'où venaient la plupart de ses navires, chargés de bois. À la fermeture des docks, il a été en grande partie comblé, et la station a ouvert en 1999."], "Canary Wharf": ["Nommée d'après un entrepôt de fruits venus des îles Canaries.", "Des navires fruitiers des Canaries y déchargeaient à partir des années 1930. Les îles elles-mêmes tireraient leur nom des chiens (en latin canis), ce qui tombe bien : Canary Wharf se trouve sur l'Isle of Dogs, « l'île aux chiens »."], "Canning Town": ["Sans doute nommée d'après un Canning, mais on ne sait pas lequel.", "Une hypothèse désigne Charles Canning, vice-roi des Indes, mais le nom était déjà en usage avant qu'il ne devienne célèbre. D'autres pensent à son père, le Premier ministre George Canning, ou à une entreprise locale nommée Canning."], "Cannon Street": ["« Cannon » n'a rien à voir avec les canons : le nom vient des fabricants de chandelles.", "Au Moyen Âge, c'était Candelwrichtestrete, la rue des chandeliers. Avec le temps, le nom s'est raccourci en Cannon Street."], "Canons Park": ["Nommée d'après les chanoines du prieuré St Bartholomew, propriétaires des terres.", "Après la fermeture du prieuré par Henri VIII, le domaine est passé à des propriétaires privés. Au début du XVIIIe siècle, le duc de Chandos y a construit un somptueux palais appelé Cannons, démoli en 1747. Son parc est devenu Canons Park."], "Chalfont & Latimer": ["Nommée d'après les villages de Chalfont et de Latimer.", "« Chalfont » signifie probablement le ruisseau de craie, du vieil anglais cealc funta. Latimer porte le nom de la famille Latimer, qui tenait ces terres depuis le début du XIVe siècle. La station s'appelait Chalfont Road jusqu'en 1915."], "Chalk Farm": ["« Chalk » (craie) n'a rien à voir avec la craie : le nom vient de Chalcot Farm.", "Chalcot viendrait de mots du vieil anglais signifiant « cabanes froides ». La ferme était un repère local il y a environ deux cents ans."], "Chancery Lane": ["Nommée d'après la Chancellerie, administration et tribunal royal de l'Angleterre médiévale.", "La Chancellerie conservait les archives du roi et jugeait selon l'équité. La rue est toujours au cœur du Londres juridique, près des Inns of Court."], "Charing Cross": ["« Charing » désigne sans doute un tournant, et la croix est le mémorial d'une reine.", "Le nom viendrait du vieil anglais cierring, un virage, peut-être la courbe de la Tamise. Édouard Ier fit ériger ici une croix en mémoire de son épouse Éléonore, morte en 1290. Une copie victorienne se dresse devant la gare."], "Chesham": ["« Chesham » signifie le pré au bord de la rivière, près d'un tas de pierres.", "Le nom est noté un siècle environ avant la conquête normande sous la forme Cæstæleshamm. Chesham est le terminus d'une branche à voie unique de la Metropolitan line."], "Chigwell": ["Personne ne sait vraiment ce que signifie « Chigwell ».", "Ce pourrait être le puits ou la source d'un homme nommé Cicca, ou venir d'un tout autre mot. Le village est situé en bordure de la forêt d'Epping."], "Chiswick Park": ["« Chiswick » signifie la ferme du fromage.", "Le nom en vieil anglais désigne une ferme qui produisait du fromage près de la Tamise. La station a ouvert en 1879 sous le nom d'Acton Green et s'appelle Chiswick Park depuis 1910."], "Chorleywood": ["« Chorley » signifie probablement la clairière des ceorls, les paysans libres.", "Ceorl est le mot du vieil anglais qui a donné « churl » (rustre). Quant à « wood », c'est le bois. La station s'écrivait Chorley Wood, en deux mots, jusqu'en 1965."], "Clapham Common": ["Nommée d'après le pré communal de Clapham, un vaste espace ouvert.", "« Clapham » signifie probablement la ferme près d'une colline ou d'une butte, du vieil anglais clopp ; une autre hypothèse évoque un homme nommé Cloppa. Ancien pâturage, le common est aujourd'hui un parc public."], "Clapham North": ["Nommée d'après Clapham, probablement la ferme près d'une colline.", "Le nom en vieil anglais viendrait de clopp, une bosse ou une butte, ou d'un homme nommé Cloppa. La station a ouvert en 1900 sous le nom de Clapham Road et s'appelle Clapham North depuis 1926."], "Clapham South": ["Nommée d'après Clapham, probablement la ferme près d'une colline.", "Elle a ouvert en 1926 ; on avait envisagé de l'appeler « Nightingale Lane ». Sous la station se trouve l'un des huit abris profonds construits pendant la Seconde Guerre mondiale."], "Cockfosters": ["Personne ne sait au juste d'où vient le nom « Cockfosters ».", "Il est attesté au XVIe siècle. Selon une idée répandue, c'était la demeure du « cock forester », le forestier en chef d'Enfield Chase, un domaine de chasse royal."], "Colindale": ["Le nom rappellerait la famille Collin, propriétaire terrien au XVIe siècle.", "Colindale est restée rurale jusqu'au XXe siècle ; elle abrite aujourd'hui le musée de la Royal Air Force, sur le site de l'aérodrome de Hendon."], "Colliers Wood": ["Nommée d'après un bois exploité par des « colliers », des charbonniers.", "Autrefois, un collier était quelqu'un qui fabriquait du charbon de bois, et non un mineur. Le bois a subsisté jusqu'à la fin du XIXe siècle."], "Covent Garden": ["« Covent » est une forme ancienne de « convent », couvent.", "Au Moyen Âge, c'était le jardin de l'abbaye de Westminster. Le célèbre marché aux fruits et légumes y a commencé au XVIIe siècle et a déménagé à Nine Elms en 1974."], "Croxley": ["« Croxley » signifie probablement la clairière d'un homme nommé Crocc.", "Leah, une clairière dans un bois, est l'une des terminaisons les plus fréquentes des noms de lieux anglais. La station a ouvert en 1925 sous le nom de Croxley Green et s'appelle Croxley depuis 1949."], "Dagenham East": ["« Dagenham » signifie la ferme d'un Saxon nommé Dæcca.", "Le nom a été écrit pour la première fois en 666, sous la forme Dæccanhaam, dans une charte de l'abbaye de Barking. La gare a ouvert en 1885 sous le nom de Dagenham ; les trains du District y sont arrivés en 1902, et elle s'appelle Dagenham East depuis 1949."], "Dagenham Heathway": ["Nommée d'après Dagenham et le Heathway, la route vers la lande de Becontree.", "Dagenham signifie la ferme d'un Saxon nommé Dæcca. La station a ouvert en 1932 sous le simple nom de Heathway, pour desservir la nouvelle cité de Becontree, et a ajouté « Dagenham » en 1949."], "Debden": ["« Debden » signifie la vallée profonde.", "La vallée profonde est peut-être celle de la rivière Roding. La station a ouvert en 1865 sur une ligne de chemin de fer et s'appelait Chigwell Lane jusqu'en 1949, quand la Central line l'a reprise."], "Dollis Hill": ["Personne ne sait vraiment d'où vient le nom « Dollis Hill ».", "Une hypothèse évoque une famille locale nommée Dalley. Pendant la Seconde Guerre mondiale, le centre de recherche des Postes installé ici a construit Colossus, l'un des premiers ordinateurs électroniques, pour les décrypteurs de Bletchley Park. Le bunker de secours de Churchill, « Paddock », se trouve aussi à proximité."], "Ealing Broadway": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom, noté vers 700 sous la forme Gillingas, s'est lentement transformé en Ylling, puis Ealing. Un « broadway » est une large rue principale, ici la rue commerçante de la ville."], "Ealing Common": ["Nommée d'après le pré communal, une étendue d'herbe à Ealing.", "« Ealing » signifie le peuple d'un Saxon nommé Gilla. De 1886 à 1910, la station s'est appelée Ealing Common and West Acton."], "Earl's Court": ["Nommée d'après la cour seigneuriale des comtes d'Oxford, seigneurs du lieu.", "La famille de Vere, comtes d'Oxford, a tenu ces terres pendant environ cinq siècles, peu après la conquête normande. Leur tribunal seigneurial, où se réglaient les litiges locaux, se trouvait près de la station."], "East Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. East Acton était un hameau distinct, à l'est de la ville ; sa station a ouvert en 1920."], "East Finchley": ["« Finchley » signifie probablement la clairière des pinsons.", "Le nom se termine par le vieil anglais leah, une clairière dans un bois. Sur la station se dresse la statue d'un archer d'Eric Aumonier, qui vise le centre de Londres."], "East Ham": ["« Ham » désigne une terre sèche dans une boucle de rivière ou entre des rivières.", "Ici, la terre se trouve entre la Tamise, la Lea et la Roding. Le lieu est noté sous la forme Hamme environ un siècle avant les Normands ; il a été divisé en East Ham et West Ham à l'époque anglo-saxonne."], "East Putney": ["« Putney » signifie le débarcadère d'un homme nommé Putta.", "Le Domesday Book de 1086 l'appelle Putelei. Le débarcadère se trouvait sur la Tamise."], "Eastcote": ["« Eastcote » signifie la ou les maisons de l'est.", "Elles se trouvaient à l'est de Ruislip ; Ascot, près de Windsor, a la même origine. Le jardin clos et le pigeonnier d'Eastcote House subsistent, bien que la maison ait été démolie dans les années 1960."], "Edgware": ["« Edgware » signifie probablement la pêcherie d'un Saxon nommé Ecgi.", "Un « wer », ou barrage, était un bassin ou une retenue servant à prendre le poisson. La Northern line a atteint Edgware en 1924 ; on prévoyait de la prolonger, mais le projet n'a jamais été achevé."], "Edgware Road": ["Nommée d'après la route d'Edgware, qui suit la voie romaine de Watling Street.", "Edgware signifie probablement la pêcherie d'un Saxon nommé Ecgi. La route file tout droit vers le nord-ouest, comme les voies romaines."], "Elephant & Castle": ["Nommée très probablement d'après une auberge de diligences, l'Elephant and Castle.", "Selon une histoire répandue, le nom viendrait de « Infanta de Castilla », une princesse espagnole, mais les historiens en doutent. Un éléphant portant un château était une enseigne courante, utilisée par exemple par la corporation des couteliers."], "Elm Park": ["Le nom a été choisi dans les années 1930 pour une nouvelle cité-jardin.", "La cité a été construite sur des terres agricoles entre Hornchurch et Rainham, et la station a ouvert en 1935 pour la desservir."], "Embankment": ["Nommée d'après le Victoria Embankment, le quai construit le long de la Tamise dans les années 1860.", "Joseph Bazalgette l'a conçu pour accueillir de nouveaux égouts et le District Railway, et pour créer une route au bord du fleuve. La station a porté plusieurs noms avec « Charing Cross » avant de devenir Embankment en 1976."], "Epping": ["« Epping » signifie probablement le peuple des hauteurs.", "Le nom figure dans le Domesday Book de 1086 sous la forme Eppinges. La grande forêt voisine tient son nom de la ville, et non l'inverse."], "Euston": ["Nommée d'après Euston Hall, dans le Suffolk, demeure des ducs de Grafton.", "Les ducs possédaient les terres ici, et Euston Road et Euston Square ont pris le nom de leur château. Le village d'Euston, dans le Suffolk, signifierait la ferme d'un homme nommé Efe."], "Euston Square": ["Nommée d'après Euston Square, le square près de la grande gare.", "Le nom vient d'Euston Hall, dans le Suffolk, demeure des ducs de Grafton, propriétaires des terres. La station a ouvert en 1863 sous le nom de Gower Street et a été rebaptisée en 1909."], "Fairlop": ["Nommée d'après le Fairlop Oak, un chêne géant de la forêt de Hainault.", "À partir du début du XVIIIe siècle, une foire s'est tenue chaque été sous ce chêne, lancée par un habitant, Daniel Day. L'arbre, abîmé par un incendie, a été abattu par le vent au début du XIXe siècle."], "Farringdon": ["Nommée d'après Nicholas et William de Faringdon, échevins de la City.", "En 1279, la famille acheta le droit de diriger ce quartier de la City, et son nom passa au quartier, à une rue et à la station. Farringdon fut l'une des premières stations du premier chemin de fer souterrain du monde, ouvert en 1863."], "Finchley Central": ["« Finchley » signifie probablement la clairière des pinsons.", "La station a ouvert en 1867 sous le nom de Finchley and Hendon. Elle est devenue Finchley (Church End) en 1894, puis Finchley Central en 1940."], "Finchley Road": ["Nommée d'après la route de Finchley, construite comme route à péage à partir de 1826.", "Finchley signifie probablement la clairière des pinsons. La nouvelle route évitait les côtes raides de Hampstead, plus à l'est."], "Finsbury Park": ["Nommée d'après un parc ouvert en 1869, qui ne se trouve pourtant pas à Finsbury.", "Le parc était destiné aux habitants de l'ancien arrondissement de Finsbury, plus au sud. « Finsbury » signifie probablement le manoir d'un homme nommé Finn."], "Fulham Broadway": ["« Fulham » signifie la terre au bord de l'eau d'un homme nommé Fulla.", "Le nom est noté vers 700 sous la forme Fulanham. La station a ouvert en 1880 sous le nom de Walham Green, d'après le pré communal du village, et s'appelle Fulham Broadway depuis 1952."], "Gants Hill": ["Nommée probablement d'après la famille le Gant, intendants des terres de l'abbaye de Barking.", "La famille est attestée ici dès le XIIIe siècle. La station, ouverte en 1947, possède entre les quais une longue salle voûtée inspirée du métro de Moscou."], "Gloucester Road": ["Nommée d'après Maria, duchesse de Gloucester, qui y fit construire une maison en 1805.", "Auparavant, la rue s'appelait Hog Moore Lane. La station a ouvert en 1868 sous le nom de Brompton (Gloucester Road)."], "Golders Green": ["Nommée probablement d'après la famille Godyere, qui vivait ici au XIVe siècle.", "Le « green » était un terrain ouvert à côté de leur propriété. Le village s'est développé très vite après l'arrivée du métro en 1907."], "Goldhawk Road": ["Nommée probablement d'après John Goldhawk, propriétaire terrien au XIVe siècle.", "Il possédait de vastes terres dans le secteur, qui faisait alors partie de la paroisse de Fulham. La station a ouvert en 1914."], "Goodge Street": ["Nommée d'après John Goodge, qui acquit les terrains en 1718.", "Avant la construction des maisons, c'était un pré appelé Crab Tree Field. Ses fils y bâtirent à partir de 1746 environ. La station a ouvert en 1907 sous le nom de Tottenham Court Road et a pris le nom de Goodge Street un an plus tard."], "Grange Hill": ["Une « grange » était une ferme avec granges, appartenant souvent à un monastère.", "Celle-ci se dressait sur une colline. Le nom n'a aucun lien avec la série télévisée pour enfants Grange Hill."], "Great Portland Street": ["Nommée d'après la rue, qui honore les ducs de Portland.", "Les terres sont revenues aux ducs quand le 2e duc a épousé leur héritière en 1734. La station a ouvert en 1863 sous le nom de Portland Road."], "Green Park": ["Nommée d'après le parc, rebaptisé The Green Park en 1746.", "Il s'appelait d'abord Upper St James's Park. Le nouveau nom décrivait sans doute sa prairie dégagée, avec peu d'arbres et sans massifs de fleurs. La station a ouvert en 1906 sous le nom de Dover Street."], "Greenford": ["« Greenford » signifie le gué vert.", "Le gué franchissait la rivière Brent. En 1857, William Perkin y ouvrit une usine pour fabriquer le mauve, le premier colorant de synthèse."], "Gunnersbury": ["« Gunnersbury » signifie le manoir d'une femme nommée Gunnhild.", "Gunnhild est un prénom scandinave. Une légende le rattache à une nièce du roi Knut, mais rien ne le prouve."], "Hainault": ["« Hainault » signifie probablement le bois d'une communauté religieuse.", "Le nom est noté en 1221 sous la forme Henehout, du vieil anglais désignant le bois d'un monastère, ici celui de l'abbaye de Barking. L'orthographe à la française est venue plus tard, d'un rapprochement erroné avec Philippa de Hainaut, épouse d'Édouard III."], "Hammersmith": ["« Hammersmith » désigne probablement un lieu avec une forge à marteau.", "Le nom est attesté pour la première fois en 1294. Une autre hypothèse, moins probable, y voit le débarcadère d'un homme nommé Hammoder."], "Hampstead": ["« Hampstead » signifie simplement ferme ou domaine.", "Le nom vient du vieil anglais hām-stede, comme Berkhamsted et Wheathampstead. La station de Hampstead, ouverte en 1907, possède les quais les plus profonds du métro."], "Hanger Lane": ["« Hanger » désigne une pente boisée.", "Le mot vient du vieil anglais hangra, un bois sur un coteau escarpé. Le même mot a donné Hanger Hill, tout proche."], "Harlesden": ["« Harlesden » signifie la ferme d'un homme nommé Heoruwulf.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Herulvestune, -tune désignant une ferme. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Harrow & Wealdstone": ["Nommée d'après Harrow et Wealdstone, la borne de Harrow Weald.", "« Harrow » vient du vieil anglais hearg, un temple païen. « Weald » signifie forêt, et la pierre marquait la limite des bois au nord de Harrow. La gare a ouvert en 1837 sur le London and Birmingham Railway."], "Harrow-on-the-Hill": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement au sommet de la colline, là où se dresse aujourd'hui l'église St Mary. La station a ouvert en 1880 sous le nom de Harrow et a ajouté « on-the-Hill » en 1894."], "Hatton Cross": ["« Hatton » signifie la ferme sur la lande.", "Cette lande était Hounslow Heath, où se trouve aujourd'hui l'aéroport d'Heathrow. « Cross » désigne probablement un carrefour."], "Heathrow Terminal 4": ["« Heathrow » signifie la rangée de maisons sur la lande.", "Le nom apparaît en 1410 sous la forme La Hetherewe, un hameau sur Hounslow Heath. Le terminal 4 a ouvert en 1986, avec sa propre station sur une boucle de la Piccadilly line."], "Heathrow Terminal 5": ["« Heathrow » signifie la rangée de maisons sur la lande.", "Le hameau, attesté dès 1410, a disparu lors de la construction de l'aéroport dans les années 1940. Le terminal 5 et sa station ont ouvert en 2008."], "Heathrow Terminals 2 & 3": ["« Heathrow » signifie la rangée de maisons sur la lande.", "La station a ouvert en 1977 sous le nom de Heathrow Central. Elle s'appelle Heathrow Terminals 2 & 3 depuis 2016, après la fermeture du terminal 1."], "Hendon Central": ["« Hendon » signifie sur la haute colline.", "Le nom est noté sous la forme Hendun avant le Domesday Book de 1086. La station a ouvert en 1923."], "High Barnet": ["« Barnet » désigne une terre défrichée par le feu.", "Le nom vient du vieil anglais bærnet, brûlis. La ville s'appelle aussi Chipping Barnet, « chipping » signifiant marché. En 1471, la bataille de Barnet, épisode de la guerre des Deux-Roses, s'est déroulée juste au nord de la ville."], "High Street Kensington": ["« Kensington » signifie la ferme d'un Saxon nommé Cynesige.", "Le lieu figure dans le Domesday Book sous la forme Chenesitun. La station a ouvert en 1868 sur Kensington High Street, près du palais de Kensington."], "Highbury & Islington": ["« Highbury » signifie le manoir d'en haut ; « Islington », la colline d'un homme nommé Gisla.", "Islington est noté vers l'an 1000 sous la forme Gislandune. Le manoir de Highbury se dressait sur une colline, au-dessus des autres manoirs de la paroisse. La station de la Victoria line a ouvert en 1968."], "Highgate": ["Nommée d'après une porte haute sur la colline, un péage sur la route du nord.", "La porte donnait accès au parc de chasse de l'évêque de Londres, et les voyageurs de la Great North Road y payaient un péage. Highgate est l'un des points les plus élevés de Londres."], "Hillingdon": ["« Hillingdon » signifie probablement la colline d'un homme nommé Hilla.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Hillendone, -done désignant une colline. La station a ouvert en 1923."], "Holborn": ["« Holborn » signifie probablement le ruisseau du creux.", "Ce ruisseau était probablement la Fleet elle-même, enfouie depuis longtemps. Les Londoniens prononcent traditionnellement « Ho-beune »."], "Holland Park": ["Nommée d'après Holland House, un manoir du XVIIe siècle dont le parc est devenu public.", "La maison tient son nom d'Henry Rich, comte de Holland, dont le titre venait de la région de Holland, dans le Lincolnshire, et non des Pays-Bas. Plus tard, la famille Fox, barons Holland, y a vécu."], "Holloway Road": ["« Holloway » signifie probablement le chemin creux, une route creusée dans le sol.", "Le bétail se rendant aux marchés de Londres a usé la route pendant des siècles. Certains y voient plutôt un « chemin sacré » pour les pèlerins."], "Hornchurch": ["« Hornchurch » signifie l'église aux cornes.", "Le nom est attesté en 1222. Nul ne sait exactement pourquoi, mais l'église St Andrew porte toujours, sur son pignon est, une tête de taureau aux cornes de cuivre."], "Hounslow Central": ["« Hounslow » signifie probablement le tertre du chien.", "Le « chien » pourrait être un animal ou un homme surnommé Hund, et le tertre un tumulus. La station a ouvert en 1886 sous le nom de Heston Hounslow et a été rebaptisée en 1925."], "Hounslow East": ["« Hounslow » signifie probablement le tertre du chien.", "Le nom se termine par le vieil anglais hlāw, un tertre ou un tumulus. La station s'appelait Hounslow Town jusqu'en 1925."], "Hounslow West": ["« Hounslow » signifie probablement le tertre du chien.", "La station a ouvert en 1884 sous le nom de Hounslow Barracks, d'après la caserne voisine, et s'appelle Hounslow West depuis 1925."], "Hyde Park Corner": ["Nommée d'après l'angle de Hyde Park.", "Le parc était autrefois le domaine de Hyde, propriété de l'abbaye de Westminster ; une « hide » était une ancienne mesure de terre. Henri VIII s'en est emparé en 1536 pour en faire un terrain de chasse."], "Ickenham": ["« Ickenham » signifie la ferme d'un homme nommé Ticca.", "Le Domesday Book de 1086 l'appelle Ticheham ; avec le temps, le T initial a disparu. La pompe du village, de 1866, se dresse toujours sur le pré communal."], "Kennington": ["« Kennington » signifie probablement la ferme d'un homme nommé Cena.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Chenintune. Kennington Park était autrefois un pré communal où se tenaient de grands rassemblements publics."], "Kensal Green": ["« Kensal » signifie le bois du roi.", "Le nom est attesté au XIIIe siècle sous la forme Kingisholte. On ne sait pas de quel roi il s'agit. Le pré se trouvait à l'emplacement de l'actuel cimetière de Kensal Green, ouvert en 1833."], "Kensington (Olympia)": ["Nommée d'après Olympia, un hall d'exposition ouvert en 1886.", "Le hall tient sans doute son nom d'Olympie, dans la Grèce antique, berceau des Jeux olympiques. Kensington signifie la ferme d'un Saxon nommé Cynesige. La station s'appelait Kensington (Addison Road) jusqu'en 1946."], "Kentish Town": ["Malgré son nom, Kentish Town n'a, semble-t-il, rien à voir avec le Kent.", "Le nom est noté en 1208 sous la forme Kentisston. Il pourrait venir d'une famille nommée Kentish, ou de mots désignant le lit d'un cours d'eau, la Fleet, aujourd'hui cachée."], "Kenton": ["« Kenton » signifie probablement la ferme d'un homme nommé Coena.", "Le nom se termine par le vieil anglais tūn, ferme ou village. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Kew Gardens": ["Nommée d'après les jardins botaniques royaux de Kew.", "« Kew » est noté en 1327 sous la forme Cayho et signifie probablement l'éperon de terre près d'un débarcadère sur la Tamise. Les jardins sont inscrits au patrimoine mondial de l'UNESCO."], "Kilburn": ["« Kilburn » signifie probablement le ruisseau des vaches, ou le ruisseau royal.", "Ce ruisseau est la Westbourne, aujourd'hui souterraine. Le nom est noté en 1134 sous la forme Cuneburna. Un prieuré se dressait à l'endroit où la voie romaine franchissait le ruisseau."], "Kilburn Park": ["« Kilburn » signifie probablement le ruisseau des vaches, ou le ruisseau royal.", "Ce ruisseau est la Westbourne, aujourd'hui souterraine. « Park » a été ajouté pour le nouveau lotissement. La station a ouvert en 1915."], "King's Cross St Pancras": ["Nommée d'après une statue du roi George IV et l'église St Pancras.", "Le quartier s'appelait autrefois Battle Bridge, d'après un pont sur la Fleet. Un monument à George IV s'y dressa d'environ 1830 à 1845 ; impopulaire, il fut vite enlevé. Saint Pancrace était un garçon martyrisé à Rome, selon la tradition en 304."], "Kingsbury": ["« Kingsbury » signifie le manoir du roi.", "On ne sait pas de quel roi il s'agit : au moment du Domesday Book, en 1086, les terres appartenaient déjà à des particuliers. La station a ouvert en 1932."], "Knightsbridge": ["« Knightsbridge » signifie le pont des jeunes gens.", "En vieil anglais, cniht désignait un jeune homme ou un serviteur, pas encore un chevalier en armure. Le pont franchissait la Westbourne. Le nom est attesté vers 1050."], "Ladbroke Grove": ["Nommée d'après James Weller Ladbroke, qui a loti le quartier au milieu du XIXe siècle.", "Il hérita des terres de son oncle vers 1821, et la rue principale reçut son nom. La station a ouvert en 1864 sous le nom de Notting Hill."], "Lambeth North": ["« Lambeth » signifie le débarcadère des agneaux.", "Le nom est noté en 1062 sous la forme Lambehitha : hithe est un ancien mot pour un débarcadère sur une rivière, comme dans Rotherhithe. La station a ouvert en 1906 et s'appelle Lambeth North depuis 1917."], "Lancaster Gate": ["Nommée d'après l'entrée Lancaster Gate des jardins de Kensington.", "Elle a été nommée en l'honneur de la reine Victoria, qui était aussi duc de Lancastre. La ville de Lancaster tient elle-même son nom d'un fort romain, un « caster », sur la rivière Lune."], "Latimer Road": ["Nommée d'après Edward Latymer, un juriste londonien mort en 1627.", "Il a légué des terres ici pour venir en aide aux pauvres de Hammersmith, et son argent a aussi fondé l'école Latymer. La rue traversait sa propriété. La station a ouvert en 1868."], "Leicester Square": ["Nommée d'après le comte de Leicester, qui fit construire Leicester House ici.", "La place a été aménagée devant sa demeure dans les années 1670. La ville de Leicester tient son nom des Ligore, le peuple de la rivière Soar, et de « ceaster », une ville romaine."], "Leyton": ["« Leyton » signifie la ferme sur la rivière Lea.", "La Lea, ou Lee, longe le quartier. La gare a ouvert en 1856 sous le nom de Low Leyton et a rejoint la Central line en 1947."], "Leytonstone": ["« Leytonstone » signifie Leyton à la pierre.", "Leyton est la ferme sur la Lea. La pierre était probablement une ancienne borne romaine ou une borne de limite près de Hollybush Hill. Le cinéaste Alfred Hitchcock est né ici en 1899."], "Liverpool Street": ["Nommée d'après Lord Liverpool, Premier ministre de 1812 à 1827.", "La rue a reçu son nom dans les années 1820. Son titre vient de la ville de Liverpool, notée en 1190 sous la forme Liuerpul, probablement une mare ou une crique aux eaux boueuses. La station a ouvert en 1875 sous le nom de Bishopsgate."], "London Bridge": ["Nommée d'après le London Bridge, le plus ancien passage sur la Tamise dans la ville.", "Il y a un pont à cet endroit depuis l'époque romaine. La gare a ouvert en 1836 ; c'est le plus ancien terminus ferroviaire du centre de Londres encore en service."], "Loughton": ["« Loughton » signifie la ferme d'un homme nommé Luhha.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Lochintuna. Bien plus ancien, le Loughton Camp est un ouvrage en terre de l'âge du fer, dans la forêt voisine."], "Maida Vale": ["Nommée d'après un pub, le Hero of Maida, qui commémorait une bataille en Italie.", "En 1806, une armée britannique commandée par le général Sir John Stuart battit les Français à Maida, en Calabre. Le pub ouvrit peu après au bord d'Edgware Road, et le quartier prit son nom."], "Manor House": ["Nommée d'après le Manor House, un pub de Green Lanes.", "L'auberge se trouvait sur la route du nord et a donné son nom au carrefour. La station a ouvert en 1932."], "Mansion House": ["Nommée d'après Mansion House, la résidence officielle du lord-maire de la City de Londres.", "Cette grande demeure a été construite au XVIIIe siècle. Les stations Bank et Cannon Street en sont en fait un peu plus proches."], "Marble Arch": ["Nommée d'après l'arc en marbre blanc dessiné par John Nash.", "Construit dans les années 1820 comme entrée du palais de Buckingham, il a été déplacé ici en 1851. Tout près se dressait le gibet de Tyburn, principal lieu d'exécution de Londres pendant des siècles."], "Marylebone": ["« Marylebone » signifie l'église Sainte-Marie près du ruisseau.", "Le nom est noté en 1453 sous la forme Maryburne, d'après une église Sainte-Marie au bord du ruisseau de Tyburn ; le « le » a été ajouté plus tard. La station a ouvert en 1907 sous le nom de Great Central, d'après la compagnie ferroviaire."], "Mile End": ["Nommée ainsi parce qu'elle se trouve à un mille d'Aldgate, l'ancienne porte de la City.", "Le nom est en usage depuis le XIIIe siècle pour l'endroit où s'achevait le premier mille de la route de l'Essex."], "Mill Hill East": ["« Mill Hill » signifie probablement la colline au moulin à vent.", "Il ne reste rien du moulin, mais un champ voisin s'appelle toujours Mill Field. La Northern line a atteint la station en 1941 ; elle devait aller plus loin, mais le prolongement n'a jamais été construit."], "Monument": ["Nommée d'après le Monument au grand incendie de Londres de 1666.", "La colonne a été conçue par Christopher Wren et Robert Hooke. Elle mesure 61 mètres, soit la distance entre sa base et l'endroit de Pudding Lane où le feu a pris."], "Moor Park": ["Nommée d'après Moor Park, un manoir palladien voisin.", "Il se dresse dans l'ancien parc de The More, un palais qui appartint au cardinal Wolsey. La station a ouvert en 1910 sous le nom de Sandy Lodge."], "Moorgate": ["Nommée d'après la Moorgate, une petite porte du mur de la City.", "Elle menait à Moorfields, des terrains marécageux à l'extérieur du mur. La porte a été démolie en 1762."], "Morden": ["« Morden » signifie probablement la colline dans le marais.", "Le nom vient du vieil anglais mōr, marais, et dūn, colline. Morden est le terminus de la Northern line et la station la plus méridionale du métro."], "Mornington Crescent": ["Nommée d'après le comte de Mornington, frère aîné du duc de Wellington.", "Richard Wellesley, 2e comte de Mornington, fut gouverneur général des Indes et ministre des Affaires étrangères. La station a aussi donné son nom à un célèbre jeu absurde de l'émission comique de la BBC I'm Sorry I Haven't a Clue."], "Neasden": ["« Neasden » signifie la colline en forme de nez.", "Le nom vient du vieil anglais nēos, nez, et dūn, colline. La station a ouvert en 1880 sous le nom de Kingsbury & Neasden."], "Newbury Park": ["« Newbury » signifie le nouveau manoir.", "Le nom remonte au Moyen Âge. La gare a ouvert en 1903, et la Central line l'a reprise en 1947."], "Nine Elms": ["Nommée d'après une rangée de neuf ormes.", "Le nom est attesté vers 1645. Depuis 1974, le quartier accueille le New Covent Garden Market, et la station a ouvert en 2021."], "North Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. La station a ouvert en 1923, au nord de l'ancien centre."], "North Ealing": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom est noté vers 700 sous la forme Gillingas. La station North Ealing a ouvert en 1903."], "North Greenwich": ["« Greenwich » signifie le port vert ou le comptoir vert.", "Le nom est attesté au début du Xe siècle. La station, ouverte en 1999, se trouve à un peu plus de deux kilomètres au nord-est de Greenwich même, à côté de ce qui fut construit comme le Millennium Dome."], "North Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement sur la colline de Harrow, là où se dresse aujourd'hui l'église St Mary. La station North Harrow a ouvert en 1915."], "North Wembley": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Le nom se termine par le vieil anglais leah, une clairière. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Northfields": ["Nommée d'après les champs du nord d'Ealing.", "Ces champs sont restés agricoles jusqu'à la construction de maisons au début du XXe siècle. La station a ouvert en 1908 sous le nom de Northfield."], "Northolt": ["« Northolt » signifie le recoin de terre du nord.", "Le nom vient du vieil anglais north et healh, un coin ou un recoin. Son pendant au sud est Southall. La station a ouvert sur la Central line en 1948."], "Northwick Park": ["Nommée d'après Northwick Park, l'espace vert à côté de la station.", "Le nom viendrait de la famille Rushout, propriétaire des terres agricoles ici, dont la résidence de campagne était Northwick Park, dans les Cotswolds. La station a ouvert en 1923 sous le nom de Northwick Park & Kenton."], "Northwood": ["« Northwood » signifie le bois du nord.", "C'était la partie boisée, au nord, de l'ancienne paroisse de Ruislip. La station a ouvert en 1887."], "Northwood Hills": ["Nommée d'après Northwood, le bois au nord de Ruislip, et ses collines.", "La station a ouvert en 1933 pour un nouveau lotissement. Curieusement, elle est un peu plus basse que la station de Northwood."], "Notting Hill Gate": ["« Notting » signifie probablement le peuple d'un homme nommé Cnotta.", "Le nom est attesté dès le XIVe siècle sous de nombreuses formes, comme Knottynghull. La « gate » était une barrière de péage sur la route d'Uxbridge."], "Oakwood": ["Nommée d'après Oakwood Park, qui doit son nom à une maison appelée Oak Lodge.", "La forêt voisine d'Enfield Chase était un domaine de chasse royal. La station a ouvert en 1933 sous le nom d'Enfield West et s'appelle Oakwood depuis 1946."], "Old Street": ["Nommée d'après la rue, notée vers 1200 sous la forme Ealdestrate.", "Le nom signifie simplement « vieille rue » ; la route est probablement romaine. En raison des nombreuses entreprises technologiques alentour, le rond-point au-dessus de la station est surnommé Silicon Roundabout."], "Osterley": ["« Osterley » signifie probablement la clairière à la bergerie.", "Le nom est attesté au XIIIe siècle. Osterley House a été construite pour le marchand Sir Thomas Gresham au XVIe siècle, puis remaniée par Robert Adam."], "Oval": ["Nommée d'après le stade de cricket de l'Oval.", "Le nom remonte à un plan de rues en forme d'ovale des années 1790 ; le terrain de cricket a été aménagé à l'intérieur. Le Surrey County Cricket Club y joue depuis 1845."], "Oxford Circus": ["Un « circus » est une place ronde où se croisent des rues ; il n'y a jamais eu de cirque.", "C'est le croisement d'Oxford Street et de Regent Street. Oxford Street était la grande route vers l'ouest, en direction d'Oxford."], "Paddington": ["« Paddington » signifie la ferme d'un homme nommé Padda.", "Le nom est anglo-saxon, -ington désignant le village des gens de quelqu'un. La station a ouvert en 1863 sur le premier chemin de fer souterrain."], "Park Royal": ["Nommée d'après le terrain d'exposition de la Royal Agricultural Society, ouvert ici en 1903.", "La foire n'y est restée que quelques années, mais le nom est resté. Le secteur est ensuite devenu l'une des plus grandes zones industrielles de Londres."], "Parsons Green": ["Nommée d'après le presbytère de Fulham, qui se dressait au bord du pré communal.", "Le pré du village subsiste sous la forme d'un petit parc. Tout près se trouve Fulham Palace, pendant des siècles la résidence de campagne des évêques de Londres."], "Perivale": ["« Perivale » signifie probablement la vallée des poiriers.", "Le nom est attesté au début du XVIe siècle sous la forme Pyryvale. La station a ouvert en 1904 sous le nom de Perivale Halt et a rejoint la Central line en 1947."], "Piccadilly Circus": ["Nommée d'après les « piccadills », des cols de dentelle rigides à la mode vers 1600.", "Un tailleur, Robert Baker, fit fortune en les vendant et se fit construire ici une maison surnommée Pickadilly Hall. Le nom s'est étendu à la rue, puis au « circus », un rond-point."], "Pimlico": ["Personne ne sait au juste d'où vient le nom « Pimlico ».", "Une théorie répandue le rattache à Ben Pimlico, un aubergiste célèbre pour sa bière, mais sa taverne se trouvait à Hoxton, à l'autre bout de Londres. La station a ouvert avec la Victoria line en 1972."], "Pinner": ["« Pinner » signifie probablement la colline en forme d'épingle, ou la colline d'un homme nommé Pinn.", "Le nom se termine par le vieil anglais ora, une pente ou une colline ; la rivière Pinn a ensuite été nommée d'après le village. La foire de Pinner se tient presque chaque année depuis une charte de 1336."], "Plaistow": ["« Plaistow » signifie probablement un lieu de jeu ou de divertissement.", "Le nom viendrait du vieil anglais plega, jeu, et stōw, lieu, peut-être là où l'on jouait à des jeux ou des mystères. D'autres le rattachent à Sir Hugh de Plaiz, un seigneur médiéval. Les habitants prononcent « Plar-stow »."], "Preston Road": ["« Preston » signifie la ferme des prêtres.", "Le nom vient du vieil anglais prēost, prêtre, et tūn, ferme. La station a ouvert en 1908 pour les visiteurs du tir aux pigeons d'argile des Jeux olympiques, tout proche."], "Putney Bridge": ["Nommée d'après le pont de Putney, qui mène à Putney sur l'autre rive.", "« Putney » signifie le débarcadère d'un homme nommé Putta. La station se trouve en fait du côté de Fulham. La course d'aviron Oxford-Cambridge part près du pont."], "Queen's Park": ["Nommée d'après la reine Victoria, qui régnait quand le quartier a été construit.", "Le parc et le lotissement datent de la fin du XIXe siècle. Les trains de la Bakerloo line s'y arrêtent depuis 1915."], "Queensbury": ["Un nom inventé, choisi dans les années 1930 pour répondre à Kingsbury, la voisine.", "On a demandé des idées aux habitants, et Queensbury l'a emporté. Le nom n'a aucune origine historique. La station a ouvert en 1934."], "Queensway": ["Nommée en l'honneur de la reine Victoria.", "On raconte qu'elle parcourait cette allée à cheval dans son enfance, quand elle vivait au palais de Kensington tout proche. La rue s'appelait Queen's Road, tout comme la station jusqu'en 1946."], "Ravenscourt Park": ["Un jeu de mots : « raven » signifie corbeau, comme le nom de famille Corbett.", "Au XVIIIe siècle, le propriétaire, Thomas Corbett, rebaptisa sa maison Ravenscourt ; des corbeaux figuraient sur ses armoiries. Le parc est devenu public. La station a ouvert en 1873 sous le nom de Shaftesbury Road."], "Rayners Lane": ["Nommée, dit-on, d'après Daniel Rayner, un fermier du coin.", "Quand le chemin de fer est arrivé en 1904, le secteur était presque vide ; la station a ouvert en 1906, et les maisons ne sont venues que dans les années 1930."], "Redbridge": ["Nommée d'après un pont de briques rouges sur la rivière Roding.", "Le pont est attesté dès le XVIIe siècle et a été démoli au début des années 1920. La station, ouverte en 1947, portait ce nom avant le district londonien de Redbridge, créé en 1965."], "Regent's Park": ["Nommée d'après le prince régent, futur roi George IV.", "Le parc a été aménagé par John Nash au début du XIXe siècle, sur un ancien terrain de chasse d'Henri VIII. Regent Street a été construite à la même époque."], "Richmond": ["Nommée d'après Richmond, dans le Yorkshire, par l'intermédiaire d'Henri VII.", "Avant de devenir roi, Henri était comte de Richmond. Vers 1500, il fit reconstruire le palais royal de Sheen et lui donna le nom de son comté. « Richmond » vient du français « riche mont », la colline forte."], "Rickmansworth": ["« Rickmansworth » signifie l'enclos d'un homme nommé Ricmær.", "-worth est un mot du vieil anglais pour un enclos ou une ferme. Le Domesday Book de 1086 l'appelle Prichemareworde."], "Roding Valley": ["Nommée d'après la rivière Roding, qui coule dans la vallée.", "La rivière tient son nom des Rodings, des villages habités par le peuple d'un chef saxon nommé Hroda."], "Royal Oak": ["Nommée d'après un pub appelé le Royal Oak.", "Ce nom de pub rappelle le chêne de Boscobel, dans le Shropshire, où le futur Charles II se cacha des soldats du Parlement en 1651. La station a ouvert en 1871."], "Ruislip": ["« Ruislip » signifie le lieu de saut où poussent les joncs.", "Le nom vient du vieil anglais rysc, jonc, et hlȳp, saut : sans doute un passage étroit de la rivière Pinn que l'on pouvait franchir d'un bond. La station a ouvert en 1904."], "Ruislip Gardens": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "Le « saut » était probablement un passage étroit sur la rivière Pinn. « Gardens » désignait les nouveaux lotissements de banlieue. La gare a ouvert en 1934 ; les trains de la Central line y sont arrivés en 1948."], "Ruislip Manor": ["Nommée d'après un lotissement construit sur les terres de l'ancien manoir de Ruislip.", "Ruislip signifie le lieu de saut où poussent les joncs. La station a ouvert comme simple halte en 1912, bien avant la plupart des maisons."], "Russell Square": ["Nommée d'après la famille Russell, ducs de Bedford.", "Ils possédaient une grande partie de Bloomsbury et ont aménagé la place vers 1800. Ses jardins ont été dessinés par Humphry Repton. Le British Museum est juste à côté."], "St James's Park": ["Nommée d'après St James's Park, qui doit son nom au palais St James.", "Henri VIII fit construire le palais à l'emplacement d'un hôpital médiéval pour lépreuses, dédié à saint Jacques le Mineur. Le parc est le plus ancien des parcs royaux de Londres."], "St John's Wood": ["Nommée d'après les chevaliers de Saint-Jean, propriétaires des bois.", "L'ordre de Saint-Jean de Jérusalem avait son prieuré à Clerkenwell et possédait ces terres boisées au Moyen Âge. La station a ouvert en 1939."], "St Paul's": ["Nommée d'après la cathédrale St Paul, juste au sud.", "Une église dédiée à saint Paul se dresse sur cette colline depuis 604. La station a ouvert en 1900 sous le nom de Post Office, d'après le siège des Postes tout proche, et a été rebaptisée en 1937."], "Seven Sisters": ["Nommée d'après un cercle de sept arbres sur Page Green.", "Selon la tradition locale, ils auraient été plantés par sept sœurs. Les premiers arbres étaient des ormes ; le cercle a été replanté plusieurs fois, la dernière en 1997, avec des charmes."], "Shepherd's Bush": ["Personne ne sait vraiment d'où vient « Shepherd's Bush ».", "Une idée veut que les bergers y faisaient reposer leurs troupeaux en route vers le marché de Smithfield, dans la City. Une autre y voit le souvenir d'un habitant nommé Shepherd ou Sheppard."], "Shepherd's Bush Market": ["Nommée d'après le marché qui longe la voie ferrée, à Shepherd's Bush.", "La station s'appelait Shepherd's Bush jusqu'en 2008, quand elle a été rebaptisée pour éviter la confusion avec la station de la Central line. On ne sait pas vraiment d'où vient « Shepherd's Bush »."], "Sloane Square": ["Nommée d'après Sir Hans Sloane, médecin et collectionneur.", "Il acheta le domaine de Chelsea en 1712. Son immense collection de livres, de plantes et de curiosités fut à l'origine du British Museum après sa mort, en 1753."], "Snaresbrook": ["Personne ne sait au juste d'où vient « Snaresbrook ».", "Ce pourrait être une déformation de « Sayers Brook », un petit ruisseau qui se jette dans la Roding. La gare a ouvert en 1856 et s'est longtemps appelée Snaresbrook & Wanstead."], "South Ealing": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom est noté vers 700 sous la forme Gillingas. La station South Ealing a ouvert en 1883."], "South Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Avant la construction des maisons, le secteur n'était que champs et l'ancien hameau de Roxeth. La station a ouvert en 1903."], "South Kensington": ["Nommée d'après Kensington, la ferme d'un Saxon nommé Cynesige.", "Le quartier s'est développé après la Grande Exposition de 1851, dont les bénéfices ont financé les musées et les écoles d'ici. Un long tunnel relie la station aux musées."], "South Kenton": ["« Kenton » signifie probablement la ferme d'un homme nommé Coena.", "Le nom se termine par le vieil anglais tūn, ferme ou village. La station South Kenton a ouvert en 1933 pour de nouvelles maisons."], "South Ruislip": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "La station a ouvert en 1908 sous le nom de Northolt Junction et n'est devenue South Ruislip qu'en 1947. La Central line est arrivée en 1948."], "South Wimbledon": ["Nommée d'après Wimbledon, bien que la station se trouve en fait à Merton.", "« Wimbledon » signifie probablement la colline d'un homme nommé Wynnmann. Pendant des années, la station s'est appelée South Wimbledon (Merton) pour le préciser."], "South Woodford": ["« Woodford » signifie le gué près du bois.", "Le gué franchissait la rivière Roding. La gare a ouvert en 1856 sous le nom de George Lane, d'après la rue voisine. Elle est devenue South Woodford en 1947, à l'arrivée de la Central line."], "Southfields": ["Nommée d'après les champs du sud de Wandsworth, des terres agricoles pendant des siècles.", "Attestés dès le XIIIe siècle, ils sont restés des champs jusque vers 1900. Pendant le tournoi de tennis de Wimbledon, c'est la station des courts."], "Southgate": ["Nommée d'après la porte sud d'Enfield Chase, un domaine de chasse royal.", "Le village s'est formé autour de cette porte. La station ronde de 1933, conçue par Charles Holden, est classée monument historique."], "Southwark": ["« Southwark » signifie le fort du sud.", "Le nom est noté au début du Xe siècle sous la forme Suthriganaweorc, le fort des hommes du Surrey, qui défendait le bout sud du London Bridge. La station a ouvert en 1999."], "Stamford Brook": ["Nommée d'après un ruisseau, aujourd'hui disparu, entre Hammersmith et Chiswick.", "« Stamford » signifierait le gué pierreux. Le ruisseau coule désormais dans une canalisation sous les rues."], "Stanmore": ["« Stanmore » signifie la mare pierreuse.", "Le nom vient du vieil anglais stān, pierre, et mere, mare ; le sol de graviers est ici très caillouteux. La station a ouvert en 1932."], "Stepney Green": ["« Stepney » signifie le débarcadère d'un homme nommé Stebba.", "Le nom est noté vers l'an 1000 sous la forme Stybbanhythe, hythe désignant un débarcadère sur la Tamise. Le « green » est l'ancien pré communal du village de Stepney."], "Stockwell": ["« Stockwell » signifie le puits ou la source près d'une souche.", "Le nom vient du vieil anglais stocc, souche ou poteau. Devant la station se trouve l'entrée d'un abri profond construit pendant la Seconde Guerre mondiale."], "Stonebridge Park": ["Nommée d'après un pont de pierre sur la rivière Brent.", "Le pont a été construit au XVIIe siècle pour faire passer Harrow Road au-dessus de la rivière. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Stratford": ["« Stratford » signifie le gué sur la voie romaine.", "Le vieil anglais stræt, une route romaine pavée, a donné le mot « street ». Ici, la route de Londres à Colchester franchissait la rivière Lea. Le quartier a été le cœur des Jeux olympiques de 2012."], "Sudbury Hill": ["« Sudbury » signifie le manoir du sud.", "Il était au sud de Harrow, le village principal. La station a ouvert en 1903 ; son bâtiment actuel, du début des années 1930, est de Charles Holden."], "Sudbury Town": ["« Sudbury » signifie le manoir du sud.", "Il était situé au sud de Harrow. La station a été reconstruite en 1931 par Charles Holden sous la forme d'une boîte de brique et de verre, modèle de nombreuses stations ultérieures."], "Swiss Cottage": ["Nommée d'après un pub construit comme un chalet suisse.", "Une auberge occupe ce site depuis 1804. Le bâtiment du pub, Ye Olde Swiss Cottage, existe toujours près de la station, mais le pub a fermé en 2025."], "Temple": ["Nommée d'après le Temple, ancienne demeure des chevaliers du Temple.", "Les Templiers y construisirent l'église ronde du Temple au XIIe siècle. Après la suppression de l'ordre au XIVe siècle, les juristes s'y installèrent, et l'Inner Temple et le Middle Temple sont toujours deux des Inns of Court."], "Theydon Bois": ["« Bois » est le nom d'une famille de seigneurs médiévaux.", "La famille Bois tenait ces terres aux XIIe et XIIIe siècles. « Theydon » signifierait la vallée où l'on récoltait le chaume. La station a ouvert en 1865 sous le nom de Theydon."], "Tooting Bec": ["« Bec » rappelle l'abbaye du Bec, en Normandie, propriétaire de terres ici après 1066.", "Tooting signifie probablement le peuple d'un homme nommé Tota. La station a ouvert en 1926 sous le nom de Trinity Road (Tooting Bec) et a été rebaptisée en 1950."], "Tooting Broadway": ["« Tooting » signifie probablement le peuple d'un homme nommé Tota.", "Un « broadway » est une large rue principale. La statue du roi Édouard VII devant la station s'y dresse depuis 1911."], "Tottenham Court Road": ["Nommée d'après la route menant au manoir de Tottenhall, et non à Tottenham.", "Le manoir, près de l'actuelle Euston Road, tirait sans doute son nom d'un propriétaire nommé Tota. La route y menait depuis le West End."], "Tottenham Hale": ["« Tottenham » signifie la ferme d'un homme nommé Totta.", "« Hale » viendrait d'un ancien mot désignant un recoin ou un coin de terre. La gare a ouvert en 1840 sous le nom de Tottenham et a pris son nom actuel à l'arrivée de la Victoria line, en 1968."], "Totteridge & Whetstone": ["« Totteridge » signifie la crête d'un homme nommé Tata ; « Whetstone » est une énigme.", "Selon la légende, des soldats y auraient aiguisé leurs épées sur une pierre à aiguiser (« whetstone ») avant la bataille de Barnet, en 1471, mais le nom est plus ancien. Il signifie plus probablement « le village de l'ouest »."], "Tower Hill": ["Nommée d'après la colline à côté de la Tour de Londres.", "Pendant des siècles, ce fut un lieu d'exécutions publiques. La station s'appelait Mark Lane jusqu'en 1946."], "Tufnell Park": ["Nommée d'après la famille Tufnell, seigneurs du manoir de Barnsbury.", "William Tufnell reçut le manoir en 1753. Son descendant Henry Tufnell commença à bâtir des maisons sur le domaine en 1845. La station a ouvert en 1907."], "Turnham Green": ["« Turnham » signifie la ferme dans la boucle du fleuve.", "La Tamise forme ici une grande boucle. En 1642, pendant la guerre civile, une armée royaliste fit demi-tour à Turnham Green au lieu de marcher sur Londres."], "Turnpike Lane": ["Nommée d'après une « turnpike », une barrière de péage sur la route du nord.", "Les voyageurs de Green Lanes devaient payer ici pour emprunter la route. La station a ouvert en 1932."], "Upminster": ["« Upminster » signifie la grande église sur les hauteurs.", "Il s'agit probablement de l'église St Laurence, sur la colline au-dessus de l'Ingrebourne. Le moulin à vent d'Upminster, construit en 1803, est toujours debout. La station est le terminus est de la District line."], "Upminster Bridge": ["Nommée d'après le pont sur la rivière Ingrebourne, près d'Upminster.", "Upminster signifie la grande église sur les hauteurs. La station a ouvert en 1934."], "Upney": ["« Upney » signifie probablement l'île d'en haut.", "L'« île » était une terre sèche au milieu des ruisseaux et des marais, près du Mayes Brook. La station a ouvert en 1932."], "Upton Park": ["« Upton » signifie la ferme sur les hauteurs.", "« Park » a été ajouté dans les années 1880 pour vendre de nouvelles maisons. L'ancien stade de West Ham United, le Boleyn Ground, était souvent appelé Upton Park."], "Uxbridge": ["« Uxbridge » signifie le pont du peuple des Wixan.", "Les Wixan étaient une tribu anglo-saxonne installée ici, et le pont franchissait la rivière Colne. Uxbridge est le terminus ouest de la Metropolitan line et de la Piccadilly line."], "Vauxhall": ["« Vauxhall » signifie la demeure de Falkes, un chevalier médiéval.", "Falkes de Breauté possédait ici une grande demeure au XIIIe siècle. Plus tard, les jardins d'agrément de Vauxhall furent célèbres dans toute l'Europe, et le constructeur automobile a pris le nom du quartier."], "Victoria": ["Nommée d'après Victoria Street, qui honore la reine Victoria.", "La grande gare a pris le nom de la rue en 1860. Elle se dresse à l'emplacement d'un ancien bassin du canal Grosvenor."], "Walthamstow Central": ["« Walthamstow » signifie probablement le lieu d'accueil.", "Le nom est noté en 1075 sous la forme Wilcumestowe. « Central » la distingue des autres gares de la ville. La Victoria line y est arrivée en 1968."], "Wanstead": ["« Wanstead » désigne un lieu, mais on ne sait pas lequel.", "Le nom est attesté au XIe siècle sous la forme Wenstede. -stead signifie un lieu ou un emplacement ; la première partie pourrait désigner une colline, ou un chariot."], "Warren Street": ["Nommée d'après Anne Warren, ou son père, l'amiral Sir Peter Warren.", "Anne épousa le propriétaire Charles FitzRoy, futur baron Southampton, qui lotit les terrains à la fin du XVIIIe siècle. La station a ouvert en 1907 sous le nom d'Euston Road et a été rebaptisée un an plus tard."], "Warwick Avenue": ["Nommée d'après Jane Warwick, qui épousa un membre d'une famille de propriétaires locaux.", "Elle se maria en 1778. Les terres appartenaient à l'évêque de Londres, et la rue reçut son nom. La station a ouvert en 1915."], "Waterloo": ["Nommée d'après le pont de Waterloo, qui commémore la bataille de Waterloo.", "Le pont était en construction quand Wellington battit Napoléon en 1815. Il devait s'appeler Strand Bridge, mais il ouvrit en 1817 sous le nom de Waterloo Bridge. La rue et la gare suivirent."], "Watford": ["« Watford » signifie probablement le gué des chasseurs, ou le gué humide.", "Le gué franchissait la rivière Colne. La station de la Metropolitan line a ouvert en 1925 à Cassiobury, assez loin du centre-ville."], "Wembley Central": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Le nom se termine par le vieil anglais leah, une clairière. La gare a ouvert en 1842 sous le nom de Sudbury et est devenue Wembley Central en 1948, l'année où Wembley accueillit les Jeux olympiques."], "Wembley Park": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Dans les années 1890, on commença ici une tour censée rivaliser avec la tour Eiffel ; elle ne fut jamais achevée. Le stade de Wembley fut construit plus tard à son emplacement."], "West Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. La station West Acton a ouvert en 1923."], "West Brompton": ["« Brompton » signifie la ferme où pousse le genêt.", "Le genêt est un arbuste à fleurs jaunes. La première gare a ouvert en 1866 ; le cimetière de Brompton, l'un des « Magnificent Seven » de Londres, est juste à côté."], "West Finchley": ["« Finchley » signifie probablement la clairière des pinsons.", "Le nom se termine par le vieil anglais leah, une clairière dans un bois. La Northern line dessert West Finchley depuis 1940."], "West Ham": ["« Ham » désigne une terre sèche dans une boucle de rivière ou entre des rivières.", "Ici, la terre se trouve entre la Tamise, la Lea et la Roding. Elle a été divisée en East Ham et West Ham à l'époque anglo-saxonne. Le club de football West Ham United a pris le nom du quartier."], "West Hampstead": ["« Hampstead » signifie simplement ferme ou domaine.", "Le nom vient du vieil anglais hām-stede. West Hampstead s'est développé à la fin du XIXe siècle avec l'arrivée de trois lignes de chemin de fer. La station a ouvert en 1879."], "West Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement sur la colline de Harrow, là où se dresse aujourd'hui l'église St Mary. La station West Harrow a ouvert en 1913."], "West Kensington": ["Nommée d'après Kensington, la ferme d'un Saxon nommé Cynesige.", "La station se trouve en fait à Fulham. Elle a ouvert en 1874 sous le nom de North End (Fulham) et a été rebaptisée West Kensington en 1877, sans doute parce que ce nom sonnait mieux."], "West Ruislip": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "Elle a ouvert en 1906 sous le nom de Ruislip & Ickenham. West Ruislip est le terminus ouest de la Central line."], "Westbourne Park": ["Nommée d'après Westbourne, le lieu à l'ouest du ruisseau.", "Westbourne est noté en 1222. Le ruisseau, qui prend sa source à Hampstead et coule aujourd'hui caché dans des canalisations, a ensuite été appelé Westbourne d'après ce lieu."], "Westminster": ["« Westminster » signifie le moutier, ou l'église abbatiale, de l'ouest.", "Elle se trouvait à l'ouest de la City de Londres. L'abbaye, fondée au Xe siècle et reconstruite par Édouard le Confesseur, a donné son nom à tout le quartier, y compris au Parlement."], "White City": ["Nommée d'après les bâtiments d'exposition blancs de 1908.", "L'Exposition franco-britannique s'est tenue ici en 1908, avec des palais revêtus de blanc. Le stade construit au même moment a accueilli les Jeux olympiques de 1908."], "Whitechapel": ["Nommée d'après une chapelle blanche, l'église St Mary Matfelon.", "La chapelle a été construite au Moyen Âge. Ses murs étaient blancs, de pierre calcaire ou de chaux, et ont donné son nom au quartier."], "Willesden Green": ["« Willesden » signifie la colline à la source.", "Le nom est noté en 939 sous la forme Willesdune. La source a disparu. La station a ouvert en 1879."], "Willesden Junction": ["Nommée d'après un grand nœud ferroviaire à Willesden.", "« Willesden » signifie la colline à la source. Plusieurs lignes de chemin de fer s'y rejoignent et s'y croisent. Les trains de la Bakerloo line s'y arrêtent depuis 1915."], "Wimbledon": ["« Wimbledon » signifie probablement la colline d'un homme nommé Wynnmann.", "Le nom est noté vers 950 sous la forme Wunemannedune ; « dun » désigne une colline. Depuis 1877, la ville accueille le plus ancien tournoi de tennis du monde."], "Wimbledon Park": ["Nommée d'après le parc de Wimbledon House, un grand domaine.", "Le parc et le lac ont été aménagés par Capability Brown dans les années 1760. Une partie de l'ancien parc accueille aujourd'hui l'All England Lawn Tennis Club."], "Wood Green": ["« Wood Green » signifie le pré près des bois.", "Le village s'est formé autour d'un espace ouvert en bordure de Tottenham Wood. La station a ouvert en 1932."], "Wood Lane": ["Nommée d'après Wood Lane, qui s'appelait Turvens Lane jusque vers 1830.", "Son ancien nom venait de Turvens House. La station a ouvert en 2008, à côté de l'ancien BBC Television Centre."], "Woodford": ["« Woodford » signifie le gué près du bois.", "Le gué franchissait la rivière Roding, en bordure de la forêt d'Epping. Il a ensuite été remplacé par un pont, qui a donné son nom à Woodford Bridge."], "Woodside Park": ["Nommée d'après Woodside House, construite en 1840.", "Un promoteur local a repris ce nom pour son nouveau lotissement, et la station a suivi. La Northern line y est arrivée en 1940."], "Abbey Wood": ["Nommée d'après les bois près de l'abbaye de Lesnes.", "L'abbaye a été fondée en 1178 par Richard de Luci ; selon la tradition, il l'a fait en pénitence pour son rôle dans la querelle qui mena au meurtre de Thomas Becket. Elle a été fermée dans les années 1520, et ses ruines se trouvent dans un parc près de la station."], "Acton Main Line": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. « Main Line » la distingue des autres Acton : elle se trouve sur la grande ligne du Great Western au départ de Paddington."], "Brentwood": ["« Brentwood » signifie le bois brûlé.", "En 1176, le nom est écrit en latin bosco arso, « bois brûlé » : une forêt en partie défrichée par le feu. La ville s'est développée sur la route de Londres à Colchester."], "Burnham": ["« Burnham » signifie la ferme près d'un ruisseau.", "Le nom vient du vieil anglais burna, ruisseau, et hām, ferme. Tout près se trouvent les Burnham Beeches, des bois anciens célèbres pour leurs vieux hêtres."], "Chadwell Heath": ["« Chadwell » signifie la source froide.", "Le nom est noté en 1254 sous la forme Chaudewell, du vieil anglais ceald, froid, et wella, source. La lande voisine était un terrain communal ouvert."], "Custom House": ["Nommée d'après un bureau de douane du Royal Victoria Dock, où l'on payait les droits sur les marchandises.", "Les cargaisons des navires déchargés dans les Royal Docks y étaient contrôlées et taxées. Aujourd'hui, la station dessert le centre d'exposition ExCeL."], "Forest Gate": ["Nommée d'après une barrière qui empêchait les animaux de sortir de la forêt d'Epping.", "Le bétail qui paissait dans la forêt risquait de s'égarer sur la grande route de Romford ; on posa donc une barrière sur une route secondaire, l'actuelle Woodford Road. Elle a été enlevée en 1881, mais le nom est resté."], "Gidea Park": ["Nommée d'après Gidea Hall, un manoir attesté dès le XIIIe siècle.", "Le nom signifierait « la maison étourdie » ou « folle », peut-être à cause d'un bâtiment à l'allure étrange. En 1910–1911, une cité-jardin y a été construite, avec un concours des maisons les mieux conçues."], "Goodmayes": ["Nommée probablement d'après John Godemay, propriétaire terrien au XIVe siècle.", "Le nom de sa famille a survécu dans celui d'une ferme. La gare a ouvert en 1901, et les maisons alentour ont suivi."], "Hanwell": ["« Hanwell » signifie probablement la source où se rassemblent les coqs ou les oiseaux sauvages.", "Le nom est noté en 959 sous la forme Hanewelle. Juste à l'ouest de la gare se trouve le viaduc de Wharncliffe, construit par Isambard Kingdom Brunel pour le Great Western Railway et ouvert en 1838."], "Harold Wood": ["Nommée d'après le roi Harold, qui possédait des terres ici avant 1066.", "Harold II fut tué à la bataille de Hastings en 1066. Son nom a survécu dans celui du bois, noté au XIIIe siècle sous la forme Horoldeswode."], "Hayes & Harlington": ["« Hayes » désigne une terre couverte de broussailles ; « Harlington », la ferme des gens de Hygered.", "Hayes vient du vieil anglais hæs, broussailles. Harlington est noté en 831 sous la forme Hygereding tun. Harlington borde aujourd'hui l'aéroport d'Heathrow."], "Ilford": ["« Ilford » signifie le gué sur la Hyle.", "La Hyle, « le ruisseau qui coule doucement », était l'ancien nom du cours inférieur de la Roding. Retirez le H, et vous obtenez Ilford."], "Iver": ["« Iver » signifie le rebord d'une colline.", "Le nom vient du vieil anglais yfer, le bord ou le sommet d'une pente. Avec ses quatre lettres, c'est l'un des noms de station les plus courts de la région de Londres."], "Langley": ["« Langley » signifie la longue clairière.", "Le nom vient du vieil anglais lang, long, et lēah, une clairière dans un bois. Le vieux village est parfois appelé Langley Marish, d'après Christiana de Marecis, qui tenait le domaine au XIIIe siècle."], "Maidenhead": ["« Maidenhead » signifie le débarcadère des jeunes filles.", "Le nom vient du vieil anglais mægden, jeune fille, et hȳth, un débarcadère sur la Tamise. Le pont ferroviaire de Brunel, achevé en 1838, possède les arches de briques les plus plates jamais construites."], "Manor Park": ["Nommée d'après un manoir construit vers 1810 sur le domaine de Hamfrith.", "Le secteur est resté agricole jusqu'à la construction de maisons à la fin du XIXe siècle. Le cimetière de la City de Londres, l'un des plus grands de Grande-Bretagne, est juste à côté."], "Maryland": ["Nommée d'après Maryland Point, qui rappellerait la colonie américaine du Maryland.", "Le nom apparaît sur une carte de 1696. On raconte qu'un marchand enrichi dans le Maryland y fit construire une maison, mais rien ne le prouve. La colonie elle-même tenait son nom de la reine Henriette-Marie."], "Reading": ["« Reading » signifie le peuple d'un homme nommé Reada.", "Le nom est noté vers 900 sous la forme Readingum. Henri Ier fonda l'abbaye de Reading en 1121 et y fut enterré ; ses ruines sont encore visibles près de la gare."], "Romford": ["« Romford » signifie le gué large.", "Le nom vient du vieil anglais rūm, spacieux ou large. La rivière Rom a reçu son nom de la ville bien plus tard, et non l'inverse. Romford accueille un marché depuis le XIIIe siècle."], "Seven Kings": ["Malgré la légende, il n'y a jamais eu sept rois.", "Selon une histoire répandue, sept rois saxons auraient fait boire leurs chevaux ici. Le nom vient plus probablement du peuple d'un homme nommé Seofeca."], "Shenfield": ["« Shenfield » signifie probablement la belle terre dégagée.", "Le nom vient du vieil anglais scēne, clair ou beau, et feld, terrain découvert. Il figure dans le Domesday Book de 1086 sous la forme Scenefelda. La gare est le terminus est de l'Elizabeth line."], "Slough": ["« Slough » désigne un lieu boueux, un marécage.", "Le nom vient du vieil anglais slōh. L'astronome William Herschel y vécut à partir de 1786 et construisit son grand télescope dans son jardin."], "Southall": ["« Southall » signifie le recoin de terre du sud.", "Le nom vient du vieil anglais sūth et healh, un coin ou un recoin ; son pendant au nord est Northolt. Southall compte une importante communauté pendjabie, et les panneaux de la gare sont aussi écrits en pendjabi."], "Taplow": ["« Taplow » signifie le tumulus d'un homme nommé Tæppa.", "Son tumulus se dresse toujours dans l'ancien cimetière. Quand on l'a fouillé en 1883, il contenait de riches trésors anglo-saxons, aujourd'hui au British Museum."], "Twyford": ["« Twyford » signifie le double gué.", "Il y avait ici deux gués sur la rivière Loddon. Beaucoup de villages anglais portent ce nom pour la même raison."], "West Drayton": ["« Drayton » désigne probablement une ferme près d'un lieu où l'on traînait les bateaux ou les charges.", "Le nom est noté en 939 sous la forme Drægtun, du vieil anglais dræg, lieu de halage. « West » a été ajouté plus tard."], "West Ealing": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom est noté vers 700 sous la forme Gillingas. West Ealing s'est développé le long d'Uxbridge Road après l'ouverture de la gare."], "Woolwich": ["« Woolwich » signifie le comptoir de la laine.", "Le nom vient du vieil anglais wull, laine, et wīc, comptoir, et est attesté au Xe siècle. Plus tard, Woolwich devint célèbre pour son arsenal royal et son chantier naval."], "Abbey Road": ["Nommée d'après la route menant à l'abbaye de Stratford Langthorne.", "Cette abbaye cistercienne, fondée en 1135, fut l'une des plus riches d'Angleterre jusqu'à sa fermeture par Henri VIII. Ce n'est pas l'Abbey Road des Beatles, qui se trouve à St John's Wood."], "All Saints": ["Nommée d'après l'église All Saints, l'église paroissiale de Poplar.", "L'église a été construite dans les années 1820, quand Poplar est devenue une paroisse à part entière. Sa haute flèche se dresse juste au nord de la station."], "Beckton": ["Nommée d'après Simon Adams Beck, gouverneur de la Gas Light and Coke Company.", "Les travaux de l'usine à gaz de la compagnie commencèrent ici en 1868 ; elle devint la plus grande usine à gaz du monde. Après sa fermeture, ses ruines ont servi de décor de cinéma, par exemple pour Full Metal Jacket."], "Beckton Park": ["Nommée d'après Beckton et son parc, qui rappellent Simon Adams Beck de la Gas Light and Coke Company.", "Beckton s'est développé autour de l'immense usine à gaz de la compagnie, commencée en 1868. Outre le gaz, elle produisait du goudron, des colorants et des engrais."], "Blackwall": ["« Blackwall » signifie la digue sombre le long de la Tamise.", "Le nom vient probablement de la couleur sombre de la digue médiévale. En 1606, des navires partirent de Blackwall pour fonder Jamestown, en Virginie, première colonie anglaise durable en Amérique."], "Bow Church": ["Nommée d'après l'église St Mary de Bow, qui se dresse sur un îlot au milieu de la route.", "Bow elle-même tient son nom d'un pont en arc sur la rivière Lea, construit au début du XIIe siècle."], "Crossharbour": ["Le nom évoque un passage sur le Millwall Dock tout proche.", "Pendant quelques années, la station s'est appelée Crossharbour and London Arena, d'après une salle de sport et de conce
