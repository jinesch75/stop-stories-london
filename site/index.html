 Enfield Chase.", "Das Dorf wuchs rund um das Tor. Die runde Station von 1933, entworfen von Charles Holden, steht unter Denkmalschutz."], "Southwark": ["„Southwark“ bedeutet die südliche Befestigung.", "Im frühen 10. Jahrhundert wurde es Suthriganaweorc geschrieben, die Befestigung der Männer von Surrey, die das Südende der London Bridge schützte. Die Station wurde 1999 eröffnet."], "Stamford Brook": ["Benannt nach einem heute verschwundenen Bach zwischen Hammersmith und Chiswick.", "„Stamford“ soll die steinige Furt bedeuten. Der Bach fließt heute in einem Rohr unter den Straßen."], "Stanmore": ["„Stanmore“ bedeutet der steinige Teich.", "Es kommt von altenglisch stān, Stein, und mere, Teich; der Kiesboden hier ist sehr steinig. Die Station wurde 1932 eröffnet."], "Stepney Green": ["„Stepney“ bedeutet der Landeplatz eines Mannes namens Stebba.", "Um 1000 wurde es Stybbanhythe geschrieben; hythe bedeutet Landeplatz an der Themse. Der „Green“ ist die alte Dorfwiese von Stepney."], "Stockwell": ["„Stockwell“ bedeutet der Brunnen oder die Quelle bei einem Baumstumpf.", "Es kommt von altenglisch stocc, Stumpf oder Pfahl. Vor der Station liegt der Eingang zu einem Tiefbunker aus dem Zweiten Weltkrieg."], "Stonebridge Park": ["Benannt nach einer Steinbrücke über den Fluss Brent.", "Die Brücke wurde im 17. Jahrhundert gebaut, um die Harrow Road über den Fluss zu führen. Die Züge der Bakerloo Line halten hier seit 1917."], "Stratford": ["„Stratford“ bedeutet die Furt an der Römerstraße.", "Altenglisch stræt, eine gepflasterte Römerstraße, ist der Ursprung des Wortes „street“ (und „Straße“). Hier querte die Straße von London nach Colchester den Fluss Lea. Die Gegend war das Zentrum der Olympischen Spiele 2012."], "Sudbury Hill": ["„Sudbury“ bedeutet das südliche Gut.", "Es lag südlich von Harrow, dem Hauptort. Die Station wurde 1903 eröffnet; ihr heutiges Gebäude aus den frühen 1930er-Jahren stammt von Charles Holden."], "Sudbury Town": ["„Sudbury“ bedeutet das südliche Gut.", "Es lag südlich von Harrow. Die Station wurde 1931 von Charles Holden als Kasten aus Ziegel und Glas neu gebaut, ein Vorbild für viele spätere U-Bahn-Stationen."], "Swiss Cottage": ["Benannt nach einem Pub im Stil eines Schweizer Chalets.", "Seit 1804 steht hier ein Gasthaus. Das Gebäude des Pubs Ye Olde Swiss Cottage steht noch nahe der Station, doch das Pub schloss 2025."], "Temple": ["Benannt nach dem Temple, einst Sitz der Tempelritter.", "Die Ritter bauten im 12. Jahrhundert die runde Temple Church. Nach der Auflösung des Ordens im 14. Jahrhundert zogen Juristen ein, und Inner und Middle Temple sind bis heute zwei der Inns of Court."], "Theydon Bois": ["„Bois“ ist der Familienname mittelalterlicher Grundherren.", "Die Familie Bois besaß das Land im 12. und 13. Jahrhundert. „Theydon“ soll das Tal bedeuten, in dem man Stroh zum Dachdecken holte. Die Station wurde 1865 als Theydon eröffnet."], "Tooting Bec": ["„Bec“ erinnert an die Abtei Le Bec in der Normandie, der nach 1066 hier Land gehörte.", "Tooting bedeutet wahrscheinlich die Leute eines Mannes namens Tota. Die Station wurde 1926 als Trinity Road (Tooting Bec) eröffnet und 1950 umbenannt."], "Tooting Broadway": ["„Tooting“ bedeutet wahrscheinlich die Leute eines Mannes namens Tota.", "Ein „Broadway“ ist eine breite Hauptstraße. Die Statue König Eduards VII. vor der Station steht dort seit 1911."], "Tottenham Court Road": ["Benannt nach der Straße zum Gut Tottenhall, nicht nach Tottenham.", "Das Gutshaus nahe der heutigen Euston Road war wohl nach einem Grundbesitzer namens Tota benannt. Die Straße führte vom West End dorthin."], "Tottenham Hale": ["„Tottenham“ bedeutet das Gehöft eines Mannes namens Totta.", "„Hale“ kommt wahrscheinlich von einem alten Wort für einen Winkel oder eine Landecke. Der Bahnhof wurde 1840 als Tottenham eröffnet und erhielt seinen heutigen Namen, als 1968 die Victoria Line kam."], "Totteridge & Whetstone": ["„Totteridge“ bedeutet der Bergrücken eines Mannes namens Tata; „Whetstone“ ist ein Rätsel.", "Der Legende nach wetzten Soldaten hier vor der Schlacht von Barnet 1471 ihre Schwerter an einem Wetzstein, doch der Name ist älter. Wahrscheinlicher bedeutet er „westliche Siedlung“."], "Tower Hill": ["Benannt nach dem Hügel neben dem Tower of London.", "Jahrhundertelang war er ein Ort öffentlicher Hinrichtungen. Bis 1946 hieß die Station Mark Lane."], "Tufnell Park": ["Benannt nach der Familie Tufnell, den Gutsherren von Barnsbury.", "William Tufnell erhielt das Gut 1753. Sein Nachfahre Henry Tufnell begann 1845, auf dem Land Häuser zu bauen. Die Station wurde 1907 eröffnet."], "Turnham Green": ["„Turnham“ bedeutet das Gehöft in der Flussbiegung.", "Die Themse macht hier eine große Schleife. 1642, im Bürgerkrieg, kehrte bei Turnham Green ein königstreues Heer um, statt auf London zu marschieren."], "Turnpike Lane": ["Benannt nach einem „turnpike“, einer Mautschranke an der Straße nach Norden.", "Reisende auf den Green Lanes mussten hier für die Benutzung der Straße zahlen. Die Station wurde 1932 eröffnet."], "Upminster": ["„Upminster“ bedeutet das Münster, die große Kirche, auf der Anhöhe.", "Gemeint ist wohl die Kirche St Laurence auf dem Hügel über dem Ingrebourne. Die Windmühle von Upminster aus dem Jahr 1803 steht noch. Die Station ist der östliche Endpunkt der District Line."], "Upminster Bridge": ["Benannt nach der Brücke über den Fluss Ingrebourne bei Upminster.", "Upminster bedeutet die große Kirche auf der Anhöhe. Die Station wurde 1934 eröffnet."], "Upney": ["„Upney“ bedeutet wahrscheinlich die höher gelegene Insel.", "Die „Insel“ war ein Stück trockenes Land zwischen Bächen und Sümpfen nahe dem Mayes Brook. Die Station wurde 1932 eröffnet."], "Upton Park": ["„Upton“ bedeutet der Hof auf der Anhöhe.", "„Park“ kam in den 1880er-Jahren hinzu, um neue Häuser zu verkaufen. Das alte Stadion von West Ham United, der Boleyn Ground, wurde oft Upton Park genannt."], "Uxbridge": ["„Uxbridge“ bedeutet die Brücke der Wixan.", "Die Wixan waren ein angelsächsischer Stamm, der sich hier niederließ, und die Brücke führte über den Fluss Colne. Uxbridge ist der westliche Endpunkt der Metropolitan und der Piccadilly Line."], "Vauxhall": ["„Vauxhall“ bedeutet die Halle des Falkes, eines mittelalterlichen Ritters.", "Falkes de Breauté besaß hier im 13. Jahrhundert ein großes Haus. Später waren die Vauxhall-Vergnügungsgärten in ganz Europa berühmt, und der Autohersteller übernahm den Namen des Viertels."], "Victoria": ["Benannt nach der Victoria Street, die an Königin Victoria erinnert.", "Der Fernbahnhof übernahm 1860 den Namen der Straße. Er steht an der Stelle eines alten Hafenbeckens des Grosvenor-Kanals."], "Walthamstow Central": ["„Walthamstow“ bedeutet wahrscheinlich der Ort des Willkommens.", "1075 wurde es Wilcumestowe geschrieben. „Central“ unterscheidet sie von anderen Bahnhöfen der Stadt. Die Victoria Line kam 1968."], "Wanstead": ["„Wanstead“ bedeutet einen Ort, doch niemand weiß, was für einen.", "Im 11. Jahrhundert wurde es Wenstede geschrieben. -stead bedeutet Ort oder Stätte; der erste Teil könnte einen Hügel oder einen Wagen meinen."], "Warren Street": ["Benannt nach Anne Warren oder ihrem Vater, Admiral Sir Peter Warren.", "Anne heiratete den Grundbesitzer Charles FitzRoy, später Baron Southampton, der das Land im späten 18. Jahrhundert bebaute. Die Station wurde 1907 als Euston Road eröffnet und ein Jahr später umbenannt."], "Warwick Avenue": ["Benannt nach Jane Warwick, die in eine örtliche Grundbesitzerfamilie einheiratete.", "Sie heiratete 1778. Das Land gehörte dem Bischof von London, und die Straße wurde nach ihr benannt. Die Station wurde 1915 eröffnet."], "Waterloo": ["Benannt nach der Waterloo Bridge, die an die Schlacht bei Waterloo erinnert.", "Die Brücke war im Bau, als Wellington 1815 Napoleon besiegte. Sie sollte Strand Bridge heißen, wurde aber 1817 als Waterloo Bridge eröffnet. Die Straße und der Bahnhof folgten."], "Watford": ["„Watford“ bedeutet wahrscheinlich die Furt der Jäger oder die nasse Furt.", "Die Furt führte durch den Fluss Colne. Die Station der Metropolitan Line wurde 1925 in Cassiobury eröffnet, ein gutes Stück vom Stadtzentrum entfernt."], "Wembley Central": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "Der Name endet auf altenglisch leah, eine Lichtung. Der Bahnhof wurde 1842 als Sudbury eröffnet und 1948 zu Wembley Central, im Jahr der Olympischen Spiele in Wembley."], "Wembley Park": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "In den 1890er-Jahren begann man hier einen Turm, der dem Eiffelturm Konkurrenz machen sollte; er wurde nie fertig. Später entstand an seiner Stelle das Wembley-Stadion."], "West Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. Die Station West Acton wurde 1923 eröffnet."], "West Brompton": ["„Brompton“ bedeutet der Hof, wo Ginster wächst.", "Ginster ist ein gelb blühender Strauch. Der erste Bahnhof wurde 1866 eröffnet; nebenan liegt der Brompton Cemetery, einer der „Magnificent Seven“, der sieben großen Friedhöfe Londons."], "West Finchley": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Der Name endet auf altenglisch leah, eine Waldlichtung. Die Northern Line bedient West Finchley seit 1940."], "West Ham": ["„Ham“ bedeutet trockenes Land in einer Flussbiegung oder zwischen Flüssen.", "Hier liegt das Land zwischen Themse, Lea und Roding. In angelsächsischer Zeit wurde es in East Ham und West Ham geteilt. Der Fußballverein West Ham United ist nach der Gegend benannt."], "West Hampstead": ["„Hampstead“ bedeutet einfach Gehöft.", "Es kommt von altenglisch hām-stede. West Hampstead wuchs im späten 19. Jahrhundert, als drei Eisenbahnlinien kamen. Die Station wurde 1879 eröffnet."], "West Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich auf dem Harrow Hill, wo heute die Kirche St Mary steht. Die Station West Harrow wurde 1913 eröffnet."], "West Kensington": ["Benannt nach Kensington, dem Hof eines Sachsen namens Cynesige.", "Die Station liegt eigentlich in Fulham. Sie wurde 1874 als North End (Fulham) eröffnet und 1877 in West Kensington umbenannt, wohl weil der Name attraktiver klang."], "West Ruislip": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Sie wurde 1906 als Ruislip & Ickenham eröffnet. West Ruislip ist der westliche Endpunkt der Central Line."], "Westbourne Park": ["Benannt nach Westbourne, dem Ort westlich des Baches.", "Westbourne wurde 1222 erwähnt. Der Bach, der in Hampstead entspringt und heute verborgen in Rohren fließt, wurde später nach dem Ort Westbourne genannt."], "Westminster": ["„Westminster“ bedeutet das Münster, die Abteikirche, im Westen.", "Es lag westlich der City of London. Die Abtei wurde im 10. Jahrhundert gegründet, von Eduard dem Bekenner neu gebaut und gab dem ganzen Viertel seinen Namen, samt dem Parlament."], "White City": ["Benannt nach den weißen Ausstellungsbauten von 1908.", "1908 fand hier die Französisch-Britische Ausstellung statt, mit weiß verkleideten Palästen. Das zugleich gebaute Stadion war Austragungsort der Olympischen Spiele 1908."], "Whitechapel": ["Benannt nach einer weißen Kapelle, der Kirche St Mary Matfelon.", "Die Kapelle wurde im Mittelalter gebaut. Ihre Mauern waren weiß, aus Kalkstein oder gekalkt, und gaben dem Viertel den Namen."], "Willesden Green": ["„Willesden“ bedeutet der Hügel mit der Quelle.", "939 wurde es Willesdune geschrieben. Die Quelle ist verschwunden. Die Station wurde 1879 eröffnet."], "Willesden Junction": ["Benannt nach einem großen Eisenbahnknoten in Willesden.", "„Willesden“ bedeutet der Hügel mit der Quelle. Hier treffen und kreuzen sich mehrere Bahnlinien. Die Züge der Bakerloo Line halten hier seit 1915."], "Wimbledon": ["„Wimbledon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Wynnmann.", "Um 950 wurde es Wunemannedune geschrieben; „dun“ bedeutet Hügel. Seit 1877 findet hier das älteste Tennisturnier der Welt statt."], "Wimbledon Park": ["Benannt nach dem Park von Wimbledon House, einem großen Landgut.", "Park und See wurden in den 1760er-Jahren von Capability Brown gestaltet. Auf einem Teil des alten Parks liegt heute der All England Lawn Tennis Club."], "Wood Green": ["„Wood Green“ bedeutet die Wiese beim Wald.", "Das Dorf wuchs rund um eine Freifläche am Rand des Tottenham Wood. Die Station wurde 1932 eröffnet."], "Wood Lane": ["Benannt nach der Wood Lane, die bis etwa 1830 Turvens Lane hieß.", "Ihr alter Name kam vom Turvens House. Die Station wurde 2008 eröffnet, neben dem alten BBC Television Centre."], "Woodford": ["„Woodford“ bedeutet die Furt beim Wald.", "Die Furt führte durch den Fluss Roding am Rand des Epping Forest. Später ersetzte sie eine Brücke, nach der Woodford Bridge benannt ist."], "Woodside Park": ["Benannt nach Woodside House, 1840 gebaut.", "Ein örtlicher Bauunternehmer übernahm den Namen für seine neue Wohnsiedlung, und die Station folgte. Die Northern Line kam 1940."], "Abbey Wood": ["Benannt nach den Wäldern bei der Abtei Lesnes.", "Die Abtei wurde 1178 von Richard de Luci gegründet; der Überlieferung nach als Buße für seine Rolle in dem Streit, der zur Ermordung von Thomas Becket führte. Sie wurde in den 1520er-Jahren aufgelöst, ihre Ruinen liegen in einem Park nahe der Station."], "Acton Main Line": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. „Main Line“ unterscheidet sie von den anderen Actons: Sie liegt an der Great-Western-Hauptstrecke ab Paddington."], "Brentwood": ["„Brentwood“ bedeutet der verbrannte Wald.", "1176 wurde es lateinisch bosco arso geschrieben, „verbrannter Wald“: ein Wald, der teils durch Feuer gerodet war. Die Stadt entstand an der Straße von London nach Colchester."], "Burnham": ["„Burnham“ bedeutet das Gehöft am Bach.", "Der Name kommt von altenglisch burna, Bach, und hām, Gehöft. In der Nähe liegen die Burnham Beeches, alte Wälder, berühmt für ihre uralten Buchen."], "Chadwell Heath": ["„Chadwell“ bedeutet die kalte Quelle.", "1254 wurde es Chaudewell geschrieben, von altenglisch ceald, kalt, und wella, Quelle. Die Heide daneben war offenes Gemeindeland."], "Custom House": ["Benannt nach einem Zollhaus am Royal Victoria Dock, wo Zoll auf Waren gezahlt wurde.", "Die Ladungen der Schiffe in den Royal Docks wurden hier kontrolliert und verzollt. Heute bedient die Station das Messezentrum ExCeL."], "Forest Gate": ["Benannt nach einem Tor, das Tiere daran hinderte, aus dem Epping Forest zu entlaufen.", "Das im Wald weidende Vieh konnte auf die Hauptstraße nach Romford laufen, deshalb kam ein Tor auf eine Nebenstraße, die heutige Woodford Road. Es wurde 1881 entfernt, doch der Name blieb."], "Gidea Park": ["Benannt nach Gidea Hall, einem seit dem 13. Jahrhundert belegten Herrenhaus.", "Der Name bedeutet vielleicht „die verrückte Halle“, womöglich wegen eines seltsam aussehenden Gebäudes. 1910–11 entstand hier eine Gartenvorstadt mit einem Wettbewerb um die am besten entworfenen Häuser."], "Goodmayes": ["Wahrscheinlich benannt nach John Godemay, einem Grundbesitzer im 14. Jahrhundert.", "Der Familienname lebte als Name eines Bauernhofs weiter. Der Bahnhof wurde 1901 eröffnet, die Häuser ringsum folgten."], "Hanwell": ["„Hanwell“ bedeutet wahrscheinlich die Quelle, an der sich Hähne oder wilde Vögel sammeln.", "959 wurde es Hanewelle geschrieben. Gleich westlich des Bahnhofs steht das Wharncliffe-Viadukt, das Isambard Kingdom Brunel für die Great Western Railway baute und das 1838 eröffnet wurde."], "Harold Wood": ["Benannt nach König Harold, dem hier vor 1066 Land gehörte.", "Harold II. fiel 1066 in der Schlacht bei Hastings. Sein Name lebte im Wald weiter, im 13. Jahrhundert als Horoldeswode belegt."], "Hayes & Harlington": ["„Hayes“ bedeutet mit Gestrüpp bewachsenes Land; „Harlington“ der Hof der Leute des Hygered.", "Hayes kommt von altenglisch hæs, Gestrüpp. Harlington wurde 831 als Hygereding tun erwähnt. Harlington grenzt heute an den Flughafen Heathrow."], "Ilford": ["„Ilford“ bedeutet die Furt über den Hyle.", "Der Hyle, „der rieselnde Bach“, war der alte Name des unteren Roding. Lässt man das H weg, erhält man Ilford."], "Iver": ["„Iver“ bedeutet die Kante eines Hügels.", "Der Name kommt von altenglisch yfer, Rand oder Kante eines Hangs. Mit vier Buchstaben ist er einer der kürzesten Stationsnamen im Raum London."], "Langley": ["„Langley“ bedeutet die lange Lichtung.", "Es kommt von altenglisch lang, lang, und lēah, eine Waldlichtung. Das alte Dorf heißt manchmal Langley Marish, nach Christiana de Marecis, der das Gut im 13. Jahrhundert gehörte."], "Maidenhead": ["„Maidenhead“ bedeutet der Landeplatz der Mädchen.", "Es kommt von altenglisch mægden, Mädchen, und hȳth, ein Landeplatz an der Themse. Brunels Eisenbahnbrücke hier, 1838 fertiggestellt, hat die flachsten Ziegelbögen, die je gebaut wurden."], "Manor Park": ["Benannt nach einem Herrenhaus, das um 1810 auf dem Gut Hamfrith gebaut wurde.", "Die Gegend war Ackerland, bis im späten 19. Jahrhundert Häuser gebaut wurden. Nebenan liegt der Friedhof der City of London, einer der größten Großbritanniens."], "Maryland": ["Benannt nach Maryland Point, das an die amerikanische Kolonie Maryland erinnern soll.", "Der Name erscheint auf einer Karte von 1696. Der Geschichte nach baute hier ein Kaufmann, der in Maryland reich geworden war, ein Haus, doch bewiesen ist das nicht. Die Kolonie selbst war nach Königin Henrietta Maria benannt."], "Reading": ["„Reading“ bedeutet die Leute eines Mannes namens Reada.", "Um 900 wurde es Readingum geschrieben. Heinrich I. gründete 1121 die Abtei Reading und wurde dort begraben; ihre Ruinen sind nahe dem Bahnhof noch zu sehen."], "Romford": ["„Romford“ bedeutet die breite Furt.", "Der Name kommt von altenglisch rūm, geräumig oder breit. Der Fluss Rom wurde viel später nach der Stadt benannt, nicht umgekehrt. Romford hat seit dem 13. Jahrhundert einen Markt."], "Seven Kings": ["Trotz der Legende gab es keine sieben Könige.", "Einer beliebten Geschichte nach tränkten hier sieben sächsische Könige ihre Pferde. Wahrscheinlicher kommt der Name von den Leuten eines Mannes namens Seofeca."], "Shenfield": ["„Shenfield“ bedeutet wahrscheinlich das schöne offene Land.", "Der Name kommt von altenglisch scēne, hell oder schön, und feld, offenes Land. Im Domesday Book von 1086 steht es als Scenefelda. Der Bahnhof ist der östliche Endpunkt der Elizabeth line."], "Slough": ["„Slough“ bedeutet ein schlammiger Ort, ein Sumpf.", "Der Name kommt von altenglisch slōh. Der Astronom William Herschel lebte hier ab 1786 und baute in seinem Garten sein großes Teleskop."], "Southall": ["„Southall“ bedeutet der südliche Landwinkel.", "Der Name kommt von altenglisch sūth und healh, Ecke oder Winkel; sein Gegenstück im Norden ist Northolt. In Southall lebt eine große Gemeinschaft aus dem Punjab, und die Schilder am Bahnhof sind auch auf Punjabi geschrieben."], "Taplow": ["„Taplow“ bedeutet der Grabhügel eines Mannes namens Tæppa.", "Sein Grabhügel steht noch auf dem alten Kirchhof. Als man ihn 1883 öffnete, enthielt er reiche angelsächsische Schätze, die heute im British Museum liegen."], "Twyford": ["„Twyford“ bedeutet die doppelte Furt.", "Hier führten zwei Furten durch den Fluss Loddon. Viele englische Dörfer tragen den Namen aus demselben Grund."], "West Drayton": ["„Drayton“ bedeutet wahrscheinlich ein Hof an einer Stelle, wo Boote oder Lasten gezogen wurden.", "939 wurde es Drægtun geschrieben, von altenglisch dræg, eine Schleppstelle. „West“ kam später hinzu."], "West Ealing": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name wurde um 700 als Gillingas erwähnt. West Ealing wuchs entlang der Uxbridge Road, nachdem der Bahnhof eröffnet worden war."], "Woolwich": ["„Woolwich“ bedeutet der Handelsplatz für Wolle.", "Der Name kommt von altenglisch wull, Wolle, und wīc, Handelsplatz, und ist seit dem 10. Jahrhundert belegt. Später wurde Woolwich für sein königliches Arsenal und seine Marinewerft berühmt."], "Abbey Road": ["Benannt nach der Straße zur Abtei Stratford Langthorne.", "Die 1135 gegründete Zisterzienserabtei war eine der reichsten Englands, bis Heinrich VIII. sie auflöste. Das ist nicht die Abbey Road der Beatles, die liegt in St John's Wood."], "All Saints": ["Benannt nach der Kirche All Saints, der Pfarrkirche von Poplar.", "Die Kirche wurde in den 1820er-Jahren gebaut, als Poplar eine eigene Pfarrei wurde. Ihr hoher Turm steht gleich nördlich der Station."], "Beckton": ["Benannt nach Simon Adams Beck, dem Vorsitzenden der Gas Light and Coke Company.", "1868 begann hier der Bau des Gaswerks der Gesellschaft; es wurde das größte Gaswerk der Welt. Nach der Schließung dienten seine Ruinen als Filmkulisse, etwa für Full Metal Jacket."], "Beckton Park": ["Benannt nach Beckton und seinem Park, die an Simon Adams Beck von der Gas Light and Coke Company erinnern.", "Beckton wuchs rund um das riesige Gaswerk der Gesellschaft, das ab 1868 gebaut wurde. Neben Gas entstanden dort Teer, Farbstoffe und Dünger."], "Blackwall": ["„Blackwall“ bedeutet der dunkle Deich an der Themse.", "Der Name kommt wahrscheinlich von der dunklen Farbe des mittelalterlichen Uferdamms. 1606 segelten Schiffe von Blackwall los, um Jamestown in Virginia zu gründen, die erste dauerhafte englische Kolonie in Amerika."], "Bow Church": ["Benannt nach der Kirche St Mary in Bow, die auf einer Insel mitten in der Straße steht.", "Bow selbst ist nach einer bogenförmigen Brücke über den Fluss Lea benannt, die Anfang des 12. Jahrhunderts gebaut wurde."], "Crossharbour": ["Der Name bezieht sich auf einen Übergang über das nahe Millwall Dock.", "Einige Jahre hieß die Station Crossharbour and London Arena, nach einer inzwischen abgerissenen Sport- und Konzerthalle."], "Cutty Sark": ["Benannt nach der Cutty Sark, einem Teeklipper von 1869, heute ein Museumsschiff in der Nähe.", "„Cutty sark“ ist schottisch für ein kurzes Nachthemd: Das Schiff ist nach der Hexe Nannie aus Robert Burns' Gedicht Tam o' Shanter benannt, die eines trägt. Ihre Figur ziert den Bug."], "Cyprus": ["Benannt nach der Insel Zypern, die 1878 unter britische Kontrolle kam.", "Damals wurden hier Häuser für Arbeiter der Royal Docks und des Gaswerks Beckton gebaut, und der patriotische Name blieb. Von der alten Siedlung ist wenig übrig."], "Deptford Bridge": ["„Deptford“ bedeutet die tiefe Furt.", "Die Furt führte durch den Fluss Ravensbourne und wurde später durch eine Brücke ersetzt. In Deptford lag eine königliche Werft, die Heinrich VIII. gründete."], "Devons Road": ["Benannt nach der Devons Road, der Straße neben der Station.", "Woher der Straßenname selbst kommt, ist nicht überliefert. Die Station wurde 1987 mit der ersten DLR-Strecke eröffnet."], "East India": ["Benannt nach den East India Docks, 1806 für die Ostindien-Kompanie gebaut.", "Die großen Schiffe der Kompanie handelten mit Indien und China. Die Becken sind zugeschüttet, doch Teile der alten Kaimauern sind erhalten."], "Elverson Road": ["Benannt nach der Elverson Road, der Straße neben der Station.", "Die Herkunft des Straßennamens ist nicht überliefert. Die Station wurde 1999 mit der DLR-Verlängerung nach Lewisham eröffnet."], "Gallions Reach": ["Benannt nach einem Abschnitt der Themse, der an die Familie Galyon erinnert.", "Die Familie besaß im 14. Jahrhundert Land am Fluss. Rudyard Kipling erwähnt Gallions in seinem Roman Das Licht erlosch von 1890."], "Greenwich": ["„Greenwich“ bedeutet der grüne Handelsplatz oder Hafen.", "Der Name ist seit dem frühen 10. Jahrhundert belegt. In Greenwich liegen die Königliche Sternwarte und der Nullmeridian, nach dem die Greenwich Mean Time bestimmt wird."], "Heron Quays": ["Benannt nach Heron Quays, einer Gruppe von Kais der alten West India Docks.", "Die Kais wurden in den 1980er-Jahren neben Canary Wharf zu Büros umgebaut. Die Station wurde 1987 mit der ersten DLR-Strecke eröffnet."], "Island Gardens": ["Benannt nach einem kleinen Park am Fluss, an der Südspitze der Isle of Dogs.", "Der 1895 eröffnete Park bietet einen berühmten Blick über die Themse auf Wrens Old Royal Naval College in Greenwich. Hier beginnt ein 1902 eröffneter Fußgängertunnel unter dem Fluss."], "King George V": ["Benannt nach dem King George V Dock, dem letzten der drei Royal Docks.", "Es wurde 1921 eröffnet und nach dem damaligen König benannt. Die großen Ozeandampfer jener Zeit legten hier an."], "Langdon Park": ["Benannt nach dem Langdon Park, dem kleinen Park neben der Station.", "Während des Baus sollte die Station Carmen Street heißen, nach einer nahen Straße."], "Lewisham": ["„Lewisham“ bedeutet wahrscheinlich das Gehöft eines Mannes namens Lēofsa.", "Der Name endet auf altenglisch hām, Gehöft. Der Ravensbourne und sein Zufluss Quaggy treffen sich nahe der Station."], "Limehouse": ["„Limehouse“ bedeutet die Kalköfen.", "Im 14. Jahrhundert hieß es „lymhostes“, die Öfen, in denen Kreide zu Baukalk gebrannt wurde. Später war Limehouse ein belebtes Hafenviertel."], "London City Airport": ["Benannt nach dem London City Airport, dem Flughafen, der der City of London am nächsten liegt.", "Er wurde 1987 auf dem Kai zwischen zwei der alten Royal Docks eröffnet. Die DLR-Station folgte 2005."], "Mudchute": ["Benannt nach einer „mud chute“, einer Schlammrutsche: Schlamm aus dem Millwall Dock wurde hierher gepumpt.", "Der Schlamm türmte sich zu einem großen Hügel. Heute liegen hier Mudchute Park und Farm, einer der größten Stadtbauernhöfe Europas."], "Pontoon Dock": ["Benannt nach einem Dock, in dem Schiffe zur Reparatur auf schwimmenden Pontons angehoben wurden.", "Hydraulische Heber hoben die Schiffe am Royal Victoria Dock aus dem Wasser. Das Themse-Sperrwerk und sein Park liegen ganz in der Nähe."], "Poplar": ["„Poplar“ bedeutet der Ort, an dem Pappeln wachsen.", "1327 wurde es Popler geschrieben. Die Bäume gediehen gut auf dem feuchten Boden an der Themse."], "Prince Regent": ["Benannt nach der Prince Regent Lane, die an den späteren Georg IV. erinnert.", "Er wurde 1811 Prinzregent, als sein Vater Georg III. zu krank zum Regieren war. Die Straße ist älter als die Docks."], "Pudding Mill Lane": ["Benannt nach der Straße, die nach einer Wassermühle am Fluss Lea heißt.", "Die Mühle soll wegen ihrer runden Form „Pudding Mill“ genannt worden sein. Die Station liegt neben dem Olympiapark von 2012."], "Royal Albert": ["Benannt nach dem Royal Albert Dock, das an Prinz Albert erinnert, den Mann von Königin Victoria.", "Das Dock wurde 1880 eröffnet, das zweite der drei Royal Docks. In seinen Lagerhäusern wurden Kühlfleisch, Bananen und Tabak umgeschlagen."], "Royal Victoria": ["Benannt nach dem Royal Victoria Dock, das an Königin Victoria erinnert.", "Es wurde 1855 auf Sumpfland eröffnet, das erste der drei Royal Docks, gebaut für große Dampfschiffe und mit direktem Bahnanschluss."], "Shadwell": ["„Shadwell“ bedeutet die seichte Quelle.", "Der Name kommt von altenglisch sceald, seicht, und wella, Quelle oder Bach. DLR und Overground haben hier je eine Station."], "South Quay": ["Benannt nach den Kais des South Dock der West India Docks.", "Die Docks wurden Anfang des 19. Jahrhunderts eröffnet. Heute säumen Bürotürme die Kais."], "Star Lane": ["Benannt nach der Star Lane, der Straße neben der Station.", "Die Herkunft des Straßennamens ist nicht überliefert. Die Station wurde 2011 an einer neuen DLR-Strecke nach Stratford International eröffnet."], "Stratford High Street": ["Benannt nach der Hauptstraße von Stratford, der alten Römerstraße nach Osten.", "Stratford bedeutet die Furt an der Römerstraße, wo sie den Lea querte. Die Station steht an der Stelle des alten Bahnhofs Stratford Market."], "Stratford International": ["Benannt nach den internationalen Zügen, die hier halten sollten.", "Der Bahnhof wurde 2009 für Züge durch den Kanaltunnel eröffnet, doch Eurostar-Züge haben hier noch nie gehalten."], "Tower Gateway": ["Benannt als Tor zum nahen Tower of London.", "Bei der Eröffnung der DLR 1987 war sie deren erste Endstation in der City. Den Bau des Tower of London begann Wilhelm der Eroberer nach 1066."], "West India Quay": ["Benannt nach den West India Docks, eröffnet 1802.", "Sie wurden für Schiffe gebaut, die Zucker, Rum und Kaffee aus der Karibik brachten, hergestellt von versklavten Menschen. In alten Lagerhäusern am Kai liegt heute das Museum of London Docklands."], "West Silvertown": ["Benannt nach Silvertown, das nichts mit Silber zu tun hat.", "Das Viertel wuchs rund um die Gummi- und Regenbekleidungsfabrik von S. W. Silver and Co., die 1852 hierher zog."], "Westferry": ["Benannt nach der West Ferry Road, die zu einer alten Fähre über die Themse führte.", "Die Straße verläuft an der Westseite der Isle of Dogs. Die Station wurde 1987 mit der ersten DLR-Strecke eröffnet."], "Woolwich Arsenal": ["Benannt nach dem Royal Arsenal, wo jahrhundertelang Waffen und Munition hergestellt wurden.", "Arbeiter des Arsenals gründeten 1886 einen Fußballverein, aus dem Arsenal wurde; er zog später nach Highbury im Norden Londons."], "Acton Central": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. „Central“ kam in den 1920er-Jahren hinzu, um sie von Actons anderen Bahnhöfen zu unterscheiden."], "Anerley": ["„Anerley“ soll von einem nordenglischen Wort für „einsam“ kommen.", "Der Grundbesitzer William Sanderson nannte sein Haus Anerley, weil es allein stand. Er gab Land für die Bahn unter der Bedingung, dass ein Bahnhof gebaut würde; dieser wurde 1839 eröffnet."], "Barking Riverside": ["Benannt nach einer neuen Stadt am Themseufer bei Barking.", "Sie entsteht auf dem Gelände alter Kraftwerke. Der Bahnhof wurde 2022 am Ende einer neuen Zweigstrecke eröffnet."], "Brockley": ["„Brockley“ bedeutet die Lichtung eines Mannes namens Broca oder eine Lichtung, wo Dachse leben.", "Altenglisch brocc heißt Dachs, lēah eine Waldlichtung. Das Viertel wuchs in viktorianischer Zeit, mit vielen großen Villen."], "Brondesbury": ["„Brondesbury“ bedeutet das Gut eines Mannes namens Brand.", "Es war eines der Güter der St Paul's Cathedral, dessen Einkünfte einem der Domherren zustanden."], "Brondesbury Park": ["Benannt nach Brondesbury, dem Gut eines Mannes namens Brand, und einer dort gebauten Parksiedlung.", "Die Häuser entstanden im späten 19. Jahrhundert auf dem Land des alten Guts, das der St Paul's Cathedral gehörte."], "Bruce Grove": ["Benannt nach Bruce Castle, einem Herrenhaus aus der Tudorzeit in Tottenham.", "Das Haus soll an die schottische Königsfamilie Bruce erinnern, der im Mittelalter Land in Tottenham gehörte. Heute ist es ein Museum."], "Bush Hill Park": ["Benannt nach Bush Hill Park, einem alten Landgut mit Herrenhaus.", "Das Gut stammt aus dem 17. Jahrhundert. Ab Ende der 1870er-Jahre wurden darauf Häuser gebaut, und 1880 wurde für sie der Bahnhof eröffnet."], "Bushey": ["„Bushey“ bedeutet eine Einfriedung aus Büschen oder eine bei Buchsbäumen.", "Der zweite Teil ist altenglisch hæg, Einfriedung; der erste kann bysc, Busch, oder box, Buchsbaum, sein. Der Bahnhof liegt eigentlich in Oxhey, auf der Seite von Watford."], "Caledonian Road & Barnsbury": ["Benannt nach dem Caledonian Asylum und Barnsbury, dem Gut der Familie Berners.", "Das Asylum war ein Heim für schottische Kinder („Caledonia“ ist der lateinische Name Schottlands). Barnsbury erinnert an die Familie de Berners, die das Gut im Mittelalter besaß."], "Cambridge Heath": ["Trotz des Namens hat Cambridge Heath nichts mit Cambridge zu tun.", "1275 wurde es Camprichthesheth geschrieben; der erste Teil kann ein alter Personenname oder ein Pflanzenname sein. Mit der Zeit wurde daraus das vertraute „Cambridge“."], "Camden Road": ["Benannt nach der Camden Road, die an Charles Pratt, 1. Earl Camden, erinnert.", "Ihm gehörte das Land von Camden Town. Sein Titel kam von Camden Place, seinem Haus in Kent, benannt nach dem Historiker William Camden."], "Canonbury": ["„Canonbury“ bedeutet das Gut der Kanoniker.", "Die Kanoniker des Priorats St Bartholomew besaßen das Land im Mittelalter. Der Canonbury Tower aus dem 16. Jahrhundert steht noch."], "Carpenders Park": ["Benannt nach Carpenders Park, einem Landgut mit Herrenhaus.", "Die Gegend blieb ländlich, bis in den 1930er-Jahren Häuser und Bungalows gebaut wurden. In den 1950er-Jahren kamen weitere Wohnungen hinzu."], "Cheshunt": ["„Cheshunt“ bedeutet wahrscheinlich die Quelle beim alten Römerkastell.", "Es kommt wahrscheinlich von altenglisch ceaster, römisches Kastell oder römische Stadt, und funta, Quelle. Das Domesday Book von 1086 nennt es Cestrehunt."], "Chingford": ["Chingford ist nach einer alten Furt benannt, doch was „Ching“ bedeutet, weiß niemand.", "Die Idee einer „Kiesfurt“ gilt heute als zweifelhaft; die Furt führte vielleicht durch den Fluss Ching oder den Lea. Am Rand des Epping Forest steht Queen Elizabeth's Hunting Lodge, 1543 für Heinrich VIII. gebaut."], "Clapham High Street": ["Benannt nach der Hauptstraße von Clapham; „Clapham“ bedeutet wahrscheinlich das Gehöft bei einem Hügel.", "Der altenglische Name kommt vielleicht von clopp, Klumpen oder Hügel. Bis 1989 hieß der Bahnhof Clapham."], "Clapham Junction": ["Nach Clapham benannt, obwohl der Bahnhof eigentlich in Battersea liegt.", "Bei der Eröffnung 1863 klang Clapham vornehmer. Gemessen an der Zahl der Züge ist er einer der verkehrsreichsten Bahnhöfe Europas."], "Clapton": ["„Clapton“ bedeutet der Hof auf einem Hügel.", "Der Name kommt von altenglisch clopp, Klumpen oder Hügel, und tūn, Hof. Das Viertel reicht hinunter bis zum Lea und den Hackney Marshes."], "Crouch Hill": ["„Crouch“ ist ein altes Wort für Kreuz: der Hügel mit dem Kreuz.", "Mittelenglisch crouche bedeutete Kreuz, wohl ein Wegkreuz. Dasselbe Wort steckt im nahen Crouch End."], "Crystal Palace": ["Benannt nach dem Crystal Palace, dem riesigen Glasbau der Weltausstellung von 1851.", "Er wurde aus dem Hyde Park hierher versetzt und 1854 wiedereröffnet. 1936 brannte er ab, doch die viktorianischen Dinosaurier-Skulpturen im Park sind erhalten."], "Dalston Junction": ["„Dalston“ bedeutet der Hof eines Mannes namens Deorlaf.", "1294 wurde es Derleston geschrieben. Der Bahnhof wurde 1986 geschlossen und 2010 für die neue East London Line wiedereröffnet."], "Dalston Kingsland": ["„Kingsland“ bedeutet das Land des Königs.", "1395 wurde es Kyngeslond geschrieben, Land im Besitz des Königs. Dalston bedeutet der Hof eines Mannes namens Deorlaf."], "Denmark Hill": ["Angeblich benannt nach Prinz Georg von Dänemark, dem Mann von Königin Anne.", "Er soll um 1700 hier ein Haus gehabt oder gejagt haben. Das King's College Hospital liegt neben dem Bahnhof."], "Edmonton Green": ["„Edmonton“ bedeutet der Hof eines Mannes namens Ēadhelm.", "Im Domesday Book von 1086 steht es als Adelmetone. Der Essayist Charles Lamb verbrachte seine letzten Jahre in Edmonton und ist auf dem Kirchhof begraben."], "Emerson Park": ["Benannt nach einer Siedlung, die der Bauunternehmer William Carter ab 1895 anlegte.", "Der Name soll von Carters Sohn Emerson stammen. Der Bahnhof wurde 1909 für die neuen Häuser eröffnet."], "Enfield Town": ["„Enfield“ bedeutet das offene Land eines Mannes namens Ēana oder wo Lämmer aufgezogen wurden.", "Der Name kommt von altenglisch feld, offenes Land. 1967 wurde in einer Bank in Enfield der erste Geldautomat der Welt aufgestellt."], "Finchley Road & Frognal": ["„Frognal“ bedeutet der Winkel, wo Frösche leben.", "Es kommt von altenglisch frogga, Frosch, und healh, Winkel. Die Finchley Road wurde ab 1826 als neue Straße nach Finchley gebaut."], "Forest Hill": ["Benannt nach dem Great North Wood, der einst den Hügel bedeckte.", "Der Wald erstreckte sich über die Hügel Südlondons. In Forest Hill liegt das Horniman Museum."], "Gospel Oak": ["Benannt nach einer Eiche, unter der an der Pfarrgrenze das Evangelium gelesen wurde.", "Wenn die Gemeinde jedes Jahr ihre Grenze abschritt („beating the bounds“), hielt sie unter dem Baum, um aus der Bibel zu lesen. Er markierte die Grenze zwischen Hampstead und St Pancras."], "Hackney Central": ["„Hackney“ bedeutet die Insel eines Mannes namens Haca.", "Die „Insel“ war trockenes, erhöhtes Land in den Sümpfen des Lea. 1198 wurde es Hakeneia geschrieben."], "Hackney Downs": ["Benannt nach Hackney Downs, einer offenen Gemeindewiese in Hackney.", "„Downs“ bedeutet Hügelland. Hackney bedeutet die Insel eines Mannes namens Haca, ein Stück trockener Boden in den Sümpfen."], "Hackney Wick": ["„Wick“ kommt von altenglisch wīc, ein Hof oder eine kleine Siedlung.", "Es war der Teil von Hackney am Fluss Lea. Ein großer Teil des Olympiaparks von 2012 liegt daneben."], "Haggerston": ["„Haggerston“ bedeutet wahrscheinlich der Grenzstein eines Mannes namens Hærgod.", "Im Domesday Book von 1086 steht es als Hergotestane. Ein erster Bahnhof wurde hier 1867 eröffnet; der heutige stammt von 2010."], "Hampstead Heath": ["Benannt nach Hampstead Heath, einer der größten Grünflächen Londons.", "„Hampstead“ bedeutet einfach Gehöft. Die Heide hat Badeteiche und auf dem Parliament Hill einen der schönsten Blicke über London."], "Harringay Green Lanes": ["„Harringay“ bedeutet die Einfriedung eines Mannes namens Hæring.", "Derselbe Name ergab Haringey und Hornsey, drei Schreibweisen eines alten Wortes. Die Green Lanes waren wahrscheinlich ein alter Viehtriebweg nach London."], "Hatch End": ["„Hatch End“ bedeutet das Viertel am Tor.", "Ein „hatch“ war ein Tor, wohl zum Pinner Park, einem mittelalterlichen Wildpark. Isabella Beeton, Autorin des berühmten Book of Household Management, lebte hier um 1860."], "Headstone Lane": ["Benannt nach Headstone Manor, einem nahen Herrenhaus mit Wassergraben.", "Sein ältester Teil stammt aus dem 14. Jahrhundert; es ist eines der ältesten Fachwerkgebäude der Gegend. Heute ist es das Museum von Harrow."], "Highams Park": ["Benannt nach dem Park von Highams, einem Herrenhaus aus dem 18. Jahrhundert.", "„Higham“ bedeutet das hohe Gehöft. Den Park gestaltete Humphry Repton in den 1790er-Jahren."], "Homerton": ["„Homerton“ bedeutet der Hof einer Frau namens Hūnburh.", "1343 wurde es Hummerton geschrieben. Es ist einer der wenigen Londoner Namen, die an eine Frau erinnern."], "Honor Oak Park": ["Benannt nach der „Oak of Honor“, der Ehreneiche auf dem One Tree Hill.", "Königin Elisabeth I. soll am 1. Mai 1602 unter einer Eiche auf dem Hügel gerastet haben. Noch heute steht dort eine Eiche."], "Hoxton": ["„Hoxton“ bedeutet der Hof eines Mannes namens Hōc.", "Im Domesday Book von 1086 steht es als Hochestone. Zu Shakespeares Zeit lag es gleich vor der City, mit Feldern und frühen Theatern in der Nähe."], "Imperial Wharf": ["Benannt nach einem Kai des Imperial-Gaswerks in Sands End, Fulham.", "Die Imperial Gas Light and Coke Company baute ein großes Gaswerk am Fluss. Der Bahnhof wurde 2009 eröffnet."], "Kensal Rise": ["„Kensal“ bedeutet der Wald des Königs; „rise“ ist ein Hang.", "Im 13. Jahrhundert wurde es Kingisholte geschrieben; welcher König gemeint ist, weiß niemand. Der amerikanische Schriftsteller Mark Twain eröffnete 1900 die Bibliothek von Kensal Rise."], "Kentish Town West": ["Trotz des Namens hat Kentish Town, soweit bekannt, nichts mit Kent zu tun.", "1208 wurde es Kentisston geschrieben. Der Name kommt vielleicht von einer Familie namens Kentish oder von Wörtern für ein Bachbett, das des heute verborgenen Flusses Fleet."], "Kilburn High Road": ["„Kilburn“ bedeutet wahrscheinlich der Bach der Kühe oder der Bach des Königs.", "Der Bach ist der Westbourne, heute unterirdisch. Die Kilburn High Road folgt der alten Römerstraße Watling Street."], "Leyton Midland Road": ["Benannt nach Leyton, dem Hof am Fluss Lea, und der Midland Road.", "Die Bahnlinie, teils im Besitz der Midland Railway, kam 1894 hierher. Der Bahnhof ist nach der Straße daneben benannt."], "Leytonstone High Road": ["„Leytonstone“ bedeutet Leyton am Stein.", "Leyton ist der Hof am Lea; der Stein war wohl ein römischer Meilenstein oder ein Grenzstein. Der Regisseur Alfred Hitchcock wurde hier 1899 geboren."], "London Fields": ["Benannt nach Gemeindewiesen, auf denen Tiere auf dem Weg zu Londons Märkten weideten.", "Treiber ließen ihre Herden hier vor der letzten Etappe in die City rasten. Heute sind die Wiesen ein Park mit Freibad."], "New Cross": ["Wahrscheinlich benannt nach einem Postkutschengasthof, dem Golden Cross, an der Straße nach Kent und Dover.", "Goldsmiths, ein Teil der University of London, liegt gleich neben dem Bahnhof."], "New Cross Gate": ["Benannt nach einer Mautschranke an der Straße bei New Cross.", "Reisende auf der Mautstraße nach Kent zahlten hier. New Cross selbst ist wohl nach einem Postkutschengasthof benannt."], "Norwood Junction": ["„Norwood“ bedeutet der Nordwald, nördlich von Croydon.", "Der Great North Wood bedeckte einst die Hügel hier. Mehrere Bahnlinien treffen sich an diesem Knotenpunkt."], "Peckham Rye": ["„Peckham“ bedeutet das Gehöft bei einem Hügel; „Rye“ ist ein altes Wort für Bach.", "Peckham Rye ist die Gemeindewiese am Bach. Der Dichter William Blake erzählte, er habe dort als Junge einen Baum voller Engel gesehen."], "Penge West": ["„Penge“ ist ein keltischer Name, der das Ende des Waldes bedeutet.", "957 wurde es Penceat geschrieben, aus denselben britischen Wörtern wie walisisch pen, Kopf oder Ende, und coed, Wald. Es ist einer der ganz wenigen keltischen Namen in London."], "Queens Road Peckham": ["Benannt nach der Queen's Road in Peckham, dem Gehöft bei einem Hügel.", "Peckham kommt von altenglisch pēac, Hügel oder Spitze, und hām, Gehöft. Der Bahnhof wurde 1866 eröffnet."], "Rectory Road": ["Wahrscheinlich benannt nach dem Pfarrhaus der Kirche St Mary in Stoke Newington.", "Die Straße führte zum Pfarrhaus von St Mary. Stoke Newington bedeutet wahrscheinlich der neue Hof bei den Baumstümpfen."], "Rotherhithe": ["„Rotherhithe“ bedeutet der Landeplatz für Rinder.", "Der Name kommt von altenglisch hrȳther, Rind, und hȳth, Landeplatz. Von hier segelte 1620 die Mayflower los. Die Züge fahren durch Brunels Themsetunnel von 1843, den ersten Tunnel unter einem schiffbaren Fluss."], "Shoreditch High Street": ["„Shoreditch“ bedeutet der Graben am Hang.", "Der Name kommt von altenglisch scora, Böschung oder Hang, und dīc, Graben. Eine Legende verbindet ihn mit Jane Shore, der Geliebten Eduards IV., doch das ist eine spätere Erfindung."], "Silver Street": ["Benannt nach der Silver Street, einer alten Straße in Edmonton.", "Silver Street ist ein häufiger alter Straßenname unsicherer Herkunft. Der Bahnhof wurde 1872 eröffnet."], "South Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. South Acton wurde ein Industrieviertel mit vielen Wäschereien, Spitzname „Soapsud Island“, Seifenschauminsel."], "South Hampstead": ["„Hampstead“ bedeutet einfach Gehöft.", "Der Name kommt von altenglisch hām-stede. Der Bahnhof wurde 1879 als Loudoun Road eröffnet und 1922 in South Hampstead umbenannt."], "South Tottenham": ["„Tottenham“ bedeutet das Gehöft eines Mannes namens Totta.", "Im Domesday Book von 1086 steht es als Toteham. Der Bahnhof South Tottenham wurde 1871 eröffnet."], "Southbury": ["Benannt nach der Southbury Road, die ihren Namen von einem nahen Feld hat.", "Bis 1882 hieß die Straße Nags Head Lane. Der Bahnhof wurde 1891 als Churchbury eröffnet und 1909 geschlossen. Im Ersten Weltkrieg öffnete er wieder, schloss erneut und kam 1960 als Southbury zurück."], "St James Street": ["Benannt nach der St James Street in Walthamstow.", "Die Straße ist wahrscheinlich nach der Kirche St James benannt, 1842 für die wachsende Stadt gebaut und später abgerissen. Walthamstow bedeutet der Ort des Willkommens."], "Stamford Hill": ["„Stamford“ bedeutet die sandige Furt.", "1294 wurde es Saundfordhull geschrieben, der Hügel bei der sandigen Furt. Über die Furt führte die Römerstraße Ermine Street durch einen Bach."], "Stoke Newington": ["„Stoke Newington“ bedeutet wahrscheinlich der neue Hof bei den Baumstümpfen.", "Der Schriftsteller Daniel Defoe lebte hier, und Edgar Allan Poe ging hier als Junge zur Schule."], "Surrey Quays": ["Benannt nach den Surrey Commercial Docks am Surrey-Ufer der Themse.", "Die Docks schlugen Holz und Getreide um. Das Greenland Dock, der älteste Teil, diente einst Walfangschiffen. Bis 1989 hieß der Bahnhof Surrey Docks."], "Sydenham": ["„Sydenham“ hieß zuerst Chipenham, wahrscheinlich das Gehöft eines Mannes namens Cippa.", "1206 wurde es Chipenham geschrieben, später Sippenham. Die Schreibweise änderte sich über die Jahrhunderte, bis daraus Sydenham wurde."], "Theobalds Grove": ["Benannt nach Theobalds, einem großen Palast von William Cecil, Lord Burghley.", "König Jakob I. liebte das Haus so sehr, dass er es gegen einen anderen Palast eintauschte, und starb dort 1625. Nur Reste sind erhalten."], "Turkey Street": ["Benannt nach der Turkey Street beim Turkey Brook in Enfield.", "Die Herkunft des Namens ist unsicher; mit dem Truthahn („turkey“) oder der Türkei hat er, soweit bekannt, nichts zu tun."], "Upper Holloway": ["„Holloway“ bedeutet der Hohlweg, eine tief in den Boden eingefahrene Straße.", "Vieh und Karren auf dem Weg zu Londons Märkten haben den Weg über Jahrhunderte ausgehöhlt."], "Walthamstow Queen's Road": ["„Walthamstow“ bedeutet wahrscheinlich der Ort des Willkommens.", "1075 wurde es Wilcumestowe geschrieben. Der Bahnhof wurde 1894 als Walthamstow eröffnet und erhielt später seinen heutigen Namen."], "Wandsworth Road": ["„Wandsworth“ bedeutet die Einfriedung eines Mannes namens Wændel.", "Im Domesday Book von 1086 steht es als Wendelesorde. Der Fluss Wandle wurde später nach der Stadt benannt."], "Wanstead Park": ["Benannt nach dem Park von Wanstead House, einem riesigen palladianischen Herrenhaus.", "Das Haus war eines der prächtigsten Englands, wurde aber 1825 abgerissen, um die Schulden seines Besitzers zu bezahlen. Sein Park ist erhalten."], "Wapping": ["„Wapping“ bedeutet vielleicht der Ort der Leute des Wæppa, oder ein sumpfiger Ort.", "Um 1220 wurde es erstmals erwähnt. Am Execution Dock in Wapping wurden Piraten gehängt, darunter 1701 Captain Kidd."], "Watford High Street": ["„Watford“ bedeutet wahrscheinlich die Furt der Jäger oder die nasse Furt.", "Die Furt führte durch den Fluss Colne. Der Bahnhof liegt gleich an der Hauptstraße der Stadt."], "Watford Junction": ["„Watford“ bedeutet wahrscheinlich die Furt der Jäger oder die nasse Furt.", "Die Furt führte durch den Fluss Colne. An diesem Knotenpunkt treffen Nebenstrecken auf die Hauptstrecke von London nach Norden."], "West Croydon": ["„Croydon“ bedeutet das Tal, in dem wilder Safran wächst.", "Der Name kommt von altenglisch croh, Safran, und denu, Tal. West Croydon ist der Endpunkt eines Zweigs der Windrush line."], "White Hart Lane": ["Benannt nach der White Hart Lane, einer Straße, die wohl im 17. Jahrhundert ihren Namen bekam.", "Der weiße Hirsch war das Abzeichen König Richards II. und ein beliebtes Wirtshausschild; die Straße ist vielleicht nach einem Gasthaus benannt. Das nahe Stadion von Tottenham Hotspur hieß lange White Hart Lane."], "Wood Street": ["Benannt nach der Wood Street in Walthamstow, auf dem Weg zum Epping Forest.", "Die Straße führte aus der Stadt hinaus zum Wald. Der Bahnhof wurde 1873 eröffnet."], "Woodgrange Park": ["Benannt nach Woodgrange, einem Hof, der einst der Abtei Stratford Langthorne gehörte.", "Eine „grange“ war ein Klosterhof. Die Häuser entstanden im späten 19. Jahrhundert auf dem Ackerland."]}};
const GAME = [{"id": "g01", "t": "guess", "s": "Arsenal", "g": [], "en": {"q": "This station was renamed in 1932 after a campaign by a football manager, Herbert Chapman.", "a": "Arsenal", "w": ["Highbury & Islington", "Finsbury Park", "White City"], "x": "It opened in 1906 as Gillespie Road, and the old name can still be seen in the tiles."}, "fr": {"q": "Cette station a été rebaptisée en 1932 après une campagne d'un entraîneur de football, Herbert Chapman.", "a": "Arsenal", "w": ["Highbury & Islington", "Finsbury Park", "White City"], "x": "Elle a ouvert en 1906 sous le nom de Gillespie Road, et l'ancien nom est encore visible sur le carrelage."}, "de": {"q": "Diese Station wurde 1932 nach einer Kampagne eines Fußballtrainers, Herbert Chapman, umbenannt.", "a": "Arsenal", "w": ["Highbury & Islington", "Finsbury Park", "White City"], "x": "Sie wurde 1906 als Gillespie Road eröffnet, und der alte Name ist auf den Fliesen noch zu sehen."}}, {"id": "g02", "t": "guess", "s": "Monument", "g": [], "en": {"q": "This station is named after a column 61 metres tall: exactly the distance from its base to Pudding Lane.", "a": "Monument", "w": ["Marble Arch", "Temple", "Bank"], "x": "The column, designed by Christopher Wren and Robert Hooke, recalls the Great Fire of London of 1666, which began in Pudding Lane."}, "fr": {"q": "Cette station doit son nom à une colonne de 61 mètres : exactement la distance entre sa base et Pudding Lane.", "a": "Monument", "w": ["Marble Arch", "Temple", "Bank"], "x": "La colonne, conçue par Christopher Wren et Robert Hooke, rappelle le grand incendie de Londres de 1666, parti de Pudding Lane."}, "de": {"q": "Diese Station ist nach einer 61 Meter hohen Säule benannt: genau die Entfernung von ihrem Fuß bis zur Pudding Lane.", "a": "Monument", "w": ["Marble Arch", "Temple", "Bank"], "x": "Die Säule von Christopher Wren und Robert Hooke erinnert an den Großen Brand von London 1666, der in der Pudding Lane ausbrach."}}, {"id": "g03", "t": "guess", "s": ": {"q": "Named after an arch designed by John Nash as an entrance to Buckingham Palace and moved here in 1851.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "It is built of white marble and was made in the 1820s."}, "fr": {"q": "Nommée d'après un arc dessiné par John Nash comme entrée du palais de Buckingham et déplacé ici en 1851.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "Il est en marbre blanc et date des années 1820."}, "de": {"q": "Benannt nach einem Bogen von John Nash, gebaut als Eingang zum Buckingham Palace und 1851 hierher versetzt.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "Er ist aus weißem Marmor und stammt aus den 1820er-Jahren."}}, {"id": "g17", "t": "guess", "s": "Ravenscourt Park", "g": [], "en": {"q": "A pun on a family name: in the 18th century the owner, Thomas Corbett, renamed his house after the birds on his coat of arms.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "A raven is 'corbeau' in French. The grounds became a public park."}, "fr": {"q": "Un jeu de mots sur un nom de famille : au XVIIIe siècle, le propriétaire, Thomas Corbett, donna à sa maison le nom des oiseaux de ses armoiries.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "« Raven » signifie corbeau. Le parc est devenu public."}, "de": {"q": "Ein Wortspiel mit einem Familiennamen: Im 18. Jahrhundert benannte der Besitzer Thomas Corbett sein Haus nach den Vögeln in seinem Wappen.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "„Raven“ heißt Rabe, auf Französisch „corbeau“. Das Gelände wurde zum öffentlichen Park."}}, {"id": "g18", "t": "guess", "s": "Leytonstone", "g": [], "en": {"q": "The film director Alfred Hitchcock was born here in 1899.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "The name means Leyton at the stone, probably an old Roman milestone or boundary stone."}, "fr": {"q": "Le cinéaste Alfred Hitchcock est né ici en 1899.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "Le nom signifie Leyton à la pierre, probablement une ancienne borne romaine ou une borne de limite."}, "de": {"q": "Der Regisseur Alfred Hitchcock wurde hier 1899 geboren.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "Der Name bedeutet Leyton am Stein, wahrscheinlich ein alter römischer Meilenstein oder Grenzstein."}}, {"id": "g19", "t": "guess", "s": "Mornington Crescent", "g": [], "en": {"q": "This station gave its name to a famous nonsense game on the BBC radio comedy I'm Sorry I Haven't a Clue.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "The crescent is named after the Earl of Mornington, elder brother of the Duke of Wellington."}, "fr": {"q": "Cette station a donné son nom à un célèbre jeu absurde de l'émission comique de la BBC I'm Sorry I Haven't a Clue.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "Le croissant de maisons porte le nom du comte de Mornington, frère aîné du duc de Wellington."}, "de": {"q": "Diese Station gab einem berühmten Nonsens-Spiel in der BBC-Radiokomödie I'm Sorry I Haven't a Clue den Namen.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "Der Halbmond aus Häusern ist nach dem Earl of Mornington benannt, dem älteren Bruder des Herzogs von Wellington."}}, {"id": "g20", "t": "guess", "s": "Southwark", "g": [], "en": {"q": "This name means the southern fort, built to defend the southern end of London Bridge.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "It was recorded in the early 10th century as Suthriganaweorc, the fort of the men of Surrey."}, "fr": {"q": "Ce nom signifie le fort du sud, construit pour défendre le bout sud du London Bridge.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "Le nom est noté au début du Xe siècle sous la forme Suthriganaweorc, le fort des hommes du Surrey."}, "de": {"q": "Dieser Name bedeutet die südliche Befestigung, die das Südende der London Bridge schützte.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "Im frühen 10. Jahrhundert wurde er Suthriganaweorc geschrieben, die Befestigung der Männer von Surrey."}}, {"id": "q01", "t": "quiz", "s": "Baker Street", "g": [], "en": {"q": "Which fictional detective lived at 221B Baker Street?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "Inspector Morse", "Father Brown"], "x": "The street itself is named after William Baker, who laid it out in the 18th century."}, "fr": {"q": "Quel détective de fiction habitait au 221B Baker Street ?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "L'inspecteur Morse", "Le père Brown"], "x": "La rue elle-même porte le nom de William Baker, qui l'a tracée au XVIIIe siècle."}, "de": {"q": "Welcher erfundene Detektiv wohnte in der Baker Street 221B?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "Inspector Morse", "Pater Brown"], "x": "Die Straße selbst ist nach William Baker benannt, der sie im 18. Jahrhundert anlegte."}}, {"id": "q02", "t": "quiz", "s": "Waterloo", "g": [], "en": {"q": "What was Waterloo Bridge originally going to be called?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "It was being built when Wellington beat Napoleon in 1815, and opened in 1817 as Waterloo Bridge."}, "fr": {"q": "Comment le pont de Waterloo devait-il s'appeler à l'origine ?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "Il était en construction quand Wellington battit Napoléon en 1815 et ouvrit en 1817 sous le nom de Waterloo Bridge."}, "de": {"q": "Wie sollte die Waterloo Bridge ursprünglich heißen?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "Sie war im Bau, als Wellington 1815 Napoleon besiegte, und wurde 1817 als Waterloo Bridge eröffnet."}}, {"id": "q03", "t": "quiz", "s": "Westminster", "g": [], "en": {"q": "What does the 'minster' in Westminster mean?", "a": "An abbey church", "w": ["A royal palace", "A market place", "A river crossing"], "x": "The abbey church lay west of the City of London and gave its name to the whole area."}, "fr": {"q": "Que signifie « minster » dans Westminster ?", "a": "Une église abbatiale", "w": ["Un palais royal", "Une place de marché", "Un passage de rivière"], "x": "L'église abbatiale se trouvait à l'ouest de la City de Londres et a donné son nom à tout le quartier."}, "de": {"q": "Was bedeutet „minster“ in Westminster?", "a": "Eine Abteikirche", "w": ["Ein Königspalast", "Ein Marktplatz", "Eine Flussüberquerung"], "x": "Die Abteikirche lag westlich der City of London und gab dem ganzen Viertel den Namen."}}, {"id": "q04", "t": "quiz", "s": "Knightsbridge", "g": [], "en": {"q": "In Old English, what did 'cniht', the first part of Knightsbridge, mean?", "a": "A young man or servant", "w": ["A knight in armour", "A king's messenger", "A bridge-keeper"], "x": "So Knightsbridge means the bridge of the young men. It crossed the River Westbourne."}, "fr": {"q": "En vieil anglais, que signifiait « cniht », la première partie de Knightsbridge ?", "a": "Un jeune homme ou un serviteur", "w": ["Un chevalier en armure", "Un messager du roi", "Un gardien de pont"], "x": "Knightsbridge signifie donc le pont des jeunes gens. Il franchissait la Westbourne."}, "de": {"q": "Was bedeutete altenglisch „cniht“, der erste Teil von Knightsbridge?", "a": "Junger Mann oder Diener", "w": ["Ritter in Rüstung", "Bote des Königs", "Brückenwärter"], "x": "Knightsbridge bedeutet also die Brücke der jungen Männer. Sie führte über den Westbourne."}}, {"id": "q05", "t": "quiz", "s": "Holland Park", "g": [], "en": {"q": "Where does the 'Holland' of Holland Park come from?", "a": "Holland in Lincolnshire", "w": ["The Netherlands", "A Dutch merchant", "A Dutch king of England"], "x": "Holland House was named after Henry Rich, Earl of Holland, whose title came from Lincolnshire."}, "fr": {"q": "D'où vient le « Holland » de Holland Park ?", "a": "De Holland, dans le Lincolnshire", "w": ["Des Pays-Bas", "D'un marchand hollandais", "D'un roi d'Angleterre hollandais"], "x": "Holland House doit son nom à Henry Rich, comte de Holland, dont le titre venait du Lincolnshire."}, "de": {"q": "Woher kommt das „Holland“ in Holland Park?", "a": "Von Holland in Lincolnshire", "w": ["Von den Niederlanden", "Von einem holländischen Kaufmann", "Von einem holländischen König Englands"], "x": "Holland House ist nach Henry Rich, Earl of Holland, benannt, dessen Titel aus Lincolnshire stammte."}}, {"id": "q06", "t": "quiz", "s": "Richmond", "g": [], "en": {"q": "Richmond is named after a town in which English county?", "a": "Yorkshire", "w": ["Surrey", "Kent", "Lincolnshire"], "x": "Henry VII had been Earl of Richmond in Yorkshire, and named his rebuilt palace at Sheen after his earldom."}, "fr": {"q": "Richmond porte le nom d'une ville de quel comté anglais ?", "a": "Le Yorkshire", "w": ["Le Surrey", "Le Kent", "Le Lincolnshire"], "x": "Henri VII avait été comte de Richmond, dans le Yorkshire, et donna le nom de son comté au palais de Sheen qu'il fit reconstruire."}, "de": {"q": "Richmond ist nach einer Stadt in welcher englischen Grafschaft benannt?", "a": "Yorkshire", "w": ["Surrey", "Kent", "Lincolnshire"], "x": "Heinrich VII. war Earl of Richmond in Yorkshire gewesen und benannte seinen neu gebauten Palast in Sheen nach seiner Grafschaft."}}, {"id": "q07", "t": "quiz", "s": "Sloane Square", "g": [], "en": {"q": "Sir Hans Sloane's huge collection became the start of which institution?", "a": "The British Museum", "w": ["The National Gallery", "The Tate", "The Royal Albert Hall"], "x": "Sloane, a physician and collector, bought the manor of Chelsea in 1712."}, "fr": {"q": "L'immense collection de Sir Hans Sloane fut à l'origine de quelle institution ?", "a": "Le British Museum", "w": ["La National Gallery", "La Tate", "Le Royal Albert Hall"], "x": "Sloane, médecin et collectionneur, acheta le domaine de Chelsea en 1712."}, "de": {"q": "Die riesige Sammlung von Sir Hans Sloane wurde zum Grundstock welcher Einrichtung?", "a": "Des British Museum", "w": ["Der National Gallery", "Der Tate", "Der Royal Albert Hall"], "x": "Sloane, Arzt und Sammler, kaufte 1712 das Gut Chelsea."}}, {"id": "q08", "t": "quiz", "s": "Bow Road", "g": [], "en": {"q": "What gave the village of Bow its name?", "a": "A bow-shaped bridge over the River Lea", "w": ["A famous archer", "An archery ground", "A ship called the Bow"], "x": "By tradition the arched bridge was built in the early 12th century at the wish of Queen Matilda."}, "fr": {"q": "Qu'est-ce qui a donné son nom au village de Bow ?", "a": "Un pont en arc sur la rivière Lea", "w": ["Un archer célèbre", "Un terrain de tir à l'arc", "Un navire appelé le Bow"], "x": "Selon la tradition, le pont voûté fut construit au début du XIIe siècle à la demande de la reine Mathilde."}, "de": {"q": "Was gab dem Dorf Bow seinen Namen?", "a": "Eine bogenförmige Brücke über den Lea", "w": ["Ein berühmter Bogenschütze", "Ein Bogenschießplatz", "Ein Schiff namens Bow"], "x": "Der Überlieferung nach wurde die gewölbte Brücke Anfang des 12. Jahrhunderts auf Wunsch von Königin Mathilde gebaut."}}, {"id": "q09", "t": "quiz", "s": "Hyde Park Corner", "g": [], "en": {"q": "Which king took over Hyde Park as a hunting ground in 1536?", "a": "Henry VIII", "w": ["Charles II", "William the Conqueror", "George IV"], "x": "Before that it was the manor of Hyde, owned by Westminster Abbey."}, "fr": {"q": "Quel roi s'empara de Hyde Park pour en faire un terrain de chasse en 1536 ?", "a": "Henri VIII", "w": ["Charles II", "Guillaume le Conquérant", "George IV"], "x": "Auparavant, c'était le domaine de Hyde, propriété de l'abbaye de Westminster."}, "de": {"q": "Welcher König übernahm 1536 den Hyde Park als Jagdgebiet?", "a": "Heinrich VIII.", "w": ["Karl II.", "Wilhelm der Eroberer", "Georg IV."], "x": "Vorher war es das Gut Hyde der Westminster Abbey."}}, {"id": "q10", "t": "quiz", "s": "Battersea Power Station", "g": [], "en": {"q": "What did 'Battersea' mean when it was first recorded in the 7th century?", "a": "Badric's island", "w": ["The battered sea", "The bath by the sea", "The battlefield"], "x": "The 'island' was dry ground in the marshes by the Thames."}, "fr": {"q": "Que signifiait « Battersea » quand le nom a été noté pour la première fois, au VIIe siècle ?", "a": "L'île de Badric", "w": ["La mer battue", "Le bain au bord de la mer", "Le champ de bataille"], "x": "L'« île » était une terre sèche dans les marais de la Tamise."}, "de": {"q": "Was bedeutete „Battersea“, als es im 7. Jahrhundert erstmals erwähnt wurde?", "a": "Badrics Insel", "w": ["Das gepeitschte Meer", "Das Bad am Meer", "Das Schlachtfeld"], "x": "Die „Insel“ war trockenes Land in den Sümpfen an der Themse."}}, {"id": "q11", "t": "quiz", "s": "Chiswick Park", "g": [], "en": {"q": "According to its Old English name, what did the farm at Chiswick make?", "a": "Cheese", "w": ["Bread", "Beer", "Candles"], "x": "'Chiswick' means the cheese farm, near the Thames."}, "fr": {"q": "D'après son nom en vieil anglais, que produisait la ferme de Chiswick ?", "a": "Du fromage", "w": ["Du pain", "De la bière", "Des chandelles"], "x": "« Chiswick » signifie la ferme du fromage, près de la Tamise."}, "de": {"q": "Was stellte der Hof in Chiswick laut seinem altenglischen Namen her?", "a": "Käse", "w": ["Brot", "Bier", "Kerzen"], "x": "„Chiswick“ bedeutet der Käsehof, nahe der Themse."}}, {"id": "q12", "t": "quiz", "s": "Kew Gardens", "g": [], "en": {"q": "What international status do the Royal Botanic Gardens at Kew have?", "a": "UNESCO World Heritage Site", "w": ["National park", "Olympic venue", "European Capital of Culture"], "x": "'Kew' was first recorded in 1327 as Cayho."}, "fr": {"q": "Quel statut international ont les jardins botaniques royaux de Kew ?", "a": "Patrimoine mondial de l'UNESCO", "w": ["Parc national", "Site olympique", "Capitale européenne de la culture"], "x": "« Kew » est noté pour la première fois en 1327, sous la forme Cayho."}, "de": {"q": "Welchen internationalen Status haben die Königlichen Botanischen Gärten in Kew?", "a": "UNESCO-Welterbe", "w": ["Nationalpark", "Olympia-Austragungsort", "Kulturhauptstadt Europas"], "x": "„Kew“ wurde 1327 erstmals als Cayho erwähnt."}}, {"id": "q13", "t": "quiz", "s": "St Paul's", "g": [], "en": {"q": "What was St Paul's station called when it opened in 1900?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "It was named after the head office of the Post Office nearby, and renamed in 1937."}, "fr": {"q": "Comment s'appelait la station St Paul's à son ouverture en 1900 ?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "Elle devait son nom au siège des Postes tout proche et a été rebaptisée en 1937."}, "de": {"q": "Wie hieß die Station St Paul's bei ihrer Eröffnung 1900?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "Sie war nach dem nahen Hauptpostamt benannt und wurde 1937 umbenannt."}}, {"id": "q14", "t": "quiz", "s": "Euston", "g": [], "en": {"q": "Euston takes its name from a country house in which county?", "a": "Suffolk", "w": ["Norfolk", "Essex", "Kent"], "x": "Euston Hall was the home of the Dukes of Grafton, who owned the land."}, "fr": {"q": "Euston tient son nom d'une demeure de campagne de quel comté ?", "a": "Le Suffolk", "w": ["Le Norfolk", "L'Essex", "Le Kent"], "x": "Euston Hall était la demeure des ducs de Grafton, propriétaires des terres."}, "de": {"q": "Euston hat seinen Namen von einem Landsitz in welcher Grafschaft?", "a": "Suffolk", "w": ["Norfolk", "Essex", "Kent"], "x": "Euston Hall war der Sitz der Herzöge von Grafton, denen das Land gehörte."}}, {"id": "q15", "t": "quiz", "s": "Stratford", "g": [], "en": {"q": "Which English word comes from Old English stræt, a paved Roman road, as in Stratford?", "a": "Street", "w": ["Straight", "Strait", "Stream"], "x": "Stratford means the ford on the Roman road, where it crossed the River Lea."}, "fr": {"q": "Quel mot anglais vient du vieil anglais stræt, une route romaine pavée, comme dans Stratford ?", "a": "Street (rue)", "w": ["Straight (droit)", "Strait (détroit)", "Stream (ruisseau)"], "x": "Stratford signifie le gué sur la voie romaine, là où elle franchissait la Lea."}, "de": {"q": "Welches englische Wort kommt von altenglisch stræt, einer gepflasterten Römerstraße, wie in Stratford?", "a": "Street (Straße)", "w": ["Straight (gerade)", "Strait (Meerenge)", "Stream (Bach)"], "x": "Stratford bedeutet die Furt an der Römerstraße, wo sie den Lea querte."}}, {"id": "q16", "t": "quiz", "s": "Wimbledon", "g": [], "en": {"q": "Since which year has Wimbledon been home to its famous tennis tournament?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "It is the world's oldest tennis tournament."}, "fr": {"q": "Depuis quelle année Wimbledon accueille-t-il son célèbre tournoi de tennis ?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "C'est le plus ancien tournoi de tennis du monde."}, "de": {"q": "Seit welchem Jahr findet in Wimbledon das berühmte Tennisturnier statt?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "Es ist das älteste Tennisturnier der Welt."}}, {"id": "q17", "t": "quiz", "s": "Hainault", "g": [], "en": {"q": "The French-looking spelling of Hainault comes from a mistaken link with whom?", "a": "Philippa of Hainault, wife of Edward III", "w": ["Eleanor of Castile, wife of Edward I", "Anne of Cleves, wife of Henry VIII", "Catherine of Aragon, wife of Henry VIII"], "x": "The name was recorded in 1221 as Henehout, a wood belonging to a religious community."}, "fr": {"q": "L'orthographe à la française de Hainault vient d'un rapprochement erroné avec qui ?", "a": "Philippa de Hainaut, épouse d'Édouard III", "w": ["Éléonore de Castille, épouse d'Édouard Ier", "Anne de Clèves, épouse d'Henri VIII", "Catherine d'Aragon, épouse d'Henri VIII"], "x": "Le nom est noté en 1221 sous la forme Henehout, le bois d'une communauté religieuse."}, "de": {"q": "Die französisch wirkende Schreibweise von Hainault kommt von einer irrigen Verbindung mit wem?", "a": "Philippa von Hennegau, Frau Eduards III.", "w": ["Eleonore von Kastilien, Frau Eduards I.", "Anna von Kleve, Frau Heinrichs VIII.", "Katharina von Aragón, Frau Heinrichs VIII."], "x": "1221 wurde der Name Henehout geschrieben, der Wald einer geistlichen Gemeinschaft."}}, {"id": "q18", "t": "quiz", "s": "Charing Cross", "g": [], "en": {"q": "Edward I put up a cross at Charing in memory of whom?", "a": "His wife Eleanor", "w": ["His mother", "His daughter", "Queen Matilda"], "x": "Eleanor died in 1290. A Victorian copy of the cross stands in front of the main line station."}, "fr": {"q": "Édouard Ier fit ériger une croix à Charing en mémoire de qui ?", "a": "De son épouse Éléonore", "w": ["De sa mère", "De sa fille", "De la reine Mathilde"], "x": "Éléonore mourut en 1290. Une copie victorienne de la croix se dresse devant la gare."}, "de": {"q": "Zum Gedenken an wen ließ Eduard I. in Charing ein Kreuz errichten?", "a": "An seine Frau Eleonore", "w": ["An seine Mutter", "An seine Tochter", "An Königin Mathilde"], "x": "Eleonore starb 1290. Eine viktorianische Nachbildung des Kreuzes steht vor dem Fernbahnhof."}}, {"id": "q19", "t": "quiz", "s": "Mile End", "g": [], "en": {"q": "Mile End lies one mile from which old gate of the City of London?", "a": "Aldgate", "w": ["Moorgate", "Bishopsgate", "Ludgate"], "x": "The name, used since the 13th century, marked the end of the first mile of the road to Essex."}, "fr": {"q": "Mile End se trouve à un mille de quelle ancienne porte de la City de Londres ?", "a": "Aldgate", "w": ["Moorgate", "Bishopsgate", "Ludgate"], "x": "Le nom, en usage depuis le XIIIe siècle, marquait la fin du premier mille de la route de l'Essex."}, "de": {"q": "Mile End liegt eine Meile von welchem alten Tor der City of London entfernt?", "a": "Aldgate", "w": ["Moorgate", "Bishopsgate", "Ludgate"], "x": "Der seit dem 13. Jahrhundert gebräuchliche Name markierte das Ende der ersten Meile der Straße nach Essex."}}, {"id": "q20", "t": "quiz", "s": "Temple", "g": [], "en": {"q": "Which medieval order gave the Temple its name?", "a": "The Knights Templar", "w": ["The Knights of St John", "The Dominican friars", "The Benedictine monks"], "x": "The knights built the round Temple Church in the 12th century; later, lawyers moved in."}, "fr": {"q": "Quel ordre médiéval a donné son nom au Temple ?", "a": "Les chevaliers du Temple", "w": ["Les chevaliers de Saint-Jean", "Les dominicains", "Les bénédictins"], "x": "Les Templiers construisirent l'église ronde du Temple au XIIe siècle ; plus tard, les juristes s'y installèrent."}, "de": {"q": "Welcher mittelalterliche Orden gab dem Temple seinen Namen?", "a": "Die Tempelritter", "w": ["Die Johanniter", "Die Dominikaner", "Die Benediktiner"], "x": "Die Ritter bauten im 12. Jahrhundert die runde Temple Church; später zogen Juristen ein."}}, {"id": "q21", "t": "quiz", "s": "Embankment", "g": [], "en": {"q": "Who built the Victoria Embankment along the Thames in the 1860s?", "a": "Joseph Bazalgette", "w": ["Christopher Wren", "John Nash", "Isambard Kingdom Brunel"], "x": "It carried new sewers and the District Railway, and created a riverside road."}, "fr": {"q": "Qui a construit le Victoria Embankment le long de la Tamise dans les années 1860 ?", "a": "Joseph Bazalgette", "w": ["Christopher Wren", "John Nash", "Isambard Kingdom Brunel"], "x": "Il accueillait de nouveaux égouts et le District Railway, et créait une route au bord du fleuve."}, "de": {"q": "Wer baute in den 1860er-Jahren das Victoria Embankment an der Themse?", "a": "Joseph Bazalgette", "w": ["Christopher Wren", "John Nash", "Isambard Kingdom Brunel"], "x": "Es nahm neue Abwasserkanäle und die District Railway auf und schuf eine Uferstraße."}}, {"id": "q22", "t": "quiz", "s": "Royal Oak", "g": [], "en": {"q": "Who hid in the oak tree at Boscobel in 1651, giving many pubs the name Royal Oak?", "a": "The future Charles II", "w": ["Henry VIII", "Oliver Cromwell", "Robin Hood"], "x": "He was hiding from Parliament's soldiers. A pub called the Royal Oak gave the station its name."}, "fr": {"q": "Qui se cacha dans le chêne de Boscobel en 1651, donnant à de nombreux pubs le nom de Royal Oak ?", "a": "Le futur Charles II", "w": ["Henri VIII", "Oliver Cromwell", "Robin des Bois"], "x": "Il se cachait des soldats du Parlement. Un pub appelé le Royal Oak a donné son nom à la station."}, "de": {"q": "Wer versteckte sich 1651 in der Eiche bei Boscobel, nach der viele Pubs Royal Oak heißen?", "a": "Der spätere Karl II.", "w": ["Heinrich VIII.", "Oliver Cromwell", "Robin Hood"], "x": "Er versteckte sich vor den Soldaten des Parlaments. Ein Pub namens Royal Oak gab der Station den Namen."}}, {"id": "q23", "t": "quiz", "s": "Colliers Wood", "g": [], "en": {"q": "In the past, what was a 'collier', as in Colliers Wood?", "a": "Someone who made charcoal", "w": ["A coal miner", "A ship's captain", "A seller of collars"], "x": "The wood used by the charcoal burners survived into the late 19th century."}, "fr": {"q": "Autrefois, qu'était un « collier », comme dans Colliers Wood ?", "a": "Quelqu'un qui fabriquait du charbon de bois", "w": ["Un mineur de charbon", "Un capitaine de navire", "Un vendeur de cols"], "x": "Le bois exploité par les charbonniers a subsisté jusqu'à la fin du XIXe siècle."}, "de": {"q": "Was war früher ein „collier“, wie in Colliers Wood?", "a": "Jemand, der Holzkohle herstellte", "w": ["Ein Bergmann", "Ein Schiffskapitän", "Ein Kragenhändler"], "x": "Der Wald der Köhler bestand bis ins späte 19. Jahrhundert."}}, {"id": "q24", "t": "quiz", "s": "Wembley Park", "g":   <p>Stop Stories is a small private, non-commercial project. It began as an app for the bus and tram stops of Luxembourg City; this is its London edition. It is <b>not</b> an official app of Transport for London (TfL), and it is not connected with TfL or any railway operator.</p>

  <h3>Sources</h3>
  <p>The stories are built on facts from these public sources. Under "Read more", every station links to the pages that were used for it.</p>
  <ul class="about-list">
    <li><b>Wikipedia</b>: the articles on each station and on the place, person or building it is named after. <a href="https://en.wikipedia.org/wiki/List_of_London_Underground_stations" target="_blank" rel="noopener">List of London Underground stations</a> for opening years and former names.</li>
    <li><b>Londonist</b>: the series "How the … line stations got their names" (one article per Underground line and one for the Elizabeth line). It was the main starting point for the Underground and Elizabeth line stories. <a href="https://londonist.com/london/transport/how-the-central-line-stations-got-their-names" target="_blank" rel="noopener">Example: the Central line</a>.</li>
    <li><b>Royal Docks</b>: <a href="https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names" target="_blank" rel="noopener">How the Royal Docks' 12 DLR stations got their names</a>.</li>
    <li><b>A. D. Mills, <i>A Dictionary of London Place Names</i></b> (Oxford University Press): the standard reference for the meaning of London place names, used through the summaries in Wikipedia and Claude's general knowledge.</li>
    <li><b>For the fact-check</b>, in addition: <a href="https://www.hidden-london.com" target="_blank" rel="noopener">Hidden London</a>, <a href="https://www.british-history.ac.uk" target="_blank" rel="noopener">British History Online</a>, the Enfield Society, the Hornsey Historical Society, the Parish of Hornchurch and the Online Etymology Dictionary.</li>
    <li><b>Lines, stations and their locations</b>: <a href="https://tfl.gov.uk/info-for/open-data-users/" target="_blank" rel="noopener">TfL Open Data</a> (Unified API). Powered by TfL Open Data. Contains OS data © Crown copyright and database rights 2016 and Geomni UK Map data © and database rights 2019.</li>
  </ul>

  <h3>How the sources were used</h3>
  <p>Facts were taken from these sources and written up in new, short texts of our own. No text, image or map has been copied from them. Explaining London's station names is not a new idea: Londonist's series and books such as Cyril M. Harris's <i>What's in a Name?</i> did it long before us, and we gladly point readers to them. What Stop Stories adds is the format: one short story per station, in the order of the line, in three languages, to read on the move.</p>
  <p>The names of the lines and the line colours are used only to show which line is which; they belong to TfL. "Underground", "Overground", "Elizabeth line" and "DLR" are TfL names. The app uses no TfL logo. The fonts (Atkinson Hyperlegible, Big Shoulders, IBM Plex Mono) are free fonts under the SIL Open Font License, served by Google Fonts. The icons and flags were drawn for this app.</p>

  <h3>Found a mistake?</h3>
  <p>Use "Help us improve" on any station, or write to <a data-mail></a>. Corrections and missing sources are very welcome. Thank you!</p>`,
fr: `

  <p>Tous les textes ont ensuite été vérifiés par d'autres agents Claude, qui ne les avaient pas écrits. Ils ont comparé chaque affirmation avec les sources citées ci-dessous ; les erreurs ont été corrigées et les points incertains signalés comme tels. L'idée, les choix et la relecture finale sont humains. Anthropic ne participe pas à ce projet et n'en est pas responsable.</p>
  <p>L'IA peut se tromper, les humains aussi. Si quelque chose vous semble faux, dites-le-nous (voir plus bas).</p>

  <h3>Qui est derrière</h3>
  <p>Stop Stories est un petit projet privé et non commercial. Il a commencé par une application pour les arrêts de bus et de tram de la ville de Luxembourg ; voici son édition londonienne. Ce n'est <b>pas</b> une application officielle de Transport for London (TfL), et il n'a aucun lien avec TfL ni avec un exploitant ferroviaire.</p>

  <h3>Sources</h3>
  <p>Les histoires reposent sur des faits tirés de ces sources publiques. Sous « En savoir plus », chaque station renvoie aux pages utilisées pour elle.</p>
  <ul class="about-list">

    <li><b>A. D. Mills, <i>A Dictionary of London Place Names</i></b> (Oxford University Press) : l'ouvrage de référence sur le sens des noms de lieux londoniens, utilisé à travers les résumés de Wikipédia et les connaissances générales de Claude.</li>
    <li><b>Pour la vérification</b>, en plus : <a href="https://www.hidden-london.com" target="_blank" rel="noopener">Hidden London</a>, <a href="https://www.british-history.ac.uk" target="_blank" rel="noopener">British History Online</a>, l'Enfield Society, la Hornsey Historical Society, la paroisse de Hornchurch et l'Online Etymology Dictionary.</li>

  <h3>Comment les sources ont été utilisées</h3>
  <p>Les faits ont été tirés de ces sources et rédigés dans de nouveaux textes courts, avec nos propres mots. Aucun texte, aucune image et aucune carte n'en a été copié. Expliquer les noms des stations de Londres n'est pas une idée nouvelle : la série de Londonist et des livres comme <i>What's in a Name?</i> de Cyril M. Harris l'ont fait bien avant nous, et nous y renvoyons volontiers. Ce que Stop Stories apporte, c'est la forme : une courte histoire par station, dans l'ordre de la ligne, en trois langues, à lire en route.</p>
  <p>Les noms des lignes et leurs couleurs servent uniquement à les distinguer ; ils appartiennent à TfL. « Underground », « Overground », « Elizabeth line » et « DLR » sont des noms de TfL. L'application n'utilise aucun logo de TfL. Les polices (Atkinson Hyperlegible, Big Shoulders, IBM Plex Mono) sont des polices libres sous licence SIL Open Font License, fournies par Google Fonts. Les icônes et les drapeaux ont été dessinés pour cette application.</p>

de: `
  <h2>Über Stop Stories</h2>

  <h3>Mit KI erstellt: Claude von Anthropic</h3>
  <p>Diese App wurde mit künstlicher Intelligenz erstellt. <b>Claude</b>, ein KI-Modell von <a href="https://www.anthropic.com" target="_blank" rel="noopener">Anthropic</a>, hat den größten Teil der Arbeit gemacht:</p>
