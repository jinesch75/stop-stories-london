ransport/how-the-central-line-stations-got-their-names"}], "ll": [[51.51758, -0.120475]]}, "Holland Park": {"name": "Holland Park", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Holland House, a 17th-century mansion whose grounds became the park.", "text": "The house took its name from Henry Rich, Earl of Holland, whose title came from Holland in Lincolnshire, not the Netherlands. Later the Fox family, Barons Holland, lived there.", "links": [{"t": "Holland House", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_House"}, {"t": "Holland Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_Park"}, {"t": "Holland Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_Park_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.507143, -0.205679]]}, "Holloway Road": {"name": "Holloway Road", "q": "Islington", "zone": "2", "head": "'Holloway' probably means the hollow way, a road worn deep into the ground.", "text": "Cattle on their way to London's markets wore the road down over centuries. Some think it was a 'hallowed way' for pilgrims instead.", "links": [{"t": "Holloway, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holloway,_London"}, {"t": "Holloway Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holloway_Road_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.552697, -0.113244]]}, "Homerton": {"name": "Homerton", "q": "Hackney", "zone": "2", "head": "'Homerton' means the farm of a woman called Hūnburh.", "text": "It was recorded in 1343 as Hummerton. It is one of the few London names that recall a woman.", "links": [{"t": "Homerton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Homerton"}, {"t": "Homerton railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Homerton_railway_station"}], "ll": [[51.547012, -0.04236]]}, "Honor Oak Park": {"name": "Honor Oak Park", "q": "Lewisham", "zone": "3", "head": "Named after the Oak of Honor on One Tree Hill.", "text": "Queen Elizabeth I is said to have rested under an oak on the hill on May Day 1602. An oak still stands there today.", "links": [{"t": "Honor Oak", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Honor_Oak"}, {"t": "Honor Oak Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Honor_Oak_Park_railway_station"}], "ll": [[51.449989, -0.045505]]}, "Hornchurch": {"name": "Hornchurch", "q": "Havering", "zone": "6", "head": "'Hornchurch' means the church with horns.", "text": "It was recorded in 1222. Nobody knows exactly why, but St Andrew's Church still has a bull's head with copper horns on its east end.", "links": [{"t": "Hornchurch", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hornchurch"}, {"t": "Hornchurch tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hornchurch_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.554093, 0.219116]]}, "Hounslow Central": {"name": "Hounslow Central", "q": "Hounslow", "zone": "4", "head": "'Hounslow' probably means the mound of the hound.", "text": "The 'hound' may be a dog or a man nicknamed Hund, and the mound probably a burial mound. The station opened in 1886 as Heston Hounslow and was renamed in 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_Central_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.471295, -0.366578]]}, "Hounslow East": {"name": "Hounslow East", "q": "Hounslow", "zone": "4", "head": "'Hounslow' probably means the mound of the hound.", "text": "It ends in Old English hlāw, a mound or burial mound. The station was called Hounslow Town until 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_East_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.473213, -0.356474]]}, "Hounslow West": {"name": "Hounslow West", "q": "Hounslow", "zone": "5", "head": "'Hounslow' probably means the mound of the hound.", "text": "The station opened in 1884 as Hounslow Barracks, after the army barracks nearby, and was renamed Hounslow West in 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow West tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_West_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.473469, -0.386544]]}, "Hoxton": {"name": "Hoxton", "q": "Hackney", "zone": "1/2", "head": "'Hoxton' means the farm of a man called Hōc.", "text": "It is in the Domesday Book of 1086 as Hochestone. In Shakespeare's time it was just outside the City, with fields and early theatres nearby.", "links": [{"t": "Hoxton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hoxton"}, {"t": "Hoxton railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hoxton_railway_station"}], "ll": [[51.531512, -0.075681]]}, "Hyde Park Corner": {"name": "Hyde Park Corner", "q": "Westminster", "zone": "1", "head": "Named after the corner of Hyde Park.", "text": "The park was once the manor of Hyde, owned by Westminster Abbey; 'hide' was an old measure of land. Henry VIII took it over in 1536 as a hunting ground.", "links": [{"t": "Hyde Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hyde_Park,_London"}, {"t": "Hyde Park Corner tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hyde_Park_Corner_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.503035, -0.152441]]}, "Ickenham": {"name": "Ickenham", "q": "Hillingdon", "zone": "6", "head": "'Ickenham' means the homestead of a man called Ticca.", "text": "The Domesday Book of 1086 records it as Ticheham; over time the T was lost. The village pump of 1866 still stands on the green.", "links": [{"t": "Ickenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ickenham"}, {"t": "Ickenham tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ickenham_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.56177, -0.442225]]}, "Ilford": {"name": "Ilford", "q": "Redbridge", "zone": "4", "head": "'Ilford' means the ford over the Hyle.", "text": "The Hyle, meaning 'the trickling stream', was the old name of the lower River Roding. Drop the H, and you have Ilford.", "links": [{"t": "Ilford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ilford"}, {"t": "Ilford railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ilford_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.559118, 0.06968]]}, "Imperial Wharf": {"name": "Imperial Wharf", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after a wharf of the Imperial Gas Works at Sands End, Fulham.", "text": "The Imperial Gas Light and Coke Company built a large gasworks by the river. The station opened in 2009.", "links": [{"t": "Imperial Wharf", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Imperial_Wharf"}, {"t": "Imperial Wharf railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Imperial_Wharf_railway_station"}], "ll": [[51.474949, -0.182823]]}, "Island Gardens": {"name": "Island Gardens", "q": "Tower Hamlets", "zone": "2", "head": "Named after a small riverside park at the southern tip of the Isle of Dogs.", "text": "The park opened in 1895 and has a famous view across the Thames to Wren's Old Royal Naval College in Greenwich. A foot tunnel under the river, opened in 1902, starts here.", "links": [{"t": "Island Gardens", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Island_Gardens"}, {"t": "Greenwich foot tunnel", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenwich_foot_tunnel"}, {"t": "Island Gardens DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Island_Gardens_DLR_station"}], "ll": [[51.487811, -0.010139]]}, "Iver": {"name": "Iver", "q": "Buckinghamshire", "zone": "", "head": "'Iver' means the brow of a hill.", "text": "It comes from Old English yfer, the edge or brow of a slope. With four letters, it is one of the shortest station names in the London area.", "links": [{"t": "Iver", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Iver"}, {"t": "Iver railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Iver_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.508503, -0.506726]]}, "Kennington": {"name": "Kennington", "q": "Southwark", "zone": "1/2", "head": "'Kennington' probably means the farm of a man called Cena.", "text": "It is recorded in the Domesday Book of 1086 as Chenintune. Kennington Park was once a common where large public meetings were held.", "links": [{"t": "Kennington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kennington"}, {"t": "Kennington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kennington_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.488337, -0.105963]]}, "Kensal Green": {"name": "Kensal Green", "q": "Brent", "zone": "2", "head": "'Kensal' means the king's wood.", "text": "It was first recorded in the 13th century as Kingisholte. Nobody knows which king. The green lay where Kensal Green Cemetery, opened in 1833, is now.", "links": [{"t": "Kensal Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Green"}, {"t": "Kensal Green station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Green_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.530539, -0.225016]]}, "Kensal Rise": {"name": "Kensal Rise", "q": "Brent", "zone": "2", "head": "'Kensal' means the king's wood; a 'rise' is a slope.", "text": "It was first recorded in the 13th century as Kingisholte; nobody knows which king. The American writer Mark Twain opened Kensal Rise Library in 1900.", "links": [{"t": "Kensal Rise", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Rise"}, {"t": "Kensal Rise railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Rise_railway_station"}], "ll": [[51.534554, -0.219957]]}, "Kensington (Olympia)": {"name": "Kensington (Olympia)", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Olympia, an exhibition hall opened in 1886.", "text": "The hall was probably named after Olympia in ancient Greece, home of the Olympic Games. Kensington means the farm of a Saxon called Cynesige. The station was called Kensington (Addison Road) until 1946.", "links": [{"t": "Olympia London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Olympia_London"}, {"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "Kensington (Olympia) station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington_(Olympia)_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.497624, -0.210015]]}, "Kentish Town": {"name": "Kentish Town", "q": "Camden", "zone": "2", "head": "Despite the name, Kentish Town has nothing to do with Kent, as far as anyone knows.", "text": "The name was recorded in 1208 as Kentisston. It may come from a family called Kentish, or from words describing the bed of a stream, the now-hidden River Fleet.", "links": [{"t": "Kentish Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town"}, {"t": "Kentish Town station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.550312, -0.140733]]}, "Kentish Town West": {"name": "Kentish Town West", "q": "Camden", "zone": "2", "head": "Despite the name, Kentish Town has nothing to do with Kent, as far as anyone knows.", "text": "It was recorded in 1208 as Kentisston. It may come from a family called Kentish, or from words for the bed of a stream, the now-hidden River Fleet.", "links": [{"t": "Kentish Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town"}, {"t": "Kentish Town West railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town_West_railway_station"}], "ll": [[51.546548, -0.146655]]}, "Kenton": {"name": "Kenton", "q": "Brent", "zone": "4", "head": "'Kenton' probably means the farm of a man called Coena.", "text": "It ends in Old English tūn, a farm or settlement. Bakerloo trains have called here since 1917.", "links": [{"t": "Kenton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton,_London"}, {"t": "Kenton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.581756, -0.31691]]}, "Kew Gardens": {"name": "Kew Gardens", "q": "Richmond", "zone": "3/4", "head": "Named after the Royal Botanic Gardens at Kew.", "text": "'Kew' was first recorded in 1327 as Cayho and probably means the spur of land by a landing place on the Thames. The gardens are a UNESCO World Heritage Site.", "links": [{"t": "Kew Gardens", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew_Gardens"}, {"t": "Kew", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew"}, {"t": "Kew Gardens station (London)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew_Gardens_station_(London)"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.477058, -0.285241]]}, "Kilburn": {"name": "Kilburn", "q": "Brent", "zone": "2", "head": "'Kilburn' probably means the cows' stream, or the royal stream.", "text": "The stream is the River Westbourne, now underground. It was first recorded in 1134 as Cuneburna. A priory stood where the Roman road crossed the stream.", "links": [{"t": "Kilburn, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn,_London"}, {"t": "Kilburn tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.547183, -0.204248]]}, "Kilburn High Road": {"name": "Kilburn High Road", "q": "Camden", "zone": "2", "head": "'Kilburn' probably means the cows' stream, or the royal stream.", "text": "The stream is the River Westbourne, now underground. Kilburn High Road follows the old Roman road, Watling Street.", "links": [{"t": "Kilburn, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn,_London"}, {"t": "Kilburn High Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn_High_Road_railway_station"}], "ll": [[51.537277, -0.192237]]}, "Kilburn Park": {"name": "Kilburn Park", "q": "Brent", "zone": "2", "head": "'Kilburn' probably means the cows' stream, or the royal stream.", "text": "The stream is the River Westbourne, now underground. 'Park' was added for the new housing estate. The station opened in 1915.", "links": [{"t": "Kilburn, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn,_London"}, {"t": "Kilburn Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn_Park_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.534979, -0.194232]]}, "King George V": {"name": "King George V", "q": "Newham", "zone": "3", "head": "Named after King George V Dock, the last of the three Royal Docks.", "text": "It opened in 1921 and was named after the king of the time. The great ocean liners of the day used it.", "links": [{"t": "King George V Dock", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King_George_V_Dock"}, {"t": "King George V DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King_George_V_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.502003, 0.062624]]}, "King's Cross St Pancras": {"name": "King's Cross St Pancras", "q": "Camden", "zone": "1", "head": "Named after a statue of King George IV, and the church of St Pancras.", "text": "The area was once called Battle Bridge, after a crossing of the River Fleet. A monument to George IV stood here from about 1830 to 1845; it was unpopular and soon removed. St Pancras was a boy martyred in Rome, by tradition in 304.", "links": [{"t": "King's Cross, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King's_Cross,_London"}, {"t": "St Pancras Old Church", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Pancras_Old_Church"}, {"t": "King's Cross St Pancras tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King's_Cross_St_Pancras_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.530663, -0.123194]]}, "Kingsbury": {"name": "Kingsbury", "q": "Brent", "zone": "4", "head": "'Kingsbury' means the king's manor.", "text": "Nobody knows which king: by the time of the Domesday Book in 1086, the land was already in private hands. The station opened in 1932.", "links": [{"t": "Kingsbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kingsbury,_London"}, {"t": "Kingsbury tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kingsbury_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.584845, -0.27879]]}, "Knightsbridge": {"name": "Knightsbridge", "q": "Kensington and Chelsea", "zone": "1", "head": "'Knightsbridge' means the bridge of the young men.", "text": "Old English cniht meant a young man or servant, not yet a knight in armour. The bridge crossed the River Westbourne. The name was first recorded in about 1050.", "links": [{"t": "Knightsbridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Knightsbridge"}, {"t": "Knightsbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Knightsbridge_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.501669, -0.160508]]}, "Ladbroke Grove": {"name": "Ladbroke Grove", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after James Weller Ladbroke, who developed the area in the mid-19th century.", "text": "He inherited the land from his uncle around 1821, and the main road was named after him. The station opened in 1864 as Notting Hill.", "links": [{"t": "Ladbroke Grove", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ladbroke_Grove"}, {"t": "Ladbroke Grove tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ladbroke_Grove_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.517449, -0.210391]]}, "Lambeth North": {"name": "Lambeth North", "q": "Lambeth", "zone": "1", "head": "'Lambeth' means the landing place for lambs.", "text": "It was recorded in 1062 as Lambehitha: hithe is an old word for a landing place on a river, as in Rotherhithe. The station opened in 1906 and was renamed Lambeth North in 1917.", "links": [{"t": "Lambeth", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lambeth"}, {"t": "Lambeth North tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lambeth_North_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.498808, -0.112315]]}, "Lancaster Gate": {"name": "Lancaster Gate", "q": "Westminster", "zone": "1", "head": "Named after the Lancaster Gate entrance to Kensington Gardens.", "text": "It was named in honour of Queen Victoria, who was also Duke of Lancaster. The city of Lancaster itself takes its name from a Roman fort, a 'caster', on the River Lune.", "links": [{"t": "Lancaster Gate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lancaster_Gate"}, {"t": "Lancaster Gate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lancaster_Gate_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.511723, -0.175494]]}, "Langdon Park": {"name": "Langdon Park", "q": "Tower Hamlets", "zone": "2", "head": "Named after Langdon Park, the small park next to the station.", "text": "While it was being built, the station was going to be called Carmen Street, after a road nearby.", "links": [{"t": "Langdon Park DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Langdon_Park_DLR_station"}], "ll": [[51.515172, -0.01415]]}, "Langley": {"name": "Langley", "q": "Berkshire", "zone": "", "head": "'Langley' means the long clearing.", "text": "It comes from Old English lang, long, and lēah, a clearing in a wood. The old village is sometimes called Langley Marish, after Christiana de Marecis, who held the manor in the 13th century.", "links": [{"t": "Langley, Berkshire", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Langley,_Berkshire"}, {"t": "Langley railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Langley_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.508062, -0.541756]]}, "Latimer Road": {"name": "Latimer Road", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Edward Latymer, a London lawyer who died in 1627.", "text": "He left land here in his will to help poor people of Hammersmith, and his money also founded Latymer School. The road ran through his property. The station opened in 1868.", "links": [{"t": "Edward Latymer", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edward_Latymer"}, {"t": "Latimer Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Latimer_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.513389, -0.217799]]}, "Leicester Square": {"name": "Leicester Square", "q": "Westminster", "zone": "1", "head": "Named after the Earl of Leicester, who built Leicester House here.", "text": "The square was laid out in front of his house in the 1670s. The city of Leicester is named after the Ligore, the people of the River Soar, and 'ceaster', a Roman town.", "links": [{"t": "Leicester Square", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leicester_Square"}, {"t": "Leicester Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leicester_Square_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.511386, -0.128426]]}, "Lewisham": {"name": "Lewisham", "q": "Lewisham", "zone": "2/3", "head": "'Lewisham' probably means the homestead of a man called Lēofsa.", "text": "The name ends in Old English hām, homestead. The River Ravensbourne and its tributary the Quaggy meet near the station.", "links": [{"t": "Lewisham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lewisham"}, {"t": "Lewisham DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lewisham_DLR_station"}], "ll": [[51.464665, -0.012874]]}, "Leyton": {"name": "Leyton", "q": "Waltham Forest", "zone": "3", "head": "'Leyton' means the farm on the River Lea.", "text": "The Lea, or Lee, runs along the edge of the area. The station first opened in 1856 as Low Leyton and joined the Central line in 1947.", "links": [{"t": "Leyton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton"}, {"t": "Leyton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.556589, -0.005523]]}, "Leyton Midland Road": {"name": "Leyton Midland Road", "q": "Waltham Forest", "zone": "3", "head": "Named after Leyton, the farm on the River Lea, and Midland Road.", "text": "The line, part-owned by the Midland Railway, opened here in 1894. The station takes its name from the road beside it.", "links": [{"t": "Leyton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton"}, {"t": "Leyton Midland Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton_Midland_Road_railway_station"}], "ll": [[51.569725, -0.008051]]}, "Leytonstone": {"name": "Leytonstone", "q": "Waltham Forest", "zone": "3/4", "head": "'Leytonstone' means Leyton at the stone.", "text": "Leyton is the farm on the River Lea. The stone was probably an old Roman milestone or boundary stone near Hollybush Hill. Film director Alfred Hitchcock was born here in 1899.", "links": [{"t": "Leytonstone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone"}, {"t": "Leytonstone tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.568324, 0.008194]]}, "Leytonstone High Road": {"name": "Leytonstone High Road", "q": "Waltham Forest", "zone": "3", "head": "'Leytonstone' means Leyton at the stone.", "text": "Leyton is the farm on the River Lea; the stone was probably a Roman milestone or a boundary stone. The film director Alfred Hitchcock was born here in 1899.", "links": [{"t": "Leytonstone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone"}, {"t": "Leytonstone High Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone_High_Road_railway_station"}], "ll": [[51.563554, 0.008416]]}, "Limehouse": {"name": "Limehouse", "q": "Tower Hamlets", "zone": "2", "head": "'Limehouse' means the lime kilns.", "text": "In the 14th century the name was 'lymhostes', the oasts or kilns where chalk was burnt to make lime for building. Later Limehouse was a busy port district.", "links": [{"t": "Limehouse", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Limehouse"}, {"t": "Limehouse DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Limehouse_DLR_station"}], "ll": [[51.512393, -0.039809]]}, "Liverpool Street": {"name": "Liverpool Street", "q": "City of London", "zone": "1", "head": "Named after Lord Liverpool, Prime Minister from 1812 to 1827.", "text": "The street was named after him in the 1820s. His title comes from the city of Liverpool, first recorded in 1190 as Liuerpul, probably a pool or creek with muddy water. The station opened in 1875 as Bishopsgate.", "links": [{"t": "Robert Jenkinson, 2nd Earl of Liverpool", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Robert_Jenkinson,_2nd_Earl_of_Liverpool"}, {"t": "Liverpool Street station#Underground stations", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Liverpool_Street_station%23Underground_stations"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.517372, -0.083182], [51.517991, -0.081426]]}, "London Bridge": {"name": "London Bridge", "q": "Southwark", "zone": "1", "head": "Named after London Bridge, the oldest crossing of the Thames in the city.", "text": "There has been a bridge here since Roman times. The main line station opened in 1836 and is the oldest railway terminus in central London still in use.", "links": [{"t": "London Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Bridge"}, {"t": "London Bridge station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Bridge_station%23London_Underground"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.505721, -0.088873]]}, "London City Airport": {"name": "London City Airport", "q": "Newham", "zone": "3", "head": "Named after London City Airport, the airport nearest the City of London.", "text": "It opened in 1987 on the quay between two of the old Royal Docks. The DLR station followed in 2005.", "links": [{"t": "London City Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_City_Airport"}, {"t": "London City Airport DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_City_Airport_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.503416, 0.048739]]}, "London Fields": {"name": "London Fields", "q": "Hackney", "zone": "2", "head": "Named after common fields where animals grazed on their way to London's markets.", "text": "Drovers rested their herds here before the last stretch into the City. The fields are now a park with an open-air pool.", "links": [{"t": "London Fields", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Fields"}, {"t": "London Fields railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Fields_railway_station"}], "ll": [[51.541153, -0.057753]]}, "Loughton": {"name": "Loughton", "q": "Epping Forest", "zone": "6", "head": "'Loughton' means the farm of a man called Luhha.", "text": "It is in the Domesday Book of 1086 as Lochintuna. Much older is Loughton Camp, an Iron Age earthwork in the forest nearby.", "links": [{"t": "Loughton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Loughton"}, {"t": "Loughton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Loughton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.641443, 0.055476]]}, "Maida Vale": {"name": "Maida Vale", "q": "Westminster", "zone": "2", "head": "Named after a pub, the Hero of Maida, which recalled a battle in Italy.", "text": "In 1806 a British force under General Sir John Stuart beat the French at Maida, in Calabria. The pub opened beside the Edgware Road soon after, and the area took its name.", "links": [{"t": "Maida Vale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maida_Vale"}, {"t": "Battle of Maida", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Maida"}, {"t": "Maida Vale tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maida_Vale_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.529777, -0.185758]]}, "Maidenhead": {"name": "Maidenhead", "q": "Berkshire", "zone": "", "head": "'Maidenhead' means the landing place of the maidens.", "text": "It comes from Old English mægden, maiden, and hȳth, a landing place on the Thames. Brunel's railway bridge here, finished in 1838, has the flattest brick arches ever built.", "links": [{"t": "Maidenhead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maidenhead"}, {"t": "Maidenhead Railway Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maidenhead_Railway_Bridge"}, {"t": "Maidenhead railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maidenhead_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.518669, -0.72266]]}, "Manor House": {"name": "Manor House", "q": "Hackney", "zone": "2/3", "head": "Named after the Manor House, a pub on Green Lanes.", "text": "The inn stood on the road to the north and gave its name to the crossroads. The station opened in 1932.", "links": [{"t": "Manor House, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_House,_London"}, {"t": "Manor House tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_House_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.570738, -0.096118]]}, "Manor Park": {"name": "Manor Park", "q": "Newham", "zone": "3/4", "head": "Named after a manor house built around 1810 on the Hamfrith estate.", "text": "The area was farmland until houses were built in the late 19th century. The City of London Cemetery, one of the largest in Britain, is next door.", "links": [{"t": "Manor Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_Park,_London"}, {"t": "Manor Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_Park_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.552477, 0.046342]]}, "Mansion House": {"name": "Mansion House", "q": "City of London", "zone": "1", "head": "Named after Mansion House, the official home of the Lord Mayor of the City of London.", "text": "The grand house was built in the 18th century. Bank and Cannon Street stations are actually a little closer to it.", "links": [{"t": "Mansion House, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mansion_House,_London"}, {"t": "Mansion House tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mansion_House_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.512117, -0.094009]]}, "Marble Arch": {"name": "Marble Arch", "q": "Westminster", "zone": "1", "head": "Named after the white marble arch designed by John Nash.", "text": "It was built in the 1820s as an entrance to Buckingham Palace and moved here in 1851. Nearby stood the Tyburn gallows, London's main place of execution for centuries.", "links": [{"t": "Marble Arch", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marble_Arch"}, {"t": "Marble Arch tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marble_Arch_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.513424, -0.158953]]}, "Maryland": {"name": "Maryland", "q": "Newham", "zone": "3", "head": "Named after Maryland Point, said to recall the American colony of Maryland.", "text": "The name appears on a map of 1696. The story goes that a merchant who had made his fortune in Maryland built a house here, but this has not been proven. The colony itself was named after Queen Henrietta Maria.", "links": [{"t": "Maryland, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maryland,_London"}, {"t": "Maryland railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maryland_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.546081, 0.005815]]}, "Marylebone": {"name": "Marylebone", "q": "Westminster", "zone": "1", "head": "'Marylebone' means St Mary's church by the stream.", "text": "It was recorded in 1453 as Maryburne, after a church of St Mary by the Tyburn stream; the 'le' was added later. The station opened in 1907 as Great Central, after the railway company.", "links": [{"t": "Marylebone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marylebone"}, {"t": "Marylebone station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marylebone_station%23London_Underground"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.522322, -0.163207]]}, "Mile End": {"name": "Mile End", "q": "Tower Hamlets", "zone": "2", "head": "Named because it lies one mile from Aldgate, the old City gate.", "text": "The name has been used since the 13th century, for the place where the first mile of the road to Essex ended.", "links": [{"t": "Mile End", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mile_End"}, {"t": "Mile End tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mile_End_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.525122, -0.03364]]}, "Mill Hill East": {"name": "Mill Hill East", "q": "Barnet", "zone": "4", "head": "'Mill Hill' probably means the hill with a windmill.", "text": "No trace of the mill remains, but a nearby field is still called Mill Field. The Northern line reached the station in 1941; it was meant to go further, but the extension was never built.", "links": [{"t": "Mill Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mill_Hill"}, {"t": "Mill Hill East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mill_Hill_East_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.608229, -0.209986]]}, "Monument": {"name": "Monument", "q": "City of London", "zone": "1", "head": "Named after the Monument to the Great Fire of London of 1666.", "text": "The column was designed by Christopher Wren and Robert Hooke. It is 61 metres tall, which is the distance from its base to the place in Pudding Lane where the fire began.", "links": [{"t": "Monument to the Great Fire of London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Monument_to_the_Great_Fire_of_London"}, {"t": "Bank and Monument stations", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bank_and_Monument_stations"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.5107, -0.085969]]}, "Moor Park": {"name": "Moor Park", "q": "Hertfordshire", "zone": "6/7", "head": "Named after Moor Park, a Palladian mansion nearby.", "text": "It stands in the old park of The More, a palace that once belonged to Cardinal Wolsey. The station opened in 1910 as Sandy Lodge.", "links": [{"t": "Moor Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moor_Park"}, {"t": "Moor Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moor_Park_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.629845, -0.432454]]}, "Moorgate": {"name": "Moorgate", "q": "City of London", "zone": "1", "head": "Named after the Moorgate, a small gate in the City wall.", "text": "It led out to Moorfields, marshy ground outside the wall. The gate was demolished in 1762.", "links": [{"t": "Moorgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moorgate"}, {"t": "Moorgate station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moorgate_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.518176, -0.088322]]}, "Morden": {"name": "Morden", "q": "Merton", "zone": "4", "head": "'Morden' probably means the hill in the marshland.", "text": "It comes from Old English mōr, marsh, and dūn, hill. Morden is the end of the Northern line and the southernmost station on the Underground.", "links": [{"t": "Morden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Morden"}, {"t": "Morden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Morden_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.402142, -0.194839]]}, "Mornington Crescent": {"name": "Mornington Crescent", "q": "Camden", "zone": "2", "head": "Named after the Earl of Mornington, elder brother of the Duke of Wellington.", "text": "Richard Wellesley, 2nd Earl of Mornington, was Governor-General of India and Foreign Secretary. The station also gave its name to a famous nonsense game on the BBC radio comedy I'm Sorry I Haven't a Clue.", "links": [{"t": "Mornington Crescent", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mornington_Crescent"}, {"t": "Mornington Crescent tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mornington_Crescent_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.534679, -0.138789]]}, "Mudchute": {"name": "Mudchute", "q": "Tower Hamlets", "zone": "2", "head": "Named after a mud chute: mud dug out of Millwall Dock was pumped here.", "text": "The mud built up into a large mound. Today the land is Mudchute Park and Farm, one of the largest city farms in Europe.", "links": [{"t": "Mudchute", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mudchute"}, {"t": "Mudchute DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mudchute_DLR_station"}], "ll": [[51.490704, -0.014738]]}, "Neasden": {"name": "Neasden", "q": "Brent", "zone": "3", "head": "'Neasden' means the nose-shaped hill.", "text": "It comes from Old English nēos, nose, and dūn, hill. The station opened in 1880 as Kingsbury & Neasden.", "links": [{"t": "Neasden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Neasden"}, {"t": "Neasden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Neasden_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.553986, -0.249837]]}, "New Cross": {"name": "New Cross", "q": "Lewisham", "zone": "2", "head": "Probably named after a coaching inn, the Golden Cross, on the road to Kent and Dover.", "text": "Goldsmiths, part of the University of London, is next to the station.", "links": [{"t": "New Cross", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/New_Cross"}, {"t": "New Cross railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/New_Cross_railway_station"}], "ll": [[51.476344, -0.032441]]}, "New Cross Gate": {"name": "New Cross Gate", "q": "Lewisham", "zone": "2", "head": "Named after a toll gate on the road at New Cross.", "text": "Travellers on the turnpike road to Kent paid here. New Cross itself is probably named after a coaching inn.", "links": [{"t": "New Cross Gate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/New_Cross_Gate"}, {"t": "New Cross Gate railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/New_Cross_Gate_railway_station"}], "ll": [[51.475128, -0.040399]]}, "Newbury Park": {"name": "Newbury Park", "q": "Redbridge", "zone": "4", "head": "'Newbury' means the new manor.", "text": "The name is medieval. The station opened in 1903, and the Central line took it over in 1947.", "links": [{"t": "Newbury Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Newbury_Park"}, {"t": "Newbury Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Newbury_Park_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.575726, 0.090004]]}, "Nine Elms": {"name": "Nine Elms", "q": "Wandsworth", "zone": "1", "head": "Named after a row of nine elm trees.", "text": "The name was first recorded around 1645. Since 1974 the area has been home to New Covent Garden Market, and the station opened in 2021.", "links": [{"t": "Nine Elms", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Nine_Elms"}, {"t": "Nine Elms tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Nine_Elms_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.479912, -0.128476]]}, "North Acton": {"name": "North Acton", "q": "Ealing", "zone": "2/3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. The station opened in 1923, north of the old town centre.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "North Acton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Acton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.523524, -0.259755]]}, "North Ealing": {"name": "North Ealing", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name was first recorded around 700 as Gillingas. North Ealing station opened in 1903.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "North Ealing tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Ealing_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.517505, -0.288868]]}, "North Greenwich": {"name": "North Greenwich", "q": "Greenwich", "zone": "2/3", "head": "'Greenwich' means the green harbour or trading place.", "text": "It was first recorded in the early 10th century. The station, opened in 1999, is just over a mile north-east of Greenwich itself, next to what was built as the Millennium Dome.", "links": [{"t": "Greenwich", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenwich"}, {"t": "North Greenwich tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Greenwich_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.50047, 0.004287]]}, "North Harrow": {"name": "North Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on Harrow Hill, where St Mary's Church stands today. North Harrow station opened in 1915.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "North Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Harrow_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.584872, -0.362408]]}, "North Wembley": {"name": "North Wembley", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "It ends in Old English leah, a clearing. Bakerloo trains have called here since 1917.", "links": [{"t": "Wembley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley"}, {"t": "North Wembley station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Wembley_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.562551, -0.304]]}, "Northfields": {"name": "Northfields", "q": "Ealing", "zone": "3", "head": "Named after the north fields of Ealing.", "text": "The fields were farmland until houses were built in the early 20th century. The station opened in 1908 as Northfield.", "links": [{"t": "Northfields, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northfields,_London"}, {"t": "Northfields tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northfields_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.499319, -0.314719]]}, "Northolt": {"name": "Northolt", "q": "Ealing", "zone": "5", "head": "'Northolt' means the northern nook of land.", "text": "It comes from Old English north and healh, a corner or nook. Its partner to the south is Southall. The station opened on the Central line in 1948.", "links": [{"t": "Northolt", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northolt"}, {"t": "Northolt tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northolt_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.548236, -0.368699]]}, "Northwick Park": {"name": "Northwick Park", "q": "Brent", "zone": "4", "head": "Named after Northwick Park, the open space beside the station.", "text": "The name is said to come from the Rushout family, who owned the farmland here and whose country seat was Northwick Park in the Cotswolds. The station opened in 1923 as Northwick Park & Kenton.", "links": [{"t": "Northwick Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwick_Park"}, {"t": "Northwick Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwick_Park_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.578481, -0.318056]]}, "Northwood": {"name": "Northwood", "q": "Hillingdon", "zone": "6", "head": "'Northwood' means the wood to the north.", "text": "It was the wooded northern part of the old parish of Ruislip. The station opened in 1887.", "links": [{"t": "Northwood, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood,_London"}, {"t": "Northwood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.611053, -0.423829]]}, "Northwood Hills": {"name": "Northwood Hills", "q": "Hillingdon", "zone": "6", "head": "Named after Northwood, the wood to the north of Ruislip, and its hills.", "text": "The station opened in 1933 for a new housing estate. Oddly, it stands a little lower than Northwood station.", "links": [{"t": "Northwood Hills", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_Hills"}, {"t": "Northwood Hills tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_Hills_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.600572, -0.409464]]}, "Norwood Junction": {"name": "Norwood Junction", "q": "Croydon", "zone": "4", "head": "'Norwood' means the north wood, north of Croydon.", "text": "The Great North Wood once covered the hills here. Several railway lines meet at the junction.", "links": [{"t": "South Norwood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/South_Norwood"}, {"t": "Norwood Junction railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Norwood_Junction_railway_station"}], "ll": [[51.397019, -0.075221]]}, "Notting Hill Gate": {"name": "Notting Hill Gate", "q": "Kensington and Chelsea", "zone": "1/2", "head": "'Notting' probably means the people of a man called Cnotta.", "text": "The name was recorded from the 14th century in many spellings, such as Knottynghull. The 'gate' was a toll gate on the road to Uxbridge.", "links": [{"t": "Notting Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Notting_Hill"}, {"t": "Notting Hill Gate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Notting_Hill_Gate_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.509128, -0.196104]]}, "Oakwood": {"name": "Oakwood", "q": "Enfield", "zone": "5", "head": "Named after Oakwood Park, which took its name from a house called Oak Lodge.", "text": "Nearby Enfield Chase was a royal hunting ground. The station opened in 1933 as Enfield West and became Oakwood in 1946.", "links": [{"t": "Oakwood, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oakwood,_London"}, {"t": "Oakwood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oakwood_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.647726, -0.132182]]}, "Old Street": {"name": "Old Street", "q": "Islington", "zone": "1", "head": "Named after the street, recorded as Ealdestrate around 1200.", "text": "The name simply means 'old street'; the road is probably Roman. Because of the many tech firms around it, the roundabout above the station is nicknamed Silicon Roundabout.", "links": [{"t": "Old Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Old_Street"}, {"t": "Old Street station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Old_Street_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.525864, -0.08777]]}, "Osterley": {"name": "Osterley", "q": "Hounslow", "zone": "4", "head": "'Osterley' probably means the clearing with a sheepfold.", "text": "It was first recorded in the 13th century. Osterley House was built for the merchant Sir Thomas Gresham in the 16th century and later remodelled by Robert Adam.", "links": [{"t": "Osterley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Osterley"}, {"t": "Osterley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Osterley_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.481274, -0.352224]]}, "Oval": {"name": "Oval", "q": "Lambeth", "zone": "2", "head": "Named after the Oval cricket ground.", "text": "The name goes back to an oval-shaped street plan of the 1790s; the cricket ground was laid out inside it. Surrey County Cricket Club has played here since 1845.", "links": [{"t": "The Oval", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/The_Oval"}, {"t": "Oval tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oval_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.48185, -0.112439]]}, "Oxford Circus": {"name": "Oxford Circus", "q": "Westminster", "zone": "1", "head": "A 'circus' is a round place where roads meet; there was never a circus.", "text": "It is the crossing of Oxford Street and Regent Street. Oxford Street was the main road west towards Oxford.", "links": [{"t": "Oxford Circus", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Circus"}, {"t": "Oxford Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Street"}, {"t": "Oxford Circus tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Circus_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.515224, -0.141903]]}, "Paddington": {"name": "Paddington", "q": "Westminster", "zone": "1", "head": "'Paddington' means the farm of a man called Padda.", "text": "The name is Anglo-Saxon, with -ington meaning the settlement of someone's people. The station opened in 1863 on the first underground railway.", "links": [{"t": "Paddington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Paddington"}, {"t": "Paddington tube station (Circle and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Paddington_tube_station_(Circle_and_Hammersmith_&_City_lines)"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.516581, -0.175689], [51.518187, -0.178306]]}, "Park Royal": {"name": "Park Royal", "q": "Ealing", "zone": "3", "head": "Named after the Royal Agricultural Society's showground, opened here in 1903.", "text": "The show only stayed for a few years, but the name remained. The area later became one of London's largest industrial estates.", "links": [{"t": "Park Royal", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Park_Royal"}, {"t": "Park Royal tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Park_Royal_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.527123, -0.284341]]}, "Parsons Green": {"name": "Parsons Green", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the parsonage of Fulham, which stood beside the green.", "text": "The village green still survives as a small park. Nearby is Fulham Palace, for many centuries the country home of the Bishops of London.", "links": [{"t": "Parsons Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Parsons_Green"}, {"t": "Parsons Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Parsons_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.475277, -0.20117]]}, "Peckham Rye": {"name": "Peckham Rye", "q": "Southwark", "zone": "2", "head": "'Peckham' means the homestead by a hill; 'Rye' is an old word for a stream.", "text": "Peckham Rye is the common beside the stream. As a boy, the poet William Blake said he saw a tree full of angels there.", "links": [{"t": "Peckham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Peckham"}, {"t": "Peckham Rye", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Peckham_Rye"}, {"t": "Peckham Rye railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Peckham_Rye_railway_station"}], "ll": [[51.470034, -0.069414]]}, "Penge West": {"name": "Penge West", "q": "Bromley", "zone": "4", "head": "'Penge' is a Celtic name meaning the end of the wood.", "text": "It was recorded in 957 as Penceat, from the same British words as Welsh pen, head or end, and coed, wood. It is one of very few Celtic names in London.", "links": [{"t": "Penge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Penge"}, {"t": "Penge West railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Penge_West_railway_station"}], "ll": [[51.417555, -0.06084]]}, "Perivale": {"name": "Perivale", "q": "Ealing", "zone": "4", "head": "'Perivale' probably means the valley of pear trees.", "text": "It was first recorded in the early 16th century as Pyryvale. The station opened in 1904 as Perivale Halt and joined the Central line in 1947.", "links": [{"t": "Perivale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Perivale"}, {"t": "Perivale tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Perivale_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.536717, -0.323446]]}, "Piccadilly Circus": {"name": "Piccadilly Circus", "q": "Westminster", "zone": "1", "head": "Named after 'piccadills', stiff lace collars fashionable around 1600.", "text": "A tailor, Robert Baker, made his fortune selling them and built a house here, nicknamed Pickadilly Hall. The name spread to the street and the circus, a round junction of roads.", "links": [{"t": "Piccadilly Circus", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly_Circus"}, {"t": "Piccadilly", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly"}, {"t": "Piccadilly Circus tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly_Circus_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.51005, -0.133798]]}, "Pimlico": {"name": "Pimlico", "q": "Westminster", "zone": "1", "head": "Nobody knows for sure where the name 'Pimlico' comes from.", "text": "One popular theory links it to Ben Pimlico, an innkeeper famous for his ale, but his tavern was in Hoxton, on the other side of London. The station opened with the Victoria line in 1972.", "links": [{"t": "Pimlico", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pimlico"}, {"t": "Pimlico tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pimlico_tube_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.489097, -0.133761]]}, "Pinner": {"name": "Pinner", "q": "Harrow", "zone": "5", "head": "'Pinner' probably means the pin-shaped hill, or the hill of a man called Pinn.", "text": "It ends in Old English ora, a slope or hill; the River Pinn was later named after the village. Pinner Fair has been held almost every year since a charter of 1336.", "links": [{"t": "Pinner", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pinner"}, {"t": "Pinner tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pinner_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.592901, -0.381161]]}, "Plaistow": {"name": "Plaistow", "q": "Newham", "zone": "3", "head": "'Plaistow' probably means a place for play or sport.", "text": "It may come from Old English plega, play, and stōw, place, perhaps where games or miracle plays were held. Others link it to Sir Hugh de Plaiz, a medieval landowner. Locals say 'Plar-stow'.", "links": [{"t": "Plaistow, Newham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Plaistow,_Newham"}, {"t": "Plaistow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Plaistow_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.531341, 0.017451]]}, "Pontoon Dock": {"name": "Pontoon Dock", "q": "Newham", "zone": "3", "head": "Named after a dock where ships were lifted on floating pontoons for repair.", "text": "Hydraulic jacks raised the ships out of the water at the Royal Victoria Dock. The Thames Barrier and its park are close by.", "links": [{"t": "Royal Victoria Dock", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Victoria_Dock"}, {"t": "Pontoon Dock DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pontoon_Dock_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.502212, 0.032115]]}, "Poplar": {"name": "Poplar", "q": "Tower Hamlets", "zone": "2", "head": "'Poplar' means the place where poplar trees grow.", "text": "It was recorded in 1327 as Popler. The trees grew well on the damp ground by the Thames.", "links": [{"t": "Poplar, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Poplar,_London"}, {"t": "Poplar DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Poplar_DLR_station"}], "ll": [[51.507744, -0.017384]]}, "Preston Road": {"name": "Preston Road", "q": "Brent", "zone": "4", "head": "'Preston' means the priests' farm.", "text": "It comes from Old English prēost, priest, and tūn, farm. The station opened in 1908 for visitors to the Olympic clay pigeon shooting nearby.", "links": [{"t": "Preston, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Preston,_London"}, {"t": "Preston Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Preston_Road_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.571972, -0.295107]]}, "Prince Regent": {"name": "Prince Regent", "q": "Newham", "zone": "3", "head": "Named after Prince Regent Lane, which honours the future George IV.", "text": "He became Prince Regent in 1811, when his father George III was too ill to rule. The lane is older than the docks.", "links": [{"t": "George IV", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/George_IV"}, {"t": "Prince Regent DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Prince_Regent_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.509263, 0.034158]]}, "Pudding Mill Lane": {"name": "Pudding Mill Lane", "q": "Newham", "zone": "2/3", "head": "Named after the lane, which took its name from a watermill on the River Lea.", "text": "The mill is said to have been nicknamed Pudding Mill because of its round shape. The station is next to the Olympic Park of 2012.", "links": [{"t": "Pudding Mill Lane DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pudding_Mill_Lane_DLR_station"}], "ll": [[51.534302, -0.012755]]}, "Putney Bridge": {"name": "Putney Bridge", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after Putney Bridge, the crossing to Putney on the other bank.", "text": "'Putney' means the landing place of a man called Putta. The station is actually on the Fulham side of the Thames. The Oxford and Cambridge Boat Race starts near the bridge.", "links": [{"t": "Putney Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney_Bridge"}, {"t": "Putney Bridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney_Bridge_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.468262, -0.208731]]}, "Queen's Park": {"name": "Queen's Park", "q": "Brent", "zone": "2", "head": "Named after Queen Victoria, who was on the throne when the area was built.", "text": "The park and housing estate date from the late 19th century. Bakerloo trains have called here since 1915.", "links": [{"t": "Queen's Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queen's_Park,_London"}, {"t": "Queen's Park (London) station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queen's_Park_(London)_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.534158, -0.204574]]}, "Queens Road Peckham": {"name": "Queens Road Peckham", "q": "Southwark", "zone": "2", "head": "Named after Queen's Road in Peckham, the homestead by a hill.", "text": "Peckham comes from Old English pēac, a hill or peak, and hām, homestead. The station opened in 1866.", "links": [{"t": "Peckham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Peckham"}, {"t": "Queens Road Peckham railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queens_Road_Peckham_railway_station"}], "ll": [[51.473566, -0.057313]]}, "Queensbury": {"name": "Queensbury", "q": "Brent", "zone": "4", "head": "An invented name, chosen in the 1930s as a play on neighbouring Kingsbury.", "text": "Local people were asked for ideas, and Queensbury won. The name has no historical background. The station opened in 1934.", "links": [{"t": "Queensbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensbury,_London"}, {"t": "Queensbury tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensbury_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.594188, -0.286219]]}, "Queensway": {"name": "Queensway", "q": "Westminster", "zone": "1", "head": "Named in honour of Queen Victoria.", "text": "She is said to have ridden along the lane as a girl, when she lived at Kensington Palace nearby. The road was called Queen's Road, and so was the station until 1946.", "links": [{"t": "Queensway, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensway,_London"}, {"t": "Queensway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queensway_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.510312, -0.187152]]}, "Ravenscourt Park": {"name": "Ravenscourt Park", "q": "Hammersmith and Fulham", "zone": "2", "head": "A pun on a family name: a raven is 'corbeau' in French.", "text": "In the 18th century the owner, Thomas Corbett, renamed his house Ravenscourt; ravens were on his coat of arms. The grounds became a public park. The station opened in 1873 as Shaftesbury Road.", "links": [{"t": "Ravenscourt Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ravenscourt_Park"}, {"t": "Ravenscourt Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ravenscourt_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.494122, -0.235881]]}, "Rayners Lane": {"name": "Rayners Lane", "q": "Harrow", "zone": "5", "head": "Said to be named after Daniel Rayner, a local farmer.", "text": "When the railway arrived in 1904 the area was almost empty; the station opened in 1906, and houses only followed in the 1930s.", "links": [{"t": "Rayners Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rayners_Lane"}, {"t": "Rayners Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rayners_Lane_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.575147, -0.371127]]}, "Reading": {"name": "Reading", "q": "Berkshire", "zone": "", "head": "'Reading' means the people of a man called Reada.", "text": "It was recorded around 900 as Readingum. Henry I founded Reading Abbey in 1121 and was buried there; its ruins can still be seen near the station.", "links": [{"t": "Reading, Berkshire", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Reading,_Berkshire"}, {"t": "Reading Abbey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Reading_Abbey"}, {"t": "Reading railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Reading_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.458786, -0.971863]]}, "Rectory Road": {"name": "Rectory Road", "q": "Hackney", "zone": "2", "head": "Probably named after the rectory of St Mary's Church, Stoke Newington.", "text": "The road led towards St Mary's rectory. Stoke Newington probably means the new farm by the tree stumps.", "links": [{"t": "Stoke Newington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stoke_Newington"}, {"t": "Rectory Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rectory_Road_railway_station"}], "ll": [[51.558502, -0.068267]]}, "Redbridge": {"name": "Redbridge", "q": "Redbridge", "zone": "4", "head": "Named after a red brick bridge over the River Roding.", "text": "The bridge was recorded from the 17th century and demolished in the early 1920s. The station, opened in 1947, had the name before the London Borough of Redbridge, created in 1965.", "links": [{"t": "Redbridge, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Redbridge,_London"}, {"t": "Redbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Redbridge_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.576243, 0.04536]]}, "Regent's Park": {"name": "Regent's Park", "q": "Westminster", "zone": "1", "head": "Named after the Prince Regent, later King George IV.", "text": "The park was laid out by John Nash in the early 19th century on what had been Henry VIII's hunting ground. Regent Street was built at the same time.", "links": [{"t": "Regent's Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Regent's_Park"}, {"t": "Regent's Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Regent's_Park_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.523344, -0.146444]]}, "Richmond": {"name": "Richmond", "q": "Richmond", "zone": "4", "head": "Named after Richmond in Yorkshire, through Henry VII.", "text": "Henry was Earl of Richmond before he became king. Around 1500 he rebuilt the royal palace at Sheen and named it after his earldom. 'Richmond' is French for 'strong hill'.", "links": [{"t": "Richmond, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Richmond,_London"}, {"t": "Richmond station (London)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Richmond_station_(London)"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.463237, -0.301336]]}, "Rickmansworth": {"name": "Rickmansworth", "q": "Hertfordshire", "zone": "7", "head": "'Rickmansworth' means the enclosure of a man called Ricmær.", "text": "-worth is an Old English word for an enclosure or farm. The Domesday Book of 1086 records it as Prichemareworde.", "links": [{"t": "Rickmansworth", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rickmansworth"}, {"t": "Rickmansworth station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rickmansworth_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.640207, -0.473703]]}, "Roding Valley": {"name": "Roding Valley", "q": "Epping Forest", "zone": "4", "head": "Named after the River Roding, which flows through the valley.", "text": "The river takes its name from the Rodings, villages of the people of a Saxon leader called Hroda.", "links": [{"t": "River Roding", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/River_Roding"}, {"t": "Roding Valley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Roding_Valley_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.617199, 0.043647]]}, "Romford": {"name": "Romford", "q": "Havering", "zone": "6", "head": "'Romford' means the wide ford.", "text": "It comes from Old English rūm, roomy or wide. The River Rom was named after the town much later, not the other way round. Romford has held a market since the 13th century.", "links": [{"t": "Romford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Romford"}, {"t": "Romford railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Romford_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.574829, 0.183237]]}, "Rotherhithe": {"name": "Rotherhithe", "q": "Southwark", "zone": "2", "head": "'Rotherhithe' means the landing place for cattle.", "text": "It comes from Old English hrȳther, cattle, and hȳth, a landing place. The Mayflower sailed from here in 1620. The trains use Brunel's Thames Tunnel of 1843, the first tunnel under a navigable river.", "links": [{"t": "Rotherhithe", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Rotherhithe"}, {"t": "Thames Tunnel", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Thames_Tunnel"}, {"t": "Rotherhithe railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org
