<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stop Stories · London</title>
<meta name="description" content="The hidden story behind the next station in London: short stories behind the names of all 418 stations of the Underground, Elizabeth line, Overground and DLR. An independent project made with AI (Claude, by Anthropic), not affiliated with TfL.">
<meta name="theme-color" content="#16201f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Stop Stories">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Text:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

html,body{margin:0}
/* Layout: one narrow phone column; an onboard-display header band, a route spine for the stop list, a big thumb-reach "Next stop" bar on the detail view */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#15211f; --muted:#5b6a67; --line:#d3dbd9;
  --route:#0d6e66; --route-soft:#d6ebe8; --tram:#a3324a; --tram-soft:#f6dfe4; --band-bus:#0d6e66; --band-tram:#a3324a; --led:#ffb23e; --band:#16201f; --band-ink:#f3f6f5;
  --check:#8a5a00; --check-bg:#fff2d6; --ok:#1d7a43; --ok-bg:#dff2e6; --scrim:rgba(10,16,15,.7); --sheet:#ffffff; --sheet-field:#eef3f2;
  --f-display:"Big Shoulders Text","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1211; --surface:#1c2725; --ink:#e8eeec; --muted:#9aaba7; --line:#33423f;
  --route:#3fb8ac; --route-soft:#17332f; --tram:#e0667d; --tram-soft:#3a1b22; --band-bus:#0f5f57; --band-tram:#8e2b40; --led:#ffbf5c; --band:#070b0a; --band-ink:#f3f6f5;
  --check:#ffcf75; --check-bg:#3a2c0e; --ok:#7fdca3; --ok-bg:#163424; --scrim:rgba(0,0,0,.75); --sheet:#25332f; --sheet-field:#16201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1211; --surface:#1c2725; --ink:#e8eeec; --muted:#9aaba7; --line:#33423f;
  --route:#3fb8ac; --route-soft:#17332f; --tram:#e0667d; --tram-soft:#3a1b22; --band-bus:#0f5f57; --band-tram:#8e2b40; --led:#ffbf5c; --band:#070b0a; --band-ink:#f3f6f5;
  --check:#ffcf75; --check-bg:#3a2c0e; --ok:#7fdca3; --ok-bg:#163424; --scrim:rgba(0,0,0,.75); --sheet:#25332f; --sheet-field:#16201e; color-scheme:dark}

:root.is-tram{--route:var(--tram);--route-soft:var(--tram-soft)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--route)}
:focus-visible{outline:3px solid var(--led);outline-offset:2px;border-radius:6px}

.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.band .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;min-height:52px}
.band{transition:background .2s}
.band.on-line{background:var(--band-bus);box-shadow:0 3px 14px rgba(0,0,0,.28)}
.band.on-line.tram{background:var(--band-tram)}
.band.on-line .back{order:-2;border-color:#ffffff55}
.band.on-line .lineno{order:-1;background:#fff;color:var(--band-bus);height:40px;min-width:46px;font-size:24px}
.band.on-line.tram .lineno{color:var(--band-tram)}
.band.on-line .eyebrow{color:#ffffffcc}
.band.on-line h1{white-space:normal;font-size:20px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back{background:none;border:1px solid #ffffff33;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--band-ink)}
.back:hover{border-color:#ffffff88}
.band-title{min-width:0;flex:1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--led)}
.band h1{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;margin:1px 0 0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lineno{font-family:var(--f-display);font-weight:800;font-size:21px;background:var(--route);color:#fff;border-radius:8px;min-width:42px;height:36px;display:grid;place-items:center;padding:0 8px;flex:none}

main{padding-block:20px 120px}
.view{display:flex;flex-direction:column;gap:20px}

.intro h2{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 10px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.line-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.line-card:hover{border-color:var(--route)}
.line-card:active{transform:scale(.99)}
.line-card .lineno{font-size:30px;height:56px;min-width:60px}
.line-card .meta{min-width:0;flex:1}
.line-card strong{display:block;font-size:18px;line-height:1.3}
.line-card span{color:var(--muted);font-size:15px}
.lines-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.line-tile{display:flex;gap:10px;align-items:center;min-width:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;cursor:pointer;transition:border-color .15s}
.line-tile:hover{border-color:var(--route)}
.line-tile .lineno{min-width:44px;height:40px;font-size:22px}
.line-tile small{min-width:0;font-size:12.5px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lineno.tram{background:var(--tram)}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font-family:var(--f-display);font-weight:700;font-size:18px;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:4px 12px}
.note{font-size:14px;color:var(--muted)}

.dir{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.dir button{border:0;background:none;border-radius:9px;padding:10px 8px;cursor:pointer;font-size:14px;line-height:1.25;color:var(--muted)}
.dir button[aria-pressed="true"]{background:var(--route);color:#fff;font-weight:700}

.list-hint{margin:0 0 -6px;font-size:15.5px;line-height:1.45;color:var(--muted)}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--route)}
.stop{position:relative}
.stop button{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer}
.dot{width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--route);margin-left:13px;position:relative;z-index:1}
.stop.end .dot{width:26px;height:26px;margin-left:9px;background:var(--route)}
.stop.here .dot{background:var(--led);border-color:var(--led);box-shadow:0 0 0 5px color-mix(in srgb,var(--led) 30%,transparent)}
.sname{min-width:0}
.sname b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;letter-spacing:.01em}
.sname small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--route);background:var(--route-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.stop button:hover .sname b{color:var(--route)}
.here-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--band);background:var(--led);border-radius:999px;padding:3px 8px}

.counter{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--route);border-radius:3px;transition:width .25s}
.sign{background:var(--band);color:var(--band-ink);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sign-mid{flex:1;min-width:0;text-align:center;padding-block:4px}
.sign-mid .eyebrow{display:block;margin-bottom:4px}
.arrow{flex:none;display:grid;place-items:center;border:0;border-radius:12px;cursor:pointer;width:42px;height:56px}
.sign h2{overflow-wrap:anywhere}
.arrow.back-arrow{background:#ffffff14;color:#c9d3d1}
.arrow.fwd-arrow{background:var(--route);color:#fff;width:48px}
.arrow:not(:disabled):active{transform:scale(.95)}
.arrow:disabled{opacity:.25;cursor:default}
.story-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.act{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 8px;border-radius:999px;border:1px solid var(--route);background:none;color:var(--route);font-weight:700;font-size:14px;line-height:1.15;white-space:nowrap;cursor:pointer}
.act:not(:disabled):hover{background:var(--route-soft)}
.act:disabled{opacity:.45;cursor:default}
.act svg{flex:none;width:17px;height:17px}
.swipe-hint{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.home{gap:24px}
.band.big .wrap{padding-block:18px 20px;justify-content:center}
.band.big .band-title{flex:none;text-align:center}
.home-rule{border:0;border-top:1px solid var(--line);margin:0 0 16px}
.band.big h1{font-size:46px;line-height:.95;margin-top:4px;white-space:normal}
.tagline{margin:6px 0 0;font-size:15px;line-height:1.3;color:#c9d3d1}
.home-lead{margin:0 0 14px;font-size:16px;color:var(--muted);text-align:center}
.wtag{display:inline-block;color:#fff;font-weight:700;border-radius:5px;padding:0 6px;line-height:1.45;background:var(--route)}
.wtag.tram{background:var(--tram)}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
.num-tile{aspect-ratio:1;border:0;border-radius:14px;background:var(--route);color:#fff;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:transform .12s,filter .12s}
.num-tile.tram{background:var(--tram)}
.num-tile:hover{filter:brightness(1.08)}
.num-tile:active{transform:scale(.94)}
.legend{display:flex;align-items:center;gap:6px;margin:12px 0 0;font-size:13px;color:var(--muted)}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--route);display:inline-block}
.legend .sw.tram{background:var(--tram)}
.legend .sw:not(:first-child){margin-left:10px}
main.stop-page{padding-top:12px;padding-bottom:28px}
.sign .eyebrow{display:block;margin-bottom:6px}
.sign h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,42px);line-height:1;margin:0;color:var(--led);text-wrap:balance;letter-spacing:.01em}
.sign .q{margin-top:8px;color:#c9d3d1;font-size:15px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.view.stopv{gap:12px}
.stopv .story p{font-size:16.5px;line-height:1.5}
.story .kind{display:inline-block;margin-bottom:8px}
.story h3{font-size:18px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.story p{margin:0;max-width:62ch}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--check-bg);color:var(--check);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.35;margin-top:10px}
.check svg{flex:none;margin-top:2px}

.reading h4{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.reading ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reading li + li{border-top:1px solid var(--line)}
.reading a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;text-decoration:none;color:var(--ink)}
.reading a:hover .rt{color:var(--route);text-decoration:underline}
.rt{display:block;font-weight:700;line-height:1.3}
.rs{display:block;font-size:13.5px;color:var(--muted)}
.reading svg{flex:none;color:var(--route)}

.two-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px;font-size:16px;line-height:1.2;text-align:center}
.btn.big svg{flex:none}
.sheet .reading ul{margin-top:-4px}
.sheet .about,.sheet .chip span,.sheet textarea,.sheet input[type=email],.sheet .msg,.sheet .btn:not(.primary),.sheet .x{background:var(--sheet-field)}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;border:1px solid var(--route);background:var(--surface);color:var(--route)}
.btn:hover{background:var(--route-soft)}
.btn.primary{background:var(--route);color:#fff;border-color:var(--route)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}

.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav .wrap{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.nav .pn{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;line-height:1.2;text-align:left}
.nav .prev{background:var(--line);border:0;color:var(--muted);justify-content:flex-start;font-weight:500}
.nav .prev:not(:disabled):hover{color:var(--ink)}
.nav .next{background:var(--route);border:0;color:#fff}
.nav .next span,.nav .prev span{display:flex;flex-direction:column;min-width:0}
.nav .next small,.nav .prev small{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.nav .next em,.nav .prev em{font-style:normal;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .next em{font-size:19px}
.nav .prev em{font-size:16px;font-weight:700}
.nav button:disabled{opacity:.4;cursor:default}
.nav .acts button{min-height:40px;padding:7px 10px;border-radius:10px;border:1px solid var(--route);background:var(--surface);color:var(--route);font-size:15px;justify-content:center}
.nav .acts button:not(:disabled):hover{background:var(--route-soft)}
.nav .acts svg{flex:none;width:18px;height:18px}
main.has-acts{padding-top:12px;padding-bottom:170px}

/* feedback sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
[hidden]{display:none !important}
.sheet-card{background:var(--sheet);border-top:6px solid var(--route);box-shadow:0 -12px 40px rgba(0,0,0,.35);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.sheet{align-items:center}.sheet-card{border-radius:18px;max-height:88%;box-shadow:0 20px 60px rgba(0,0,0,.4)}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;margin:0}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.about{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.about .lineno{height:36px;min-width:40px;font-size:20px}
.about b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.about small{color:var(--muted);font-size:13.5px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.flabel{font-weight:700;margin-bottom:8px;padding:0;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;line-height:1.2}
.chip input:checked + span{background:var(--route);border-color:var(--route);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--led);outline-offset:2px}
textarea,input[type=email]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
textarea:focus,input[type=email]:focus{outline:none;border-color:var(--route);box-shadow:0 0 0 3px var(--route-soft)}
.hint{font-size:13.5px;color:var(--muted);margin-top:4px}
.err{color:var(--check);font-size:14px;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.done{display:flex;flex-direction:column;gap:12px}
.status{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.4}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--check-bg);color:var(--check)}
.status svg{flex:none;margin-top:2px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;user-select:all}
.addr{font-family:var(--f-mono);font-size:14px;user-select:all}

/* compact feedback form */
.fbs .sheet-head h2{font-size:26px}
.fb-about{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14.5px;color:var(--muted);min-width:0}
.fb-about .lineno{height:24px;min-width:30px;font-size:15px;border-radius:6px;padding:0 6px}
.fb-about span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbs form{display:flex;flex-direction:column;margin-top:12px}
.fbs legend,.fbs .flabel{font-size:15px;margin-bottom:6px}
.fbs .chips{gap:6px}
.fbs .chip span{font-size:14px;padding:6px 11px}
.fbs .flabel{margin-top:12px}
.fbs textarea{min-height:72px;height:72px;font-size:16px;padding:8px 10px}
.fbs .err{margin-top:8px}
.fbs .send{margin-top:12px;width:100%;min-height:46px;font-size:16px}
.fb-hint{margin:6px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.steps-intro{margin:14px 0 8px;font-size:16px;font-weight:700}
.note + .steps{margin-top:6px}
.steps{margin:14px 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.4}
.steps .addr{display:inline-block;margin:2px 8px 0 0;font-size:14.5px;word-break:break-all}
.btn.small{padding:4px 10px;font-size:13.5px;border-radius:8px;vertical-align:middle;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Beautiful Luxembourg branding, language switch */
.brandrow{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:28px;height:28px;border-radius:7px;background:#fff;padding:2px;flex:none}
/* landing page: brand on the left, flag on the right, a line, then the centred title */
.band.big .band-title{flex:1;width:100%}
.band.big .brandrow{justify-content:flex-start;text-align:left;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid #ffffff2e}
.langpick{position:relative;margin-left:auto;flex:none}
.langpick[hidden],.langmenu[hidden]{display:none !important}
.flagbtn{display:grid;place-items:center;width:44px;height:34px;padding:0;border:1px solid #ffffff3d;border-radius:8px;background:#ffffff10;cursor:pointer}
.flagbtn:hover,.flagbtn[aria-expanded="true"]{border-color:#ffffffa0}
.flag{display:block;width:26px;height:18px;border-radius:3px;box-shadow:0 0 0 1px #00000033}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:160px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:2px}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:15px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.langmenu button:hover{background:var(--route-soft)}
.langmenu button[aria-checked="true"]{font-weight:700;background:var(--route-soft)}
.band:not(.big) .brandrow .logo{display:none}
/* search and near me */
.finder{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search:focus-within{border-color:var(--route);box-shadow:0 0 0 3px var(--route-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:12px 0;color:var(--ink)}
.near{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:center;border:1px solid var(--route);background:none;color:var(--route);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.near:hover{background:var(--route-soft)}
.near.small{padding:6px 12px;font-size:14px;flex:none}
.list-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.list-top .list-hint{margin:0}
#whereMsg{margin:-6px 0 0}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.res:hover{border-color:var(--route)}
.res-name{flex:1;min-width:0}
.res-name b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.15}
.res-name small{color:var(--muted);font-size:13.5px}
.res-lines{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:52%}
.mini-line{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 5px;border-radius:6px;background:var(--route);color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px}
.mini-line.tram{background:var(--tram)}
.more{font-size:12px;color:var(--muted);align-self:center}
/* footer and about */
.home-foot{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;font-size:14px;color:var(--muted);text-align:center}
.home-foot a{font-weight:700}
.foot-links{display:flex;gap:10px;align-items:center;justify-content:center}
.home-foot .copy{font-size:13px}
.home-rule.after-grid{margin:22px 0 0}
.about-page h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;margin:4px 0 0}
.about-page h3{font-size:18px;margin:6px 0 -10px}
.about-page p{margin:0;max-width:62ch}
.act{white-space:normal}
.band.big .tagline{text-wrap:balance;max-width:34ch;margin-inline:auto}

/* direction: from/to card with a swap button, as in map apps */
.route-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px}
.rc-stops{flex:1;min-width:0}
.rc-row{display:flex;align-items:baseline;gap:8px;min-height:26px}
.rc-stops{display:flex;flex-direction:column;gap:4px}
.rc-lab{flex:none;width:3.4em;font-size:14px;color:var(--muted);font-weight:600}
.rc-name{font-size:16px;line-height:1.25;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.rc-name{color:var(--ink);font-weight:400}
.rc-dot{flex:none;width:12px;height:12px;border-radius:50%}
.rc-dot.from{border:2.5px solid var(--muted);background:var(--surface)}
.rc-dot.to{background:var(--route);box-shadow:0 0 0 3px var(--route-soft)}
.rc-link{width:0;height:14px;margin:2px 0 2px 5px;border-left:2px dotted var(--muted)}
.rc-swap{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg,transparent);color:var(--route);cursor:pointer}
.rc-swap:hover{background:var(--route-soft);border-color:var(--route)}
.rc-swap:active{transform:rotate(180deg);transition:transform .2s}
/* gentle depth (option B): soft shadow under the line boxes and the line-page banner */
.num-tile{box-shadow:0 2px 3px rgba(0,0,0,.14),0 6px 14px rgba(13,60,55,.26)}
.num-tile:active{box-shadow:0 1px 2px rgba(0,0,0,.14),0 2px 6px rgba(13,60,55,.2)}
.band.on-line{box-shadow:0 2px 6px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.num-tile{box-shadow:0 2px 3px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35)}}
.story .nostory{color:var(--muted);font-style:italic;margin:0 0 4px}

/* home: fold-out line picker + search + near me (v46) */
.lines-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.lines-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:600;text-align:left;cursor:pointer;border-radius:14px}
.lines-toggle .lt-text{flex:1;min-width:0}
.lines-toggle .chev{flex:none;color:var(--route);transition:transform .2s}
.lines-card.open .lines-toggle .chev{transform:rotate(180deg)}
.lines-card .num-grid{padding:2px 16px 16px}
.home .finder{gap:12px}
.home .near{align-self:stretch;padding:12px 16px;border-radius:12px;font-size:16px}
.loc-note{font-size:13px;margin:8px 0 0;text-align:center}
#found:empty{display:none}

/* folded line picker shows its first row + a "+" tile (v47) */
.num-tile.more-tile{background:var(--surface);color:var(--route);border:2px solid var(--route);font-size:34px;font-weight:700;box-shadow:none}
.num-tile.more-tile:hover{background:var(--route-soft);filter:none}
.home-rule.mid-rule{margin:0}

/* landing page option A: search and near-me in a soft green panel (v49) */
.home .finder{background:var(--route-soft);border-radius:14px;padding:16px}
.home .finder .search{border-color:transparent}

/* smaller line tiles on the landing page; search + near me as two side-by-side buttons (v50) */
.lines-card .num-grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.lines-card .num-tile{font-size:22px;border-radius:11px}
.lines-card .num-tile.more-tile{font-size:26px}
.finder-btns{display:flex;gap:10px}
.finder-btns[hidden],.search[hidden]{display:none}
.fbtn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border:1px solid transparent;border-radius:12px;background:var(--surface);color:var(--route);font-weight:700;font-size:15px;line-height:1.2;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fbtn svg{flex:none}
.fbtn:hover{border-color:var(--route)}
.search-x{flex:none;display:grid;place-items:center;width:32px;height:32px;margin-right:-6px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.search input::-webkit-search-cancel-button{display:none}
/* dark mode: deeper tile colours so the white numbers stay readable */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num-tile:not(.more-tile),:root:not([data-theme="light"]) .mini-line{background:#1a7d74}
 :root:not([data-theme="light"]) .num-tile.tram,:root:not([data-theme="light"]) .mini-line.tram{background:#b54159}}
:root[data-theme="dark"] .num-tile:not(.more-tile),:root[data-theme="dark"] .mini-line{background:#1a7d74}
:root[data-theme="dark"] .num-tile.tram,:root[data-theme="dark"] .mini-line.tram{background:#b54159}

/* quiz game (v51) */
.fbtn.play{background:var(--route);color:#fff}
.fbtn.play:hover{filter:brightness(1.08);border-color:transparent}
.game{gap:14px}
.game-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.game-card.intro,.game-card.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px}
.game-card h2{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0}
.game-card p{margin:0}
.game-icon{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--route-soft);color:var(--route)}
.game-icon svg{width:30px;height:30px}
.game-best{color:var(--muted);font-size:14px}
.btn.primary{background:var(--route);color:#fff;border-color:var(--route)}
.btn.primary:hover{filter:brightness(1.08);background:var(--route)}
.game-card .btn{padding:12px 22px;font-size:16px}
.game-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.game-dots{display:flex;gap:6px}
.game-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.game-dots i.cur{background:none;box-shadow:inset 0 0 0 2px var(--route)}
.game-dots i.ok{background:var(--ok)}
.game-dots i.no{background:var(--tram)}
.game-kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--route);margin:0 0 6px!important}
.game-q{font-family:var(--f-body)!important;font-size:19px!important;font-weight:700;line-height:1.35!important;margin:0 0 14px!important}
.game-opts{display:flex;flex-direction:column;gap:8px}
.gopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.3;cursor:pointer}
@media (hover:hover){.game-opts:not(.still) .gopt:not([disabled]):hover{border-color:var(--route);background:var(--route-soft)}}
.gopt[disabled]{cursor:default}
.gopt.right{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
.gopt.wrong{border-color:var(--tram);background:var(--tram-soft)}
.gopt.dim{opacity:.55}
.gmark{font-weight:800;font-size:18px}
.gopt.right .gmark{color:var(--ok)}
.gopt.wrong .gmark{color:var(--tram)}
.game-fb:empty{display:none}
.game-fb{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.game-verdict{font-weight:700;font-size:17px}
.game-verdict.ok{color:var(--ok)}
.game-verdict.no{color:var(--tram)}
.game-ex{font-size:16px;line-height:1.5}
.game-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.game-acts .btn{flex:1 1 auto;padding:11px 14px;font-size:15px}
.game-big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;color:var(--route)}
.game-msg{font-size:17px;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fbtn.play,:root:not([data-theme="light"]) .btn.primary{background:#1a7d74;border-color:#1a7d74}}
:root[data-theme="dark"] .fbtn.play,:root[data-theme="dark"] .btn.primary{background:#1a7d74;border-color:#1a7d74}

/* story pop-up from the quiz (v52) */
.story-title{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:2px 0 6px}
.story-lines{display:flex;flex-wrap:wrap;gap:4px}
.story.pop{box-shadow:none}
.story.pop h3{margin-top:0}
.sheet-close{width:100%;padding:13px;font-size:16px}
.gopt{-webkit-tap-highlight-color:transparent}
.gopt:focus{outline:none}
.gopt:focus-visible{outline:2px solid var(--route);outline-offset:2px}



/* ── London edition ─────────────────────────────────────────────────────
   Neutral Stop Stories look (no roundel, no TfL typeface). Line colours only
   identify the lines; each line page sets --lc (line colour), --lc-ink (text on
   it) and --route (an accent that stays readable on white). */
.band.on-line{background:var(--lc,#16201f);color:var(--lc-ink,#fff)}
.band.on-line .eyebrow{color:inherit;opacity:.82}
.band.on-line .back{color:inherit;border-color:currentColor;opacity:.9}
.band.on-line h1{color:inherit}
.lineno[hidden]{display:none}

/* home: the eleven lines as named rows with a colour bar */
.tube-groups{padding:0 14px 16px}
.tube-groups[hidden]{display:none}
.tube-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.tube-groups .mode-label:first-child{margin-top:2px}
.tube-card .lines-toggle{font-size:17px}
.tube-card .lines-toggle .chev{color:var(--muted)}
.tube-tile{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px 6px 0;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 10px rgba(13,60,55,.12);transition:transform .12s,border-color .12s}
.tube-tile:hover{border-color:var(--muted)}
.tube-tile:active{transform:scale(.97)}
.tube-tile .bar{flex:none;align-self:stretch;width:12px;margin:-6px 0;background:var(--lc)}
.tube-tile b{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05}
@media (max-width:340px){.tube-grid{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tube-tile{box-shadow:0 2px 3px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.3)}}

/* small line badges (near me, quiz pop-ups) */
.mini-line{background:var(--lc)!important;color:var(--lc-ink)!important;font-size:13px;min-width:34px;letter-spacing:.02em}

/* route chooser for lines with branches */
.branch-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:-10px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--route);font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.branch-btn:hover{border-color:var(--route);background:var(--route-soft)}
.branch-btn small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.branch-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.branch-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:15.5px;line-height:1.3}
.branch-list button:hover{border-color:var(--route)}
.branch-list button[aria-current="true"]{border-color:var(--route);box-shadow:0 0 0 2px var(--route-soft);font-weight:700}
.branch-list .n{flex:none;font-size:13px;color:var(--muted);font-weight:400}
.branch-list .t{flex:1;min-width:0}

/* line-coloured accents on the line and station pages */
.fb-about .lineno{background:var(--lc);color:var(--lc-ink);font-size:14px;min-width:0;padding:0 8px}

/* About page: lists of what the AI did and of the sources */
.about-list{margin:-6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.about-list li{line-height:1.45}
.about-page a{overflow-wrap:anywhere}
.home-foot .ai-note a{font-weight:400;color:var(--muted)}

</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <button class="back" id="back" aria-label="Back" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="band-title">
      <div class="brandrow"><span class="eyebrow" id="bandEyebrow">London</span>
        <div class="langpick" id="langBar" hidden>
          <button class="flagbtn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language"></button>
          <div class="langmenu" id="langMenu" role="menu" hidden><button data-lang="en" lang="en" role="menuitemradio"></button><button data-lang="fr" lang="fr" role="menuitemradio"></button><button data-lang="de" lang="de" role="menuitemradio"></button></div>
        </div>
      </div>
      <h1 id="bandTitle">Stop Stories</h1>
      <p class="tagline" id="bandTag" hidden></p>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" hidden></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card" id="sheetCard"></div>
</div>

<script>
// ── Settings ──
// Address that receives feedback from the "Help us improve" form.
const OWNER_EMAIL = "jacquesbrosius@hotmail.com";

// Generated by build.py. Station texts written from public sources (see Read more links);
// lines, stations and locations from TfL open data (Unified API, 01 November 2026).
const STOPS = {"Abbey Road": {"name": "Abbey Road", "q": "Newham", "zone": "2/3", "head": "Named after the road to Stratford Langthorne Abbey.", "text": "The Cistercian abbey was founded in 1135 and was one of the richest in England until Henry VIII closed it. This is not the Abbey Road of the Beatles, which is in St John's Wood.", "links": [{"t": "Stratford Langthorne Abbey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Stratford_Langthorne_Abbey"}, {"t": "Abbey Road DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Abbey_Road_DLR_station"}], "ll": [[51.531926, 0.003737]]}, "Abbey Wood": {"name": "Abbey Wood", "q": "Greenwich and Bexley", "zone": "4", "head": "Named after the woods by Lesnes Abbey.", "text": "The abbey was founded in 1178 by Richard de Luci; tradition says he did it in penance for his part in the quarrel that led to the murder of Thomas Becket. It was closed in the 1520s, and its ruins stand in a park near the station.", "links": [{"t": "Lesnes Abbey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lesnes_Abbey"}, {"t": "Abbey Wood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Abbey_Wood"}, {"t": "Abbey Wood railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Abbey_Wood_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.491284, 0.121087]]}, "Acton Central": {"name": "Acton Central", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. 'Central' was added in the 1920s to tell it apart from Acton's other stations.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "Acton Central railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton_Central_railway_station"}], "ll": [[51.508716, -0.262971]]}, "Acton Main Line": {"name": "Acton Main Line", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. 'Main Line' tells it apart from the other Actons: it is on the Great Western main line from Paddington.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "Acton Main Line railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton_Main_Line_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.51718, -0.266756]]}, "Acton Town": {"name": "Acton Town", "q": "Ealing", "zone": "3", "head": "'Acton' means the farm by the oak trees.", "text": "The name comes from two Old English words: āc, oak, and tūn, a farm or settlement. The station opened in 1879 as Mill Hill Park and was renamed Acton Town in 1910.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "Acton Town tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton_Town_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.503057, -0.280462]]}, "Aldgate": {"name": "Aldgate", "q": "City of London", "zone": "1", "head": "Named after Aldgate, one of the gates in London's Roman and medieval wall.", "text": "Nobody is sure what 'Ald' means. Suggestions include 'old gate', an 'ale gate' with a tavern, a Saxon called Ealh, or a gate open to all. The gate itself was pulled down in 1761.", "links": [{"t": "Aldgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Aldgate"}, {"t": "Aldgate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Aldgate_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.514246, -0.075689]]}, "Aldgate East": {"name": "Aldgate East", "q": "Tower Hamlets", "zone": "1", "head": "Named after Aldgate, an old gate in the City wall, and placed just east of it.", "text": "'East' tells it apart from Aldgate station a short walk away. The origin of 'Aldgate' is uncertain: an old gate, an ale gate with a tavern, or a Saxon called Ealh are among the ideas.", "links": [{"t": "Aldgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Aldgate"}, {"t": "Aldgate East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Aldgate_East_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.515037, -0.072384]]}, "All Saints": {"name": "All Saints", "q": "Tower Hamlets", "zone": "2", "head": "Named after All Saints Church, the parish church of Poplar.", "text": "The church was built in the 1820s, when Poplar became a parish of its own. Its tall spire stands just north of the station.", "links": [{"t": "All Saints Church, Poplar", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/All_Saints_Church,_Poplar"}, {"t": "All Saints DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/All_Saints_DLR_station"}], "ll": [[51.511, -0.013135]]}, "Alperton": {"name": "Alperton", "q": "Brent", "zone": "4", "head": "'Alperton' means the farm of a man called Ealhbeorht.", "text": "Nothing else is known about him. The station opened in 1903 as Perivale-Alperton and took its present name in 1910.", "links": [{"t": "Alperton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Alperton"}, {"t": "Alperton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Alperton_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.540627, -0.29961]]}, "Amersham": {"name": "Amersham", "q": "Buckinghamshire", "zone": "9", "head": "'Amersham' means the home of a Saxon called Ealhmund.", "text": "It was recorded in Anglo-Saxon times as Agmodesham, with -ham meaning a homestead. The Metropolitan Railway reached the town in 1892.", "links": [{"t": "Amersham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Amersham"}, {"t": "Amersham station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Amersham_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.674126, -0.607714]]}, "Anerley": {"name": "Anerley", "q": "Bromley", "zone": "4", "head": "'Anerley' is said to come from a northern word for 'lonely'.", "text": "The landowner, William Sanderson, called his house Anerley because it stood alone. He gave land for the railway on condition that a station was built, and it opened in 1839.", "links": [{"t": "Anerley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Anerley"}, {"t": "Anerley railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Anerley_railway_station"}], "ll": [[51.412153, -0.065886]]}, "Angel": {"name": "Angel", "q": "Islington", "zone": "1", "head": "Named after the Angel, a famous coaching inn.", "text": "The inn stood at the junction of the Great North Road and Pentonville Road, where coaches stopped before the last stretch into London. It survived into the 20th century, and the station opened nearby in 1901.", "links": [{"t": "Angel, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Angel,_London"}, {"t": "Angel tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Angel_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.53184, -0.10635]]}, "Archway": {"name": "Archway", "q": "Islington", "zone": "2/3", "head": "Named after the bridge that carries Hornsey Lane over the road to the north.", "text": "The first archway was built in 1813 and replaced around 1900 by the iron bridge seen today. The station was called Highgate when it opened in 1907 and only became Archway in 1947.", "links": [{"t": "Archway, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Archway,_London"}, {"t": "Archway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Archway_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.565478, -0.134819]]}, "Arnos Grove": {"name": "Arnos Grove", "q": "Enfield", "zone": "4", "head": "The name probably recalls the Arnold family, landowners in the 14th century.", "text": "Over the centuries 'Arnold's Grove' seems to have become Arno's Grove and then Arnos Grove, though the link is not certain. The round station building of 1932 is one of Charles Holden's best known designs.", "links": [{"t": "Arnos Grove", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Arnos_Grove"}, {"t": "Arnos Grove tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Arnos_Grove_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.616446, -0.133062]]}, "Arsenal": {"name": "Arsenal", "q": "Islington", "zone": "2", "head": "Named after Arsenal Football Club, whose old Highbury ground was next door.", "text": "The club was founded at the Royal Arsenal in Woolwich and moved to Highbury in 1913. The station opened in 1906 as Gillespie Road and was renamed in 1932, after a campaign by the club's manager Herbert Chapman. The old name can still be seen in the tiles.", "links": [{"t": "Arsenal F.C.", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Arsenal_F.C."}, {"t": "Arsenal tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Arsenal_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.558655, -0.107457]]}, "Baker Street": {"name": "Baker Street", "q": "Westminster", "zone": "1", "head": "Named after William Baker, who laid out the street in the 18th century.", "text": "The station opened in 1863 on the world's first underground railway, the Metropolitan Railway. Baker Street is also the fictional home of Sherlock Holmes, at 221B.", "links": [{"t": "Baker Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Baker_Street"}, {"t": "Baker Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Baker_Street_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.522883, -0.15713]]}, "Balham": {"name": "Balham", "q": "Wandsworth", "zone": "3", "head": "'Balham' probably means a homestead in a rounded enclosure.", "text": "The place is in the Domesday Book of 1086 as Belgeham. The first part may come from an Old English word for something round or smooth.", "links": [{"t": "Balham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Balham"}, {"t": "Balham station#London Underground station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Balham_station%23London_Underground_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.443288, -0.152997]]}, "Bank": {"name": "Bank", "q": "City of London", "zone": "1", "head": "Named after the Bank of England, which stands above the station.", "text": "The Waterloo & City line arrived here first, in 1898, in a station simply called City. Today Bank is one of the largest stations on the network, with several lines meeting under the old heart of the City.", "links": [{"t": "Bank of England", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bank_of_England"}, {"t": "Bank and Monument stations", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bank_and_Monument_stations"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.513132, -0.090047]]}, "Barbican": {"name": "Barbican", "q": "City of London", "zone": "1", "head": "'Barbican' means a watchtower or outer defence of a fortified town.", "text": "The name probably recalls a tower on or near London's Roman and medieval wall. The station opened in 1865 as Aldersgate Street, after another gate in the wall, and only became Barbican in 1968.", "links": [{"t": "Barbican Estate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barbican_Estate"}, {"t": "Barbican tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barbican_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.520275, -0.097993]]}, "Barking": {"name": "Barking", "q": "Barking and Dagenham", "zone": "4", "head": "'Barking' means the people of Bereca, or the settlement by the birch trees.", "text": "It was recorded as Berecingum in 735. Barking Abbey, founded in the 7th century, was one of the most important nunneries in England.", "links": [{"t": "Barking, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barking,_London"}, {"t": "Barking station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barking_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.539321, 0.081053]]}, "Barking Riverside": {"name": "Barking Riverside", "q": "Barking and Dagenham", "zone": "4", "head": "Named after a new town on the banks of the Thames at Barking.", "text": "It is being built on the site of old power stations. The station opened in 2022 at the end of a new branch line.", "links": [{"t": "Barking Riverside", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barking_Riverside"}, {"t": "Barking Riverside railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barking_Riverside_railway_station"}], "ll": [[51.51953, 0.11596]]}, "Barkingside": {"name": "Barkingside", "q": "Redbridge", "zone": "4", "head": "'Barkingside' means the Barking side of Hainault Forest.", "text": "The area lay just inside the old manor and parish of Barking, whose boundary ran through the forest. A map of 1777 shows 'Barking Side' as a long strip of common land on the forest's western edge.", "links": [{"t": "Barkingside", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barkingside"}, {"t": "Barkingside tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barkingside_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.585689, 0.088585]]}, "Barons Court": {"name": "Barons Court", "q": "Hammersmith and Fulham", "zone": "2", "head": "An invented name, chosen around 1900 for new houses.", "text": "It may come from Baronscourt in Northern Ireland, linked to the developer Sir William Palliser, or be a play on Earl's Court, the next stop on the Piccadilly line.", "links": [{"t": "Barons Court", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barons_Court"}, {"t": "Barons Court tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barons_Court_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.490311, -0.213427]]}, "Battersea Power Station": {"name": "Battersea Power Station", "q": "Wandsworth", "zone": "1", "head": "Named after the power station next door, now shops, homes and offices.", "text": "Battersea itself is one of London's oldest recorded names: in the 7th century it was Badrices īeg, Badric's island, dry ground in the marshes by the Thames. The station opened in 2021 at the end of the Northern line extension.", "links": [{"t": "Battersea Power Station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battersea_Power_Station"}, {"t": "Battersea", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battersea"}, {"t": "Battersea Power Station tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battersea_Power_Station_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.479932, -0.142142]]}, "Bayswater": {"name": "Bayswater", "q": "Westminster", "zone": "1", "head": "'Bayswater' recalls Bayard's Watering, recorded in 1380.", "text": "'Bayard' may be a family name, or an old word for a horse. The 'watering' was a place by the River Westbourne where animals drank; the river now flows in a pipe under the streets.", "links": [{"t": "Bayswater", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bayswater"}, {"t": "Bayswater tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bayswater_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.512284, -0.187938]]}, "Beckton": {"name": "Beckton", "q": "Newham", "zone": "3", "head": "Named after Simon Adams Beck, governor of the Gas Light and Coke Company.", "text": "Work on the company's gasworks began here in 1868; it became the largest gasworks in the world. After it closed, its ruins were used as a film set, for example for Full Metal Jacket.", "links": [{"t": "Beckton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Beckton"}, {"t": "Beckton Gas Works", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Beckton_Gas_Works"}, {"t": "Beckton DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Beckton_DLR_station"}], "ll": [[51.514362, 0.061453]]}, "Beckton Park": {"name": "Beckton Park", "q": "Newham", "zone": "3", "head": "Named after Beckton and its park, recalling Simon Adams Beck of the Gas Light and Coke Company.", "text": "Beckton grew around the company's huge gasworks, begun in 1868. Besides gas, it produced by-products such as tar, dyes and fertiliser.", "links": [{"t": "Beckton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Beckton"}, {"t": "Beckton Park DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Beckton_Park_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.508793, 0.054932]]}, "Becontree": {"name": "Becontree", "q": "Barking and Dagenham", "zone": "5", "head": "'Becontree' probably means the tree of a Saxon called Beohha.", "text": "It was the name of an old meeting place of the local hundred, a unit of the county. After the First World War it was given to a huge new council estate, one of the largest in the world at the time.", "links": [{"t": "Becontree", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Becontree"}, {"t": "Becontree tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Becontree_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.540331, 0.127016]]}, "Belsize Park": {"name": "Belsize Park", "q": "Camden", "zone": "2", "head": "'Belsize' comes from the French bel assis, beautifully situated.", "text": "The name is recorded from the 14th century for an estate on the slopes below Hampstead. The station opened in 1907.", "links": [{"t": "Belsize Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Belsize_Park"}, {"t": "Belsize Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Belsize_Park_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.550311, -0.164648]]}, "Bermondsey": {"name": "Bermondsey", "q": "Southwark", "zone": "2", "head": "'Bermondsey' means the island of a man called Beornmund.", "text": "The 'island' was a patch of raised dry ground in the marshes south of the Thames. The place is recorded in the Domesday Book of 1086, and the station opened in 1999 on the Jubilee line extension.", "links": [{"t": "Bermondsey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bermondsey"}, {"t": "Bermondsey tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bermondsey_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.49775, -0.063993]]}, "Bethnal Green": {"name": "Bethnal Green", "q": "Tower Hamlets", "zone": "2", "head": "'Bethnal' probably means the corner of a man called Blitha.", "text": "Early spellings such as Blithehale point to Old English blithe, happy, or a personal name, and healh, a corner of land. 'Green' was the open village green, which survives as a park.", "links": [{"t": "Bethnal Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bethnal_Green"}, {"t": "Bethnal Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bethnal_Green_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.527222, -0.055506], [51.523917, -0.059568]]}, "Blackfriars": {"name": "Blackfriars", "q": "City of London", "zone": "1", "head": "Named after the black-robed Dominican friars, who had a priory here.", "text": "The friars moved here in the 13th century and stayed until Henry VIII closed the monasteries. Their name lives on in the bridge, the station and the area.", "links": [{"t": "Blackfriars, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackfriars,_London"}, {"t": "Blackfriars station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackfriars_station%23London_Underground"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.511581, -0.103659]]}, "Blackhorse Road": {"name": "Blackhorse Road", "q": "Waltham Forest", "zone": "3", "head": "Named after the road, whose name is probably a corruption of Black House Lane.", "text": "The 'black house' was a local mansion, so the black horse on the station's tiles is a later idea. The station opened with the Victoria line in 1968.", "links": [{"t": "Blackhorse Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackhorse_Road_tube_station"}, {"t": "Blackhorse Road station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackhorse_Road_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.586919, -0.04115]]}, "Blackwall": {"name": "Blackwall", "q": "Tower Hamlets", "zone": "2", "head": "'Blackwall' means the dark embankment along the Thames.", "text": "The name probably comes from the dark colour of the medieval river wall. Ships sailed from Blackwall in 1606 to found Jamestown in Virginia, the first lasting English colony in America.", "links": [{"t": "Blackwall, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackwall,_London"}, {"t": "Blackwall DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Blackwall_DLR_station"}], "ll": [[51.507991, -0.006969]]}, "Bond Street": {"name": "Bond Street", "q": "Westminster", "zone": "1", "head": "Named after Sir Thomas Bond, who developed the street in the 17th century.", "text": "Bond bought land here and laid out the street. Today there is no street simply called Bond Street: it is made up of Old Bond Street and New Bond Street.", "links": [{"t": "Bond Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bond_Street"}, {"t": "Bond Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bond_Street_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.514304, -0.149723]]}, "Borough": {"name": "Borough", "q": "Southwark", "zone": "1", "head": "Named after the Borough of Southwark, the town at the south end of London Bridge.", "text": "For centuries this was London's main suburb, so it was simply called 'the Borough'. The station opened in 1890 on the first deep-level tube line.", "links": [{"t": "Borough, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Borough,_London"}, {"t": "Borough tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Borough_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.501199, -0.09337]]}, "Boston Manor": {"name": "Boston Manor", "q": "Hounslow", "zone": "4", "head": "Named after Boston Manor House, a Jacobean mansion near the station.", "text": "The name has nothing to do with Boston in Lincolnshire or Massachusetts: it probably goes back to a medieval name for the farm of a man called Bord. The station was called Boston Road until 1911.", "links": [{"t": "Boston Manor House", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Boston_Manor_House"}, {"t": "Boston Manor tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Boston_Manor_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.495635, -0.324939]]}, "Bounds Green": {"name": "Bounds Green", "q": "Haringey", "zone": "3/4", "head": "Named after the le Bounde family, who held land here in the Middle Ages.", "text": "Their name survived in a local farm, and the station took it when the Piccadilly line arrived in 1932.", "links": [{"t": "Bounds Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bounds_Green"}, {"t": "Bounds Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bounds_Green_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.607034, -0.124235]]}, "Bow Church": {"name": "Bow Church", "q": "Tower Hamlets", "zone": "2", "head": "Named after St Mary's Church, Bow, which stands on an island in the middle of the road.", "text": "Bow itself is named after a bow-shaped bridge over the River Lea, built in the early 12th century.", "links": [{"t": "St Mary's Church, Bow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Mary's_Church,_Bow"}, {"t": "Bow Church DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bow_Church_DLR_station"}], "ll": [[51.527858, -0.020936]]}, "Bow Road": {"name": "Bow Road", "q": "Tower Hamlets", "zone": "2", "head": "Named after the bow-shaped bridge over the River Lea.", "text": "The arched bridge was built in the early 12th century, by tradition at the wish of Queen Matilda, and gave its name to the village of Bow.", "links": [{"t": "Bow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bow,_London"}, {"t": "Bow Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bow_Road_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.52694, -0.025128]]}, "Brent Cross": {"name": "Brent Cross", "q": "Barnet", "zone": "3", "head": "Named after the River Brent and a crossroads nearby.", "text": "'Brent' is a Celtic name, much older than English, and may mean 'the holy one' or 'the high one'. The station opened in 1923 as Brent and became Brent Cross in 1976.", "links": [{"t": "River Brent", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/River_Brent"}, {"t": "Brent Cross tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brent_Cross_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.57665, -0.213622]]}, "Brentwood": {"name": "Brentwood", "q": "Essex", "zone": "9", "head": "'Brentwood' means the burnt wood.", "text": "In 1176 it was written in Latin as bosco arso, 'burnt wood': a forest partly cleared by fire. The town grew up on the road from London to Colchester.", "links": [{"t": "Brentwood, Essex", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brentwood,_Essex"}, {"t": "Brentwood railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brentwood_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.613605, 0.299586]]}, "Brixton": {"name": "Brixton", "q": "Lambeth", "zone": "2", "head": "'Brixton' means the stone of a man called Beorhtsige.", "text": "The stone was probably a meeting place for the local hundred, an old unit of the county. The Victoria line reached Brixton in 1971.", "links": [{"t": "Brixton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brixton"}, {"t": "Brixton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brixton_tube_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.462618, -0.114888]]}, "Brockley": {"name": "Brockley", "q": "Lewisham", "zone": "2", "head": "'Brockley' means the clearing of a man called Broca, or one where badgers live.", "text": "Old English brocc means badger, and lēah a clearing in a wood. The area grew in Victorian times, with many large villas.", "links": [{"t": "Brockley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brockley"}, {"t": "Brockley railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brockley_railway_station"}], "ll": [[51.464649, -0.037537]]}, "Bromley-by-Bow": {"name": "Bromley-by-Bow", "q": "Tower Hamlets", "zone": "2/3", "head": "'Bromley' means a clearing where broom grows.", "text": "'By-Bow' was added in 1968 to stop people confusing it with Bromley in Kent. Bow itself is named after a bow-shaped bridge over the River Lea.", "links": [{"t": "Bromley-by-Bow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bromley-by-Bow"}, {"t": "Bromley-by-Bow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bromley-by-Bow_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.524839, -0.011538]]}, "Brondesbury": {"name": "Brondesbury", "q": "Brent", "zone": "2", "head": "'Brondesbury' means the manor of a man called Brand.", "text": "It was one of the manors of St Paul's Cathedral, whose income went to one of the cathedral's canons.", "links": [{"t": "Brondesbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brondesbury"}, {"t": "Brondesbury railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brondesbury_railway_station"}], "ll": [[51.545166, -0.202309]]}, "Brondesbury Park": {"name": "Brondesbury Park", "q": "Brent", "zone": "2", "head": "Named after Brondesbury, the manor of a man called Brand, and a park estate built there.", "text": "The houses were built in the late 19th century on land of the old manor, which belonged to St Paul's Cathedral.", "links": [{"t": "Brondesbury Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brondesbury_Park"}, {"t": "Brondesbury Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Brondesbury_Park_railway_station"}], "ll": [[51.540734, -0.210054]]}, "Bruce Grove": {"name": "Bruce Grove", "q": "Haringey", "zone": "3", "head": "Named after Bruce Castle, a Tudor manor house in Tottenham.", "text": "The house is said to recall the Scottish royal family of Bruce, who held land in Tottenham in the Middle Ages. It is now a museum.", "links": [{"t": "Bruce Castle", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bruce_Castle"}, {"t": "Bruce Grove railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bruce_Grove_railway_station"}], "ll": [[51.593959, -0.069867]]}, "Buckhurst Hill": {"name": "Buckhurst Hill", "q": "Epping Forest", "zone": "5", "head": "'Buckhurst' means a wooded hill covered in beech trees.", "text": "It was first recorded in the 12th century as La Bocherste. The hill lies on the edge of Epping Forest, which still has many beeches.", "links": [{"t": "Buckhurst Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Buckhurst_Hill"}, {"t": "Buckhurst Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Buckhurst_Hill_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.626605, 0.046757]]}, "Burnham": {"name": "Burnham", "q": "Berkshire", "zone": "", "head": "'Burnham' means the homestead by a stream.", "text": "It comes from Old English burna, stream, and hām, homestead. Nearby are Burnham Beeches, ancient woods famous for their old beech trees.", "links": [{"t": "Burnham, Buckinghamshire", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Burnham,_Buckinghamshire"}, {"t": "Burnham Beeches", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Burnham_Beeches"}, {"t": "Burnham railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Burnham_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.523506, -0.646374]]}, "Burnt Oak": {"name": "Burnt Oak", "q": "Barnet", "zone": "4", "head": "Named after an old oak tree, said to have been burnt by lightning.", "text": "The name first appears in 1754 for a field beside Watling Street, the old Roman road. The oak itself is long gone.", "links": [{"t": "Burnt Oak", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Burnt_Oak"}, {"t": "Burnt Oak tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Burnt_Oak_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.602774, -0.264048]]}, "Bush Hill Park": {"name": "Bush Hill Park", "q": "Enfield", "zone": "5", "head": "Named after Bush Hill Park, an old country estate with a mansion.", "text": "The estate dates from the 17th century. Houses were built on it from the late 1870s, and the station opened in 1880 to serve them.", "links": [{"t": "Bush Hill Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bush_Hill_Park"}, {"t": "Bush Hill Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bush_Hill_Park_railway_station"}], "ll": [[51.641519, -0.069221]]}, "Bushey": {"name": "Bushey", "q": "Hertfordshire", "zone": "8", "head": "'Bushey' means an enclosure made of bushes, or one near box trees.", "text": "The second part is Old English hæg, an enclosure; the first may be bysc, bush, or box, box tree. The station is actually in Oxhey, on the Watford side.", "links": [{"t": "Bushey", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bushey"}, {"t": "Bushey railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bushey_railway_station"}], "ll": [[51.645691, -0.385612]]}, "Caledonian Road": {"name": "Caledonian Road", "q": "Islington", "zone": "2", "head": "Named after the Caledonian Asylum, a home for Scottish children.", "text": "The asylum was set up for children of Scottish soldiers and sailors killed or wounded in the Napoleonic Wars, and moved to this road in 1828. 'Caledonia' is the old Latin name for Scotland.", "links": [{"t": "Caledonian Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Caledonian_Road"}, {"t": "Caledonian Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Caledonian_Road_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.548519, -0.118493]]}, "Caledonian Road & Barnsbury": {"name": "Caledonian Road & Barnsbury", "q": "Islington", "zone": "2", "head": "Named after the Caledonian Asylum, and Barnsbury, the manor of the Berners family.", "text": "The asylum was a home for Scottish children ('Caledonia' is Latin for Scotland). Barnsbury recalls the de Berners family, who held the manor in the Middle Ages.", "links": [{"t": "Barnsbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Barnsbury"}, {"t": "Caledonian Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Caledonian_Road"}, {"t": "Caledonian Road & Barnsbury railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Caledonian_Road_&_Barnsbury_railway_station"}], "ll": [[51.543041, -0.116729]]}, "Cambridge Heath": {"name": "Cambridge Heath", "q": "Tower Hamlets", "zone": "2", "head": "Despite the name, Cambridge Heath has nothing to do with Cambridge.", "text": "It was recorded in 1275 as Camprichthesheth; the first part may be an old personal name or a plant name. Over time it was changed to look like the familiar 'Cambridge'.", "links": [{"t": "Cambridge Heath", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cambridge_Heath"}, {"t": "Cambridge Heath railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cambridge_Heath_railway_station"}], "ll": [[51.531973, -0.057279]]}, "Camden Road": {"name": "Camden Road", "q": "Camden", "zone": "2", "head": "Named after Camden Road, which honours Charles Pratt, 1st Earl Camden.", "text": "He owned the land of Camden Town. His title came from Camden Place, his house in Kent, named after the historian William Camden.", "links": [{"t": "Camden Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Camden_Town"}, {"t": "Camden Road railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Camden_Road_railway_station"}], "ll": [[51.541791, -0.138701]]}, "Camden Town": {"name": "Camden Town", "q": "Camden", "zone": "2", "head": "Named after Charles Pratt, 1st Earl Camden, who owned the land.", "text": "In 1791 he began to let it for building houses. His title came from Camden Place, his house in Kent, which had been named after the historian William Camden.", "links": [{"t": "Camden Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Camden_Town"}, {"t": "Camden Town tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Camden_Town_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.539292, -0.14274]]}, "Canada Water": {"name": "Canada Water", "q": "Southwark", "zone": "2", "head": "Named after a lake that was once part of Canada Dock.", "text": "The dock in the Surrey Docks was named after the country, because most of its ships came from Canada, carrying timber. When the docks closed, it was mostly filled in, and the station opened in 1999.", "links": [{"t": "Canada Water", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canada_Water"}, {"t": "Canada Water station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canada_Water_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.497931, -0.049405]]}, "Canary Wharf": {"name": "Canary Wharf", "q": "Tower Hamlets", "zone": "2", "head": "Named after a warehouse for fruit from the Canary Islands.", "text": "Fruit ships from the islands unloaded here from the 1930s. The islands themselves are said to be named after dogs (Latin canis), which fits nicely: Canary Wharf is on the Isle of Dogs.", "links": [{"t": "Canary Wharf", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canary_Wharf"}, {"t": "Canary Wharf tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canary_Wharf_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.503488, -0.018246], [51.506203, -0.018834], [51.504838, -0.020997]]}, "Canning Town": {"name": "Canning Town", "q": "Newham", "zone": "2/3", "head": "Probably named after a Canning, but nobody is sure which one.", "text": "One theory points
