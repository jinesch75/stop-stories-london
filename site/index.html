cien pâturage, le common est aujourd'hui un parc public."], "Clapham North": ["Nommée d'après Clapham, probablement la ferme près d'une colline.", "Le nom en vieil anglais viendrait de clopp, une bosse ou une butte, ou d'un homme nommé Cloppa. La station a ouvert en 1900 sous le nom de Clapham Road et s'appelle Clapham North depuis 1926."], "Clapham South": ["Nommée d'après Clapham, probablement la ferme près d'une colline.", "Elle a ouvert en 1926 ; on avait envisagé de l'appeler « Nightingale Lane ». Sous la station se trouve l'un des huit abris profonds construits pendant la Seconde Guerre mondiale."], "Cockfosters": ["Personne ne sait au juste d'où vient le nom « Cockfosters ».", "Il est attesté au XVIe siècle. Selon une idée répandue, c'était la demeure du « cock forester », le forestier en chef d'Enfield Chase, un domaine de chasse royal."], "Colindale": ["Le nom rappellerait la famille Collin, propriétaire terrien au XVIe siècle.", "Colindale est restée rurale jusqu'au XXe siècle ; elle abrite aujourd'hui le musée de la Royal Air Force, sur le site de l'aérodrome de Hendon."], "Colliers Wood": ["Nommée d'après un bois exploité par des « colliers », des charbonniers.", "Autrefois, un collier était quelqu'un qui fabriquait du charbon de bois, et non un mineur. Le bois a subsisté jusqu'à la fin du XIXe siècle."], "Covent Garden": ["« Covent » est une forme ancienne de « convent », couvent.", "Au Moyen Âge, c'était le jardin de l'abbaye de Westminster. Le célèbre marché aux fruits et légumes y a commencé au XVIIe siècle et a déménagé à Nine Elms en 1974."], "Croxley": ["« Croxley » signifie probablement la clairière d'un homme nommé Crocc.", "Leah, une clairière dans un bois, est l'une des terminaisons les plus fréquentes des noms de lieux anglais. La station a ouvert en 1925 sous le nom de Croxley Green et s'appelle Croxley depuis 1949."], "Dagenham East": ["« Dagenham » signifie la ferme d'un Saxon nommé Dæcca.", "Le nom a été écrit pour la première fois en 666, sous la forme Dæccanhaam, dans une charte de l'abbaye de Barking. La station a ouvert en 1902 sous le nom de Dagenham et s'appelle Dagenham East depuis 1949."], "Dagenham Heathway": ["Nommée d'après Dagenham et le Heathway, la route vers la lande de Becontree.", "Dagenham signifie la ferme d'un Saxon nommé Dæcca. La station a ouvert en 1932 sous le simple nom de Heathway, pour desservir la nouvelle cité de Becontree, et a ajouté « Dagenham » en 1949."], "Debden": ["« Debden » signifie la vallée profonde.", "Il s'agit de la vallée de la rivière Roding. La station a ouvert en 1865 sur une ligne de chemin de fer et s'appelait Chigwell Lane jusqu'en 1949, quand la Central line l'a reprise."], "Dollis Hill": ["Personne ne sait vraiment d'où vient le nom « Dollis Hill ».", "Une hypothèse évoque une famille locale nommée Dalley. Pendant la Seconde Guerre mondiale, le centre de recherche des Postes installé ici a construit Colossus, l'un des premiers ordinateurs électroniques, pour les décrypteurs de Bletchley Park. Le bunker de secours de Churchill, « Paddock », se trouve aussi à proximité."], "Ealing Broadway": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom, noté vers 700 sous la forme Gillingas, s'est lentement transformé en Ylling, puis Ealing. Un « broadway » est une large rue principale, ici la rue commerçante de la ville."], "Ealing Common": ["Nommée d'après le pré communal, une étendue d'herbe à Ealing.", "« Ealing » signifie le peuple d'un Saxon nommé Gilla. De 1886 à 1910, la station s'est appelée Ealing Common and West Acton."], "Earl's Court": ["Nommée d'après la cour seigneuriale des comtes d'Oxford, seigneurs du lieu.", "La famille de Vere, comtes d'Oxford, a tenu ces terres pendant environ cinq siècles, peu après la conquête normande. Leur tribunal seigneurial, où se réglaient les litiges locaux, se trouvait près de la station."], "East Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. East Acton était un hameau distinct, à l'est de la ville ; sa station a ouvert en 1920."], "East Finchley": ["« Finchley » signifie probablement la clairière des pinsons.", "Le nom se termine par le vieil anglais leah, une clairière dans un bois. Sur la station se dresse la statue d'un archer d'Eric Aumonier, qui vise le centre de Londres."], "East Ham": ["« Ham » désigne une terre sèche dans une boucle de rivière ou entre des rivières.", "Ici, la terre se trouve entre la Tamise, la Lea et la Roding. Le lieu est noté sous la forme Hamme environ un siècle avant les Normands ; il a été divisé en East Ham et West Ham au XIIe siècle."], "East Putney": ["« Putney » signifie le débarcadère d'un homme nommé Putta.", "Le Domesday Book de 1086 l'appelle Putelei. Le débarcadère se trouvait sur la Tamise, à l'emplacement actuel du pont de Putney."], "Eastcote": ["« Eastcote » signifie la ou les maisons de l'est.", "Elles se trouvaient à l'est de Ruislip. Ascot, près de Windsor, a la même origine."], "Edgware": ["« Edgware » signifie probablement la pêcherie d'un Saxon nommé Ecgi.", "Un « wer », ou barrage, était un bassin ou une retenue servant à prendre le poisson. La Northern line a atteint Edgware en 1924 ; on prévoyait de la prolonger, mais le projet n'a jamais été achevé."], "Edgware Road": ["Nommée d'après la route d'Edgware, qui suit la voie romaine de Watling Street.", "Edgware signifie probablement la pêcherie d'un Saxon nommé Ecgi. La route file tout droit vers le nord-ouest, comme les voies romaines."], "Elephant & Castle": ["Nommée très probablement d'après une auberge de diligences, l'Elephant and Castle.", "Selon une histoire répandue, le nom viendrait de « Infanta de Castilla », une princesse espagnole, mais les historiens en doutent. Un éléphant portant un château était une enseigne courante, utilisée par exemple par la corporation des couteliers."], "Elm Park": ["Le nom a été choisi dans les années 1930 pour une nouvelle cité-jardin.", "La cité a été construite sur des terres agricoles entre Hornchurch et Rainham, et la station a ouvert en 1935 pour la desservir."], "Embankment": ["Nommée d'après le Victoria Embankment, le quai construit le long de la Tamise dans les années 1860.", "Joseph Bazalgette l'a conçu pour accueillir de nouveaux égouts et le District Railway, et pour créer une route au bord du fleuve. La station a porté plusieurs noms avec « Charing Cross » avant de devenir Embankment en 1976."], "Epping": ["« Epping » signifie probablement le peuple des hauteurs.", "Le nom figure dans le Domesday Book de 1086 sous la forme Eppinges. La grande forêt voisine tient son nom de la ville, et non l'inverse."], "Euston": ["Nommée d'après Euston Hall, dans le Suffolk, demeure des ducs de Grafton.", "Les ducs possédaient les terres ici, et Euston Road et Euston Square ont pris le nom de leur château. Le village d'Euston, dans le Suffolk, signifierait la ferme d'un homme nommé Efe."], "Euston Square": ["Nommée d'après Euston Square, le square près de la grande gare.", "Le nom vient d'Euston Hall, dans le Suffolk, demeure des ducs de Grafton, propriétaires des terres. La station a ouvert en 1863 sous le nom de Gower Street et a été rebaptisée en 1909."], "Fairlop": ["Nommée d'après le Fairlop Oak, un chêne géant de la forêt de Hainault.", "À partir du début du XVIIIe siècle, une foire s'est tenue chaque été sous ce chêne, lancée par un habitant, Daniel Day. L'arbre, abîmé par un incendie, a été abattu par le vent au début du XIXe siècle."], "Farringdon": ["Nommée d'après Nicholas et William de Faringdon, échevins de la City.", "Ils possédaient des terres ici au XIIIe siècle, et leur nom est passé à un quartier de la City, à une rue et à la station. Farringdon fut l'une des premières stations du premier chemin de fer souterrain du monde, ouvert en 1863."], "Finchley Central": ["« Finchley » signifie probablement la clairière des pinsons.", "La station a ouvert en 1867 sur une ligne de chemin de fer et s'est appelée Finchley (Church End) jusqu'en 1940, date à laquelle elle est devenue Finchley Central."], "Finchley Road": ["Nommée d'après la route de Finchley, construite dans les années 1820 comme route à péage.", "Finchley signifie probablement la clairière des pinsons. La nouvelle route évitait les côtes raides de Hampstead, plus à l'est."], "Finsbury Park": ["Nommée d'après un parc ouvert en 1869, qui ne se trouve pourtant pas à Finsbury.", "Le parc était destiné aux habitants de l'ancien arrondissement de Finsbury, plus au sud. « Finsbury » signifie probablement le manoir d'un homme nommé Finn."], "Fulham Broadway": ["« Fulham » signifie la terre au bord de l'eau d'un homme nommé Fulla.", "Le nom est noté vers 700 sous la forme Fulanham. La station a ouvert en 1880 sous le nom de Walham Green, d'après le pré communal du village, et s'appelle Fulham Broadway depuis 1952."], "Gants Hill": ["Nommée probablement d'après la famille le Gant, intendants des terres de l'abbaye de Barking.", "La famille est attestée ici dès le XIIIe siècle. La station, ouverte en 1947, possède entre les quais une longue salle voûtée inspirée du métro de Moscou."], "Gloucester Road": ["Nommée d'après Maria, duchesse de Gloucester, qui y fit construire une maison en 1805.", "Auparavant, la rue s'appelait Hog Moore Lane. La station a ouvert en 1868 sous le nom de Brompton (Gloucester Road)."], "Golders Green": ["Nommée d'après la famille Godyere, qui possédait des terres ici au XIVe siècle.", "Le « green » était un terrain ouvert à côté de leur propriété. Le village s'est développé très vite après l'arrivée du métro en 1907."], "Goldhawk Road": ["Nommée probablement d'après John Goldhawk, propriétaire terrien au XVe siècle.", "Il possédait de vastes terres dans le secteur, qui faisait alors partie de la paroisse de Fulham. La station a ouvert en 1914."], "Goodge Street": ["Nommée d'après John Goodge, qui a loti les terrains à partir de 1746.", "Avant la construction des maisons, c'était un pré appelé Crab Tree Field. La station a ouvert en 1907 sous le nom de Tottenham Court Road et a pris le nom de Goodge Street un an plus tard."], "Grange Hill": ["Une « grange » était une ferme avec granges, appartenant souvent à un monastère.", "Celle-ci se dressait sur une colline. Le nom n'a aucun lien avec la série télévisée pour enfants Grange Hill."], "Great Portland Street": ["Nommée d'après la rue, qui honore les ducs de Portland.", "Le 2e duc de Portland possédait les terres à partir de 1734. La station a ouvert en 1863 sous le nom de Portland Road."], "Green Park": ["Nommée d'après le parc, rebaptisé The Green Park en 1746.", "Il s'appelait d'abord Upper St James's Park. Le nouveau nom décrivait sans doute sa prairie dégagée, avec peu d'arbres et sans massifs de fleurs. La station a ouvert en 1906 sous le nom de Dover Street."], "Greenford": ["« Greenford » signifie le gué vert.", "Le gué franchissait la rivière Brent, qui serpente toujours dans le secteur entre des rives verdoyantes."], "Gunnersbury": ["« Gunnersbury » signifie le manoir d'une femme nommée Gunnhild.", "Gunnhild est un prénom scandinave. Une légende le rattache à une nièce du roi Knut, mais rien ne le prouve."], "Hainault": ["« Hainault » signifie probablement le bois d'une communauté religieuse.", "Le nom est noté en 1221 sous la forme Henehout, du vieil anglais désignant le bois d'un monastère, ici celui de l'abbaye de Barking. L'orthographe à la française est venue plus tard, d'un rapprochement erroné avec Philippa de Hainaut, épouse d'Édouard III."], "Hammersmith": ["« Hammersmith » désigne probablement un lieu avec une forge à marteau.", "Le nom est attesté pour la première fois en 1294. Une autre hypothèse, moins probable, y voit le débarcadère d'un homme nommé Hammoder."], "Hampstead": ["« Hampstead » signifie simplement ferme ou domaine.", "Le nom vient du vieil anglais hām-stede, comme Berkhamsted et Wheathampstead. La station de Hampstead, ouverte en 1907, possède les quais les plus profonds du métro."], "Hanger Lane": ["« Hanger » désigne une pente boisée.", "Le mot vient du vieil anglais hangra, un bois sur un coteau escarpé. Le même mot a donné Hanger Hill, tout proche."], "Harlesden": ["« Harlesden » signifie la ferme d'un homme nommé Heoruwulf.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Herulvestune, -tune désignant une ferme. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Harrow & Wealdstone": ["Nommée d'après Harrow et Wealdstone, la borne de Harrow Weald.", "« Harrow » vient du vieil anglais hearg, un temple païen. « Weald » signifie forêt, et la pierre marquait la limite des bois au nord de Harrow. La gare a ouvert en 1837 sur le London and Birmingham Railway."], "Harrow-on-the-Hill": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement au sommet de la colline, là où se dresse aujourd'hui l'église St Mary. La station a ouvert en 1880 sous le nom de Harrow et a ajouté « on-the-Hill » en 1894."], "Hatton Cross": ["« Hatton » signifie la ferme sur la lande.", "Cette lande était Hounslow Heath, où se trouve aujourd'hui l'aéroport d'Heathrow. « Cross » désigne probablement un carrefour."], "Heathrow Terminal 4": ["« Heathrow » signifie la rangée de maisons sur la lande.", "Le nom apparaît en 1410 sous la forme La Hetherewe, un hameau sur Hounslow Heath. Le terminal 4 a ouvert en 1986, avec sa propre station sur une boucle de la Piccadilly line."], "Heathrow Terminal 5": ["« Heathrow » signifie la rangée de maisons sur la lande.", "Le hameau, attesté dès 1410, a disparu lors de la construction de l'aéroport dans les années 1940. Le terminal 5 et sa station ont ouvert en 2008."], "Heathrow Terminals 2 & 3": ["« Heathrow » signifie la rangée de maisons sur la lande.", "La station a ouvert en 1977 sous le nom de Heathrow Central. Elle s'appelle Heathrow Terminals 2 & 3 depuis 2016, après la fermeture du terminal 1."], "Hendon Central": ["« Hendon » signifie sur la haute colline.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Hendun. La station a ouvert en 1923."], "High Barnet": ["« Barnet » désigne une terre défrichée par le feu.", "Le nom vient du vieil anglais bærnet, brûlis. La ville s'appelle aussi Chipping Barnet, « chipping » signifiant marché. En 1471, la bataille de Barnet, épisode de la guerre des Deux-Roses, s'est déroulée juste au nord de la ville."], "High Street Kensington": ["« Kensington » signifie la ferme d'un Saxon nommé Cynesige.", "Le lieu figure dans le Domesday Book sous la forme Chenesitun. La station a ouvert en 1868 sur Kensington High Street, près du palais de Kensington."], "Highbury & Islington": ["« Highbury » signifie le manoir d'en haut ; « Islington », la colline d'un homme nommé Gisla.", "Islington est noté vers l'an 1000 sous la forme Gislandune. Highbury était le plus élevé des deux manoirs de la paroisse. La station de la Victoria line a ouvert en 1968."], "Highgate": ["Nommée d'après une porte haute sur la colline, un péage sur la route du nord.", "La porte donnait accès au parc de chasse de l'évêque de Londres, et les voyageurs de la Great North Road y payaient un péage. Highgate est l'un des points les plus élevés de Londres."], "Hillingdon": ["« Hillingdon » signifie probablement la colline d'un homme nommé Hilla.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Hillendone, -done désignant une colline. La station a ouvert en 1923."], "Holborn": ["« Holborn » signifie probablement le ruisseau du creux.", "Ce ruisseau était un affluent de la Fleet, enfoui depuis longtemps. Les Londoniens prononcent traditionnellement « Ho-beune »."], "Holland Park": ["Nommée d'après Holland House, un manoir du XVIIe siècle dont le parc est devenu public.", "La maison tient son nom d'Henry Rich, comte de Holland, dont le titre venait de la région de Holland, dans le Lincolnshire, et non des Pays-Bas. Plus tard, la famille Fox, barons Holland, y a vécu."], "Holloway Road": ["« Holloway » signifie le chemin creux, une route creusée dans le sol.", "Le bétail et les charrettes se rendant aux marchés de Londres ont usé la route pendant des siècles. L'autre idée, un « chemin sacré » pour les pèlerins, est moins probable."], "Hornchurch": ["« Hornchurch » signifie l'église aux cornes.", "Le nom est attesté en 1222. Nul ne sait exactement pourquoi, mais l'église St Andrew porte toujours, sur son pignon est, une tête de taureau avec de vraies cornes."], "Hounslow Central": ["« Hounslow » signifie probablement le tertre du chien.", "Le « chien » pourrait être un animal ou un homme surnommé Hund, et le tertre un tumulus. La station a ouvert en 1886 sous le nom de Heston Hounslow et a été rebaptisée en 1925."], "Hounslow East": ["« Hounslow » signifie probablement le tertre du chien.", "Le nom se termine par le vieil anglais hlāw, un tertre ou un tumulus. La station s'appelait Hounslow Town jusqu'en 1925."], "Hounslow West": ["« Hounslow » signifie probablement le tertre du chien.", "La station a ouvert en 1884 sous le nom de Hounslow Barracks, d'après la caserne voisine, et s'appelle Hounslow West depuis 1925."], "Hyde Park Corner": ["Nommée d'après l'angle de Hyde Park.", "Le parc était autrefois le domaine de Hyde, propriété de l'abbaye de Westminster ; une « hide » était une ancienne mesure de terre. Henri VIII s'en est emparé en 1536 pour en faire un terrain de chasse."], "Ickenham": ["« Ickenham » signifie la ferme d'un homme nommé Ticca.", "Le Domesday Book de 1086 l'appelle Ticheham. Avec le temps, le T initial a disparu."], "Kennington": ["« Kennington » signifie la ferme d'un homme nommé Cena.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Chenintune. Kennington Park était autrefois un pré communal où se tenaient de grands rassemblements publics."], "Kensal Green": ["« Kensal » signifie le bois du roi.", "Le nom est attesté au XIIIe siècle sous la forme Kingisholte. On ne sait pas de quel roi il s'agit. Le pré se trouvait à l'emplacement de l'actuel cimetière de Kensal Green, ouvert en 1833."], "Kensington (Olympia)": ["Nommée d'après Olympia, un hall d'exposition ouvert en 1886.", "Le hall tient sans doute son nom d'Olympie, dans la Grèce antique, berceau des Jeux olympiques. Kensington signifie la ferme d'un Saxon nommé Cynesige. La station s'appelait Kensington (Addison Road) jusqu'en 1946."], "Kentish Town": ["Malgré son nom, Kentish Town n'a, semble-t-il, rien à voir avec le Kent.", "Le nom est noté en 1208 sous la forme Kentisston. Il pourrait venir d'une famille nommée Kentish, ou de mots désignant le lit d'un cours d'eau, la Fleet, aujourd'hui cachée."], "Kenton": ["« Kenton » signifie probablement la ferme d'un homme nommé Coena.", "Le nom se termine par le vieil anglais tūn, ferme ou village. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Kew Gardens": ["Nommée d'après les jardins botaniques royaux de Kew.", "« Kew » est noté en 1327 sous la forme Cayho et signifie probablement l'éperon de terre près d'un débarcadère sur la Tamise. Les jardins sont inscrits au patrimoine mondial de l'UNESCO."], "Kilburn": ["« Kilburn » signifie probablement le ruisseau des vaches, ou le ruisseau royal.", "Ce ruisseau est la Westbourne, aujourd'hui souterraine. Le nom est noté en 1134 sous la forme Cuneburna. Un prieuré se dressait à l'endroit où la voie romaine franchissait le ruisseau."], "Kilburn Park": ["« Kilburn » signifie probablement le ruisseau des vaches, ou le ruisseau royal.", "Ce ruisseau est la Westbourne, aujourd'hui souterraine. « Park » a été ajouté pour le nouveau lotissement. La station a ouvert en 1915."], "King's Cross St Pancras": ["Nommée d'après une statue du roi George IV et l'église St Pancras.", "Le quartier s'appelait autrefois Battle Bridge, d'après un pont sur la Fleet. Un monument à George IV s'y dressa d'environ 1830 à 1845 ; impopulaire, il fut vite enlevé. Saint Pancrace était un garçon martyrisé à Rome, selon la tradition en 304."], "Kingsbury": ["« Kingsbury » signifie le manoir du roi.", "On ne sait pas de quel roi il s'agit : au moment du Domesday Book, en 1086, les terres appartenaient déjà à des particuliers. La station a ouvert en 1932."], "Knightsbridge": ["« Knightsbridge » signifie le pont des jeunes gens.", "En vieil anglais, cniht désignait un jeune homme ou un serviteur, pas encore un chevalier en armure. Le pont franchissait la Westbourne. Le nom est attesté vers 1050."], "Ladbroke Grove": ["Nommée d'après James Weller Ladbroke, qui a loti le quartier au milieu du XIXe siècle.", "Sa famille possédait ces terres depuis au moins le début du XVIIe siècle, et il a donné son propre nom à la rue principale. La station a ouvert en 1864 sous le nom de Notting Hill."], "Lambeth North": ["« Lambeth » signifie le débarcadère des agneaux.", "Le nom est noté en 1062 sous la forme Lambehitha : hithe est un ancien mot pour un débarcadère sur une rivière, comme dans Rotherhithe. La station a ouvert en 1906 et s'appelle Lambeth North depuis 1917."], "Lancaster Gate": ["Nommée d'après l'entrée Lancaster Gate des jardins de Kensington.", "Elle a été nommée en l'honneur de la reine Victoria, qui était aussi duc de Lancastre. La ville de Lancaster tient elle-même son nom d'un fort romain, un « caster », sur la rivière Lune."], "Latimer Road": ["Nommée d'après Edward Latymer, un marchand londonien mort en 1627.", "Il a légué des terres ici pour venir en aide aux pauvres de Hammersmith, et son argent a aussi fondé l'école Latymer. La rue traversait sa propriété. La station a ouvert en 1868."], "Leicester Square": ["Nommée d'après le comte de Leicester, qui fit construire Leicester House ici.", "La place a été aménagée devant sa demeure dans les années 1670. La ville de Leicester tient son nom d'une tribu celte et de « ceaster », une ville romaine."], "Leyton": ["« Leyton » signifie la ferme sur la rivière Lea.", "La Lea, ou Lee, longe le quartier. La gare a ouvert en 1856 sous le nom de Low Leyton et a rejoint la Central line en 1947."], "Leytonstone": ["« Leytonstone » signifie Leyton à la pierre.", "Leyton est la ferme sur la Lea. La pierre était probablement une ancienne borne romaine ou une borne de limite près de Hollybush Hill. Le cinéaste Alfred Hitchcock est né ici en 1899."], "Liverpool Street": ["Nommée d'après Lord Liverpool, Premier ministre de 1812 à 1827.", "La rue a reçu son nom dans les années 1820. Son titre vient de la ville de Liverpool, notée en 1190 sous la forme Liuerpul, probablement une mare ou une crique aux eaux boueuses. La station a ouvert en 1875 sous le nom de Bishopsgate."], "London Bridge": ["Nommée d'après le London Bridge, le plus ancien passage sur la Tamise dans la ville.", "Il y a un pont à cet endroit depuis l'époque romaine. La gare a ouvert en 1836 ; c'est le plus ancien terminus ferroviaire du centre de Londres encore en service."], "Loughton": ["« Loughton » signifie la ferme d'un homme nommé Luhha.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Lochintuna. Bien plus ancien, le Loughton Camp est un ouvrage en terre de l'âge du fer, dans la forêt voisine."], "Maida Vale": ["Nommée d'après un pub, le Hero of Maida, qui commémorait une bataille en Italie.", "En 1806, une armée britannique commandée par le général Sir John Stuart battit les Français à Maida, en Calabre. Le pub ouvrit peu après au bord d'Edgware Road, et le quartier prit son nom."], "Manor House": ["Nommée d'après le Manor House, un pub de Green Lanes.", "L'auberge se trouvait sur la route du nord et a donné son nom au carrefour. La station a ouvert en 1932."], "Mansion House": ["Nommée d'après Mansion House, la résidence officielle du lord-maire de la City de Londres.", "Cette grande demeure a été construite au XVIIIe siècle. Les stations Bank et Cannon Street en sont en fait un peu plus proches."], "Marble Arch": ["Nommée d'après l'arc en marbre blanc dessiné par John Nash.", "Construit dans les années 1820 comme entrée du palais de Buckingham, il a été déplacé ici en 1851. Tout près se dressait le gibet de Tyburn, principal lieu d'exécution de Londres pendant des siècles."], "Marylebone": ["« Marylebone » signifie l'église Sainte-Marie près du ruisseau.", "Le nom est noté en 1453 sous la forme Maryburne, d'après une église Sainte-Marie au bord du ruisseau de Tyburn ; le « le » a été ajouté plus tard. La station a ouvert en 1907 sous le nom de Great Central, d'après la compagnie ferroviaire."], "Mile End": ["Nommée ainsi parce qu'elle se trouve à un mille d'Aldgate, l'ancienne porte de la City.", "Le nom est en usage depuis le XIIIe siècle pour l'endroit où s'achevait le premier mille de la route de l'Essex."], "Mill Hill East": ["« Mill Hill » signifie probablement la colline au moulin à vent.", "Il ne reste rien du moulin, mais un champ voisin s'appelle toujours Mill Field. La Northern line a atteint la station en 1941 ; elle devait aller plus loin, mais le prolongement n'a jamais été construit."], "Monument": ["Nommée d'après le Monument au grand incendie de Londres de 1666.", "La colonne a été conçue par Christopher Wren et Robert Hooke. Elle mesure 61 mètres, soit la distance entre sa base et l'endroit de Pudding Lane où le feu a pris."], "Moor Park": ["Nommée d'après Moor Park, un manoir palladien voisin.", "Il se dresse à l'emplacement d'une demeure plus ancienne appelée The More, qui appartenait au cardinal Wolsey. La station a ouvert en 1910 sous le nom de Sandy Lodge."], "Moorgate": ["Nommée d'après la Moorgate, une petite porte du mur de la City.", "Elle menait à Moorfields, des terrains marécageux à l'extérieur du mur. La porte a été démolie en 1762."], "Morden": ["« Morden » signifie probablement la colline dans le marais.", "Le nom vient du vieil anglais mōr, marais, et dūn, colline. Morden est le terminus de la Northern line et la station la plus méridionale du métro."], "Mornington Crescent": ["Nommée d'après le comte de Mornington, frère aîné du duc de Wellington.", "Richard Wellesley, 2e comte de Mornington, fut gouverneur général des Indes et ministre des Affaires étrangères. La station a aussi donné son nom à un célèbre jeu absurde de l'émission comique de la BBC I'm Sorry I Haven't a Clue."], "Neasden": ["« Neasden » signifie la colline en forme de nez.", "Le nom vient du vieil anglais næs, nez, et dūn, colline. La station a ouvert en 1880 sous le nom de Kingsbury & Neasden."], "Newbury Park": ["« Newbury » signifie le nouveau manoir.", "Le nom remonte au Moyen Âge. La station a ouvert en 1947, quand la Central line a repris une ligne de chemin de fer secondaire."], "Nine Elms": ["Nommée d'après une rangée de neuf ormes.", "Le nom est attesté vers 1645. Depuis 1974, le quartier accueille le New Covent Garden Market, et la station a ouvert en 2021."], "North Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. La station a ouvert en 1923, au nord de l'ancien centre."], "North Ealing": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom est noté vers 700 sous la forme Gillingas. La station North Ealing a ouvert en 1903."], "North Greenwich": ["« Greenwich » signifie le port vert ou le comptoir vert.", "Le nom est attesté au début du Xe siècle. La station, ouverte en 1999, se trouve à environ trois kilomètres au nord-est de Greenwich même, à côté de ce qui fut construit comme le Millennium Dome."], "North Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement sur la colline de Harrow, là où se dresse aujourd'hui l'église St Mary. La station North Harrow a ouvert en 1915."], "North Wembley": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Le nom se termine par le vieil anglais leah, une clairière. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Northfields": ["Nommée d'après les champs du nord d'Ealing.", "Ces champs sont restés agricoles jusqu'à la construction de maisons au début du XXe siècle. La station a ouvert en 1908 sous le nom de Northfield Halt."], "Northolt": ["« Northolt » signifie le recoin de terre du nord.", "Le nom vient du vieil anglais north et healh, un coin ou un recoin. Son pendant au sud est Southall. La station a ouvert sur la Central line en 1948."], "Northwick Park": ["Nommée d'après Northwick Park, l'espace vert à côté de la station.", "Le nom viendrait de la famille Rushout, propriétaire des terres agricoles ici, dont la résidence de campagne était Northwick Park, dans les Cotswolds. La station a ouvert en 1923 sous le nom de Northwick Park & Kenton."], "Northwood": ["« Northwood » signifie le bois du nord.", "C'était la partie boisée, au nord, de l'ancienne paroisse de Ruislip. La station a ouvert en 1887."], "Northwood Hills": ["Nommée d'après Northwood, le bois au nord de Ruislip, et ses collines.", "La station a ouvert en 1933 pour un nouveau lotissement. Curieusement, elle est un peu plus basse que la station de Northwood."], "Notting Hill Gate": ["« Notting » signifie probablement le peuple d'un homme nommé Cnotta.", "Le nom est attesté dès le XIVe siècle sous de nombreuses formes, comme Knottynghull. La « gate » était une barrière de péage sur la route d'Uxbridge."], "Oakwood": ["Nommée d'après Oakwood Park, qui doit son nom aux chênes d'Enfield Chase.", "Enfield Chase était un domaine de chasse royal. La station a ouvert en 1933 sous le nom d'Enfield West et s'appelle Oakwood depuis 1946."], "Old Street": ["Nommée d'après la rue, notée vers 1200 sous la forme Ealdestrate.", "Le nom signifie simplement « vieille rue ». La route est probablement romaine, vieille de près de deux mille ans."], "Osterley": ["« Osterley » signifie probablement la clairière à la bergerie.", "Le nom est attesté au XIIIe siècle. Osterley House a été construite pour le marchand Sir Thomas Gresham au XVIe siècle, puis remaniée par Robert Adam."], "Oval": ["Nommée d'après le stade de cricket de l'Oval.", "Le nom remonte à un plan de rues en forme d'ovale des années 1790 ; le terrain de cricket a été aménagé à l'intérieur. Le Surrey County Cricket Club y joue depuis 1845."], "Oxford Circus": ["Un « circus » est une place ronde où se croisent des rues ; il n'y a jamais eu de cirque.", "C'est le croisement d'Oxford Street et de Regent Street. Oxford Street était la grande route vers l'ouest, en direction d'Oxford."], "Paddington": ["« Paddington » signifie la ferme d'un homme nommé Padda.", "Le nom est anglo-saxon, -ington désignant le village des gens de quelqu'un. La station a ouvert en 1863 sur le premier chemin de fer souterrain."], "Park Royal": ["Nommée d'après le terrain d'exposition de la Royal Agricultural Society, ouvert ici en 1903.", "La foire n'y est restée que quelques années, mais le nom est resté. Le secteur est ensuite devenu l'une des plus grandes zones industrielles de Londres."], "Parsons Green": ["Nommée d'après le presbytère de Fulham, qui se dressait au bord du pré communal.", "Le pré du village subsiste sous la forme d'un petit parc."], "Perivale": ["« Perivale » signifie probablement la vallée des poiriers.", "Le nom est attesté au début du XVIe siècle sous la forme Pyryvale. La station a ouvert en 1904 sous le nom de Perivale Halt et a rejoint la Central line en 1947."], "Piccadilly Circus": ["Nommée d'après les « piccadills », des cols de dentelle rigides à la mode vers 1600.", "Un tailleur, Robert Baker, fit fortune en les vendant et se fit construire ici une maison surnommée Pickadilly Hall. Le nom s'est étendu à la rue, puis au « circus », un rond-point."], "Pimlico": ["Personne ne sait au juste d'où vient le nom « Pimlico ».", "Une théorie répandue le rattache à Ben Pimlico, un aubergiste célèbre pour sa bière, mais sa taverne se trouvait à Hoxton, à l'autre bout de Londres. La station a ouvert avec la Victoria line en 1972."], "Pinner": ["« Pinner » signifie probablement la colline en forme d'épingle, ou la colline d'un homme nommé Pinn.", "Le nom se termine par le vieil anglais ora, une pente ou une colline. La rivière Pinn a ensuite été nommée d'après le village."], "Plaistow": ["« Plaistow » signifie probablement un lieu de jeu ou de divertissement.", "Le nom viendrait du vieil anglais plega, jeu, et stōw, lieu, peut-être là où l'on jouait à des jeux ou des mystères. D'autres le rattachent à Sir Hugh de Plaiz, un seigneur médiéval. Les habitants prononcent « Plar-stow »."], "Preston Road": ["« Preston » signifie la ferme des prêtres.", "Le nom vient du vieil anglais prēost, prêtre, et tūn, ferme. La station a ouvert en 1908."], "Putney Bridge": ["Nommée d'après le pont de Putney, qui mène à Putney sur l'autre rive.", "« Putney » signifie le débarcadère d'un homme nommé Putta. La station se trouve en fait du côté de Fulham. La course d'aviron Oxford-Cambridge part près du pont."], "Queen's Park": ["Nommée d'après la reine Victoria, qui régnait quand le quartier a été construit.", "Le parc et le lotissement datent de la fin du XIXe siècle. Les trains de la Bakerloo line s'y arrêtent depuis 1915."], "Queensbury": ["Un nom inventé, choisi dans les années 1930 pour répondre à Kingsbury, la voisine.", "On a demandé des idées aux habitants, et Queensbury l'a emporté. Le nom n'a aucune origine historique. La station a ouvert en 1934."], "Queensway": ["Nommée en l'honneur de la reine Victoria.", "On raconte qu'elle parcourait cette allée à cheval dans son enfance, quand elle vivait au palais de Kensington tout proche. La rue s'appelait Queen's Road, tout comme la station jusqu'en 1946."], "Ravenscourt Park": ["Un jeu de mots : « raven » signifie corbeau, comme le nom de famille Corbett.", "Au XVIIIe siècle, le propriétaire, Thomas Corbett, rebaptisa sa maison Ravenscourt ; des corbeaux figuraient sur ses armoiries. Le parc est devenu public. La station a ouvert en 1877 sous le nom de Shaftesbury Road."], "Rayners Lane": ["Nommée, dit-on, d'après Daniel Rayner, un fermier du coin.", "Quand le chemin de fer est arrivé en 1904, le secteur était presque vide ; la station a ouvert en 1906, et les maisons ne sont venues que dans les années 1930."], "Redbridge": ["Nommée d'après un pont de briques rouges sur la rivière Roding.", "Le pont est attesté dès le XVIIe siècle et a été démoli en 1922. La station, ouverte en 1947, portait ce nom avant le district londonien de Redbridge, créé en 1965."], "Regent's Park": ["Nommée d'après le prince régent, futur roi George IV.", "Le parc a été aménagé par John Nash au début du XIXe siècle, sur un ancien terrain de chasse d'Henri VIII. Regent Street a été construite à la même époque."], "Richmond": ["Nommée d'après Richmond, dans le Yorkshire, par l'intermédiaire d'Henri VII.", "Avant de devenir roi, Henri était comte de Richmond. Vers 1500, il fit reconstruire le palais royal de Sheen et lui donna le nom de son comté. « Richmond » vient du français « riche mont », la colline forte."], "Rickmansworth": ["« Rickmansworth » signifie l'enclos d'un homme nommé Ricmær.", "-worth est un mot du vieil anglais pour un enclos ou une ferme. Le Domesday Book de 1086 l'appelle Prichemareworde."], "Roding Valley": ["Nommée d'après la rivière Roding, qui coule dans la vallée.", "La rivière tient son nom des Rodings, des villages habités par le peuple d'un chef saxon nommé Hroda."], "Royal Oak": ["Nommée d'après un pub appelé le Royal Oak.", "Ce nom de pub rappelle le chêne de Boscobel, dans le Shropshire, où le futur Charles II se cacha des soldats du Parlement en 1651. La station a ouvert en 1871."], "Ruislip": ["« Ruislip » signifie le lieu de saut où poussent les joncs.", "Le nom vient du vieil anglais rysc, jonc, et hlȳp, saut : sans doute un passage étroit de la rivière Pinn que l'on pouvait franchir d'un bond. La station a ouvert en 1904."], "Ruislip Gardens": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "Le « saut » était probablement un passage étroit sur la rivière Pinn. « Gardens » désignait les nouveaux lotissements de banlieue. La station a ouvert sur la Central line en 1948."], "Ruislip Manor": ["Nommée d'après un lotissement construit sur les terres de l'ancien manoir de Ruislip.", "Ruislip signifie le lieu de saut où poussent les joncs. La station a ouvert comme simple halte en 1912, bien avant la plupart des maisons."], "Russell Square": ["Nommée d'après la famille Russell, ducs de Bedford.", "Ils possédaient une grande partie de Bloomsbury et ont aménagé la place vers 1800."], "St James's Park": ["Nommée d'après St James's Park, qui doit son nom au palais St James.", "Henri VIII fit construire le palais à l'emplacement d'un hôpital médiéval pour lépreuses, dédié à saint Jacques le Mineur. Le parc est le plus ancien des parcs royaux de Londres."], "St John's Wood": ["Nommée d'après les chevaliers de Saint-Jean, propriétaires des bois.", "L'ordre de Saint-Jean de Jérusalem avait son prieuré à Clerkenwell et possédait ces terres boisées au Moyen Âge. La station a ouvert en 1939."], "St Paul's": ["Nommée d'après la cathédrale St Paul, juste au sud.", "Une église dédiée à saint Paul se dresse sur cette colline depuis 604. La station a ouvert en 1900 sous le nom de Post Office, d'après le siège des Postes tout proche, et a été rebaptisée en 1937."], "Seven Sisters": ["Nommée d'après un cercle de sept arbres sur Page Green.", "Selon la tradition locale, ils auraient été plantés par sept sœurs. Les premiers arbres étaient des ormes ; le cercle a été replanté plusieurs fois, la dernière en 1996, avec des charmes."], "Shepherd's Bush": ["Personne ne sait vraiment d'où vient « Shepherd's Bush ».", "Une idée veut que les bergers y faisaient reposer leurs troupeaux en route vers le marché de Smithfield, dans la City. Une autre y voit le souvenir d'un habitant nommé Shepherd ou Sheppard."], "Shepherd's Bush Market": ["Nommée d'après le marché qui longe la voie ferrée, à Shepherd's Bush.", "La station s'appelait Shepherd's Bush jusqu'en 2008, quand elle a été rebaptisée pour éviter la confusion avec la station de la Central line. On ne sait pas vraiment d'où vient « Shepherd's Bush »."], "Sloane Square": ["Nommée d'après Sir Hans Sloane, médecin et collectionneur.", "Il acheta le domaine de Chelsea en 1712. Son immense collection de livres, de plantes et de curiosités fut à l'origine du British Museum après sa mort, en 1753."], "Snaresbrook": ["Personne ne sait au juste d'où vient « Snaresbrook ».", "Ce pourrait être une déformation de « Sayers Brook », un petit ruisseau qui se jette dans la Roding. La station a ouvert en 1856 sous le nom de Snaresbrook & Wanstead."], "South Ealing": ["« Ealing » signifie le peuple d'un Saxon nommé Gilla.", "Le nom est noté vers 700 sous la forme Gillingas. La station South Ealing a ouvert en 1883."], "South Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Avant la construction des maisons, le secteur n'était que champs et l'ancien hameau de Roxeth. La station a ouvert en 1903."], "South Kensington": ["Nommée d'après Kensington, la ferme d'un Saxon nommé Cynesige.", "Le quartier s'est développé après la Grande Exposition de 1851, dont les bénéfices ont financé les musées et les écoles d'ici. Un long tunnel relie la station aux musées."], "South Kenton": ["« Kenton » signifie probablement la ferme d'un homme nommé Coena.", "Le nom se termine par le vieil anglais tūn, ferme ou village. La station South Kenton a ouvert en 1933 pour de nouvelles maisons."], "South Ruislip": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "La station a ouvert en 1908 sous le nom de Northolt Junction et n'est devenue South Ruislip qu'en 1947. La Central line est arrivée en 1948."], "South Wimbledon": ["Nommée d'après Wimbledon, bien que la station se trouve en fait à Merton.", "« Wimbledon » signifie probablement la colline d'un homme nommé Wynnmann. Pendant des années, la station s'est appelée South Wimbledon (Merton) pour le préciser."], "South Woodford": ["« Woodford » signifie le gué près du bois.", "Le gué franchissait la rivière Roding. La station a ouvert en 1856 sous le nom de George Lane, d'après la rue voisine, et son nom a changé plusieurs fois avant de devenir South Woodford."], "Southfields": ["Nommée d'après les champs du sud de Wandsworth, des terres agricoles pendant des siècles.", "Attestés dès le XIIIe siècle, ils sont restés des champs jusque vers 1900. Pendant le tournoi de tennis de Wimbledon, c'est la station des courts."], "Southgate": ["Nommée d'après la porte sud d'Enfield Chase, un domaine de chasse royal.", "Le village s'est formé autour de cette porte. La station ronde de 1933, conçue par Charles Holden, est classée monument historique."], "Southwark": ["« Southwark » signifie le fort du sud.", "Le nom est noté au début du Xe siècle sous la forme Suthriganaweorc, le fort des hommes du Surrey, qui défendait le bout sud du London Bridge. La station a ouvert en 1999."], "Stamford Brook": ["Nommée d'après un ruisseau, aujourd'hui disparu, entre Hammersmith et Chiswick.", "« Stamford » signifierait le gué pierreux. Le ruisseau coule désormais dans une canalisation sous les rues."], "Stanmore": ["« Stanmore » signifie la mare pierreuse.", "Le nom vient du vieil anglais stān, pierre, et mere, mare ; le sol de graviers est ici très caillouteux. La station a ouvert en 1932."], "Stepney Green": ["« Stepney » signifie le débarcadère d'un homme nommé Stebba.", "Le nom est noté vers l'an 1000 sous la forme Stybbanhythe, hythe désignant un débarcadère sur la Tamise. Le « green » est l'ancien pré communal du village de Stepney."], "Stockwell": ["« Stockwell » signifie le puits ou la source près d'une souche.", "Le nom vient du vieil anglais stocc, souche ou poteau. Devant la station se trouve l'entrée d'un abri profond construit pendant la Seconde Guerre mondiale."], "Stonebridge Park": ["Nommée d'après un pont de pierre sur la rivière Brent.", "Le pont a été construit au XVIIe siècle pour faire passer Harrow Road au-dessus de la rivière. Les trains de la Bakerloo line s'y arrêtent depuis 1917."], "Stratford": ["« Stratford » signifie le gué sur la voie romaine.", "Le vieil anglais stræt, une route romaine pavée, a donné le mot « street ». Ici, la route de Londres à Colchester franchissait la rivière Lea. Le quartier a été le cœur des Jeux olympiques de 2012."], "Sudbury Hill": ["« Sudbury » signifie le manoir du sud.", "Il était au sud de Harrow, le village principal. La station Sudbury Hill a ouvert en 1903."], "Sudbury Town": ["« Sudbury » signifie le manoir du sud.", "Il était situé au sud de Harrow. La station a été reconstruite en 1931 par Charles Holden sous la forme d'une boîte de brique et de verre, modèle de nombreuses stations ultérieures."], "Swiss Cottage": ["Nommée d'après un pub construit comme un chalet suisse.", "Une auberge occupe ce site depuis le début du XIXe siècle. Le pub, Ye Olde Swiss Cottage, existe toujours près de la station."], "Temple": ["Nommée d'après le Temple, ancienne demeure des chevaliers du Temple.", "Les Templiers y construisirent l'église ronde du Temple au XIIe siècle. Après la suppression de l'ordre au XIVe siècle, les juristes s'y installèrent, et l'Inner Temple et le Middle Temple sont toujours deux des Inns of Court."], "Theydon Bois": ["« Bois » est le nom d'une famille de seigneurs médiévaux.", "La famille Bois tenait ces terres aux XIIe et XIIIe siècles. « Theydon » signifierait la vallée où l'on récoltait le chaume. La station a ouvert en 1865 sous le nom de Theydon."], "Tooting Bec": ["« Bec » rappelle l'abbaye du Bec, en Normandie, propriétaire de terres ici après 1066.", "Tooting signifie probablement le peuple d'un homme nommé Tota. La station a ouvert en 1926 sous le nom de Trinity Road (Tooting Bec) et a été rebaptisée en 1950."], "Tooting Broadway": ["« Tooting » signifie probablement le peuple d'un homme nommé Tota.", "Un « broadway » est une large rue principale. La statue du roi Édouard VII devant la station s'y dresse depuis 1911."], "Tottenham Court Road": ["Nommée d'après la route menant au manoir de Tottenhall, et non à Tottenham.", "Le manoir, près de l'actuelle Euston Road, tirait sans doute son nom d'un propriétaire nommé Tota. La route y menait depuis le West End."], "Tottenham Hale": ["« Tottenham » signifie la ferme d'un homme nommé Totta.", "« Hale » viendrait d'un ancien mot signifiant hisser ou haler : des marchandises comme le bois y étaient déchargées de la rivière Lea. La station a ouvert avec la Victoria line en 1968."], "Totteridge & Whetstone": ["« Totteridge » signifie la crête d'un homme nommé Tata ; « Whetstone » est une énigme.", "Selon la légende, des soldats y auraient aiguisé leurs épées sur une pierre à aiguiser (« whetstone ») avant la bataille de Barnet, en 1471, mais le nom est plus ancien. Il signifie plus probablement « le village de l'ouest »."], "Tower Hill": ["Nommée d'après la colline à côté de la Tour de Londres.", "Pendant des siècles, ce fut un lieu d'exécutions publiques. La station s'appelait Mark Lane jusqu'en 1946."], "Tufnell Park": ["Nommée d'après la famille Tufnell, seigneurs du manoir de Barnsbury.", "William Tufnell reçut le manoir en 1753. Son descendant Henry Tufnell commença à bâtir des maisons sur le domaine en 1845. La station a ouvert en 1907."], "Turnham Green": ["« Turnham » signifie la ferme dans la boucle du fleuve.", "La Tamise forme ici une grande boucle. En 1642, pendant la guerre civile, une armée royaliste fit demi-tour à Turnham Green au lieu de marcher sur Londres."], "Turnpike Lane": ["Nommée d'après une « turnpike », une barrière de péage sur la route du nord.", "Les voyageurs de Green Lanes devaient payer ici pour emprunter la route. La station a ouvert en 1932."], "Upminster": ["« Upminster » signifie la grande église sur les hauteurs.", "Upminster est le terminus est de la District line."], "Upminster Bridge": ["Nommée d'après le pont sur la rivière Ingrebourne, près d'Upminster.", "Upminster signifie la grande église sur les hauteurs. La station a ouvert en 1934."], "Upney": ["« Upney » signifie probablement l'île d'en haut.", "L'« île » était une terre sèche au milieu des ruisseaux et des marais, près du Mayes Brook. La station a ouvert en 1932."], "Upton Park": ["« Upton » signifie la ferme sur les hauteurs.", "« Park » a été ajouté dans les années 1880 pour vendre de nouvelles maisons. L'ancien stade de West Ham United, le Boleyn Ground, était souvent appelé Upton Park."], "Uxbridge": ["« Uxbridge » signifie le pont du peuple des Wixan.", "Les Wixan étaient une tribu anglo-saxonne installée ici, et le pont franchissait la rivière Colne. Uxbridge est le terminus ouest de la Metropolitan line et de la Piccadilly line."], "Vauxhall": ["« Vauxhall » signifie la demeure de Falkes, un chevalier médiéval.", "Falkes de Breauté la fit construire au XIIIe siècle. Plus tard, les jardins d'agrément de Vauxhall furent célèbres dans toute l'Europe, et le constructeur automobile a pris le nom du quartier."], "Victoria": ["Nommée d'après Victoria Street, qui honore la reine Victoria.", "La grande gare a pris le nom de la rue en 1860. Elle se dresse à l'emplacement d'un ancien bassin du canal Grosvenor."], "Walthamstow Central": ["« Walthamstow » signifie probablement le lieu d'accueil.", "Le nom est noté en 1075 sous la forme Wilcumestowe. « Central » la distingue des autres gares de la ville. La Victoria line y est arrivée en 1968."], "Wanstead": ["« Wanstead » désigne un lieu, mais on ne sait pas lequel.", "Le nom est attesté au XIe siècle sous la forme Wenstede. -stead signifie un lieu ou un emplacement ; la première partie pourrait désigner une colline, ou un chariot."], "Warren Street": ["Nommée d'après Anne Warren, épouse du propriétaire Charles FitzRoy.", "FitzRoy, futur baron Southampton, a loti les terrains à la fin du XVIIIe siècle. La station a ouvert en 1907 sous le nom d'Euston Road et a été rebaptisée un an plus tard."], "Warwick Avenue": ["Nommée d'après Jane Warwick, épouse de Sir John Frederick.", "Ils se marièrent en 1778 ; Frederick louait les terres à l'évêque de Londres, et l'avenue reçut le nom de son épouse. La station a ouvert en 1915."], "Waterloo": ["Nommée d'après le pont de Waterloo, qui commémore la bataille de Waterloo.", "Le pont était en construction quand Wellington battit Napoléon en 1815. Il devait s'appeler Strand Bridge, mais il ouvrit en 1817 sous le nom de Waterloo Bridge. La rue et la gare suivirent."], "Watford": ["« Watford » signifie probablement le gué des chasseurs, ou le gué humide.", "Le gué franchissait la rivière Colne. La station de la Metropolitan line a ouvert en 1925 à Cassiobury, assez loin du centre-ville."], "Wembley Central": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Le nom se termine par le vieil anglais leah, une clairière. La gare a ouvert en 1842 sous le nom de Sudbury et est devenue Wembley Central en 1948, l'année où Wembley accueillit les Jeux olympiques."], "Wembley Park": ["« Wembley » signifie la clairière d'un Saxon nommé Wemba.", "Dans les années 1890, on commença ici une tour censée rivaliser avec la tour Eiffel ; elle ne fut jamais achevée. Le stade de Wembley fut construit plus tard à son emplacement."], "West Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. La station West Acton a ouvert en 1923."], "West Brompton": ["« Brompton » signifie la ferme où pousse le genêt.", "Le genêt est un arbuste à fleurs jaunes. La station a ouvert en 1869 ; le cimetière de Brompton, l'un des « Magnificent Seven » de Londres, est juste à côté."], "West Finchley": ["« Finchley » signifie probablement la clairière des pinsons.", "Le nom se termine par le vieil anglais leah, une clairière dans un bois. La Northern line dessert West Finchley depuis 1940."], "West Ham": ["« Ham » désigne une terre sèche dans une boucle de rivière ou entre des rivières.", "Ici, la terre se trouve entre la Tamise, la Lea et la Roding. Elle a été divisée en East Ham et West Ham au XIIe siècle. Le club de football West Ham United a pris le nom du quartier."], "West Hampstead": ["« Hampstead » signifie simplement ferme ou domaine.", "Le nom vient du vieil anglais hām-stede. West Hampstead s'est développé à la fin du XIXe siècle avec l'arrivée de trois lignes de chemin de fer. La station a ouvert en 1879."], "West Harrow": ["« Harrow » vient du vieil anglais hearg, un temple ou sanctuaire païen.", "Le sanctuaire se trouvait probablement sur la colline de Harrow, là où se dresse aujourd'hui l'église St Mary. La station West Harrow a ouvert en 1913."], "West Kensington": ["Nommée d'après Kensington, la ferme d'un Saxon nommé Cynesige.", "La station se trouve en fait à Fulham. Elle a ouvert en 1874 sous le nom de North End (Fulham) et a été rebaptisée West Kensington en 1877, sans doute parce que ce nom sonnait mieux."], "West Ruislip": ["Nommée d'après Ruislip, le lieu de saut où poussent les joncs.", "Elle a ouvert en 1906 sous le nom de Ruislip & Ickenham. West Ruislip est le terminus ouest de la Central line."], "Westbourne Park": ["Nommée d'après la rivière Westbourne, le « ruisseau de l'ouest ».", "La rivière prend sa source à Hampstead et se jette dans la Tamise, aujourd'hui cachée dans des canalisations. Au Moyen Âge, le secteur s'appelait Westbourne Green."], "Westminster": ["« Westminster » signifie le moutier, ou l'église abbatiale, de l'ouest.", "Elle se trouvait à l'ouest de la City de Londres. L'abbaye, fondée au Xe siècle et reconstruite par Édouard le Confesseur, a donné son nom à tout le quartier, y compris au Parlement."], "White City": ["Nommée d'après les bâtiments d'exposition blancs de 1908.", "L'Exposition franco-britannique s'est tenue ici en 1908, avec des palais revêtus de blanc. Le stade construit au même moment a accueilli les Jeux olympiques de 1908."], "Whitechapel": ["Nommée d'après une chapelle blanche, l'église St Mary Matfelon.", "La chapelle a été construite en pierre calcaire blanche au XIIIe siècle, et ses murs clairs ont donné son nom au quartier."], "Willesden Green": ["« Willesden » signifie la source près de la colline.", "Le nom est noté en 939 sous la forme Willesdune. La source a disparu. La station a ouvert en 1879."], "Willesden Junction": ["Nommée d'après un grand nœud ferroviaire à Willesden.", "« Willesden » signifie la source près de la colline. Plusieurs lignes de chemin de fer s'y rejoignent et s'y croisent. Les trains de la Bakerloo line s'y arrêtent depuis 1915."], "Wimbledon": ["« Wimbledon » signifie probablement la colline d'un homme nommé Wynnmann.", "Le nom est noté vers 950 sous la forme Wunemannedune ; « dun » désigne une colline. Depuis 1877, la ville accueille le plus ancien tournoi de tennis du monde."], "Wimbledon Park": ["Nommée d'après le parc de Wimbledon House, un grand domaine.", "Le parc et le lac ont été aménagés par Capability Brown dans les années 1760. Une partie de l'ancien parc accueille aujourd'hui l'All England Lawn Tennis Club."], "Wood Green": ["« Wood Green » signifie le pré près des bois.", "Le village s'est formé autour d'un espace ouvert en bordure de la forêt d'Enfield Chase. La station a ouvert en 1932."], "Wood Lane": ["Nommée d'après Wood Lane, qui s'appelait Turvens Lane jusque vers 1830.", "La rue a été rebaptisée d'après les bois voisins. La station a ouvert en 2008, à côté de l'ancien BBC Television Centre."], "Woodford": ["« Woodford » signifie le gué près du bois.", "Le gué franchissait la rivière Roding, en bordure de la forêt d'Epping. Il a ensuite été remplacé par un pont, qui a donné son nom à Woodford Bridge."], "Woodside Park": ["Nommée d'après Woodside House, construite en 1840.", "Un promoteur local a repris ce nom pour son nouveau lotissement, et la station a suivi. La Northern line y est arrivée en 1940."]}, "de": {"Acton Town": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von zwei altenglischen Wörtern: āc, Eiche, und tūn, Hof oder Siedlung. Die Station wurde 1879 als Mill Hill Park eröffnet und heißt seit 1910 Acton Town."], "Aldgate": ["Benannt nach Aldgate, einem der Tore in Londons römischer und mittelalterlicher Stadtmauer.", "Was „Ald“ bedeutet, weiß niemand genau. Vorschläge sind „altes Tor“, ein „Biertor“ mit einer Schenke, ein Sachse namens Ealh oder ein Tor, das allen offenstand. Das Tor selbst wurde 1761 abgerissen."], "Aldgate East": ["Benannt nach Aldgate, einem alten Tor in der Stadtmauer der City, und gleich östlich davon gelegen.", "„East“ unterscheidet sie von der nahen Station Aldgate. Die Herkunft von „Aldgate“ ist unsicher: ein altes Tor, ein Biertor mit Schenke oder ein Sachse namens Ealh gehören zu den Ideen."], "Alperton": ["„Alperton“ bedeutet der Hof eines Mannes namens Ealhbeorht.", "Der sächsische Name ist eine frühe Form von Albert; mehr ist über ihn nicht bekannt. Die Station wurde 1903 als Perivale-Alperton eröffnet und trägt ihren heutigen Namen seit 1910."], "Amersham": ["„Amersham“ bedeutet das Heim eines Sachsen namens Ealhmund.", "In angelsächsischer Zeit wurde es Agmodesham geschrieben; -ham bedeutet Hof oder Gehöft. Die Metropolitan Railway erreichte die Stadt 1892."], "Angel": ["Benannt nach dem Angel, einem berühmten Postkutschengasthof.", "Der Gasthof stand an der Kreuzung der Great North Road mit der Pentonville Road, wo die Kutschen vor der letzten Etappe nach London hielten. Er bestand bis ins 20. Jahrhundert, und 1901 wurde in der Nähe die Station eröffnet."], "Archway": ["Benannt nach der Brücke, die die Hornsey Lane über die Straße nach Norden führt.", "Der erste Bogen wurde 1813 gebaut und um 1900 durch die heutige Eisenbrücke ersetzt. Bei ihrer Eröffnung 1907 hieß die Station Highgate und erst seit 1947 Archway."], "Arnos Grove": ["Der Name erinnert wahrscheinlich an die Familie Arnold, Grundbesitzer im 14. Jahrhundert.", "Im Lauf der Jahrhunderte wurde aus „Arnold's Grove“ wohl Arno's Grove und dann Arnos Grove, sicher ist die Verbindung aber nicht. Das runde Stationsgebäude von 1932 ist einer der bekanntesten Entwürfe von Charles Holden."], "Arsenal": ["Benannt nach dem Fußballverein Arsenal, dessen altes Stadion in Highbury gleich nebenan lag.", "Der Verein wurde im Royal Arsenal in Woolwich gegründet und zog 1913 nach Highbury. Die Station wurde 1906 als Gillespie Road eröffnet und 1932 umbenannt, nach einer Kampagne des Vereinstrainers Herbert Chapman. Der alte Name ist auf den Fliesen noch zu sehen."], "Baker Street": ["Benannt nach William Baker, der die Straße im 18. Jahrhundert anlegte.", "Die Station wurde 1863 an der ersten U-Bahn der Welt eröffnet, der Metropolitan Railway. Baker Street ist auch die fiktive Adresse von Sherlock Holmes, Nummer 221B."], "Balham": ["„Balham“ bedeutet wahrscheinlich ein Gehöft in einer runden Einfriedung.", "Der Ort steht im Domesday Book von 1086 als Belgeham. Der erste Teil kommt vielleicht von einem altenglischen Wort für etwas Rundes oder Glattes."], "Bank": ["Benannt nach der Bank of England, die über der Station steht.", "Als Erste kam 1898 die Waterloo & City Line, in einer Station, die einfach City hieß. Heute ist Bank einer der größten Knotenpunkte des Netzes, wo sich mehrere Linien unter dem alten Herzen der City treffen."], "Barbican": ["„Barbican“ bedeutet Wachturm oder Vorwerk einer befestigten Stadt.", "Der Name erinnert wohl an einen Turm an oder bei Londons römischer und mittelalterlicher Stadtmauer. Die Station wurde 1865 als Aldersgate Street eröffnet, nach einem anderen Mauertor, und heißt erst seit 1968 Barbican."], "Barking": ["„Barking“ bedeutet die Leute des Berica oder die Siedlung bei den Birken.", "Im 8. Jahrhundert wurde es Berecingas geschrieben. Die im 7. Jahrhundert gegründete Abtei Barking war eines der wichtigsten Frauenklöster Englands."], "Barkingside": ["„Barkingside“ bedeutet die Barking zugewandte Seite des Hainault-Waldes.", "Das Gebiet lag gerade noch innerhalb des alten Gutsbezirks und der Pfarrei Barking, deren Grenze durch den Wald lief. Eine Karte von 1777 zeigt „Barking Side“ als langen Streifen Gemeindeland am Westrand des Waldes."], "Barons Court": ["Ein erfundener Name, um 1900 für neue Wohnhäuser gewählt.", "Er hat keine bekannte historische Grundlage. Wahrscheinlich sollte er vornehm klingen und zu Earl's Court passen, der nächsten Station."], "Battersea Power Station": ["Benannt nach dem benachbarten Kraftwerk, heute Geschäfte, Wohnungen und Büros.", "Battersea gehört zu den ältesten überlieferten Namen Londons: Im 7. Jahrhundert hieß es Badrices īeg, Badrics Insel, trockenes Land in den Sümpfen an der Themse. Die Station wurde 2021 am Ende der Verlängerung der Northern Line eröffnet."], "Bayswater": ["„Bayswater“ erinnert an Bayard's Watering, erwähnt 1380.", "Die Familie Bayard besaß hier Land am Fluss Westbourne, der heute in einem Rohr unter den Straßen fließt. Das „Watering“ war wohl eine Tränke für Pferde oder Vieh."], "Becontree": ["„Becontree“ bedeutet wahrscheinlich der Baum eines Sachsen namens Beohha.", "Es war der Versammlungsort einer alten Hundertschaft, eines Verwaltungsbezirks der Grafschaft. Nach dem Ersten Weltkrieg erhielt eine riesige Sozialwohnungssiedlung den Namen, damals eine der größten der Welt."], "Belsize Park": ["„Belsize“ kommt vom französischen bel assis, schön gelegen.", "Der Name ist seit dem 14. Jahrhundert für ein Gut an den Hängen unterhalb von Hampstead belegt. Die Station wurde 1907 eröffnet."], "Bermondsey": ["„Bermondsey“ bedeutet die Insel eines Mannes namens Beornmund.", "Die „Insel“ war ein Stück erhöhtes, trockenes Land in den Sümpfen südlich der Themse. Der Ort steht im Domesday Book von 1086; die Station wurde 1999 mit der Verlängerung der Jubilee Line eröffnet."], "Bethnal Green": ["„Bethnal“ bedeutet wahrscheinlich der Winkel eines Mannes namens Blitha.", "Frühe Schreibweisen wie Blithehale weisen auf altenglisch blithe, fröhlich, oder einen Personennamen und healh, einen Landwinkel. Der „Green“ war die offene Dorfwiese, die heute als Park erhalten ist."], "Blackfriars": ["Benannt nach den schwarz gekleideten Dominikanern, die hier ein Kloster hatten.", "Die Mönche kamen im 13. Jahrhundert hierher und blieben, bis Heinrich VIII. die Klöster auflöste. Ihr Name lebt in der Brücke, dem Bahnhof und dem Viertel weiter."], "Blackhorse Road": ["Benannt nach der Straße, deren Name wohl eine Verballhornung von Black House Lane ist.", "Das „schwarze Haus“ war ein örtliches Herrenhaus; das schwarze Pferd auf den Fliesen der Station ist also eine spätere Idee. Die Station wurde 1968 mit der Victoria Line eröffnet."], "Bond Street": ["Benannt nach Sir Thomas Bond, der die Straße im 17. Jahrhundert anlegte.", "Bond kaufte hier Land und legte die Straße an. Eine Straße namens Bond Street allein gibt es heute nicht: Sie besteht aus Old Bond Street und New Bond Street."], "Borough": ["Benannt nach dem Borough of Southwark, der Stadt am Südende der London Bridge.", "Jahrhundertelang war dies Londons wichtigste Vorstadt und hieß deshalb einfach „the Borough“. Die Station wurde 1890 an der ersten tief liegenden U-Bahn-Linie eröffnet."], "Boston Manor": ["Benannt nach Boston Manor House, einem jakobinischen Herrenhaus nahe der Station.", "Mit Boston in Lincolnshire oder Massachusetts hat der Name nichts zu tun: Er geht wahrscheinlich auf einen mittelalterlichen Namen für den Hof eines Mannes namens Bord zurück. Bis 1911 hieß die Station Boston Road."], "Bounds Green": ["Benannt nach der Familie le Bounde, die hier im 13. Jahrhundert Land besaß.", "Ihr Name lebte in einem Bauernhof weiter, und die Station übernahm ihn, als 1932 die Piccadilly Line kam."], "Bow Road": ["Benannt nach der bogenförmigen Brücke über den Fluss Lea.", "Die gewölbte Brücke wurde Anfang des 12. Jahrhunderts gebaut, der Überlieferung nach auf Wunsch von Königin Mathilde, und gab dem Dorf Bow („Bogen“) seinen Namen."], "Brent Cross": ["Benannt nach dem Fluss Brent und einer nahen Kreuzung.", "„Brent“ ist ein keltischer Name, viel älter als das Englische, und bedeutet vielleicht „die Heilige“ oder „die Hohe“. Die Station wurde 1923 als Brent eröffnet und heißt seit 1976 Brent Cross."], "Brixton": ["„Brixton“ bedeutet der Stein eines Mannes namens Beorhtsige.", "Der Stein war wohl der Versammlungsort der örtlichen Hundertschaft, eines alten Verwaltungsbezirks. Die Victoria Line erreichte Brixton 1971."], "Bromley-by-Bow": ["„Bromley“ bedeutet eine Lichtung, auf der Ginster wächst.", "„By-Bow“ wurde 1968 hinzugefügt, damit man es nicht mit Bromley in Kent verwechselt. Bow selbst ist nach einer bogenförmigen Brücke über den Lea benannt."], "Buckhurst Hill": ["„Buckhurst“ bedeutet ein bewaldeter Hügel voller Buchen.", "Im 12. Jahrhundert wurde es La Bocherste geschrieben. Der Hügel liegt am Rand des Epping Forest, in dem noch viele Buchen stehen."], "Burnt Oak": ["Der Name deutet auf eine verbrannte Eiche hin, doch ihre Geschichte ist unbekannt.", "Er taucht 1754 zum ersten Mal als Name eines Feldes an der Watling Street auf, der alten Römerstraße. Die Eiche, die den Namen gab, ist längst verschwunden."], "Caledonian Road": ["Benannt nach dem Caledonian Asylum, einem Heim für schottische Kinder.", "Das Heim wurde für Kinder schottischer Soldaten und Seeleute gegründet, die in den Napoleonischen Kriegen gefallen oder verwundet waren, und zog 1828 an diese Straße. „Caledonia“ ist der alte lateinische Name Schottlands."], "Camden Town": ["Benannt nach Charles Pratt, 1. Earl Camden, dem das Land gehörte.", "1791 begann er, es als Bauland zu verpachten. Sein Titel kam von Camden Place, seinem Haus in Kent, das nach dem Historiker William Camden benannt war."], "Canada Water": ["Benannt nach einem See, der einst zum Canada Dock gehörte.", "Das Dock in den Surrey Docks hieß nach dem Land, aus dem die meisten Schiffe kamen, beladen mit Holz. Nach der Schließung der Docks wurde es größtenteils zugeschüttet, und 1999 wurde die Station eröffnet."], "Canary Wharf": ["Benannt nach einem Lagerhaus für Obst von den Kanarischen Inseln.", "Ab den 1930er-Jahren entluden hier Obstschiffe von den Inseln. Die Inseln selbst sollen nach Hunden benannt sein (lateinisch canis), was gut passt: Canary Wharf liegt auf der Isle of Dogs, der „Hundeinsel“."], "Canning Town": ["Wahrscheinlich nach einem Canning benannt, aber niemand weiß, nach welchem.", "Eine Theorie nennt Charles Canning, Vizekönig von Indien, doch der Name war schon in Gebrauch, bevor er berühmt wurde. Andere denken an seinen Vater, Premierminister George Canning, oder an eine örtliche Firma namens Canning."], "Cannon Street": ["„Cannon“ hat nichts mit Kanonen zu tun: Der Name kommt von den Kerzenmachern.", "Im Mittelalter hieß sie Candelwrichtestrete, die Straße der Kerzenmacher. Mit der Zeit wurde daraus Cannon Street."], "Canons Park": ["Benannt nach den Kanonikern des Priorats St Bartholomew, denen hier Land gehörte.", "Nachdem Heinrich VIII. das Priorat aufgelöst hatte, ging das Gut an private Besitzer. Anfang des 18. Jahrhunderts baute der Herzog von Chandos hier ein prächtiges Haus namens Cannons, das 1747 abgerissen wurde. Sein Park wurde zu Canons Park."], "Chalfont & Latimer": ["Benannt nach den Dörfern Chalfont und Latimer.", "„Chalfont“ bedeutet wahrscheinlich der Kreidebach, von altenglisch cealc funta. Latimer ist nach der Familie Latimer benannt, die das Land ab dem frühen 14. Jahrhundert besaß. Bis 1915 hieß die Station Chalfont Road."], "Chalk Farm": ["„Chalk“ (Kreide) hat nichts mit Kreide zu tun: Der Name kommt von der Chalcot Farm.", "Chalcot kommt vielleicht von altenglischen Wörtern für „kalte Hütten“. Der Hof war vor etwa 200 Jahren ein bekannter Orientierungspunkt."], "Chancery Lane": ["Benannt nach der Chancery, einer königlichen Kanzlei und einem Gericht im mittelalterlichen England.", "Die Chancery verwahrte die Urkunden des Königs und urteilte nach Billigkeit. Die Straße liegt bis heute im Herzen des juristischen London, nahe den Inns of Court."], "Charing Cross": ["„Charing“ bedeutet wohl eine Biegung, und das Kreuz ist ein Denkmal für eine Königin.", "Der Name kommt vielleicht von altenglisch cierring, eine Wende, etwa die Biegung der Themse. Eduard I. ließ hier ein Kreuz für seine Frau Eleonore errichten, die 1290 starb. Eine viktorianische Nachbildung steht vor dem Fernbahnhof."], "Chesham": ["„Chesham“ bedeutet die Flusswiese bei einem Steinhaufen.", "Etwa ein Jahrhundert vor der normannischen Eroberung wurde es Cæstæleshamm geschrieben. Chesham ist der Endpunkt eines eingleisigen Zweigs der Metropolitan Line."], "Chigwell": ["Was „Chigwell“ bedeutet, weiß niemand so genau.", "Es könnte der Brunnen oder die Quelle eines Mannes namens Cicca sein oder von einem ganz anderen Wort kommen. Das Dorf liegt am Rand des Epping Forest."], "Chiswick Park": ["„Chiswick“ bedeutet der Käsehof.", "Der altenglische Name verweist auf einen Hof, der nahe der Themse Käse herstellte. Die Station wurde 1879 als Acton Green eröffnet und heißt seit 1910 Chiswick Park."], "Chorleywood": ["„Chorley“ bedeutet wahrscheinlich die Lichtung der ceorls, der freien Bauern.", "Ceorl ist das altenglische Wort, aus dem „churl“ (Bauer, Grobian) wurde. Der „wood“, der Wald, braucht keine Erklärung. Bis 1964 schrieb sich die Station Chorley Wood, in zwei Wörtern."], "Clapham Common": ["Benannt nach der Gemeindewiese von Clapham, einer großen Freifläche.", "„Clapham“ bedeutet wahrscheinlich das Gehöft bei einem Hügel, von altenglisch clopp; eine andere Idee ist ein Mann namens Cloppa. Die Wiese war einst Weideland und ist heute ein öffentlicher Park."], "Clapham North": ["Benannt nach Clapham, wahrscheinlich das Gehöft bei einem Hügel.", "Der altenglische Name kommt vielleicht von clopp, Klumpen oder Hügel, oder von einem Mann namens Cloppa. Die Station wurde 1900 als Clapham Road eröffnet und 1926 in Clapham North umbenannt."], "Clapham South": ["Benannt nach Clapham, wahrscheinlich das Gehöft bei einem Hügel.", "Sie wurde 1926 eröffnet; als Name war auch „Nightingale Lane“ im Gespräch. Unter der Station liegt einer von acht Tiefbunkern, die im Zweiten Weltkrieg gebaut wurden."], "Cockfosters": ["Woher „Cockfosters“ kommt, weiß niemand sicher.", "Der Name ist seit dem 16. Jahrhundert belegt. Eine beliebte Idee ist, dass hier der „cock forester“ wohnte, der oberste Förster des königlichen Jagdgebiets Enfield Chase."], "Colindale": ["Der Name soll an die Familie Collin erinnern, Grundbesitzer im 16. Jahrhundert.", "Colindale war bis ins 20. Jahrhundert Ackerland; heute steht hier das Museum der Royal Air Force auf dem Gelände des Flugplatzes Hendon."], "Colliers Wood": ["Benannt nach einem Wald, den „colliers“ nutzten, also Köhler.", "Früher war ein collier jemand, der Holzkohle herstellte, kein Bergmann. Der Wald bestand bis ins späte 19. Jahrhundert."], "Covent Garden": ["„Covent“ ist eine alte Form von „convent“, Kloster.", "Im Mittelalter war hier der Garten der Westminster Abbey. Der berühmte Obst- und Gemüsemarkt begann im 17. Jahrhundert und zog 1974 nach Nine Elms."], "Croxley": ["„Croxley“ bedeutet wahrscheinlich die Lichtung eines Mannes namens Crocc.", "Leah, eine Waldlichtung, ist eine der häufigsten Endungen englischer Ortsnamen. Die Station wurde 1925 als Croxley Green eröffnet und heißt seit 1949 Croxley."], "Dagenham East": ["„Dagenham“ bedeutet das Gehöft eines Sachsen namens Dæcca.", "Der Name wurde 666 erstmals aufgeschrieben, als Dæccanhaam, in einer Urkunde der Abtei Barking. Die Station wurde 1902 als Dagenham eröffnet und heißt seit 1949 Dagenham East."], "Dagenham Heathway": ["Benannt nach Dagenham und dem Heathway, der Straße zur Heide von Becontree.", "Dagenham bedeutet das Gehöft eines Sachsen namens Dæcca. Die Station wurde 1932 einfach als Heathway eröffnet, für die neue Siedlung Becontree, und erhielt 1949 den Zusatz „Dagenham“."], "Debden": ["„Debden“ bedeutet das tiefe Tal.", "Gemeint ist das Tal des Flusses Roding. Die Station wurde 1865 an einer Eisenbahnlinie eröffnet und hieß bis 1949 Chigwell Lane, als die Central Line sie übernahm."], "Dollis Hill": ["Woher „Dollis Hill“ kommt, weiß niemand so genau.", "Eine Idee ist eine örtliche Familie namens Dalley. Im Zweiten Weltkrieg baute die Forschungsstelle der Post hier Colossus, einen der ersten elektronischen Computer, für die Codeknacker von Bletchley Park. Auch Churchills Notbunker „Paddock“ liegt in der Nähe."], "Ealing Broadway": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name, um 700 als Gillingas belegt, wurde langsam zu Ylling und dann Ealing. Ein „Broadway“ ist eine breite Hauptstraße, hier die Einkaufsstraße der Stadt."], "Ealing Common": ["Benannt nach der Gemeindewiese, einem offenen Grasland in Ealing.", "„Ealing“ bedeutet die Leute eines Sachsen namens Gilla. Von 1886 bis 1910 hieß die Station Ealing Common and West Acton."], "Earl's Court": ["Benannt nach dem Gericht der Earls of Oxford, der Grundherren.", "Die Familie de Vere, Earls of Oxford, besaß das Land von kurz nach der normannischen Eroberung an rund 500 Jahre lang. Ihr Gutsgericht, wo örtliche Streitfälle verhandelt wurden, stand nahe der Station."], "East Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. East Acton war ein eigener Weiler östlich der Stadt; die Station wurde 1920 eröffnet."], "East Finchley": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Der Name endet auf altenglisch leah, eine Waldlichtung. Auf der Station steht die Statue eines Bogenschützen von Eric Aumonier, der seinen Pfeil Richtung Innenstadt richtet."], "East Ham": ["„Ham“ bedeutet trockenes Land in einer Flussbiegung oder zwischen Flüssen.", "Das Land liegt hier zwischen Themse, Lea und Roding. Etwa ein Jahrhundert vor den Normannen wurde es Hamme genannt und im 12. Jahrhundert in East Ham und West Ham geteilt."], "East Putney": ["„Putney“ bedeutet der Landeplatz eines Mannes namens Putta.", "Das Domesday Book von 1086 nennt es Putelei. Der Landeplatz lag an der Themse, dort, wo heute die Putney Bridge steht."], "Eastcote": ["„Eastcote“ bedeutet die Hütte oder die Hütten im Osten.", "Sie lagen östlich von Ruislip. Ascot bei Windsor hat denselben Ursprung."], "Edgware": ["„Edgware“ bedeutet wahrscheinlich der Fischteich eines Sachsen namens Ecgi.", "Ein „wer“, ein Wehr, war ein Teich oder Damm zum Fischfang. Die Northern Line erreichte Edgware 1924 und sollte weiterführen, doch die Verlängerung wurde nie vollendet."], "Edgware Road": ["Benannt nach der Straße nach Edgware, die der römischen Watling Street folgt.", "Edgware bedeutet wahrscheinlich der Fischteich eines Sachsen namens Ecgi. Die Straße führt schnurgerade nach Nordwesten, wie römische Straßen eben."], "Elephant & Castle": ["Höchstwahrscheinlich benannt nach einem Postkutschengasthof namens Elephant and Castle.", "Einer beliebten Geschichte nach kommt der Name von „Infanta de Castilla“, einer spanischen Prinzessin, doch Historiker bezweifeln das. Ein Elefant mit einer Burg auf dem Rücken war ein verbreitetes Zeichen, etwa im Wappen der Messerschmiede-Zunft."], "Elm Park": ["Der Name wurde in den 1930er-Jahren für eine neue Gartenstadtsiedlung gewählt.", "Die Siedlung entstand auf Ackerland zwischen Hornchurch und Rainham, und 1935 wurde die Station für sie eröffnet."], "Embankment": ["Benannt nach dem Victoria Embankment, der in den 1860er-Jahren gebauten Uferbefestigung an der Themse.", "Joseph Bazalgette baute sie für neue Abwasserkanäle und die District Railway und schuf dabei eine Uferstraße. Die Station hatte viele Namen mit „Charing Cross“, bevor sie 1976 Embankment wurde."], "Epping": ["„Epping“ bedeutet wahrscheinlich die Leute des Hochlands.", "Im Domesday Book von 1086 steht es als Eppinges. Der große Wald in der Nähe ist nach der Stadt benannt, nicht umgekehrt."], "Euston": ["Benannt nach Euston Hall in Suffolk, dem Sitz der Herzöge von Grafton.", "Den Herzögen gehörte hier das Land, und Euston Road und Euston Square übernahmen den Namen ihres Landsitzes. Das Dorf Euston in Suffolk bedeutet wohl der Hof eines Mannes namens Efe."], "Euston Square": ["Benannt nach Euston Square, dem Platz beim Fernbahnhof.", "Der Name kommt von Euston Hall in Suffolk, dem Sitz der Herzöge von Grafton, denen das Land gehörte. Die Station wurde 1863 als Gower Street eröffnet und 1909 umbenannt."], "Fairlop": ["Benannt nach der Fairlop Oak, einer riesigen Eiche im Hainault Forest.", "Ab dem frühen 18. Jahrhundert fand jeden Sommer ein Jahrmarkt unter der Eiche statt, gegründet von einem Einheimischen, Daniel Day. Der Baum wurde durch ein Feuer beschädigt und stürzte im frühen 19. Jahrhundert im Sturm um."], "Farringdon": ["Benannt nach Nicholas und William de Faringdon, Ratsherren der City.", "Ihnen gehörte hier im 13. Jahrhundert Land, und ihr Name ging auf einen Stadtbezirk, eine Straße und die Station über. Farringdon war eine der ersten Stationen der ersten U-Bahn der Welt, eröffnet 1863."], "Finchley Central": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Die Station wurde 1867 an einer Eisenbahnlinie eröffnet und hieß bis 1940 Finchley (Church End); dann wurde sie zu Finchley Central."], "Finchley Road": ["Benannt nach der Straße nach Finchley, in den 1820er-Jahren als Mautstraße gebaut.", "Finchley bedeutet wahrscheinlich die Lichtung, wo Finken leben. Die neue Straße umging die steilen Hügel von Hampstead weiter östlich."], "Finsbury Park": ["Benannt nach einem 1869 eröffneten Park, der aber nicht in Finsbury liegt.", "Der Park war für die Bewohner des alten Bezirks Finsbury weiter südlich gedacht. „Finsbury“ bedeutet wahrscheinlich das Gut eines Mannes namens Finn."], "Fulham Broadway": ["„Fulham“ bedeutet das Uferland eines Mannes namens Fulla.", "Um 700 wurde es Fulanham geschrieben. Die Station wurde 1880 als Walham Green eröffnet, nach der Dorfwiese, und 1952 in Fulham Broadway umbenannt."], "Gants Hill": ["Wahrscheinlich benannt nach der Familie le Gant, Verwalter der Ländereien der Abtei Barking.", "Die Familie ist hier seit dem 13. Jahrhundert belegt. Die 1947 eröffnete Station hat zwischen den Bahnsteigen eine lange gewölbte Halle nach dem Vorbild der Moskauer Metro."], "Gloucester Road": ["Benannt nach Maria, Herzogin von Gloucester, die hier 1805 ein Haus baute.", "Vorher hieß die Straße Hog Moore Lane. Die Station wurde 1868 als Brompton (Gloucester Road) eröffnet."], "Golders Green": ["Benannt nach der Familie Godyere, die hier im 14. Jahrhundert Land besaß.", "Die Wiese war offenes Land neben ihrem Besitz. Das Dorf wuchs schnell, nachdem 1907 die U-Bahn kam."], "Goldhawk Road": ["Wahrscheinlich benannt nach John Goldhawk, einem Grundbesitzer im 15. Jahrhundert.", "Ihm gehörte viel Land in der Gegend, die damals zur Pfarrei Fulham gehörte. Die Station wurde 1914 eröffnet."], "Goodge Street": ["Benannt nach John Goodge, der das Land ab 1746 bebaute.", "Vor dem Bau der Häuser war hier eine Wiese namens Crab Tree Field. Die Station wurde 1907 als Tottenham Court Road eröffnet und ein Jahr später in Goodge Street umbenannt."], "Grange Hill": ["Eine „grange“ war ein Gutshof mit Scheunen, oft im Besitz eines Klosters.", "Dieser stand auf einem Hügel. Mit der Kinderserie Grange Hill hat der Name nichts zu tun."], "Great Portland Street": ["Benannt nach der Straße, die an die Herzöge von Portland erinnert.", "Dem 2. Herzog von Portland gehörte das Land ab 1734. Die Station wurde 1863 als Portland Road eröffnet."], "Green Park": ["Benannt nach dem Park, der 1746 in The Green Park umbenannt wurde.", "Zuerst hieß er Upper St James's Park. Der neue Name beschrieb wohl seine offene Wiese mit wenigen Bäumen und ohne Blumenbeete. Die Station wurde 1906 als Dover Street eröffnet."], "Greenford": ["„Greenford“ bedeutet die grüne Furt.", "Die Furt führte durch den Fluss Brent, der sich noch heute zwischen grünen Ufern durch die Gegend windet."], "Gunnersbury": ["„Gunnersbury“ bedeutet das Gut einer Frau namens Gunnhild.", "Gunnhild ist ein skandinavischer Name. Eine Legende verbindet ihn mit einer Nichte von König Knut, doch Beweise gibt es keine."], "Hainault": ["„Hainault“ bedeutet wahrscheinlich der Wald einer geistlichen Gemeinschaft.", "1221 wurde es Henehout geschrieben, altenglisch für einen Klosterwald, hier im Besitz der Abtei Barking. Die französisch wirkende Schreibweise kam später, durch eine irrige Verbindung mit Philippa von Hennegau (Hainaut), der Frau Eduards III."], "Hammersmith": ["„Hammersmith“ bedeutet wahrscheinlich ein Ort mit einer Hammerschmiede.", "Der Name ist seit 1294 belegt. Eine andere, weniger wahrscheinliche Theorie sieht darin den Landeplatz eines Mannes namens Hammoder."], "Hampstead": ["„Hampstead“ bedeutet einfach Gehöft.", "Der Name kommt von altenglisch hām-stede, wie bei Berkhamsted und Wheathampstead. Die 1907 eröffnete Station Hampstead hat die tiefsten Bahnsteige der U-Bahn."], "Hanger Lane": ["„Hanger“ bedeutet ein bewaldeter Hang.", "Es kommt von altenglisch hangra, ein Wald an einem steilen Hang. Dasselbe Wort steckt im nahen Hanger Hill."], "Harlesden": ["„Harlesden“ bedeutet der Hof eines Mannes namens Heoruwulf.", "Im Domesday Book von 1086 steht es als Herulvestune; -tune bedeutet Hof. Die Züge der Bakerloo Line halten hier seit 1917."], "Harrow & Wealdstone": ["Benannt nach Harrow und dem Wealdstone, dem Grenzstein von Harrow Weald.", "„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel. „Weald“ bedeutet Wald, und der Stein markierte den Rand der Wälder nördlich von Harrow. Der Bahnhof wurde 1837 an der London and Birmingham Railway eröffnet."], "Harrow-on-the-Hill": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich oben auf dem Hügel, wo heute die Kirche St Mary steht. Die Station wurde 1880 als Harrow eröffnet und erhielt 1894 den Zusatz „on-the-Hill“."], "Hatton Cross": ["„Hatton“ bedeutet der Hof auf der Heide.", "Die Heide war Hounslow Heath, wo heute der Flughafen Heathrow liegt. „Cross“ meint wahrscheinlich eine Kreuzung."], "Heathrow Terminal 4": ["„Heathrow“ bedeutet die
