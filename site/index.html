 Häuserreihe auf der Heide.", "1410 wurde es erstmals als La Hetherewe erwähnt, ein Weiler auf der Hounslow Heath. Terminal 4 wurde 1986 eröffnet, mit eigener Station an einer Schleife der Piccadilly Line."], "Heathrow Terminal 5": ["„Heathrow“ bedeutet die Häuserreihe auf der Heide.", "Der seit 1410 belegte Weiler verschwand, als in den 1940er-Jahren der Flughafen gebaut wurde. Terminal 5 und seine Station wurden 2008 eröffnet."], "Heathrow Terminals 2 & 3": ["„Heathrow“ bedeutet die Häuserreihe auf der Heide.", "Die Station wurde 1977 als Heathrow Central eröffnet. Seit 2016, nach der Schließung von Terminal 1, heißt sie Heathrow Terminals 2 & 3."], "Hendon Central": ["„Hendon“ bedeutet am hohen Hügel.", "Im Domesday Book von 1086 steht es als Hendun. Die Station wurde 1923 eröffnet."], "High Barnet": ["„Barnet“ bedeutet durch Brandrodung gewonnenes Land.", "Es kommt von altenglisch bærnet, Brennen. Die Stadt heißt auch Chipping Barnet, „chipping“ bedeutet Markt. 1471 wurde gleich nördlich der Stadt die Schlacht von Barnet ausgetragen, Teil der Rosenkriege."], "High Street Kensington": ["„Kensington“ bedeutet der Hof eines Sachsen namens Cynesige.", "Im Domesday Book steht es als Chenesitun. Die Station wurde 1868 an der Kensington High Street eröffnet, nahe dem Kensington-Palast."], "Highbury & Islington": ["„Highbury“ bedeutet das hohe Gut; „Islington“ der Hügel eines Mannes namens Gisla.", "Islington wurde um 1000 als Gislandune geschrieben. Highbury war das höher gelegene von zwei Gütern der Pfarrei. Die Station der Victoria Line wurde 1968 eröffnet."], "Highgate": ["Benannt nach einem hohen Tor auf dem Hügel, einer Mautstelle an der Straße nach Norden.", "Das Tor führte in den Jagdpark des Bischofs von London, und Reisende auf der Great North Road zahlten hier Maut. Highgate ist einer der höchsten Punkte Londons."], "Hillingdon": ["„Hillingdon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Hilla.", "Im Domesday Book von 1086 steht es als Hillendone; -done bedeutet Hügel. Die Station wurde 1923 eröffnet."], "Holborn": ["„Holborn“ bedeutet wahrscheinlich der Bach in der Senke.", "Der Bach war ein Zufluss des Flusses Fleet und ist längst unter der Erde verschwunden. Londoner sagen traditionell „Hoh-bn“."], "Holland Park": ["Benannt nach Holland House, einem Herrenhaus aus dem 17. Jahrhundert, dessen Gelände zum Park wurde.", "Das Haus ist nach Henry Rich, Earl of Holland, benannt; sein Titel kam von Holland in Lincolnshire, nicht von den Niederlanden. Später lebte dort die Familie Fox, die Barone Holland."], "Holloway Road": ["„Holloway“ bedeutet der Hohlweg, eine tief in den Boden eingefahrene Straße.", "Vieh und Karren auf dem Weg zu Londons Märkten haben den Weg über Jahrhunderte ausgehöhlt. Die andere Idee, ein „heiliger Weg“ für Pilger, ist weniger wahrscheinlich."], "Hornchurch": ["„Hornchurch“ bedeutet die Kirche mit Hörnern.", "Der Name ist 1222 belegt. Warum, weiß niemand genau, aber die Kirche St Andrew trägt an ihrer Ostseite noch heute einen Stierkopf mit echten Hörnern."], "Hounslow Central": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Der „Hund“ kann ein Tier oder ein Mann mit dem Spitznamen Hund sein, der Hügel wohl ein Grabhügel. Die Station wurde 1886 als Heston Hounslow eröffnet und 1925 umbenannt."], "Hounslow East": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Der Name endet auf altenglisch hlāw, Hügel oder Grabhügel. Bis 1925 hieß die Station Hounslow Town."], "Hounslow West": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Die Station wurde 1884 als Hounslow Barracks eröffnet, nach der nahen Kaserne, und 1925 in Hounslow West umbenannt."], "Hyde Park Corner": ["Benannt nach der Ecke des Hyde Park.", "Der Park war einst das Gut Hyde der Westminster Abbey; ein „hide“ war ein altes Flächenmaß. Heinrich VIII. übernahm es 1536 als Jagdgebiet."], "Ickenham": ["„Ickenham“ bedeutet das Gehöft eines Mannes namens Ticca.", "Das Domesday Book von 1086 nennt es Ticheham. Mit der Zeit ging das T verloren."], "Kennington": ["„Kennington“ bedeutet der Hof eines Mannes namens Cena.", "Im Domesday Book von 1086 steht es als Chenintune. Kennington Park war einst eine Gemeindewiese, auf der große öffentliche Versammlungen stattfanden."], "Kensal Green": ["„Kensal“ bedeutet der Wald des Königs.", "Im 13. Jahrhundert wurde es Kingisholte geschrieben. Welcher König gemeint ist, weiß niemand. Die Wiese lag dort, wo heute der 1833 eröffnete Friedhof Kensal Green ist."], "Kensington (Olympia)": ["Benannt nach Olympia, einer 1886 eröffneten Ausstellungshalle.", "Die Halle ist wohl nach Olympia im antiken Griechenland benannt, der Heimat der Olympischen Spiele. Kensington bedeutet der Hof eines Sachsen namens Cynesige. Bis 1946 hieß die Station Kensington (Addison Road)."], "Kentish Town": ["Trotz des Namens hat Kentish Town, soweit bekannt, nichts mit Kent zu tun.", "1208 wurde es Kentisston geschrieben. Der Name kommt vielleicht von einer Familie namens Kentish oder von Wörtern für ein Bachbett, das des heute verborgenen Flusses Fleet."], "Kenton": ["„Kenton“ bedeutet wahrscheinlich der Hof eines Mannes namens Coena.", "Der Name endet auf altenglisch tūn, Hof oder Siedlung. Die Züge der Bakerloo Line halten hier seit 1917."], "Kew Gardens": ["Benannt nach den Königlichen Botanischen Gärten in Kew.", "„Kew“ wurde 1327 als Cayho erwähnt und bedeutet wahrscheinlich der Landvorsprung bei einer Anlegestelle an der Themse. Die Gärten gehören zum UNESCO-Welterbe."], "Kilburn": ["„Kilburn“ bedeutet wahrscheinlich der Bach der Kühe oder der Bach des Königs.", "Der Bach ist der Westbourne, heute unterirdisch. 1134 wurde der Name als Cuneburna erwähnt. Wo die Römerstraße den Bach kreuzte, stand ein Kloster."], "Kilburn Park": ["„Kilburn“ bedeutet wahrscheinlich der Bach der Kühe oder der Bach des Königs.", "Der Bach ist der Westbourne, heute unterirdisch. „Park“ kam für die neue Wohnsiedlung hinzu. Die Station wurde 1915 eröffnet."], "King's Cross St Pancras": ["Benannt nach einer Statue von König Georg IV. und der Kirche St Pancras.", "Die Gegend hieß früher Battle Bridge, nach einer Brücke über den Fleet. Ein Denkmal für Georg IV. stand hier etwa von 1830 bis 1845; es war unbeliebt und wurde bald entfernt. Der heilige Pankratius war ein Junge, der der Überlieferung nach 304 in Rom den Märtyrertod starb."], "Kingsbury": ["„Kingsbury“ bedeutet das Gut des Königs.", "Welcher König gemeint ist, weiß niemand: Zur Zeit des Domesday Book 1086 war das Land schon in privater Hand. Die Station wurde 1932 eröffnet."], "Knightsbridge": ["„Knightsbridge“ bedeutet die Brücke der jungen Männer.", "Altenglisch cniht bedeutete junger Mann oder Diener, noch nicht Ritter in Rüstung. Die Brücke führte über den Westbourne. Der Name ist um 1050 erstmals belegt."], "Ladbroke Grove": ["Benannt nach James Weller Ladbroke, der die Gegend Mitte des 19. Jahrhunderts bebaute.", "Seiner Familie gehörte das Land seit mindestens dem frühen 17. Jahrhundert, und er benannte die Hauptstraße nach sich selbst. Die Station wurde 1864 als Notting Hill eröffnet."], "Lambeth North": ["„Lambeth“ bedeutet der Landeplatz für Lämmer.", "1062 wurde es Lambehitha geschrieben: hithe ist ein altes Wort für einen Landeplatz am Fluss, wie in Rotherhithe. Die Station wurde 1906 eröffnet und heißt seit 1917 Lambeth North."], "Lancaster Gate": ["Benannt nach dem Tor Lancaster Gate der Kensington Gardens.", "Es wurde zu Ehren von Königin Victoria benannt, die auch Herzog von Lancaster war. Die Stadt Lancaster selbst ist nach einem römischen Kastell, einem „caster“, am Fluss Lune benannt."], "Latimer Road": ["Benannt nach Edward Latymer, einem Londoner Kaufmann, der 1627 starb.", "Er vermachte hier Land, um den Armen von Hammersmith zu helfen, und sein Geld gründete auch die Latymer School. Die Straße führte durch seinen Besitz. Die Station wurde 1868 eröffnet."], "Leicester Square": ["Benannt nach dem Earl of Leicester, der hier Leicester House baute.", "Der Platz wurde in den 1670er-Jahren vor seinem Haus angelegt. Die Stadt Leicester ist nach einem keltischen Stamm und „ceaster“, einer römischen Stadt, benannt."], "Leyton": ["„Leyton“ bedeutet der Hof am Fluss Lea.", "Der Lea, auch Lee geschrieben, fließt am Rand des Viertels entlang. Der Bahnhof wurde 1856 als Low Leyton eröffnet und kam 1947 zur Central Line."], "Leytonstone": ["„Leytonstone“ bedeutet Leyton am Stein.", "Leyton ist der Hof am Lea. Der Stein war wahrscheinlich ein alter römischer Meilenstein oder Grenzstein beim Hollybush Hill. Der Regisseur Alfred Hitchcock wurde hier 1899 geboren."], "Liverpool Street": ["Benannt nach Lord Liverpool, Premierminister von 1812 bis 1827.", "Die Straße wurde in den 1820er-Jahren nach ihm benannt. Sein Titel kommt von der Stadt Liverpool, 1190 als Liuerpul erwähnt, wahrscheinlich ein Teich oder Priel mit schlammigem Wasser. Die Station wurde 1875 als Bishopsgate eröffnet."], "London Bridge": ["Benannt nach der London Bridge, dem ältesten Themseübergang der Stadt.", "Schon seit der Römerzeit gibt es hier eine Brücke. Der Fernbahnhof wurde 1836 eröffnet und ist der älteste noch genutzte Kopfbahnhof im Zentrum Londons."], "Loughton": ["„Loughton“ bedeutet der Hof eines Mannes namens Luhha.", "Im Domesday Book von 1086 steht es als Lochintuna. Viel älter ist Loughton Camp, eine Wallanlage aus der Eisenzeit im nahen Wald."], "Maida Vale": ["Benannt nach einem Pub, dem Hero of Maida, der an eine Schlacht in Italien erinnerte.", "1806 besiegte eine britische Truppe unter General Sir John Stuart die Franzosen bei Maida in Kalabrien. Bald darauf eröffnete das Pub an der Edgware Road, und die Gegend übernahm seinen Namen."], "Manor House": ["Benannt nach dem Manor House, einem Pub an den Green Lanes.", "Der Gasthof stand an der Straße nach Norden und gab der Kreuzung ihren Namen. Die Station wurde 1932 eröffnet."], "Mansion House": ["Benannt nach dem Mansion House, dem Amtssitz des Lord Mayor der City of London.", "Das prächtige Haus wurde im 18. Jahrhundert gebaut. Die Stationen Bank und Cannon Street liegen sogar etwas näher daran."], "Marble Arch": ["Benannt nach dem weißen Marmorbogen von John Nash.", "Er wurde in den 1820er-Jahren als Eingang zum Buckingham Palace gebaut und 1851 hierher versetzt. In der Nähe stand der Galgen von Tyburn, jahrhundertelang Londons wichtigste Hinrichtungsstätte."], "Marylebone": ["„Marylebone“ bedeutet die Marienkirche am Bach.", "1453 wurde es Maryburne geschrieben, nach einer Marienkirche am Bach Tyburn; das „le“ kam später hinzu. Die Station wurde 1907 als Great Central eröffnet, nach der Eisenbahngesellschaft."], "Mile End": ["So benannt, weil es eine Meile von Aldgate entfernt liegt, dem alten Tor der City.", "Der Name wird seit dem 13. Jahrhundert für den Ort verwendet, an dem die erste Meile der Straße nach Essex endete."], "Mill Hill East": ["„Mill Hill“ bedeutet wahrscheinlich der Hügel mit der Windmühle.", "Von der Mühle ist nichts geblieben, aber ein Feld in der Nähe heißt noch Mill Field. Die Northern Line erreichte die Station 1941; sie sollte weiterführen, doch die Verlängerung wurde nie gebaut."], "Monument": ["Benannt nach dem Monument für den Großen Brand von London von 1666.", "Die Säule wurde von Christopher Wren und Robert Hooke entworfen. Sie ist 61 Meter hoch, genau so weit wie von ihrem Fuß bis zu der Stelle in der Pudding Lane, wo das Feuer ausbrach."], "Moor Park": ["Benannt nach Moor Park, einem palladianischen Herrenhaus in der Nähe.", "Es steht an der Stelle eines älteren Hauses namens The More, das Kardinal Wolsey gehörte. Die Station wurde 1910 als Sandy Lodge eröffnet."], "Moorgate": ["Benannt nach dem Moorgate, einem kleinen Tor in der Stadtmauer der City.", "Es führte hinaus nach Moorfields, sumpfigem Gelände vor der Mauer. Das Tor wurde 1762 abgerissen."], "Morden": ["„Morden“ bedeutet wahrscheinlich der Hügel im Moor.", "Es kommt von altenglisch mōr, Moor, und dūn, Hügel. Morden ist die Endstation der Northern Line und die südlichste Station der U-Bahn."], "Mornington Crescent": ["Benannt nach dem Earl of Mornington, dem älteren Bruder des Herzogs von Wellington.", "Richard Wellesley, 2. Earl of Mornington, war Generalgouverneur von Indien und Außenminister. Die Station gab auch einem berühmten Nonsens-Spiel in der BBC-Radiokomödie I'm Sorry I Haven't a Clue den Namen."], "Neasden": ["„Neasden“ bedeutet der nasenförmige Hügel.", "Es kommt von altenglisch næs, Nase, und dūn, Hügel. Die Station wurde 1880 als Kingsbury & Neasden eröffnet."], "Newbury Park": ["„Newbury“ bedeutet das neue Gut.", "Der Name ist mittelalterlich. Die Station wurde 1947 eröffnet, als die Central Line eine Nebenbahn übernahm."], "Nine Elms": ["Benannt nach einer Reihe von neun Ulmen.", "Der Name wurde um 1645 erstmals erwähnt. Seit 1974 ist hier der New Covent Garden Market, und 2021 wurde die Station eröffnet."], "North Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. Die Station wurde 1923 nördlich des alten Ortskerns eröffnet."], "North Ealing": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name wurde um 700 als Gillingas erwähnt. Die Station North Ealing wurde 1903 eröffnet."], "North Greenwich": ["„Greenwich“ bedeutet der grüne Hafen oder Handelsplatz.", "Der Name ist seit dem frühen 10. Jahrhundert belegt. Die 1999 eröffnete Station liegt etwa drei Kilometer nordöstlich von Greenwich selbst, neben dem einstigen Millennium Dome."], "North Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich auf dem Harrow Hill, wo heute die Kirche St Mary steht. Die Station North Harrow wurde 1915 eröffnet."], "North Wembley": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "Der Name endet auf altenglisch leah, eine Lichtung. Die Züge der Bakerloo Line halten hier seit 1917."], "Northfields": ["Benannt nach den nördlichen Feldern von Ealing.", "Die Felder blieben Ackerland, bis im frühen 20. Jahrhundert Häuser gebaut wurden. Die Station wurde 1908 als Northfield Halt eröffnet."], "Northolt": ["„Northolt“ bedeutet der nördliche Landwinkel.", "Es kommt von altenglisch north und healh, Ecke oder Winkel. Sein Gegenstück im Süden ist Southall. Die Station wurde 1948 an der Central Line eröffnet."], "Northwick Park": ["Benannt nach Northwick Park, der Grünfläche neben der Station.", "Der Name soll von der Familie Rushout stammen, der das Ackerland hier gehörte und deren Landsitz Northwick Park in den Cotswolds war. Die Station wurde 1923 als Northwick Park & Kenton eröffnet."], "Northwood": ["„Northwood“ bedeutet der Wald im Norden.", "Es war der bewaldete Nordteil der alten Pfarrei Ruislip. Die Station wurde 1887 eröffnet."], "Northwood Hills": ["Benannt nach Northwood, dem Wald nördlich von Ruislip, und seinen Hügeln.", "Die Station wurde 1933 für eine neue Wohnsiedlung eröffnet. Seltsamerweise liegt sie etwas tiefer als die Station Northwood."], "Notting Hill Gate": ["„Notting“ bedeutet wahrscheinlich die Leute eines Mannes namens Cnotta.", "Der Name ist seit dem 14. Jahrhundert in vielen Schreibweisen belegt, etwa Knottynghull. Das „gate“ war eine Mautschranke an der Straße nach Uxbridge."], "Oakwood": ["Benannt nach dem Oakwood Park, der nach den Eichen von Enfield Chase heißt.", "Enfield Chase war ein königliches Jagdgebiet. Die Station wurde 1933 als Enfield West eröffnet und heißt seit 1946 Oakwood."], "Old Street": ["Benannt nach der Straße, um 1200 als Ealdestrate erwähnt.", "Der Name bedeutet einfach „alte Straße“. Die Straße ist wahrscheinlich römisch, fast 2.000 Jahre alt."], "Osterley": ["„Osterley“ bedeutet wahrscheinlich die Lichtung mit einem Schafpferch.", "Der Name ist seit dem 13. Jahrhundert belegt. Osterley House wurde im 16. Jahrhundert für den Kaufmann Sir Thomas Gresham gebaut und später von Robert Adam umgestaltet."], "Oval": ["Benannt nach dem Cricketstadion The Oval.", "Der Name geht auf einen ovalen Straßenplan aus den 1790er-Jahren zurück; das Cricketfeld wurde darin angelegt. Der Surrey County Cricket Club spielt hier seit 1845."], "Oxford Circus": ["Ein „circus“ ist ein runder Platz, an dem Straßen zusammenkommen; einen Zirkus gab es nie.", "Hier kreuzen sich Oxford Street und Regent Street. Die Oxford Street war die Hauptstraße nach Westen, Richtung Oxford."], "Paddington": ["„Paddington“ bedeutet der Hof eines Mannes namens Padda.", "Der Name ist angelsächsisch; -ington bedeutet die Siedlung von jemandes Leuten. Die Station wurde 1863 an der ersten U-Bahn eröffnet."], "Park Royal": ["Benannt nach dem Ausstellungsgelände der Royal Agricultural Society, 1903 hier eröffnet.", "Die Landwirtschaftsschau blieb nur wenige Jahre, doch der Name blieb. Später wurde die Gegend zu einem der größten Gewerbegebiete Londons."], "Parsons Green": ["Benannt nach dem Pfarrhaus von Fulham, das an der Dorfwiese stand.", "Die Dorfwiese ist als kleiner Park erhalten."], "Perivale": ["„Perivale“ bedeutet wahrscheinlich das Tal der Birnbäume.", "Der Name ist seit dem frühen 16. Jahrhundert als Pyryvale belegt. Die Station wurde 1904 als Perivale Halt eröffnet und kam 1947 zur Central Line."], "Piccadilly Circus": ["Benannt nach „piccadills“, steifen Spitzenkragen, die um 1600 in Mode waren.", "Ein Schneider, Robert Baker, wurde mit ihnen reich und baute hier ein Haus, das man Pickadilly Hall nannte. Der Name ging auf die Straße über und auf den „circus“, einen runden Platz."], "Pimlico": ["Woher der Name „Pimlico“ kommt, weiß niemand sicher.", "Eine beliebte Theorie verbindet ihn mit Ben Pimlico, einem für sein Bier berühmten Wirt, doch seine Schenke lag in Hoxton, am anderen Ende Londons. Die Station wurde 1972 mit der Victoria Line eröffnet."], "Pinner": ["„Pinner“ bedeutet wahrscheinlich der nadelförmige Hügel oder der Hügel eines Mannes namens Pinn.", "Der Name endet auf altenglisch ora, Hang oder Hügel. Der Fluss Pinn wurde später nach dem Dorf benannt."], "Plaistow": ["„Plaistow“ bedeutet wahrscheinlich ein Platz für Spiel oder Sport.", "Es kommt wohl von altenglisch plega, Spiel, und stōw, Ort, vielleicht dort, wo Spiele oder Mysterienspiele stattfanden. Andere verbinden es mit Sir Hugh de Plaiz, einem mittelalterlichen Grundherrn. Einheimische sagen „Plar-stow“."], "Preston Road": ["„Preston“ bedeutet der Hof der Priester.", "Es kommt von altenglisch prēost, Priester, und tūn, Hof. Die Station wurde 1908 eröffnet."], "Putney Bridge": ["Benannt nach der Putney Bridge, der Brücke nach Putney am anderen Ufer.", "„Putney“ bedeutet der Landeplatz eines Mannes namens Putta. Die Station liegt tatsächlich auf der Fulham-Seite der Themse. Das Ruderrennen zwischen Oxford und Cambridge beginnt nahe der Brücke."], "Queen's Park": ["Benannt nach Königin Victoria, die regierte, als das Viertel gebaut wurde.", "Park und Wohnsiedlung stammen aus dem späten 19. Jahrhundert. Die Züge der Bakerloo Line halten hier seit 1915."], "Queensbury": ["Ein erfundener Name, in den 1930er-Jahren als Gegenstück zum benachbarten Kingsbury gewählt.", "Man fragte die Einheimischen nach Vorschlägen, und Queensbury gewann. Der Name hat keinen historischen Hintergrund. Die Station wurde 1934 eröffnet."], "Queensway": ["Zu Ehren von Königin Victoria benannt.", "Sie soll als Mädchen auf diesem Weg geritten sein, als sie im nahen Kensington-Palast lebte. Die Straße hieß Queen's Road, die Station ebenso bis 1946."], "Ravenscourt Park": ["Ein Wortspiel mit einem Familiennamen: „raven“ heißt Rabe, auf Französisch „corbeau“.", "Im 18. Jahrhundert taufte der Besitzer Thomas Corbett sein Haus in Ravenscourt um; Raben waren in seinem Wappen. Das Gelände wurde zum öffentlichen Park. Die Station wurde 1877 als Shaftesbury Road eröffnet."], "Rayners Lane": ["Angeblich benannt nach Daniel Rayner, einem Bauern aus der Gegend.", "Als 1904 die Bahn kam, war die Gegend fast leer; die Station wurde 1906 eröffnet, und Häuser folgten erst in den 1930er-Jahren."], "Redbridge": ["Benannt nach einer roten Ziegelbrücke über den Fluss Roding.", "Die Brücke ist seit dem 17. Jahrhundert belegt und wurde 1922 abgerissen. Die 1947 eröffnete Station trug den Namen schon vor dem 1965 gegründeten Londoner Bezirk Redbridge."], "Regent's Park": ["Benannt nach dem Prinzregenten, dem späteren König Georg IV.", "Der Park wurde im frühen 19. Jahrhundert von John Nash angelegt, auf einem früheren Jagdgebiet Heinrichs VIII. Die Regent Street entstand zur selben Zeit."], "Richmond": ["Über Heinrich VII. nach Richmond in Yorkshire benannt.", "Bevor er König wurde, war Heinrich Earl of Richmond. Um 1500 baute er den königlichen Palast in Sheen neu und benannte ihn nach seiner Grafschaft. „Richmond“ ist französisch für „starker Hügel“."], "Rickmansworth": ["„Rickmansworth“ bedeutet die Einfriedung eines Mannes namens Ricmær.", "-worth ist ein altenglisches Wort für Einfriedung oder Hof. Das Domesday Book von 1086 nennt es Prichemareworde."], "Roding Valley": ["Benannt nach dem Fluss Roding, der durch das Tal fließt.", "Der Fluss ist nach den Rodings benannt, Dörfern der Leute eines sächsischen Anführers namens Hroda."], "Royal Oak": ["Benannt nach einem Pub namens Royal Oak.", "Der Pubname erinnert an die Eiche bei Boscobel in Shropshire, in der sich der spätere Karl II. 1651 vor den Soldaten des Parlaments versteckte. Die Station wurde 1871 eröffnet."], "Ruislip": ["„Ruislip“ bedeutet die Sprungstelle, an der Binsen wachsen.", "Es kommt von altenglisch rysc, Binse, und hlȳp, Sprung: wohl eine schmale Stelle am Fluss Pinn, über die man springen konnte. Die Station wurde 1904 eröffnet."], "Ruislip Gardens": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Die Sprungstelle war wohl eine schmale Stelle am Fluss Pinn. „Gardens“ stand für neue Vorstadtsiedlungen. Die Station wurde 1948 an der Central Line eröffnet."], "Ruislip Manor": ["Benannt nach einer Wohnsiedlung auf dem Land des alten Gutes Ruislip.", "Ruislip bedeutet die Sprungstelle, an der Binsen wachsen. Die Station wurde 1912 als kleiner Haltepunkt eröffnet, lange vor den meisten Häusern."], "Russell Square": ["Benannt nach der Familie Russell, den Herzögen von Bedford.", "Ihnen gehörte ein großer Teil von Bloomsbury, und sie legten den Platz um 1800 an."], "St James's Park": ["Benannt nach dem St James's Park, der seinen Namen vom St James's Palace hat.", "Heinrich VIII. baute den Palast an der Stelle eines mittelalterlichen Hospitals für leprakranke Frauen, das dem heiligen Jakobus dem Jüngeren geweiht war. Der Park ist der älteste der königlichen Parks Londons."], "St John's Wood": ["Benannt nach den Johanniterrittern, denen die Wälder hier gehörten.", "Der Orden des heiligen Johannes von Jerusalem hatte sein Priorat in Clerkenwell und besaß im Mittelalter dieses bewaldete Land. Die Station wurde 1939 eröffnet."], "St Paul's": ["Benannt nach der St Paul's Cathedral, gleich südlich davon.", "Seit 604 steht auf diesem Hügel eine dem heiligen Paulus geweihte Kirche. Die Station wurde 1900 als Post Office eröffnet, nach dem nahen Hauptpostamt, und 1937 umbenannt."], "Seven Sisters": ["Benannt nach einem Ring aus sieben Bäumen auf dem Page Green.", "Der örtlichen Überlieferung nach pflanzten sieben Schwestern sie. Die ersten Bäume waren Ulmen; der Ring wurde mehrmals neu gepflanzt, zuletzt 1996 mit Hainbuchen."], "Shepherd's Bush": ["Woher „Shepherd's Bush“ kommt, weiß eigentlich niemand.", "Eine Idee ist, dass Schäfer hier mit ihren Herden auf dem Weg zum Smithfield-Markt in der City rasteten. Eine andere, dass der Name an einen Einheimischen namens Shepherd oder Sheppard erinnert."], "Shepherd's Bush Market": ["Benannt nach dem Straßenmarkt neben der Bahnstrecke in Shepherd's Bush.", "Bis 2008 hieß die Station Shepherd's Bush; dann wurde sie umbenannt, um Verwechslungen mit der Station der Central Line zu vermeiden. Woher „Shepherd's Bush“ kommt, weiß niemand sicher."], "Sloane Square": ["Benannt nach Sir Hans Sloane, Arzt und Sammler.", "Er kaufte 1712 das Gut Chelsea. Seine riesige Sammlung von Büchern, Pflanzen und Kuriositäten wurde nach seinem Tod 1753 zum Grundstock des British Museum."], "Snaresbrook": ["Woher „Snaresbrook“ kommt, weiß niemand sicher.", "Es könnte eine veränderte Form von „Sayers Brook“ sein, einem kleinen Bach, der in den Roding mündet. Die Station wurde 1856 als Snaresbrook & Wanstead eröffnet."], "South Ealing": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name wurde um 700 als Gillingas erwähnt. Die Station South Ealing wurde 1883 eröffnet."], "South Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Bevor die Häuser gebaut wurden, gab es hier nur Felder und den alten Weiler Roxeth. Die Station wurde 1903 eröffnet."], "South Kensington": ["Benannt nach Kensington, dem Hof eines Sachsen namens Cynesige.", "Das Viertel wuchs nach der Weltausstellung von 1851, deren Gewinn die Museen und Hochschulen hier finanzierte. Ein langer Tunnel führt von der Station zu den Museen."], "South Kenton": ["„Kenton“ bedeutet wahrscheinlich der Hof eines Mannes namens Coena.", "Der Name endet auf altenglisch tūn, Hof oder Siedlung. Die Station South Kenton wurde 1933 für neue Wohnhäuser eröffnet."], "South Ruislip": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Die Station wurde 1908 als Northolt Junction eröffnet und heißt erst seit 1947 South Ruislip. Die Central Line kam 1948."], "South Wimbledon": ["Benannt nach Wimbledon, obwohl die Station eigentlich in Merton liegt.", "„Wimbledon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Wynnmann. Viele Jahre hieß die Station South Wimbledon (Merton), um das klarzustellen."], "South Woodford": ["„Woodford“ bedeutet die Furt beim Wald.", "Die Furt führte durch den Fluss Roding. Die Station wurde 1856 als George Lane eröffnet, nach der Straße davor, und ihr Name änderte sich mehrmals, bis er bei South Woodford blieb."], "Southfields": ["Benannt nach den südlichen Feldern von Wandsworth, jahrhundertelang Ackerland.", "Sie wurden im 13. Jahrhundert erstmals erwähnt und blieben Felder bis etwa 1900. Während des Tennisturniers von Wimbledon ist dies die Station für die Plätze."], "Southgate": ["Benannt nach dem Südtor zum königlichen Jagdgebiet Enfield Chase.", "Das Dorf wuchs rund um das Tor. Die runde Station von 1933, entworfen von Charles Holden, steht unter Denkmalschutz."], "Southwark": ["„Southwark“ bedeutet die südliche Befestigung.", "Im frühen 10. Jahrhundert wurde es Suthriganaweorc geschrieben, die Befestigung der Männer von Surrey, die das Südende der London Bridge schützte. Die Station wurde 1999 eröffnet."], "Stamford Brook": ["Benannt nach einem heute verschwundenen Bach zwischen Hammersmith und Chiswick.", "„Stamford“ soll die steinige Furt bedeuten. Der Bach fließt heute in einem Rohr unter den Straßen."], "Stanmore": ["„Stanmore“ bedeutet der steinige Teich.", "Es kommt von altenglisch stān, Stein, und mere, Teich; der Kiesboden hier ist sehr steinig. Die Station wurde 1932 eröffnet."], "Stepney Green": ["„Stepney“ bedeutet der Landeplatz eines Mannes namens Stebba.", "Um 1000 wurde es Stybbanhythe geschrieben; hythe bedeutet Landeplatz an der Themse. Der „Green“ ist die alte Dorfwiese von Stepney."], "Stockwell": ["„Stockwell“ bedeutet der Brunnen oder die Quelle bei einem Baumstumpf.", "Es kommt von altenglisch stocc, Stumpf oder Pfahl. Vor der Station liegt der Eingang zu einem Tiefbunker aus dem Zweiten Weltkrieg."], "Stonebridge Park": ["Benannt nach einer Steinbrücke über den Fluss Brent.", "Die Brücke wurde im 17. Jahrhundert gebaut, um die Harrow Road über den Fluss zu führen. Die Züge der Bakerloo Line halten hier seit 1917."], "Stratford": ["„Stratford“ bedeutet die Furt an der Römerstraße.", "Altenglisch stræt, eine gepflasterte Römerstraße, ist der Ursprung des Wortes „street“ (und „Straße“). Hier querte die Straße von London nach Colchester den Fluss Lea. Die Gegend war das Zentrum der Olympischen Spiele 2012."], "Sudbury Hill": ["„Sudbury“ bedeutet das südliche Gut.", "Es lag südlich von Harrow, dem Hauptort. Die Station Sudbury Hill wurde 1903 eröffnet."], "Sudbury Town": ["„Sudbury“ bedeutet das südliche Gut.", "Es lag südlich von Harrow. Die Station wurde 1931 von Charles Holden als Kasten aus Ziegel und Glas neu gebaut, ein Vorbild für viele spätere U-Bahn-Stationen."], "Swiss Cottage": ["Benannt nach einem Pub im Stil eines Schweizer Chalets.", "Seit dem frühen 19. Jahrhundert steht hier ein Gasthaus. Das Pub Ye Olde Swiss Cottage gibt es noch heute nahe der Station."], "Temple": ["Benannt nach dem Temple, einst Sitz der Tempelritter.", "Die Ritter bauten im 12. Jahrhundert die runde Temple Church. Nach der Auflösung des Ordens im 14. Jahrhundert zogen Juristen ein, und Inner und Middle Temple sind bis heute zwei der Inns of Court."], "Theydon Bois": ["„Bois“ ist der Familienname mittelalterlicher Grundherren.", "Die Familie Bois besaß das Land im 12. und 13. Jahrhundert. „Theydon“ soll das Tal bedeuten, in dem man Stroh zum Dachdecken holte. Die Station wurde 1865 als Theydon eröffnet."], "Tooting Bec": ["„Bec“ erinnert an die Abtei Le Bec in der Normandie, der nach 1066 hier Land gehörte.", "Tooting bedeutet wahrscheinlich die Leute eines Mannes namens Tota. Die Station wurde 1926 als Trinity Road (Tooting Bec) eröffnet und 1950 umbenannt."], "Tooting Broadway": ["„Tooting“ bedeutet wahrscheinlich die Leute eines Mannes namens Tota.", "Ein „Broadway“ ist eine breite Hauptstraße. Die Statue König Eduards VII. vor der Station steht dort seit 1911."], "Tottenham Court Road": ["Benannt nach der Straße zum Gut Tottenhall, nicht nach Tottenham.", "Das Gutshaus nahe der heutigen Euston Road war wohl nach einem Grundbesitzer namens Tota benannt. Die Straße führte vom West End dorthin."], "Tottenham Hale": ["„Tottenham“ bedeutet das Gehöft eines Mannes namens Totta.", "„Hale“ soll von einem alten Wort für hieven oder ziehen kommen: Hier wurden Waren wie Holz aus dem Fluss Lea entladen. Die Station wurde 1968 mit der Victoria Line eröffnet."], "Totteridge & Whetstone": ["„Totteridge“ bedeutet der Bergrücken eines Mannes namens Tata; „Whetstone“ ist ein Rätsel.", "Der Legende nach wetzten Soldaten hier vor der Schlacht von Barnet 1471 ihre Schwerter an einem Wetzstein, doch der Name ist älter. Wahrscheinlicher bedeutet er „westliche Siedlung“."], "Tower Hill": ["Benannt nach dem Hügel neben dem Tower of London.", "Jahrhundertelang war er ein Ort öffentlicher Hinrichtungen. Bis 1946 hieß die Station Mark Lane."], "Tufnell Park": ["Benannt nach der Familie Tufnell, den Gutsherren von Barnsbury.", "William Tufnell erhielt das Gut 1753. Sein Nachfahre Henry Tufnell begann 1845, auf dem Land Häuser zu bauen. Die Station wurde 1907 eröffnet."], "Turnham Green": ["„Turnham“ bedeutet das Gehöft in der Flussbiegung.", "Die Themse macht hier eine große Schleife. 1642, im Bürgerkrieg, kehrte bei Turnham Green ein königstreues Heer um, statt auf London zu marschieren."], "Turnpike Lane": ["Benannt nach einem „turnpike“, einer Mautschranke an der Straße nach Norden.", "Reisende auf den Green Lanes mussten hier für die Benutzung der Straße zahlen. Die Station wurde 1932 eröffnet."], "Upminster": ["„Upminster“ bedeutet das Münster, die große Kirche, auf der Anhöhe.", "Upminster ist der östliche Endpunkt der District Line."], "Upminster Bridge": ["Benannt nach der Brücke über den Fluss Ingrebourne bei Upminster.", "Upminster bedeutet die große Kirche auf der Anhöhe. Die Station wurde 1934 eröffnet."], "Upney": ["„Upney“ bedeutet wahrscheinlich die höher gelegene Insel.", "Die „Insel“ war ein Stück trockenes Land zwischen Bächen und Sümpfen nahe dem Mayes Brook. Die Station wurde 1932 eröffnet."], "Upton Park": ["„Upton“ bedeutet der Hof auf der Anhöhe.", "„Park“ kam in den 1880er-Jahren hinzu, um neue Häuser zu verkaufen. Das alte Stadion von West Ham United, der Boleyn Ground, wurde oft Upton Park genannt."], "Uxbridge": ["„Uxbridge“ bedeutet die Brücke der Wixan.", "Die Wixan waren ein angelsächsischer Stamm, der sich hier niederließ, und die Brücke führte über den Fluss Colne. Uxbridge ist der westliche Endpunkt der Metropolitan und der Piccadilly Line."], "Vauxhall": ["„Vauxhall“ bedeutet die Halle des Falkes, eines mittelalterlichen Ritters.", "Falkes de Breauté baute sie im 13. Jahrhundert. Später waren die Vauxhall-Vergnügungsgärten in ganz Europa berühmt, und der Autohersteller übernahm den Namen des Viertels."], "Victoria": ["Benannt nach der Victoria Street, die an Königin Victoria erinnert.", "Der Fernbahnhof übernahm 1860 den Namen der Straße. Er steht an der Stelle eines alten Hafenbeckens des Grosvenor-Kanals."], "Walthamstow Central": ["„Walthamstow“ bedeutet wahrscheinlich der Ort des Willkommens.", "1075 wurde es Wilcumestowe geschrieben. „Central“ unterscheidet sie von anderen Bahnhöfen der Stadt. Die Victoria Line kam 1968."], "Wanstead": ["„Wanstead“ bedeutet einen Ort, doch niemand weiß, was für einen.", "Im 11. Jahrhundert wurde es Wenstede geschrieben. -stead bedeutet Ort oder Stätte; der erste Teil könnte einen Hügel oder einen Wagen meinen."], "Warren Street": ["Benannt nach Anne Warren, der Frau des Grundbesitzers Charles FitzRoy.", "FitzRoy, später Baron Southampton, bebaute das Land im späten 18. Jahrhundert. Die Station wurde 1907 als Euston Road eröffnet und ein Jahr später umbenannt."], "Warwick Avenue": ["Benannt nach Jane Warwick, der Frau von Sir John Frederick.", "Sie heirateten 1778; Frederick hatte das Land vom Bischof von London gepachtet, und die Allee wurde nach ihr benannt. Die Station wurde 1915 eröffnet."], "Waterloo": ["Benannt nach der Waterloo Bridge, die an die Schlacht bei Waterloo erinnert.", "Die Brücke war im Bau, als Wellington 1815 Napoleon besiegte. Sie sollte Strand Bridge heißen, wurde aber 1817 als Waterloo Bridge eröffnet. Die Straße und der Bahnhof folgten."], "Watford": ["„Watford“ bedeutet wahrscheinlich die Furt der Jäger oder die nasse Furt.", "Die Furt führte durch den Fluss Colne. Die Station der Metropolitan Line wurde 1925 in Cassiobury eröffnet, ein gutes Stück vom Stadtzentrum entfernt."], "Wembley Central": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "Der Name endet auf altenglisch leah, eine Lichtung. Der Bahnhof wurde 1842 als Sudbury eröffnet und 1948 zu Wembley Central, im Jahr der Olympischen Spiele in Wembley."], "Wembley Park": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "In den 1890er-Jahren begann man hier einen Turm, der dem Eiffelturm Konkurrenz machen sollte; er wurde nie fertig. Später entstand an seiner Stelle das Wembley-Stadion."], "West Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. Die Station West Acton wurde 1923 eröffnet."], "West Brompton": ["„Brompton“ bedeutet der Hof, wo Ginster wächst.", "Ginster ist ein gelb blühender Strauch. Die Station wurde 1869 eröffnet; nebenan liegt der Brompton Cemetery, einer der „Magnificent Seven“, der sieben großen Friedhöfe Londons."], "West Finchley": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Der Name endet auf altenglisch leah, eine Waldlichtung. Die Northern Line bedient West Finchley seit 1940."], "West Ham": ["„Ham“ bedeutet trockenes Land in einer Flussbiegung oder zwischen Flüssen.", "Hier liegt das Land zwischen Themse, Lea und Roding. Im 12. Jahrhundert wurde es in East Ham und West Ham geteilt. Der Fußballverein West Ham United ist nach der Gegend benannt."], "West Hampstead": ["„Hampstead“ bedeutet einfach Gehöft.", "Es kommt von altenglisch hām-stede. West Hampstead wuchs im späten 19. Jahrhundert, als drei Eisenbahnlinien kamen. Die Station wurde 1879 eröffnet."], "West Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich auf dem Harrow Hill, wo heute die Kirche St Mary steht. Die Station West Harrow wurde 1913 eröffnet."], "West Kensington": ["Benannt nach Kensington, dem Hof eines Sachsen namens Cynesige.", "Die Station liegt eigentlich in Fulham. Sie wurde 1874 als North End (Fulham) eröffnet und 1877 in West Kensington umbenannt, wohl weil der Name attraktiver klang."], "West Ruislip": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Sie wurde 1906 als Ruislip & Ickenham eröffnet. West Ruislip ist der westliche Endpunkt der Central Line."], "Westbourne Park": ["Benannt nach dem Fluss Westbourne, dem „westlichen Bach“.", "Der Fluss entspringt in Hampstead und mündet in die Themse, heute in Rohren verborgen. Im Mittelalter hieß die Gegend Westbourne Green."], "Westminster": ["„Westminster“ bedeutet das Münster, die Abteikirche, im Westen.", "Es lag westlich der City of London. Die Abtei wurde im 10. Jahrhundert gegründet, von Eduard dem Bekenner neu gebaut und gab dem ganzen Viertel seinen Namen, samt dem Parlament."], "White City": ["Benannt nach den weißen Ausstellungsbauten von 1908.", "1908 fand hier die Französisch-Britische Ausstellung statt, mit weiß verkleideten Palästen. Das zugleich gebaute Stadion war Austragungsort der Olympischen Spiele 1908."], "Whitechapel": ["Benannt nach einer weißen Kapelle, der Kirche St Mary Matfelon.", "Die Kapelle wurde im 13. Jahrhundert aus weißem Kalkstein gebaut, und ihre hellen Mauern gaben dem Viertel den Namen."], "Willesden Green": ["„Willesden“ bedeutet die Quelle am Hügel.", "939 wurde es Willesdune geschrieben. Die Quelle ist verschwunden. Die Station wurde 1879 eröffnet."], "Willesden Junction": ["Benannt nach einem großen Eisenbahnknoten in Willesden.", "„Willesden“ bedeutet die Quelle am Hügel. Hier treffen und kreuzen sich mehrere Bahnlinien. Die Züge der Bakerloo Line halten hier seit 1915."], "Wimbledon": ["„Wimbledon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Wynnmann.", "Um 950 wurde es Wunemannedune geschrieben; „dun“ bedeutet Hügel. Seit 1877 findet hier das älteste Tennisturnier der Welt statt."], "Wimbledon Park": ["Benannt nach dem Park von Wimbledon House, einem großen Landgut.", "Park und See wurden in den 1760er-Jahren von Capability Brown gestaltet. Auf einem Teil des alten Parks liegt heute der All England Lawn Tennis Club."], "Wood Green": ["„Wood Green“ bedeutet die Wiese beim Wald.", "Das Dorf wuchs rund um eine Freifläche am Rand des Waldes von Enfield Chase. Die Station wurde 1932 eröffnet."], "Wood Lane": ["Benannt nach der Wood Lane, die bis etwa 1830 Turvens Lane hieß.", "Sie wurde nach den nahen Wäldern umbenannt. Die Station wurde 2008 eröffnet, neben dem alten BBC Television Centre."], "Woodford": ["„Woodford“ bedeutet die Furt beim Wald.", "Die Furt führte durch den Fluss Roding am Rand des Epping Forest. Später ersetzte sie eine Brücke, nach der Woodford Bridge benannt ist."], "Woodside Park": ["Benannt nach Woodside House, 1840 gebaut.", "Ein örtlicher Bauunternehmer übernahm den Namen für seine neue Wohnsiedlung, und die Station folgte. Die Northern Line kam 1940."]}};

"Piccadilly Circus", "g": [], "en": {"q": "This place is named after stiff lace collars that made a tailor rich around 1600.", "a": "Piccadilly Circus", "w": ["Oxford Circus", "Covent Garden", "Leicester Square"], "x": "The tailor Robert Baker sold 'piccadills', and his house here was nicknamed Pickadilly Hall."}, "fr": {"q": "Ce lieu doit son nom à des cols de dentelle rigides qui firent la fortune d'un tailleur vers 1600.", "a": "Piccadilly Circus", "w": ["Oxford Circus", "Covent Garden", "Leicester Square"], "x": "Le tailleur Robert Baker vendait des « piccadills », et sa maison ici était surnommée Pickadilly Hall."}, "de": {"q": "Dieser Ort ist nach steifen Spitzenkragen benannt, die um 1600 einen Schneider reich machten.", "a": "Piccadilly Circus", "w": ["Oxford Circus", "Covent Garden", "Leicester Square"], "x": "Der Schneider Robert Baker verkaufte „piccadills“, und sein Haus hier nannte man Pickadilly Hall."}}, {"id": "g04", "t": "guess", "s": "Cannon Street", "g": [], "en": {"q": "Despite its name, this street has nothing to do with guns: in the Middle Ages it was the street of the candle-makers.", "a": "Cannon Street", "w": ["Temple", "Blackfriars", "Moorgate"], "x": "It was called Candelwrichtestrete, the street of the candle-wrights, and the name was later shortened."}, "fr": {"q": "Malgré son nom, cette rue n'a rien à voir avec les canons : au Moyen Âge, c'était la rue des fabricants de chandelles.", "a": "Cannon Street", "w": ["Temple", "Blackfriars", "Moorgate"], "x": "Elle s'appelait Candelwrichtestrete, la rue des chandeliers, et le nom s'est ensuite raccourci."}, "de": {"q": "Trotz ihres Namens hat diese Straße nichts mit Kanonen zu tun: Im Mittelalter war sie die Straße der Kerzenmacher.", "a": "Cannon Street", "w": ["Temple", "Blackfriars", "Moorgate"], "x": "Sie hieß Candelwrichtestrete, die Straße der Kerzenmacher, und der Name wurde später verkürzt."}}, {"id": "g05", "t": "guess", "s": "Canary Wharf", "g": [], "en": {"q": "Named after a warehouse for fruit ships from islands said to be named after dogs. Fittingly, it stands on the Isle of Dogs.", "a": "Canary Wharf", "w": ["Canada Water", "Canning Town", "North Greenwich"], "x": "Fruit ships from the Canary Islands unloaded here from the 1930s."}, "fr": {"q": "Nommée d'après un entrepôt pour des navires fruitiers venus d'îles qui devraient leur nom aux chiens. Elle se trouve, comme il se doit, sur l'Isle of Dogs.", "a": "Canary Wharf", "w": ["Canada Water", "Canning Town", "North Greenwich"], "x": "Des navires fruitiers des îles Canaries y déchargeaient à partir des années 1930."}, "de": {"q": "Benannt nach einem Lagerhaus für Obstschiffe von Inseln, die nach Hunden benannt sein sollen. Passenderweise liegt sie auf der Isle of Dogs.", "a": "Canary Wharf", "w": ["Canada Water", "Canning Town", "North Greenwich"], "x": "Ab den 1930er-Jahren entluden hier Obstschiffe von den Kanarischen Inseln."}}, {"id": "g06", "t": "guess", "s": "Seven Sisters", "g": [], "en": {"q": "Named after a ring of trees on Page Green which, by local tradition, were planted by sisters.", "a": "Seven Sisters", "w": ["Turnpike Lane", "Wood Green", "Manor House"], "x": "The ring has been replanted several times, most recently with hornbeams in 1996."}, "fr": {"q": "Nommée d'après un cercle d'arbres sur Page Green qui, selon la tradition locale, auraient été plantés par des sœurs.", "a": "Seven Sisters", "w": ["Turnpike Lane", "Wood Green", "Manor House"], "x": "Le cercle a été replanté plusieurs fois, la dernière en 1996, avec des charmes."}, "de": {"q": "Benannt nach einem Ring aus Bäumen auf dem Page Green, die der örtlichen Überlieferung nach von Schwestern gepflanzt wurden.", "a": "Seven Sisters", "w": ["Turnpike Lane", "Wood Green", "Manor House"], "x": "Der Ring wurde mehrmals neu gepflanzt, zuletzt 1996 mit Hainbuchen."}}, {"id": "g07", "t": "guess", "s": "Swiss Cottage", "g": [], "en": {"q": "This station is named after a pub built to look like a chalet in the Alps.", "a": "Swiss Cottage", "w": ["St John's Wood", "Belsize Park", "Finchley Road"], "x": "An inn has stood on the site since the early 19th century, and the pub still stands near the station."}, "fr": {"q": "Cette station doit son nom à un pub construit comme un chalet des Alpes.", "a": "Swiss Cottage", "w": ["St John's Wood", "Belsize Park", "Finchley Road"], "x": "Une auberge occupe le site depuis le début du XIXe siècle, et le pub existe toujours près de la station."}, "de": {"q": "Diese Station ist nach einem Pub benannt, das wie ein Chalet in den Alpen aussieht.", "a": "Swiss Cottage", "w": ["St John's Wood", "Belsize Park", "Finchley Road"], "x": "Seit dem frühen 19. Jahrhundert steht hier ein Gasthaus, und das Pub gibt es noch heute nahe der Station."}}, {"id": "g08", "t": "guess", "s": "Maida Vale", "g": [], "en": {"q": "Named after a pub recalling a battle of 1806, when a British force beat the French in Calabria.", "a": "Maida Vale", "w": ["Waterloo", "Warwick Avenue", "Kilburn Park"], "x": "The pub was the Hero of Maida, honouring General Sir John Stuart."}, "fr": {"q": "Nommée d'après un pub rappelant une bataille de 1806, où une armée britannique battit les Français en Calabre.", "a": "Maida Vale", "w": ["Waterloo", "Warwick Avenue", "Kilburn Park"], "x": "Le pub s'appelait le Hero of Maida, en l'honneur du général Sir John Stuart."}, "de": {"q": "Benannt nach einem Pub, das an eine Schlacht von 1806 erinnerte, als eine britische Truppe die Franzosen in Kalabrien besiegte.", "a": "Maida Vale", "w": ["Waterloo", "Warwick Avenue", "Kilburn Park"], "x": "Das Pub hieß Hero of Maida, zu Ehren von General Sir John Stuart."}}, {"id": "g09", "t": "guess", "s": "Covent Garden", "g": [], "en": {"q": "The first word of this name is an old form of 'convent': it was once the garden of Westminster Abbey.", "a": "Covent Garden", "w": ["Temple", "Green Park", "Russell Square"], "x": "The famous fruit and vegetable market began here in the 17th century and moved to Nine Elms in 1974."}, "fr": {"q": "Le premier mot de ce nom est une forme ancienne de « convent », couvent : c'était autrefois le jardin de l'abbaye de Westminster.", "a": "Covent Garden", "w": ["Temple", "Green Park", "Russell Square"], "x": "Le célèbre marché aux fruits et légumes y a commencé au XVIIe siècle et a déménagé à Nine Elms en 1974."}, "de": {"q": "Das erste Wort dieses Namens ist eine alte Form von „convent“, Kloster: Hier lag einst der Garten der Westminster Abbey.", "a": "Covent Garden", "w": ["Temple", "Green Park", "Russell Square"], "x": "Der berühmte Obst- und Gemüsemarkt begann hier im 17. Jahrhundert und zog 1974 nach Nine Elms."}}, {"id": "g10", "t": "guess", "s": "Morden", "g": [], "en": {"q": "This end of the Northern line is the southernmost station on the whole Underground.", "a": "Morden", "w": ["Brixton", "Wimbledon", "Battersea Power Station"], "x": "Its name probably means the hill in the marshland."}, "fr": {"q": "Ce terminus de la Northern line est la station la plus méridionale de tout le métro.", "a": "Morden", "w": ["Brixton", "Wimbledon", "Battersea Power Station"], "x": "Son nom signifie probablement la colline dans le marais."}, "de": {"q": "Diese Endstation der Northern Line ist die südlichste Station der ganzen U-Bahn.", "a": "Morden", "w": ["Brixton", "Wimbledon", "Battersea Power Station"], "x": "Ihr Name bedeutet wahrscheinlich der Hügel im Moor."}}, {"id": "g11", "t": "guess", "s": "Hampstead", "g": [], "en": {"q": "This station, opened in 1907, has the deepest platforms on the Underground.", "a": "Hampstead", "w": ["Highgate", "Belsize Park", "Golders Green"], "x": "Its name simply means homestead, from Old English hām-stede."}, "fr": {"q": "Cette station, ouverte en 1907, possède les quais les plus profonds du métro.", "a": "Hampstead", "w": ["Highgate", "Belsize Park", "Golders Green"], "x": "Son nom signifie simplement ferme ou domaine, du vieil anglais hām-stede."}, "de": {"q": "Diese 1907 eröffnete Station hat die tiefsten Bahnsteige der U-Bahn.", "a": "Hampstead", "w": ["Highgate", "Belsize Park", "Golders Green"], "x": "Ihr Name bedeutet einfach Gehöft, von altenglisch hām-stede."}}, {"id": "g12", "t": "guess", "s": "Caledonian Road", "g": [], "en": {"q": "Named after a home for children of Scottish soldiers and sailors killed or wounded in the Napoleonic Wars.", "a": "Caledonian Road", "w": ["Holloway Road", "King's Cross St Pancras", "Camden Town"], "x": "The Caledonian Asylum moved to this road in 1828. 'Caledonia' is the old Latin name for Scotland."}, "fr": {"q": "Nommée d'après un foyer pour les enfants de soldats et de marins écossais tués ou blessés pendant les guerres napoléoniennes.", "a": "Caledonian Road", "w": ["Holloway Road", "King's Cross St Pancras", "Camden Town"], "x": "Le Caledonian Asylum s'est installé dans cette rue en 1828. « Caledonia » est l'ancien nom latin de l'Écosse."}, "de": {"q": "Benannt nach einem Heim für Kinder schottischer Soldaten und Seeleute, die in den Napoleonischen Kriegen gefallen oder verwundet waren.", "a": "Caledonian Road", "w": ["Holloway Road", "King's Cross St Pancras", "Camden Town"], "x": "Das Caledonian Asylum zog 1828 an diese Straße. „Caledonia“ ist der alte lateinische Name Schottlands."}}, {"id": "g13", "t": "guess", "s": "White City", "g": [], "en": {"q": "Named after white exhibition palaces of 1908. The stadium built at the same time hosted that year's Olympic Games.", "a": "White City", "w": ["Wembley Park", "Stratford", "Wood Lane"], "x": "The palaces belonged to the Franco-British Exhibition."}, "fr": {"q": "Nommée d'après des palais d'exposition blancs de 1908. Le stade construit au même moment a accueilli les Jeux olympiques de cette année-là.", "a": "White City", "w": ["Wembley Park", "Stratford", "Wood Lane"], "x": "Les palais appartenaient à l'Exposition franco-britannique."}, "de": {"q": "Benannt nach weißen Ausstellungspalästen von 1908. Das zugleich gebaute Stadion war Austragungsort der Olympischen Spiele jenes Jahres.", "a": "White City", "w": ["Wembley Park", "Stratford", "Wood Lane"], "x": "Die Paläste gehörten zur Französisch-Britischen Ausstellung."}}, {"id": "g14", "t": "guess", "s": "Dollis Hill", "g": [], "en": {"q": "In the Second World War, Colossus, one of the first electronic computers, was built here for the codebreakers.", "a": "Dollis Hill", "w": ["Neasden", "Willesden Green", "Kingsbury"], "x": "The Post Office Research Station built it for Bletchley Park."}, "fr": {"q": "Pendant la Seconde Guerre mondiale, Colossus, l'un des premiers ordinateurs électroniques, a été construit ici pour les décrypteurs.", "a": "Dollis Hill", "w": ["Neasden", "Willesden Green", "Kingsbury"], "x": "Le centre de recherche des Postes l'a construit pour Bletchley Park."}, "de": {"q": "Im Zweiten Weltkrieg wurde hier Colossus gebaut, einer der ersten elektronischen Computer, für die Codeknacker.", "a": "Dollis Hill", "w": ["Neasden", "Willesden Green", "Kingsbury"], "x": "Die Forschungsstelle der Post baute ihn für Bletchley Park."}}, {"id": "g15", "t": "guess", "s": "Hornchurch", "g": [], "en": {"q": "This town's church still has the head of a bull with real horns on its east end.", "a": "Hornchurch", "w": ["Upminster", "Elm Park", "Whitechapel"], "x": "The name means the church with horns and was recorded in 1222. Nobody knows exactly why."}, "fr": {"q": "L'église de cette ville porte toujours, sur son pignon est, une tête de taureau avec de vraies cornes.", "a": "Hornchurch", "w": ["Upminster", "Elm Park", "Whitechapel"], "x": "Le nom signifie l'église aux cornes et est attesté en 1222. Nul ne sait exactement pourquoi."}, "de": {"q": "Die Kirche dieses Ortes trägt an ihrer Ostseite noch heute einen Stierkopf mit echten Hörnern.", "a": "Hornchurch", "w": ["Upminster", "Elm Park", "Whitechapel"], "x": "Der Name bedeutet die Kirche mit Hörnern und ist 1222 belegt. Warum, weiß niemand genau."}}, {"id": "g16", "t": "guess", "s": "Marble Arch", "g": [], "en": {"q": "Named after an arch designed by John Nash as an entrance to Buckingham Palace and moved here in 1851.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "It is built of white marble and was made in the 1820s."}, "fr": {"q": "Nommée d'après un arc dessiné par John Nash comme entrée du palais de Buckingham et déplacé ici en 1851.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "Il est en marbre blanc et date des années 1820."}, "de": {"q": "Benannt nach einem Bogen von John Nash, gebaut als Eingang zum Buckingham Palace und 1851 hierher versetzt.", "a": "Marble Arch", "w": ["Hyde Park Corner", "Lancaster Gate", "Green Park"], "x": "Er ist aus weißem Marmor und stammt aus den 1820er-Jahren."}}, {"id": "g17", "t": "guess", "s": "Ravenscourt Park", "g": [], "en": {"q": "A pun on a family name: in the 18th century the owner, Thomas Corbett, renamed his house after the birds on his coat of arms.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "A raven is 'corbeau' in French. The grounds became a public park."}, "fr": {"q": "Un jeu de mots sur un nom de famille : au XVIIIe siècle, le propriétaire, Thomas Corbett, donna à sa maison le nom des oiseaux de ses armoiries.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "« Raven » signifie corbeau. Le parc est devenu public."}, "de": {"q": "Ein Wortspiel mit einem Familiennamen: Im 18. Jahrhundert benannte der Besitzer Thomas Corbett sein Haus nach den Vögeln in seinem Wappen.", "a": "Ravenscourt Park", "w": ["Stamford Brook", "Turnham Green", "Goldhawk Road"], "x": "„Raven“ heißt Rabe, auf Französisch „corbeau“. Das Gelände wurde zum öffentlichen Park."}}, {"id": "g18", "t": "guess", "s": "Leytonstone", "g": [], "en": {"q": "The film director Alfred Hitchcock was born here in 1899.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "The name means Leyton at the stone, probably an old Roman milestone or boundary stone."}, "fr": {"q": "Le cinéaste Alfred Hitchcock est né ici en 1899.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "Le nom signifie Leyton à la pierre, probablement une ancienne borne romaine ou une borne de limite."}, "de": {"q": "Der Regisseur Alfred Hitchcock wurde hier 1899 geboren.", "a": "Leytonstone", "w": ["Leyton", "Snaresbrook", "Wanstead"], "x": "Der Name bedeutet Leyton am Stein, wahrscheinlich ein alter römischer Meilenstein oder Grenzstein."}}, {"id": "g19", "t": "guess", "s": "Mornington Crescent", "g": [], "en": {"q": "This station gave its name to a famous nonsense game on the BBC radio comedy I'm Sorry I Haven't a Clue.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "The crescent is named after the Earl of Mornington, elder brother of the Duke of Wellington."}, "fr": {"q": "Cette station a donné son nom à un célèbre jeu absurde de l'émission comique de la BBC I'm Sorry I Haven't a Clue.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "Le croissant de maisons porte le nom du comte de Mornington, frère aîné du duc de Wellington."}, "de": {"q": "Diese Station gab einem berühmten Nonsens-Spiel in der BBC-Radiokomödie I'm Sorry I Haven't a Clue den Namen.", "a": "Mornington Crescent", "w": ["Camden Town", "Euston", "Warren Street"], "x": "Der Halbmond aus Häusern ist nach dem Earl of Mornington benannt, dem älteren Bruder des Herzogs von Wellington."}}, {"id": "g20", "t": "guess", "s": "Southwark", "g": [], "en": {"q": "This name means the southern fort, built to defend the southern end of London Bridge.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "It was recorded in the early 10th century as Suthriganaweorc, the fort of the men of Surrey."}, "fr": {"q": "Ce nom signifie le fort du sud, construit pour défendre le bout sud du London Bridge.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "Le nom est noté au début du Xe siècle sous la forme Suthriganaweorc, le fort des hommes du Surrey."}, "de": {"q": "Dieser Name bedeutet die südliche Befestigung, die das Südende der London Bridge schützte.", "a": "Southwark", "w": ["Kennington", "London Bridge", "Bermondsey"], "x": "Im frühen 10. Jahrhundert wurde er Suthriganaweorc geschrieben, die Befestigung der Männer von Surrey."}}, {"id": "q01", "t": "quiz", "s": "Baker Street", "g": [], "en": {"q": "Which fictional detective lived at 221B Baker Street?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "Inspector Morse", "Father Brown"], "x": "The street itself is named after William Baker, who laid it out in the 18th century."}, "fr": {"q": "Quel détective de fiction habitait au 221B Baker Street ?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "L'inspecteur Morse", "Le père Brown"], "x": "La rue elle-même porte le nom de William Baker, qui l'a tracée au XVIIIe siècle."}, "de": {"q": "Welcher erfundene Detektiv wohnte in der Baker Street 221B?", "a": "Sherlock Holmes", "w": ["Hercule Poirot", "Inspector Morse", "Pater Brown"], "x": "Die Straße selbst ist nach William Baker benannt, der sie im 18. Jahrhundert anlegte."}}, {"id": "q02", "t": "quiz", "s": "Waterloo", "g": [], "en": {"q": "What was Waterloo Bridge originally going to be called?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "It was being built when Wellington beat Napoleon in 1815, and opened in 1817 as Waterloo Bridge."}, "fr": {"q": "Comment le pont de Waterloo devait-il s'appeler à l'origine ?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "Il était en construction quand Wellington battit Napoléon en 1815 et ouvrit en 1817 sous le nom de Waterloo Bridge."}, "de": {"q": "Wie sollte die Waterloo Bridge ursprünglich heißen?", "a": "Strand Bridge", "w": ["Westminster Bridge", "Victory Bridge", "Napoleon Bridge"], "x": "Sie war im Bau, als Wellington 1815 Napoleon besiegte, und wurde 1817 als Waterloo Bridge eröffnet."}}, {"id": "q03", "t": "quiz", "s": "Westminster", "g": [], "en": {"q": "What does the 'minster' in Westminster mean?", "a": "An abbey church", "w": ["A royal palace", "A market place", "A river crossing"], "x": "The abbey church lay west of the City of London and gave its name to the whole area."}, "fr": {"q": "Que signifie « minster » dans Westminster ?", "a": "Une église abbatiale", "w": ["Un palais royal", "Une place de marché", "Un passage de rivière"], "x": "L'église abbatiale se trouvait à l'ouest de la City de Londres et a donné son nom à tout le quartier."}, "de": {"q": "Was bedeutet „minster“ in Westminster?", "a": "Eine Abteikirche", "w": ["Ein Königspalast", "Ein Marktplatz", "Eine Flussüberquerung"], "x": "Die Abteikirche lag westlich der City of London und gab dem ganzen Viertel den Namen."}}, {"id": "q04", "t": "quiz", "s": "Knightsbridge", "g": [], "en": {"q": "In Old English, what did 'cniht', the first part of Knightsbridge, mean?", "a": "A young man or servant", "w": ["A knight in armour", "A king's messenger", "A bridge-keeper"], "x": "So Knightsbridge means the bridge of the young men. It crossed the River Westbourne."}, "fr": {"q": "En vieil anglais, que signifiait « cniht », la première partie de Knightsbridge ?", "a": "Un jeune homme ou un serviteur", "w": ["Un chevalier en armure", "Un messager du roi", "Un gardien de pont"], "x": "Knightsbridge signifie donc le pont des jeunes gens. Il franchissait la Westbourne."}, "de": {"q": "Was bedeutete altenglisch „cniht“, der erste Teil von Knightsbridge?", "a": "Junger Mann oder Diener", "w": ["Ritter in Rüstung", "Bote des Königs", "Brückenwärter"], "x": "Knightsbridge bedeutet also die Brücke der jungen Männer. Sie führte über den Westbourne."}}, {"id": "q05", "t": "quiz", "s": "Holland Park", "g": [], "en": {"q": "Where does the 'Holland' of Holland Park come from?", "a": "Holland in Lincolnshire", "w": ["The Netherlands", "A Dutch merchant", "A Dutch king of England"], "x": "Holland House was named after Henry Rich, Earl of Holland, whose title came from Lincolnshire."}, "fr": {"q": "D'où vient le « Holland » de Holland Park ?", "a": "De Holland, dans le Lincolnshire", "w": ["Des Pays-Bas", "D'un marchand hollandais", "D'un roi d'Angleterre hollandais"], "x": "Holland House doit son nom à Henry Rich, comte de Holland, dont le titre venait du Lincolnshire."}, "de": {"q": "Woher kommt das „Holland“ in Holland Park?", "a": "Von Holland in Lincolnshire", "w": ["Von den Niederlanden", "Von einem holländischen Kaufmann", "Von einem holländischen König Englands"], "x": "Holland House ist nach Henry Rich, Earl of Holland, benannt, dessen Titel aus Lincolnshire stammte."}}, {"id": "q06", "t": "quiz", "s": "Richmond", "g": [], "en": {"q": "Richmond is named after a town in which English county?", "a": "Yorkshire", "w": ["Surrey", "Kent", "Lincolnshire"], "x": "Henry VII had been Earl of Richmond in Yorkshire, and named his rebuilt palace at Sheen after his earldom."}, "fr": {"q": "Richmond porte le nom d'une ville de quel comté anglais ?", "a": "Le Yorkshire", "w": ["Le Surrey", "Le Kent", "Le Lincolnshire"], "x": "Henri VII avait été comte de Richmond, dans le Yorkshire, et donna le nom de son comté au palais de Sheen qu'il fit reconstruire."}, "de": {"q": "Richmond ist nach einer Stadt in welcher englischen Grafschaft benannt?", "a": "Yorkshire", "w": ["Surrey", "Kent", "Lincolnshire"], "x": "Heinrich VII. war Earl of Richmond in Yorkshire gewesen und benannte seinen neu gebauten Palast in Sheen nach seiner Grafschaft."}}, {"id": "q07", "t": "quiz", "s": "Sloane Square", "g": [], "en": {"q": "Sir Hans Sloane's huge collection became the start of which institution?", "a": "The British Museum", "w": ["The National Gallery", "The Tate", "The Royal Albert Hall"], "x": "Sloane, a physician and collector, bought the manor of Chelsea in 1712."}, "fr": {"q": "L'immense collection de Sir Hans Sloane fut à l'origine de quelle institution ?", "a": "Le British Museum", "w": ["La National Gallery", "La Tate", "Le Royal Albert Hall"], "x": "Sloane, médecin et collectionneur, acheta le domaine de Chelsea en 1712."}, "de": {"q": "Die riesige Sammlung von Sir Hans Sloane wurde zum Grundstock welcher Einrichtung?", "a": "Des British Museum", "w": ["Der National Gallery", "Der Tate", "Der Royal Albert Hall"], "x": "Sloane, Arzt und Sammler, kaufte 1712 das Gut Chelsea."}}, {"id": "q08", "t": "quiz", "s": "Bow Road", "g": [], "en": {"q": "What gave the village of Bow its name?", "a": "A bow-shaped bridge over the River Lea", "w": ["A famous archer", "An archery ground", "A ship called the Bow"], "x": "By tradition the arched bridge was built in the early 12th century at the wish of Queen Matilda."}, "fr": {"q": "Qu'est-ce qui a donné son nom au village de Bow ?", "a": "Un pont en arc sur la rivière Lea", "w": ["Un archer célèbre", "Un terrain de tir à l'arc", "Un navire appelé le Bow"], "x": "Selon la tradition, le pont voûté fut construit au début du XIIe siècle à la demande de la reine Mathilde."}, "de": {"q": "Was gab dem Dorf Bow seinen Namen?", "a": "Eine bogenförmige Brücke über den Lea", "w": ["Ein berühmter Bogenschütze", "Ein Bogenschießplatz", "Ein Schiff namens Bow"], "x": "Der Überlieferung nach wurde die gewölbte Brücke Anfang des 12. Jahrhunderts auf Wunsch von Königin Mathilde gebaut."}}, {"id": "q09", "t": "quiz", "s": "Hyde Park Corner", "g": [], "en": {"q": "Which king took over Hyde Park as a hunting ground in 1536?", "a": "Henry VIII", "w": ["Charles II", "William the Conqueror", "George IV"], "x": "Before that it was the manor of Hyde, owned by Westminster Abbey."}, "fr": {"q": "Quel roi s'empara de Hyde Park pour en faire un terrain de chasse en 1536 ?", "a": "Henri VIII", "w": ["Charles II", "Guillaume le Conquérant", "George IV"], "x": "Auparavant, c'était le domaine de Hyde, propriété de l'abbaye de Westminster."}, "de": {"q": "Welcher König übernahm 1536 den Hyde Park als Jagdgebiet?", "a": "Heinrich VIII.", "w": ["Karl II.", "Wilhelm der Eroberer", "Georg IV."], "x": "Vorher war es das Gut Hyde der Westminster Abbey."}}, {"id": "q10", "t": "quiz", "s": "Battersea Power Station", "g": [], "en": {"q": "What did 'Battersea' mean when it was first recorded in the 7th century?", "a": "Badric's island", "w": ["The battered sea", "The bath by the sea", "The battlefield"], "x": "The 'island' was dry ground in the marshes by the Thames."}, "fr": {"q": "Que signifiait « Battersea » quand le nom a été noté pour la première fois, au VIIe siècle ?", "a": "L'île de Badric", "w": ["La mer battue", "Le bain au bord de la mer", "Le champ de bataille"], "x": "L'« île » était une terre sèche dans les marais de la Tamise."}, "de": {"q": "Was bedeutete „Battersea“, als es im 7. Jahrhundert erstmals erwähnt wurde?", "a": "Badrics Insel", "w": ["Das gepeitschte Meer", "Das Bad am Meer", "Das Schlachtfeld"], "x": "Die „Insel“ war trockenes Land in den Sümpfen an der Themse."}}, {"id": "q11", "t": "quiz", "s": "Chiswick Park", "g": [], "en": {"q": "According to its Old English name, what did the farm at Chiswick make?", "a": "Cheese", "w": ["Bread", "Beer", "Candles"], "x": "'Chiswick' means the cheese farm, near the Thames."}, "fr": {"q": "D'après son nom en vieil anglais, que produisait la ferme de Chiswick ?", "a": "Du fromage", "w": ["Du pain", "De la bière", "Des chandelles"], "x": "« Chiswick » signifie la ferme du fromage, près de la Tamise."}, "de": {"q": "Was stellte der Hof in Chiswick laut seinem altenglischen Namen her?", "a": "Käse", "w": ["Brot", "Bier", "Kerzen"], "x": "„Chiswick“ bedeutet der Käsehof, nahe der Themse."}}, {"id": "q12", "t": "quiz", "s": "Kew Gardens", "g": [], "en": {"q": "What international status do the Royal Botanic Gardens at Kew have?", "a": "UNESCO World Heritage Site", "w": ["National park", "Olympic venue", "European Capital of Culture"], "x": "'Kew' was first recorded in 1327 as Cayho."}, "fr": {"q": "Quel statut international ont les jardins botaniques royaux de Kew ?", "a": "Patrimoine mondial de l'UNESCO", "w": ["Parc national", "Site olympique", "Capitale européenne de la culture"], "x": "« Kew » est noté pour la première fois en 1327, sous la forme Cayho."}, "de": {"q": "Welchen internationalen Status haben die Königlichen Botanischen Gärten in Kew?", "a": "UNESCO-Welterbe", "w": ["Nationalpark", "Olympia-Austragungsort", "Kulturhauptstadt Europas"], "x": "„Kew“ wurde 1327 erstmals als Cayho erwähnt."}}, {"id": "q13", "t": "quiz", "s": "St Paul's", "g": [], "en": {"q": "What was St Paul's station called when it opened in 1900?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "It was named after the head office of the Post Office nearby, and renamed in 1937."}, "fr": {"q": "Comment s'appelait la station St Paul's à son ouverture en 1900 ?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "Elle devait son nom au siège des Postes tout proche et a été rebaptisée en 1937."}, "de": {"q": "Wie hieß die Station St Paul's bei ihrer Eröffnung 1900?", "a": "Post Office", "w": ["Cathedral", "Cheapside", "Ludgate"], "x": "Sie war nach dem nahen Hauptpostamt benannt und wurde 1937 umbenannt."}}, {"id": "q14", "t": "quiz", "s": "Euston", "g": [], "en": {"q": "Euston takes its name from a country house in which county?", "a": "Suffolk", "w": ["Norfolk", "Essex", "Kent"], "x": "Euston Hall was the home of the Dukes of Grafton, who owned the land."}, "fr": {"q": "Euston tient son nom d'une demeure de campagne de quel comté ?", "a": "Le Suffolk", "w": ["Le Norfolk", "L'Essex", "Le Kent"], "x": "Euston Hall était la demeure des ducs de Grafton, propriétaires des terres."}, "de": {"q": "Euston hat seinen Namen von einem Landsitz in welcher Grafschaft?", "a": "Suffolk", "w": ["Norfolk", "Essex", "Kent"], "x": "Euston Hall war der Sitz der Herzöge von Grafton, denen das Land gehörte."}}, {"id": "q15", "t": "quiz", "s": "Stratford", "g": [], "en": {"q": "Which English word comes from Old English stræt, a paved Roman road, as in Stratford?", "a": "Street", "w": ["Straight", "Strait", "Stream"], "x": "Stratford means the ford on the Roman road, where it crossed the River Lea."}, "fr": {"q": "Quel mot anglais vient du vieil anglais stræt, une route romaine pavée, comme dans Stratford ?", "a": "Street (rue)", "w": ["Straight (droit)", "Strait (détroit)", "Stream (ruisseau)"], "x": "Stratford signifie le gué sur la voie romaine, là où elle franchissait la Lea."}, "de": {"q": "Welches englische Wort kommt von altenglisch stræt, einer gepflasterten Römerstraße, wie in Stratford?", "a": "Street (Straße)", "w": ["Straight (gerade)", "Strait (Meerenge)", "Stream (Bach)"], "x": "Stratford bedeutet die Furt an der Römerstraße, wo sie den Lea querte."}}, {"id": "q16", "t": "quiz", "s": "Wimbledon", "g": [], "en": {"q": "Since which year has Wimbledon been home to its famous tennis tournament?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "It is the world's oldest tennis tournament."}, "fr": {"q": "Depuis quelle année Wimbledon accueille-t-il son célèbre tournoi de tennis ?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "C'est le plus ancien tournoi de tennis du monde."}, "de": {"q": "Seit welchem Jahr findet in Wimbledon das berühmte Tennisturnier statt?", "a": "1877", "w": ["1851", "1908", "1924"], "x": "Es ist das älteste Tennisturnier der Welt."}}, {"id": "q17", "t": "quiz", "s": "Hainault", "g": [], "en": {"q": "The French-looking spelling of Hainault comes from a mistaken link with whom?", "a": "Philippa of Hainault, wife of Edward III", "w": ["Eleanor of Castile, wife of Edward I", "Anne of Cleves, wife of Henry VIII", "Catherine of Aragon, wife of Henry VIII"], "x": "The name was recorded in 1221 as Henehout, a wood belonging to a religious community."}, "fr": {"q": "L'orthographe à la française de Hainault vient d'un rapprochement erroné avec qui ?", "a": "Philippa de Hainaut, épouse d'Édouard III", "w": ["Éléonore de Castille, épouse d'Édouard Ier", "Anne de Clèves, épouse d'Henri VIII", "Catherine d'Aragon, épouse d'Henri VIII"], "x": "Le nom est noté en 1221 sous la forme Henehout, le bois d'une communauté religieuse."}, "de": {"q": "Die französisch wirkende Schreibweise von Hainault kommt von einer irrigen Verbindung mit wem?", "a": "Philippa von Hennegau, Frau Eduards III.", "w": ["Eleonore von Kastilien, Frau Eduards I.", "Anna von Kleve, Frau Heinrichs VIII.", "Katharina von Aragón, Frau Heinrichs VIII."], "x": "1221 wurde der Name Henehout geschrieben, der Wald einer geistlichen Gemeinschaft."}}, {"id": "q18", "t": "quiz", "s": "Charing Cross", "g": [], "en": {"q": "Edward I put up a cross at Charing in memory of whom?", "a": "His wife Eleanor", "w": ["His mother", "His daughter", "Queen Matilda"], "x": "Eleanor died in 1290. A Victorian copy of the cross stands in front of the main line station."}, "fr": {"q": "Édouard Ier fit ériger une croix à Charing en mémoire de qui ?", "a": "De son épouse Éléonore", "w": ["De sa mère", "De sa fille", "De la reine Mathilde"], "x": "Éléonore mourut en 1290. Une copie victorienne de la croix se dresse devant la gare."}, "de": {"q": "Zum Gedenken an wen ließ Eduard I. in Charing ein Kreuz errichten?", "a": "An seine Frau Eleonore", "w": ["An seine Mutter", "An seine Tochter", "An Königin Mathilde"], "x": "Eleonore starb 1290. Eine viktorianische Nachbildung des Kreuzes steht vor dem Fernbahnhof."}}, {"id": "q19", "t": "quiz", "s": "Mile End", "g": [], "en": {"q": "Mile End lies one mile from which old gate of the City of London?", "a": "Aldgate", "w": ["Moorgate", "Bishopsgate", "Ludgate"], "x": "The name, used since the 13th century, marked the end of the first mile of the road to Essex."}, "fr": {"q": "Mile End se trouve à un mille de quelle ancienne porte de la City de Londres ?", "a": "Aldgate", "w": ["Moorgate", "Bishopsgate", "Ludgate"], "x": "Le nom, en usage depuis
