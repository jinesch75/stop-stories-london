rt aujourd'hui démolie."], "Cutty Sark": ["Nommée d'après le Cutty Sark, un clipper à thé de 1869, aujourd'hui navire-musée tout proche.", "« Cutty sark » signifie en écossais une chemise de nuit courte : le navire doit son nom à la sorcière Nannie du poème Tam o' Shanter de Robert Burns, qui en porte une. Sa figure orne la proue du navire."], "Cyprus": ["Nommée d'après l'île de Chypre, passée sous contrôle britannique en 1878.", "Des maisons pour les ouvriers des Royal Docks et de l'usine à gaz de Beckton y furent construites à cette époque, et ce nom patriotique est resté. Il reste peu de chose de l'ancienne cité."], "Deptford Bridge": ["« Deptford » signifie le gué profond.", "Le gué franchissait la rivière Ravensbourne ; il fut plus tard remplacé par un pont. Deptford abritait un chantier naval royal fondé par Henri VIII."], "Devons Road": ["Nommée d'après Devons Road, la rue qui longe la station.", "On ne sait pas d'où vient le nom de la rue elle-même. La station a ouvert avec la première ligne du DLR en 1987."], "East India": ["Nommée d'après les East India Docks, construits en 1806 pour la Compagnie des Indes orientales.", "Les grands navires de la compagnie commerçaient avec l'Inde et la Chine. Les bassins ont été comblés, mais des parties des anciens murs subsistent."], "Elverson Road": ["Nommée d'après Elverson Road, la rue qui longe la station.", "On ne connaît pas l'origine du nom de la rue. La station a ouvert en 1999 avec le prolongement du DLR vers Lewisham."], "Gallions Reach": ["Nommée d'après un tronçon de la Tamise, qui rappelle la famille Galyon.", "La famille possédait des biens au bord du fleuve au XIVe siècle. Rudyard Kipling mentionne Gallions dans son roman de 1890 La Lumière qui s'éteint."], "Greenwich": ["« Greenwich » signifie le comptoir ou le port vert.", "Le nom est attesté au début du Xe siècle. Greenwich abrite l'Observatoire royal et le méridien d'origine, la ligne de longitude zéro qui définit l'heure de Greenwich (GMT)."], "Heron Quays": ["Nommée d'après Heron Quays, un ensemble de quais des anciens West India Docks.", "Les quais ont été reconstruits en bureaux dans les années 1980, à côté de Canary Wharf. La station a ouvert avec la première ligne du DLR en 1987."], "Island Gardens": ["Nommée d'après un petit parc au bord du fleuve, à la pointe sud de l'Isle of Dogs.", "Le parc, ouvert en 1895, offre une vue célèbre sur l'Old Royal Naval College de Wren, à Greenwich, de l'autre côté de la Tamise. Un tunnel piéton sous le fleuve, ouvert en 1902, part d'ici."], "King George V": ["Nommée d'après le King George V Dock, le dernier des trois Royal Docks.", "Il a ouvert en 1921 et porte le nom du roi de l'époque. Les grands paquebots de ce temps y accostaient."], "Langdon Park": ["Nommée d'après Langdon Park, le petit parc voisin.", "Pendant sa construction, la station devait s'appeler Carmen Street, d'après une rue toute proche."], "Lewisham": ["« Lewisham » signifie probablement la ferme d'un homme nommé Lēofsa.", "Le nom se termine par le vieil anglais hām, ferme. La Ravensbourne et son affluent, la Quaggy, se rejoignent près de la station."], "Limehouse": ["« Limehouse » signifie les fours à chaux.", "Au XIVe siècle, le nom était « lymhostes », les fours où l'on brûlait la craie pour faire de la chaux de construction. Plus tard, Limehouse devint un quartier portuaire animé."], "London City Airport": ["Nommée d'après le London City Airport, l'aéroport le plus proche de la City de Londres.", "Il a ouvert en 1987 sur le quai entre deux des anciens Royal Docks. La station du DLR a suivi en 2005."], "Mudchute": ["Nommée d'après une « mud chute », une goulotte à boue : la vase extraite du Millwall Dock y était pompée.", "La boue a formé un grand monticule. Aujourd'hui, le terrain accueille Mudchute Park and Farm, l'une des plus grandes fermes urbaines d'Europe."], "Pontoon Dock": ["Nommée d'après un bassin où les navires étaient soulevés sur des pontons flottants pour être réparés.", "Des vérins hydrauliques sortaient les navires de l'eau au Royal Victoria Dock. La Thames Barrier et son parc sont tout proches."], "Poplar": ["« Poplar » signifie le lieu où poussent les peupliers.", "Le nom est noté en 1327 sous la forme Popler. Les arbres poussaient bien sur le sol humide au bord de la Tamise."], "Prince Regent": ["Nommée d'après Prince Regent Lane, qui honore le futur George IV.", "Il devint prince régent en 1811, quand son père George III fut trop malade pour régner. La rue est plus ancienne que les docks."], "Pudding Mill Lane": ["Nommée d'après la rue, qui doit son nom à un moulin à eau sur la rivière Lea.", "Le moulin aurait été surnommé Pudding Mill à cause de sa forme ronde. La station jouxte le parc olympique de 2012."], "Royal Albert": ["Nommée d'après le Royal Albert Dock, qui honore le prince Albert, époux de la reine Victoria.", "Le bassin a ouvert en 1880 ; c'était le deuxième des trois Royal Docks. Ses entrepôts recevaient de la viande réfrigérée, des bananes et du tabac."], "Royal Victoria": ["Nommée d'après le Royal Victoria Dock, qui honore la reine Victoria.", "Il a ouvert en 1855 sur des marais ; c'était le premier des trois Royal Docks, construit pour les grands navires à vapeur et directement relié au chemin de fer."], "Shadwell": ["« Shadwell » signifie la source peu profonde.", "Le nom vient du vieil anglais sceald, peu profond, et wella, source ou ruisseau. Le DLR et l'Overground y ont chacun une station."], "South Quay": ["Nommée d'après les quais du South Dock des West India Docks.", "Les bassins ont ouvert au début du XIXe siècle. Les quais sont aujourd'hui bordés de tours de bureaux."], "Star Lane": ["Nommée d'après Star Lane, la rue qui longe la station.", "On ne connaît pas l'origine du nom de la rue. La station a ouvert en 2011, sur une nouvelle ligne du DLR vers Stratford International."], "Stratford High Street": ["Nommée d'après la grand-rue de Stratford, l'ancienne voie romaine vers l'est.", "Stratford signifie le gué sur la voie romaine, là où elle franchissait la Lea. La station se trouve à l'emplacement de l'ancienne gare de Stratford Market."], "Stratford International": ["Nommée pour les trains internationaux qui devaient s'y arrêter.", "La gare a ouvert en 2009 pour les trains passant par le tunnel sous la Manche, mais aucun Eurostar ne s'y est jamais arrêté."], "Tower Gateway": ["Nommée comme porte d'accès à la Tour de Londres, toute proche.", "C'était le premier terminus du DLR dans la City, à l'ouverture de la ligne en 1987. La Tour de Londres a été commencée par Guillaume le Conquérant après 1066."], "West India Quay": ["Nommée d'après les West India Docks, ouverts en 1802.", "Ils furent construits pour les navires apportant des Caraïbes du sucre, du rhum et du café produits par des personnes réduites en esclavage. D'anciens entrepôts du quai abritent aujourd'hui le Museum of London Docklands."], "West Silvertown": ["Nommée d'après Silvertown, qui n'a rien à voir avec l'argent.", "Le quartier s'est formé autour de l'usine de caoutchouc et de vêtements imperméables de S. W. Silver and Co., installée ici en 1852."], "Westferry": ["Nommée d'après West Ferry Road, qui menait à un ancien bac sur la Tamise.", "La rue longe le côté ouest de l'Isle of Dogs. La station a ouvert avec la première ligne du DLR en 1987."], "Woolwich Arsenal": ["Nommée d'après le Royal Arsenal, où l'on fabriqua pendant des siècles armes et munitions.", "En 1886, des ouvriers de l'Arsenal fondèrent un club de football, devenu Arsenal, qui s'installa plus tard à Highbury, dans le nord de Londres."], "Acton Central": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. « Central » a été ajouté dans les années 1920 pour la distinguer des autres gares d'Acton."], "Anerley": ["« Anerley » viendrait d'un mot du nord de l'Angleterre signifiant « solitaire ».", "Le propriétaire, William Sanderson, appela sa maison Anerley parce qu'elle était isolée. Il céda des terrains au chemin de fer à condition qu'on y construise une gare, qui ouvrit en 1839."], "Barking Riverside": ["Nommée d'après une ville nouvelle au bord de la Tamise, à Barking.", "Elle est construite sur le site d'anciennes centrales électriques. La gare a ouvert en 2022 au bout d'une nouvelle branche."], "Brockley": ["« Brockley » signifie la clairière d'un homme nommé Broca, ou une clairière où vivent des blaireaux.", "En vieil anglais, brocc signifie blaireau, et lēah une clairière dans un bois. Le quartier s'est développé à l'époque victorienne, avec de nombreuses grandes villas."], "Brondesbury": ["« Brondesbury » signifie le manoir d'un homme nommé Brand.", "C'était l'un des domaines de la cathédrale St Paul, dont le revenu allait à l'un des chanoines."], "Brondesbury Park": ["Nommée d'après Brondesbury, le manoir d'un homme nommé Brand, et un lotissement qui y fut construit.", "Les maisons ont été bâties à la fin du XIXe siècle sur les terres de l'ancien manoir, qui appartenait à la cathédrale St Paul."], "Bruce Grove": ["Nommée d'après Bruce Castle, un manoir de l'époque Tudor à Tottenham.", "La maison rappellerait la famille royale écossaise des Bruce, qui possédait des terres à Tottenham au Moyen Âge. C'est aujourd'hui un musée."], "Bush Hill Park": ["Nommée d'après Bush Hill Park, un ancien domaine de campagne avec un manoir.", "Le domaine remonte au XVIIe siècle. Des maisons y ont été construites à partir de la fin des années 1870, et la gare a ouvert en 1880 pour les desservir."], "Bushey": ["« Bushey » signifie un enclos fait de buissons, ou un enclos près des buis.", "La seconde partie est le vieil anglais hæg, un enclos ; la première pourrait être bysc, buisson, ou box, buis. La gare se trouve en fait à Oxhey, du côté de Watford."], "Caledonian Road & Barnsbury": ["Nommée d'après le Caledonian Asylum, et Barnsbury, le manoir de la famille Berners.", "Cet établissement était un foyer pour enfants écossais (« Caledonia » est le nom latin de l'Écosse). Barnsbury rappelle la famille de Berners, qui tenait le manoir au Moyen Âge."], "Cambridge Heath": ["Malgré son nom, Cambridge Heath n'a rien à voir avec Cambridge.", "Le nom est noté en 1275 sous la forme Camprichthesheth ; la première partie pourrait être un ancien nom de personne ou un nom de plante. Avec le temps, on l'a transformé pour qu'il ressemble au familier « Cambridge »."], "Camden Road": ["Nommée d'après Camden Road, qui honore Charles Pratt, 1er comte de Camden.", "Il possédait les terres de Camden Town. Son titre venait de Camden Place, sa demeure du Kent, nommée d'après l'historien William Camden."], "Canonbury": ["« Canonbury » signifie le manoir des chanoines.", "Les chanoines du prieuré St Bartholomew possédaient ces terres au Moyen Âge. La Canonbury Tower, construite au XVIe siècle, est toujours debout."], "Carpenders Park": ["Nommée d'après Carpenders Park, un domaine de campagne avec un manoir.", "Le secteur est resté rural jusqu'à la construction de maisons et de pavillons dans les années 1930. D'autres logements ont suivi dans les années 1950."], "Cheshunt": ["« Cheshunt » signifie probablement la source près de l'ancien fort romain.", "Le nom viendrait du vieil anglais ceaster, un fort ou une ville romaine, et funta, une source. Le Domesday Book de 1086 l'appelle Cestrehunt."], "Chingford": ["Chingford doit son nom à un ancien gué, mais on ne sait pas ce que signifie « Ching ».", "L'idée d'un « gué de galets » est aujourd'hui mise en doute ; le gué franchissait peut-être la rivière Ching ou la Lea. En bordure de la forêt d'Epping se dresse le pavillon de chasse de la reine Élisabeth, construit pour Henri VIII en 1543."], "Clapham High Street": ["Nommée d'après la grand-rue de Clapham ; « Clapham » signifie probablement la ferme près d'une colline.", "Le nom en vieil anglais viendrait de clopp, une bosse ou une butte. La gare s'appelait Clapham jusqu'en 1989."], "Clapham Junction": ["Nommée d'après Clapham, bien que la gare se trouve en fait à Battersea.", "À son ouverture en 1863, Clapham était le nom le plus chic. C'est l'une des gares les plus fréquentées d'Europe en nombre de trains."], "Clapton": ["« Clapton » signifie la ferme sur une colline.", "Le nom vient du vieil anglais clopp, une bosse ou une colline, et tūn, ferme. Le quartier descend jusqu'à la Lea et aux marais de Hackney."], "Crouch Hill": ["« Crouch » est un ancien mot pour croix : la colline à la croix.", "En moyen anglais, crouche signifiait croix, sans doute un calvaire au bord du chemin. Le même mot se retrouve dans Crouch End, tout proche."], "Crystal Palace": ["Nommée d'après le Crystal Palace, l'immense bâtiment de verre de la Grande Exposition de 1851.", "Il fut déplacé ici depuis Hyde Park et rouvrit en 1854. Il brûla en 1936, mais les sculptures victoriennes de dinosaures du parc subsistent."], "Dalston Junction": ["« Dalston » signifie la ferme d'un homme nommé Deorlaf.", "Le nom est noté en 1294 sous la forme Derleston. La gare a fermé en 1986 et rouvert en 2010 pour la nouvelle East London line."], "Dalston Kingsland": ["« Kingsland » signifie la terre du roi.", "Le nom est noté en 1395 sous la forme Kyngeslond, une terre appartenant au roi. Dalston signifie la ferme d'un homme nommé Deorlaf."], "Denmark Hill": ["Nommée, dit-on, d'après le prince Georges de Danemark, époux de la reine Anne.", "Il aurait eu une maison ou chassé ici vers 1700. Le King's College Hospital est à côté de la gare."], "Edmonton Green": ["« Edmonton » signifie la ferme d'un homme nommé Ēadhelm.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Adelmetone. L'essayiste Charles Lamb vécut à Edmonton ses dernières années et repose dans le cimetière."], "Emerson Park": ["Nommée d'après un lotissement aménagé à partir de 1895 par le promoteur William Carter.", "Le nom viendrait de son fils, Emerson. La gare a ouvert en 1909 pour desservir les nouvelles maisons."], "Enfield Town": ["« Enfield » signifie la terre dégagée d'un homme nommé Ēana, ou celle où l'on élevait des agneaux.", "Le nom vient du vieil anglais feld, terrain découvert. En 1967, le premier distributeur de billets du monde fut installé dans une banque d'Enfield."], "Finchley Road & Frognal": ["« Frognal » signifie le recoin des grenouilles.", "Le nom vient du vieil anglais frogga, grenouille, et healh, un recoin. Finchley Road a été construite à partir de 1826 comme nouvelle route vers Finchley."], "Forest Hill": ["Nommée d'après la Great North Wood, la grande forêt qui couvrait autrefois la colline.", "Ce bois s'étendait sur les collines du sud de Londres. Forest Hill abrite le Horniman Museum."], "Gospel Oak": ["Nommée d'après un chêne sous lequel on lisait l'Évangile à la limite de la paroisse.", "Quand les paroissiens parcouraient chaque année les limites de la paroisse (« beating the bounds »), ils s'arrêtaient sous l'arbre pour lire la Bible. Il marquait la frontière entre Hampstead et St Pancras."], "Hackney Central": ["« Hackney » signifie l'île d'un homme nommé Haca.", "L'« île » était une terre sèche surélevée dans les marais de la Lea. Le nom est noté en 1198 sous la forme Hakeneia."], "Hackney Downs": ["Nommée d'après Hackney Downs, un pré communal de Hackney.", "« Downs » désigne des terres vallonnées. Hackney signifie l'île d'un homme nommé Haca, une terre sèche dans les marais."], "Hackney Wick": ["« Wick » vient du vieil anglais wīc, une ferme ou un petit établissement.", "C'était la partie de Hackney au bord de la Lea. Une grande partie du parc olympique de 2012 se trouve à côté."], "Haggerston": ["« Haggerston » signifie probablement la borne d'un homme nommé Hærgod.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Hergotestane. Une première gare a ouvert ici en 1867 ; la gare actuelle date de 2010."], "Hampstead Heath": ["Nommée d'après Hampstead Heath, l'un des plus grands espaces verts de Londres.", "« Hampstead » signifie simplement ferme ou domaine. La lande possède des étangs de baignade et, sur Parliament Hill, l'une des plus belles vues sur Londres."], "Harringay Green Lanes": ["« Harringay » signifie l'enclos d'un homme nommé Hæring.", "Le même nom a donné Haringey et Hornsey : trois orthographes d'un seul vieux mot. Green Lanes était probablement un ancien chemin de bouviers qui menaient le bétail à Londres."], "Hatch End": ["« Hatch End » signifie le quartier près de la barrière.", "Une « hatch » était une barrière, probablement celle de Pinner Park, un parc à cerfs médiéval. Isabella Beeton, autrice du célèbre Book of Household Management, y vécut vers 1860."], "Headstone Lane": ["Nommée d'après Headstone Manor, un manoir entouré de douves tout proche.", "Sa partie la plus ancienne date du XIVe siècle, ce qui en fait l'un des plus vieux bâtiments à colombages de la région. Il abrite aujourd'hui le musée de Harrow."], "Highams Park": ["Nommée d'après le parc de Highams, un manoir du XVIIIe siècle.", "« Higham » signifie la ferme d'en haut. Le parc a été aménagé par Humphry Repton dans les années 1790."], "Homerton": ["« Homerton » signifie la ferme d'une femme nommée Hūnburh.", "Le nom est noté en 1343 sous la forme Hummerton. C'est l'un des rares noms de lieux londoniens qui rappellent une femme."], "Honor Oak Park": ["Nommée d'après le chêne d'honneur (« Oak of Honor ») de One Tree Hill.", "La reine Élisabeth Ire se serait reposée sous un chêne sur la colline le 1er mai 1602. Un chêne s'y dresse encore aujourd'hui."], "Hoxton": ["« Hoxton » signifie la ferme d'un homme nommé Hōc.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Hochestone. À l'époque de Shakespeare, il se trouvait juste à l'extérieur de la City, avec des champs et les premiers théâtres à proximité."], "Imperial Wharf": ["Nommée d'après un quai de l'Imperial Gas Works, à Sands End, Fulham.", "L'Imperial Gas Light and Coke Company construisit une grande usine à gaz au bord du fleuve. La gare a ouvert en 2009."], "Kensal Rise": ["« Kensal » signifie le bois du roi ; une « rise » est une pente.", "Le nom est attesté au XIIIe siècle sous la forme Kingisholte ; on ne sait pas de quel roi il s'agit. L'écrivain américain Mark Twain a inauguré la bibliothèque de Kensal Rise en 1900."], "Kentish Town West": ["Malgré son nom, Kentish Town n'a, semble-t-il, rien à voir avec le Kent.", "Le nom est noté en 1208 sous la forme Kentisston. Il pourrait venir d'une famille nommée Kentish, ou de mots désignant le lit d'un cours d'eau, la Fleet, aujourd'hui cachée."], "Kilburn High Road": ["« Kilburn » signifie probablement le ruisseau des vaches, ou le ruisseau royal.", "Ce ruisseau est la Westbourne, aujourd'hui souterraine. Kilburn High Road suit l'ancienne voie romaine, Watling Street."], "Leyton Midland Road": ["Nommée d'après Leyton, la ferme sur la rivière Lea, et Midland Road.", "La ligne, en partie propriété du Midland Railway, est arrivée ici en 1894. La gare tient son nom de la rue qui la longe."], "Leytonstone High Road": ["« Leytonstone » signifie Leyton à la pierre.", "Leyton est la ferme sur la Lea ; la pierre était probablement une borne romaine ou une borne de limite. Le cinéaste Alfred Hitchcock est né ici en 1899."], "London Fields": ["Nommée d'après des champs communaux où paissaient les bêtes en route vers les marchés de Londres.", "Les bouviers y faisaient reposer leurs troupeaux avant la dernière étape vers la City. Les champs sont aujourd'hui un parc avec une piscine en plein air."], "New Cross": ["Nommée probablement d'après une auberge de diligences, le Golden Cross, sur la route du Kent et de Douvres.", "Goldsmiths, qui fait partie de l'université de Londres, se trouve à côté de la gare."], "New Cross Gate": ["Nommée d'après une barrière de péage sur la route à New Cross.", "Les voyageurs de la route à péage vers le Kent payaient ici. New Cross doit probablement son nom à une auberge de diligences."], "Norwood Junction": ["« Norwood » signifie le bois du nord, au nord de Croydon.", "La Great North Wood couvrait autrefois les collines d'ici. Plusieurs lignes de chemin de fer se rejoignent à cette bifurcation."], "Peckham Rye": ["« Peckham » signifie la ferme près d'une colline ; « Rye » est un ancien mot pour ruisseau.", "Peckham Rye est le pré communal au bord du ruisseau. Enfant, le poète William Blake affirmait y avoir vu un arbre rempli d'anges."], "Penge West": ["« Penge » est un nom celtique qui signifie le bout du bois.", "Le nom est noté en 957 sous la forme Penceat, des mêmes mots brittoniques que le gallois pen, tête ou bout, et coed, bois. C'est l'un des très rares noms celtiques de Londres."], "Queens Road Peckham": ["Nommée d'après Queen's Road, à Peckham, la ferme près d'une colline.", "Peckham vient du vieil anglais pēac, colline ou pic, et hām, ferme. La gare a ouvert en 1866."], "Rectory Road": ["Nommée probablement d'après le presbytère de l'église St Mary de Stoke Newington.", "La rue menait vers le presbytère de St Mary. Stoke Newington signifie probablement la nouvelle ferme près des souches."], "Rotherhithe": ["« Rotherhithe » signifie le débarcadère du bétail.", "Le nom vient du vieil anglais hrȳther, bétail, et hȳth, débarcadère. Le Mayflower partit d'ici en 1620. Les trains empruntent le tunnel sous la Tamise de Brunel (1843), le premier tunnel sous un fleuve navigable."], "Shoreditch High Street": ["« Shoreditch » signifie le fossé près de la pente.", "Le nom vient du vieil anglais scora, talus ou pente, et dīc, fossé. Une légende le rattache à Jane Shore, maîtresse d'Édouard IV, mais c'est une invention tardive."], "Silver Street": ["Nommée d'après Silver Street, une vieille rue d'Edmonton.", "Silver Street est un nom de rue ancien et répandu, d'origine incertaine. La gare a ouvert en 1872."], "South Acton": ["« Acton » signifie la ferme près des chênes.", "Le nom vient du vieil anglais āc, chêne, et tūn, ferme. South Acton est devenu un quartier industriel avec de nombreuses blanchisseries, surnommé « Soapsud Island », l'île à la mousse de savon."], "South Hampstead": ["« Hampstead » signifie simplement ferme ou domaine.", "Le nom vient du vieil anglais hām-stede. La gare a ouvert en 1879 sous le nom de Loudoun Road et s'appelle South Hampstead depuis 1922."], "South Tottenham": ["« Tottenham » signifie la ferme d'un homme nommé Totta.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Toteham. La gare de South Tottenham a ouvert en 1871."], "Southbury": ["Nommée d'après Southbury Road, qui tient son nom d'un champ voisin.", "La rue s'appelait Nags Head Lane jusqu'en 1882. La gare a ouvert en 1891 sous le nom de Churchbury et a fermé en 1909. Elle a rouvert pendant la Première Guerre mondiale, a refermé, puis est revenue sous le nom de Southbury en 1960."], "St James Street": ["Nommée d'après St James Street, à Walthamstow.", "La rue tient probablement son nom de l'église St James, construite en 1842 pour la ville en pleine croissance, puis démolie. Walthamstow signifie le lieu d'accueil."], "Stamford Hill": ["« Stamford » signifie le gué sablonneux.", "Le nom est noté en 1294 sous la forme Saundfordhull, la colline près du gué sablonneux. Le gué permettait à la voie romaine, Ermine Street, de franchir un ruisseau."], "Stoke Newington": ["« Stoke Newington » signifie probablement la nouvelle ferme près des souches.", "L'écrivain Daniel Defoe a vécu ici, et Edgar Allan Poe y est allé à l'école enfant."], "Surrey Quays": ["Nommée d'après les Surrey Commercial Docks, sur la rive « Surrey » de la Tamise.", "Ces bassins recevaient du bois et des céréales. Le Greenland Dock, la partie la plus ancienne, accueillait autrefois des baleiniers. La gare s'appelait Surrey Docks jusqu'en 1989."], "Sydenham": ["« Sydenham » s'appelait d'abord Chipenham, probablement la ferme d'un homme nommé Cippa.", "Le nom est noté en 1206 sous la forme Chipenham, puis Sippenham. L'orthographe a changé au fil des siècles jusqu'à devenir Sydenham."], "Theobalds Grove": ["Nommée d'après Theobalds, un grand palais qui appartenait à William Cecil, lord Burghley.", "Le roi Jacques Ier aimait tant cette maison qu'il l'échangea contre un autre palais, et il y mourut en 1625. Il n'en reste que des fragments."], "Turkey Street": ["Nommée d'après Turkey Street, près du Turkey Brook, à Enfield.", "L'origine du nom est incertaine ; à ce qu'on sache, elle n'a rien à voir avec la dinde (« turkey ») ni avec la Turquie."], "Upper Holloway": ["« Holloway » signifie le chemin creux, une route creusée dans le sol.", "Le bétail et les charrettes se rendant aux marchés de Londres ont usé la route pendant des siècles."], "Walthamstow Queen's Road": ["« Walthamstow » signifie probablement le lieu d'accueil.", "Le nom est noté en 1075 sous la forme Wilcumestowe. La gare a ouvert en 1894 sous le nom de Walthamstow et a pris son nom actuel plus tard."], "Wandsworth Road": ["« Wandsworth » signifie l'enclos d'un homme nommé Wændel.", "Le lieu figure dans le Domesday Book de 1086 sous la forme Wendelesorde. La rivière Wandle a ensuite reçu son nom de la ville."], "Wanstead Park": ["Nommée d'après le parc de Wanstead House, un immense manoir palladien.", "La maison était l'une des plus somptueuses d'Angleterre, mais elle fut démolie en 1825 pour payer les dettes de son propriétaire. Son parc subsiste."], "Wapping": ["« Wapping » pourrait signifier le lieu du peuple de Wæppa, ou un lieu marécageux.", "Le nom est noté vers 1220. Des pirates furent pendus à l'Execution Dock de Wapping, dont le capitaine Kidd en 1701."], "Watford High Street": ["« Watford » signifie probablement le gué des chasseurs, ou le gué humide.", "Le gué franchissait la rivière Colne. La gare se trouve juste à côté de la grand-rue de la ville."], "Watford Junction": ["« Watford » signifie probablement le gué des chasseurs, ou le gué humide.", "Le gué franchissait la rivière Colne. À cette bifurcation, des lignes secondaires rejoignent la grande ligne de Londres vers le nord."], "West Croydon": ["« Croydon » signifie la vallée où pousse le safran sauvage.", "Le nom vient du vieil anglais croh, safran, et denu, vallée. West Croydon est le terminus d'une branche de la Windrush line."], "White Hart Lane": ["Nommée d'après White Hart Lane, une rue nommée probablement au XVIIe siècle.", "Le cerf blanc était l'emblème du roi Richard II et une enseigne d'auberge courante ; la rue doit peut-être son nom à une auberge. Le stade voisin de Tottenham Hotspur a longtemps été appelé White Hart Lane."], "Wood Street": ["Nommée d'après Wood Street, à Walthamstow, sur la route de la forêt d'Epping.", "La rue menait de la ville vers la forêt. La gare a ouvert en 1873."], "Woodgrange Park": ["Nommée d'après Woodgrange, une ferme qui appartenait à l'abbaye de Stratford Langthorne.", "Une « grange » était la ferme d'un monastère. Les maisons ont été construites à la fin du XIXe siècle sur ces terres agricoles."]}, "de": {"Acton Town": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von zwei altenglischen Wörtern: āc, Eiche, und tūn, Hof oder Siedlung. Die Station wurde 1879 als Mill Hill Park eröffnet und heißt seit 1910 Acton Town."], "Aldgate": ["Benannt nach Aldgate, einem der Tore in Londons römischer und mittelalterlicher Stadtmauer.", "Was „Ald“ bedeutet, weiß niemand genau. Vorschläge sind „altes Tor“, ein „Biertor“ mit einer Schenke, ein Sachse namens Ealh oder ein Tor, das allen offenstand. Das Tor selbst wurde 1761 abgerissen."], "Aldgate East": ["Benannt nach Aldgate, einem alten Tor in der Stadtmauer der City, und gleich östlich davon gelegen.", "„East“ unterscheidet sie von der nahen Station Aldgate. Die Herkunft von „Aldgate“ ist unsicher: ein altes Tor, ein Biertor mit Schenke oder ein Sachse namens Ealh gehören zu den Ideen."], "Alperton": ["„Alperton“ bedeutet der Hof eines Mannes namens Ealhbeorht.", "Mehr ist über ihn nicht bekannt. Die Station wurde 1903 als Perivale-Alperton eröffnet und trägt ihren heutigen Namen seit 1910."], "Amersham": ["„Amersham“ bedeutet das Heim eines Sachsen namens Ealhmund.", "In angelsächsischer Zeit wurde es Agmodesham geschrieben; -ham bedeutet Hof oder Gehöft. Die Metropolitan Railway erreichte die Stadt 1892."], "Angel": ["Benannt nach dem Angel, einem berühmten Postkutschengasthof.", "Der Gasthof stand an der Kreuzung der Great North Road mit der Pentonville Road, wo die Kutschen vor der letzten Etappe nach London hielten. Er bestand bis ins 20. Jahrhundert, und 1901 wurde in der Nähe die Station eröffnet."], "Archway": ["Benannt nach der Brücke, die die Hornsey Lane über die Straße nach Norden führt.", "Der erste Bogen wurde 1813 gebaut und um 1900 durch die heutige Eisenbrücke ersetzt. Bei ihrer Eröffnung 1907 hieß die Station Highgate und erst seit 1947 Archway."], "Arnos Grove": ["Der Name erinnert wahrscheinlich an die Familie Arnold, Grundbesitzer im 14. Jahrhundert.", "Im Lauf der Jahrhunderte wurde aus „Arnold's Grove“ wohl Arno's Grove und dann Arnos Grove, sicher ist die Verbindung aber nicht. Das runde Stationsgebäude von 1932 ist einer der bekanntesten Entwürfe von Charles Holden."], "Arsenal": ["Benannt nach dem Fußballverein Arsenal, dessen altes Stadion in Highbury gleich nebenan lag.", "Der Verein wurde im Royal Arsenal in Woolwich gegründet und zog 1913 nach Highbury. Die Station wurde 1906 als Gillespie Road eröffnet und 1932 umbenannt, nach einer Kampagne des Vereinstrainers Herbert Chapman. Der alte Name ist auf den Fliesen noch zu sehen."], "Baker Street": ["Benannt nach William Baker, der die Straße im 18. Jahrhundert anlegte.", "Die Station wurde 1863 an der ersten U-Bahn der Welt eröffnet, der Metropolitan Railway. Baker Street ist auch die fiktive Adresse von Sherlock Holmes, Nummer 221B."], "Balham": ["„Balham“ bedeutet wahrscheinlich ein Gehöft in einer runden Einfriedung.", "Der Ort steht im Domesday Book von 1086 als Belgeham. Der erste Teil kommt vielleicht von einem altenglischen Wort für etwas Rundes oder Glattes."], "Bank": ["Benannt nach der Bank of England, die über der Station steht.", "Als Erste kam 1898 die Waterloo & City Line, in einer Station, die einfach City hieß. Heute ist Bank einer der größten Knotenpunkte des Netzes, wo sich mehrere Linien unter dem alten Herzen der City treffen."], "Barbican": ["„Barbican“ bedeutet Wachturm oder Vorwerk einer befestigten Stadt.", "Der Name erinnert wohl an einen Turm an oder bei Londons römischer und mittelalterlicher Stadtmauer. Die Station wurde 1865 als Aldersgate Street eröffnet, nach einem anderen Mauertor, und heißt erst seit 1968 Barbican."], "Barking": ["„Barking“ bedeutet die Leute des Bereca oder die Siedlung bei den Birken.", "735 wurde es Berecingum geschrieben. Die im 7. Jahrhundert gegründete Abtei Barking war eines der wichtigsten Frauenklöster Englands."], "Barkingside": ["„Barkingside“ bedeutet die Barking zugewandte Seite des Hainault-Waldes.", "Das Gebiet lag gerade noch innerhalb des alten Gutsbezirks und der Pfarrei Barking, deren Grenze durch den Wald lief. Eine Karte von 1777 zeigt „Barking Side“ als langen Streifen Gemeindeland am Westrand des Waldes."], "Barons Court": ["Ein erfundener Name, um 1900 für neue Wohnhäuser gewählt.", "Er kommt vielleicht von Baronscourt in Nordirland, verbunden mit dem Bauherrn Sir William Palliser, oder ist ein Wortspiel mit Earl's Court, der nächsten Station der Piccadilly Line."], "Battersea Power Station": ["Benannt nach dem benachbarten Kraftwerk, heute Geschäfte, Wohnungen und Büros.", "Battersea gehört zu den ältesten überlieferten Namen Londons: Im 7. Jahrhundert hieß es Badrices īeg, Badrics Insel, trockenes Land in den Sümpfen an der Themse. Die Station wurde 2021 am Ende der Verlängerung der Northern Line eröffnet."], "Bayswater": ["„Bayswater“ erinnert an Bayard's Watering, erwähnt 1380.", "„Bayard“ kann ein Familienname sein oder ein altes Wort für ein Pferd. Das „Watering“ war eine Tränke am Fluss Westbourne, der heute in einem Rohr unter den Straßen fließt."], "Becontree": ["„Becontree“ bedeutet wahrscheinlich der Baum eines Sachsen namens Beohha.", "Es war der Versammlungsort einer alten Hundertschaft, eines Verwaltungsbezirks der Grafschaft. Nach dem Ersten Weltkrieg erhielt eine riesige Sozialwohnungssiedlung den Namen, damals eine der größten der Welt."], "Belsize Park": ["„Belsize“ kommt vom französischen bel assis, schön gelegen.", "Der Name ist seit dem 14. Jahrhundert für ein Gut an den Hängen unterhalb von Hampstead belegt. Die Station wurde 1907 eröffnet."], "Bermondsey": ["„Bermondsey“ bedeutet die Insel eines Mannes namens Beornmund.", "Die „Insel“ war ein Stück erhöhtes, trockenes Land in den Sümpfen südlich der Themse. Der Ort steht im Domesday Book von 1086; die Station wurde 1999 mit der Verlängerung der Jubilee Line eröffnet."], "Bethnal Green": ["„Bethnal“ bedeutet wahrscheinlich der Winkel eines Mannes namens Blitha.", "Frühe Schreibweisen wie Blithehale weisen auf altenglisch blithe, fröhlich, oder einen Personennamen und healh, einen Landwinkel. Der „Green“ war die offene Dorfwiese, die heute als Park erhalten ist."], "Blackfriars": ["Benannt nach den schwarz gekleideten Dominikanern, die hier ein Kloster hatten.", "Die Mönche kamen im 13. Jahrhundert hierher und blieben, bis Heinrich VIII. die Klöster auflöste. Ihr Name lebt in der Brücke, dem Bahnhof und dem Viertel weiter."], "Blackhorse Road": ["Benannt nach der Straße, deren Name wohl eine Verballhornung von Black House Lane ist.", "Das „schwarze Haus“ war ein örtliches Herrenhaus; das schwarze Pferd auf den Fliesen der Station ist also eine spätere Idee. Die Station wurde 1968 mit der Victoria Line eröffnet."], "Bond Street": ["Benannt nach Sir Thomas Bond, der die Straße im 17. Jahrhundert anlegte.", "Bond kaufte hier Land und legte die Straße an. Eine Straße namens Bond Street allein gibt es heute nicht: Sie besteht aus Old Bond Street und New Bond Street."], "Borough": ["Benannt nach dem Borough of Southwark, der Stadt am Südende der London Bridge.", "Jahrhundertelang war dies Londons wichtigste Vorstadt und hieß deshalb einfach „the Borough“. Die Station wurde 1890 an der ersten tief liegenden U-Bahn-Linie eröffnet."], "Boston Manor": ["Benannt nach Boston Manor House, einem jakobinischen Herrenhaus nahe der Station.", "Mit Boston in Lincolnshire oder Massachusetts hat der Name nichts zu tun: Er geht wahrscheinlich auf einen mittelalterlichen Namen für den Hof eines Mannes namens Bord zurück. Bis 1911 hieß die Station Boston Road."], "Bounds Green": ["Benannt nach der Familie le Bounde, die hier im Mittelalter Land besaß.", "Ihr Name lebte in einem Bauernhof weiter, und die Station übernahm ihn, als 1932 die Piccadilly Line kam."], "Bow Road": ["Benannt nach der bogenförmigen Brücke über den Fluss Lea.", "Die gewölbte Brücke wurde Anfang des 12. Jahrhunderts gebaut, der Überlieferung nach auf Wunsch von Königin Mathilde, und gab dem Dorf Bow („Bogen“) seinen Namen."], "Brent Cross": ["Benannt nach dem Fluss Brent und einer nahen Kreuzung.", "„Brent“ ist ein keltischer Name, viel älter als das Englische, und bedeutet vielleicht „die Heilige“ oder „die Hohe“. Die Station wurde 1923 als Brent eröffnet und heißt seit 1976 Brent Cross."], "Brixton": ["„Brixton“ bedeutet der Stein eines Mannes namens Beorhtsige.", "Der Stein war wohl der Versammlungsort der örtlichen Hundertschaft, eines alten Verwaltungsbezirks. Die Victoria Line erreichte Brixton 1971."], "Bromley-by-Bow": ["„Bromley“ bedeutet eine Lichtung, auf der Ginster wächst.", "„By-Bow“ wurde 1968 hinzugefügt, damit man es nicht mit Bromley in Kent verwechselt. Bow selbst ist nach einer bogenförmigen Brücke über den Lea benannt."], "Buckhurst Hill": ["„Buckhurst“ bedeutet ein bewaldeter Hügel voller Buchen.", "Im 12. Jahrhundert wurde es La Bocherste geschrieben. Der Hügel liegt am Rand des Epping Forest, in dem noch viele Buchen stehen."], "Burnt Oak": ["Benannt nach einer alten Eiche, die vom Blitz verbrannt worden sein soll.", "Der Name taucht 1754 für ein Feld an der Watling Street auf, der alten Römerstraße. Die Eiche selbst ist längst verschwunden."], "Caledonian Road": ["Benannt nach dem Caledonian Asylum, einem Heim für schottische Kinder.", "Das Heim wurde für Kinder schottischer Soldaten und Seeleute gegründet, die in den Napoleonischen Kriegen gefallen oder verwundet waren, und zog 1828 an diese Straße. „Caledonia“ ist der alte lateinische Name Schottlands."], "Camden Town": ["Benannt nach Charles Pratt, 1. Earl Camden, dem das Land gehörte.", "1791 begann er, es als Bauland zu verpachten. Sein Titel kam von Camden Place, seinem Haus in Kent, das nach dem Historiker William Camden benannt war."], "Canada Water": ["Benannt nach einem See, der einst zum Canada Dock gehörte.", "Das Dock in den Surrey Docks hieß nach dem Land, aus dem die meisten Schiffe kamen, beladen mit Holz. Nach der Schließung der Docks wurde es größtenteils zugeschüttet, und 1999 wurde die Station eröffnet."], "Canary Wharf": ["Benannt nach einem Lagerhaus für Obst von den Kanarischen Inseln.", "Ab den 1930er-Jahren entluden hier Obstschiffe von den Inseln. Die Inseln selbst sollen nach Hunden benannt sein (lateinisch canis), was gut passt: Canary Wharf liegt auf der Isle of Dogs, der „Hundeinsel“."], "Canning Town": ["Wahrscheinlich nach einem Canning benannt, aber niemand weiß, nach welchem.", "Eine Theorie nennt Charles Canning, Vizekönig von Indien, doch der Name war schon in Gebrauch, bevor er berühmt wurde. Andere denken an seinen Vater, Premierminister George Canning, oder an eine örtliche Firma namens Canning."], "Cannon Street": ["„Cannon“ hat nichts mit Kanonen zu tun: Der Name kommt von den Kerzenmachern.", "Im Mittelalter hieß sie Candelwrichtestrete, die Straße der Kerzenmacher. Mit der Zeit wurde daraus Cannon Street."], "Canons Park": ["Benannt nach den Kanonikern des Priorats St Bartholomew, denen hier Land gehörte.", "Nachdem Heinrich VIII. das Priorat aufgelöst hatte, ging das Gut an private Besitzer. Anfang des 18. Jahrhunderts baute der Herzog von Chandos hier ein prächtiges Haus namens Cannons, das 1747 abgerissen wurde. Sein Park wurde zu Canons Park."], "Chalfont & Latimer": ["Benannt nach den Dörfern Chalfont und Latimer.", "„Chalfont“ bedeutet wahrscheinlich der Kreidebach, von altenglisch cealc funta. Latimer ist nach der Familie Latimer benannt, die das Land ab dem frühen 14. Jahrhundert besaß. Bis 1915 hieß die Station Chalfont Road."], "Chalk Farm": ["„Chalk“ (Kreide) hat nichts mit Kreide zu tun: Der Name kommt von der Chalcot Farm.", "Chalcot kommt vielleicht von altenglischen Wörtern für „kalte Hütten“. Der Hof war vor etwa 200 Jahren ein bekannter Orientierungspunkt."], "Chancery Lane": ["Benannt nach der Chancery, einer königlichen Kanzlei und einem Gericht im mittelalterlichen England.", "Die Chancery verwahrte die Urkunden des Königs und urteilte nach Billigkeit. Die Straße liegt bis heute im Herzen des juristischen London, nahe den Inns of Court."], "Charing Cross": ["„Charing“ bedeutet wohl eine Biegung, und das Kreuz ist ein Denkmal für eine Königin.", "Der Name kommt vielleicht von altenglisch cierring, eine Wende, etwa die Biegung der Themse. Eduard I. ließ hier ein Kreuz für seine Frau Eleonore errichten, die 1290 starb. Eine viktorianische Nachbildung steht vor dem Fernbahnhof."], "Chesham": ["„Chesham“ bedeutet die Flusswiese bei einem Steinhaufen.", "Etwa ein Jahrhundert vor der normannischen Eroberung wurde es Cæstæleshamm geschrieben. Chesham ist der Endpunkt eines eingleisigen Zweigs der Metropolitan Line."], "Chigwell": ["Was „Chigwell“ bedeutet, weiß niemand so genau.", "Es könnte der Brunnen oder die Quelle eines Mannes namens Cicca sein oder von einem ganz anderen Wort kommen. Das Dorf liegt am Rand des Epping Forest."], "Chiswick Park": ["„Chiswick“ bedeutet der Käsehof.", "Der altenglische Name verweist auf einen Hof, der nahe der Themse Käse herstellte. Die Station wurde 1879 als Acton Green eröffnet und heißt seit 1910 Chiswick Park."], "Chorleywood": ["„Chorley“ bedeutet wahrscheinlich die Lichtung der ceorls, der freien Bauern.", "Ceorl ist das altenglische Wort, aus dem „churl“ (Bauer, Grobian) wurde. Der „wood“, der Wald, braucht keine Erklärung. Bis 1965 schrieb sich die Station Chorley Wood, in zwei Wörtern."], "Clapham Common": ["Benannt nach der Gemeindewiese von Clapham, einer großen Freifläche.", "„Clapham“ bedeutet wahrscheinlich das Gehöft bei einem Hügel, von altenglisch clopp; eine andere Idee ist ein Mann namens Cloppa. Die Wiese war einst Weideland und ist heute ein öffentlicher Park."], "Clapham North": ["Benannt nach Clapham, wahrscheinlich das Gehöft bei einem Hügel.", "Der altenglische Name kommt vielleicht von clopp, Klumpen oder Hügel, oder von einem Mann namens Cloppa. Die Station wurde 1900 als Clapham Road eröffnet und 1926 in Clapham North umbenannt."], "Clapham South": ["Benannt nach Clapham, wahrscheinlich das Gehöft bei einem Hügel.", "Sie wurde 1926 eröffnet; als Name war auch „Nightingale Lane“ im Gespräch. Unter der Station liegt einer von acht Tiefbunkern, die im Zweiten Weltkrieg gebaut wurden."], "Cockfosters": ["Woher „Cockfosters“ kommt, weiß niemand sicher.", "Der Name ist seit dem 16. Jahrhundert belegt. Eine beliebte Idee ist, dass hier der „cock forester“ wohnte, der oberste Förster des königlichen Jagdgebiets Enfield Chase."], "Colindale": ["Der Name soll an die Familie Collin erinnern, Grundbesitzer im 16. Jahrhundert.", "Colindale war bis ins 20. Jahrhundert Ackerland; heute steht hier das Museum der Royal Air Force auf dem Gelände des Flugplatzes Hendon."], "Colliers Wood": ["Benannt nach einem Wald, den „colliers“ nutzten, also Köhler.", "Früher war ein collier jemand, der Holzkohle herstellte, kein Bergmann. Der Wald bestand bis ins späte 19. Jahrhundert."], "Covent Garden": ["„Covent“ ist eine alte Form von „convent“, Kloster.", "Im Mittelalter war hier der Garten der Westminster Abbey. Der berühmte Obst- und Gemüsemarkt begann im 17. Jahrhundert und zog 1974 nach Nine Elms."], "Croxley": ["„Croxley“ bedeutet wahrscheinlich die Lichtung eines Mannes namens Crocc.", "Leah, eine Waldlichtung, ist eine der häufigsten Endungen englischer Ortsnamen. Die Station wurde 1925 als Croxley Green eröffnet und heißt seit 1949 Croxley."], "Dagenham East": ["„Dagenham“ bedeutet das Gehöft eines Sachsen namens Dæcca.", "Der Name wurde 666 erstmals aufgeschrieben, als Dæccanhaam, in einer Urkunde der Abtei Barking. Der Bahnhof wurde 1885 als Dagenham eröffnet, 1902 kamen die Züge der District Line, und seit 1949 heißt er Dagenham East."], "Dagenham Heathway": ["Benannt nach Dagenham und dem Heathway, der Straße zur Heide von Becontree.", "Dagenham bedeutet das Gehöft eines Sachsen namens Dæcca. Die Station wurde 1932 einfach als Heathway eröffnet, für die neue Siedlung Becontree, und erhielt 1949 den Zusatz „Dagenham“."], "Debden": ["„Debden“ bedeutet das tiefe Tal.", "Das tiefe Tal ist vielleicht das des Flusses Roding. Die Station wurde 1865 an einer Eisenbahnlinie eröffnet und hieß bis 1949 Chigwell Lane, als die Central Line sie übernahm."], "Dollis Hill": ["Woher „Dollis Hill“ kommt, weiß niemand so genau.", "Eine Idee ist eine örtliche Familie namens Dalley. Im Zweiten Weltkrieg baute die Forschungsstelle der Post hier Colossus, einen der ersten elektronischen Computer, für die Codeknacker von Bletchley Park. Auch Churchills Notbunker „Paddock“ liegt in der Nähe."], "Ealing Broadway": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name, um 700 als Gillingas belegt, wurde langsam zu Ylling und dann Ealing. Ein „Broadway“ ist eine breite Hauptstraße, hier die Einkaufsstraße der Stadt."], "Ealing Common": ["Benannt nach der Gemeindewiese, einem offenen Grasland in Ealing.", "„Ealing“ bedeutet die Leute eines Sachsen namens Gilla. Von 1886 bis 1910 hieß die Station Ealing Common and West Acton."], "Earl's Court": ["Benannt nach dem Gericht der Earls of Oxford, der Grundherren.", "Die Familie de Vere, Earls of Oxford, besaß das Land von kurz nach der normannischen Eroberung an rund 500 Jahre lang. Ihr Gutsgericht, wo örtliche Streitfälle verhandelt wurden, stand nahe der Station."], "East Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. East Acton war ein eigener Weiler östlich der Stadt; die Station wurde 1920 eröffnet."], "East Finchley": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Der Name endet auf altenglisch leah, eine Waldlichtung. Auf der Station steht die Statue eines Bogenschützen von Eric Aumonier, der seinen Pfeil Richtung Innenstadt richtet."], "East Ham": ["„Ham“ bedeutet trockenes Land in einer Flussbiegung oder zwischen Flüssen.", "Das Land liegt hier zwischen Themse, Lea und Roding. Etwa ein Jahrhundert vor den Normannen wurde es Hamme genannt und in angelsächsischer Zeit in East Ham und West Ham geteilt."], "East Putney": ["„Putney“ bedeutet der Landeplatz eines Mannes namens Putta.", "Das Domesday Book von 1086 nennt es Putelei. Der Landeplatz lag an der Themse."], "Eastcote": ["„Eastcote“ bedeutet die Hütte oder die Hütten im Osten.", "Sie lagen östlich von Ruislip; Ascot bei Windsor hat denselben Ursprung. Der ummauerte Garten und der Taubenschlag von Eastcote House sind erhalten, obwohl das Haus in den 1960er-Jahren abgerissen wurde."], "Edgware": ["„Edgware“ bedeutet wahrscheinlich der Fischteich eines Sachsen namens Ecgi.", "Ein „wer“, ein Wehr, war ein Teich oder Damm zum Fischfang. Die Northern Line erreichte Edgware 1924 und sollte weiterführen, doch die Verlängerung wurde nie vollendet."], "Edgware Road": ["Benannt nach der Straße nach Edgware, die der römischen Watling Street folgt.", "Edgware bedeutet wahrscheinlich der Fischteich eines Sachsen namens Ecgi. Die Straße führt schnurgerade nach Nordwesten, wie römische Straßen eben."], "Elephant & Castle": ["Höchstwahrscheinlich benannt nach einem Postkutschengasthof namens Elephant and Castle.", "Einer beliebten Geschichte nach kommt der Name von „Infanta de Castilla“, einer spanischen Prinzessin, doch Historiker bezweifeln das. Ein Elefant mit einer Burg auf dem Rücken war ein verbreitetes Zeichen, etwa im Wappen der Messerschmiede-Zunft."], "Elm Park": ["Der Name wurde in den 1930er-Jahren für eine neue Gartenstadtsiedlung gewählt.", "Die Siedlung entstand auf Ackerland zwischen Hornchurch und Rainham, und 1935 wurde die Station für sie eröffnet."], "Embankment": ["Benannt nach dem Victoria Embankment, der in den 1860er-Jahren gebauten Uferbefestigung an der Themse.", "Joseph Bazalgette baute sie für neue Abwasserkanäle und die District Railway und schuf dabei eine Uferstraße. Die Station hatte viele Namen mit „Charing Cross“, bevor sie 1976 Embankment wurde."], "Epping": ["„Epping“ bedeutet wahrscheinlich die Leute des Hochlands.", "Im Domesday Book von 1086 steht es als Eppinges. Der große Wald in der Nähe ist nach der Stadt benannt, nicht umgekehrt."], "Euston": ["Benannt nach Euston Hall in Suffolk, dem Sitz der Herzöge von Grafton.", "Den Herzögen gehörte hier das Land, und Euston Road und Euston Square übernahmen den Namen ihres Landsitzes. Das Dorf Euston in Suffolk bedeutet wohl der Hof eines Mannes namens Efe."], "Euston Square": ["Benannt nach Euston Square, dem Platz beim Fernbahnhof.", "Der Name kommt von Euston Hall in Suffolk, dem Sitz der Herzöge von Grafton, denen das Land gehörte. Die Station wurde 1863 als Gower Street eröffnet und 1909 umbenannt."], "Fairlop": ["Benannt nach der Fairlop Oak, einer riesigen Eiche im Hainault Forest.", "Ab dem frühen 18. Jahrhundert fand jeden Sommer ein Jahrmarkt unter der Eiche statt, gegründet von einem Einheimischen, Daniel Day. Der Baum wurde durch ein Feuer beschädigt und stürzte im frühen 19. Jahrhundert im Sturm um."], "Farringdon": ["Benannt nach Nicholas und William de Faringdon, Ratsherren der City.", "1279 kaufte die Familie das Recht, diesen Stadtbezirk der City zu leiten, und ihr Name ging auf den Bezirk, eine Straße und die Station über. Farringdon war eine der ersten Stationen der ersten U-Bahn der Welt, eröffnet 1863."], "Finchley Central": ["„Finchley“ bedeutet wahrscheinlich die Lichtung, wo Finken leben.", "Die Station wurde 1867 als Finchley and Hendon eröffnet. 1894 wurde sie zu Finchley (Church End) und 1940 zu Finchley Central."], "Finchley Road": ["Benannt nach der Straße nach Finchley, ab 1826 als Mautstraße gebaut.", "Finchley bedeutet wahrscheinlich die Lichtung, wo Finken leben. Die neue Straße umging die steilen Hügel von Hampstead weiter östlich."], "Finsbury Park": ["Benannt nach einem 1869 eröffneten Park, der aber nicht in Finsbury liegt.", "Der Park war für die Bewohner des alten Bezirks Finsbury weiter südlich gedacht. „Finsbury“ bedeutet wahrscheinlich das Gut eines Mannes namens Finn."], "Fulham Broadway": ["„Fulham“ bedeutet das Uferland eines Mannes namens Fulla.", "Um 700 wurde es Fulanham geschrieben. Die Station wurde 1880 als Walham Green eröffnet, nach der Dorfwiese, und 1952 in Fulham Broadway umbenannt."], "Gants Hill": ["Wahrscheinlich benannt nach der Familie le Gant, Verwalter der Ländereien der Abtei Barking.", "Die Familie ist hier seit dem 13. Jahrhundert belegt. Die 1947 eröffnete Station hat zwischen den Bahnsteigen eine lange gewölbte Halle nach dem Vorbild der Moskauer Metro."], "Gloucester Road": ["Benannt nach Maria, Herzogin von Gloucester, die hier 1805 ein Haus baute.", "Vorher hieß die Straße Hog Moore Lane. Die Station wurde 1868 als Brompton (Gloucester Road) eröffnet."], "Golders Green": ["Wahrscheinlich benannt nach der Familie Godyere, die hier im 14. Jahrhundert lebte.", "Die Wiese war offenes Land neben ihrem Besitz. Das Dorf wuchs schnell, nachdem 1907 die U-Bahn kam."], "Goldhawk Road": ["Wahrscheinlich benannt nach John Goldhawk, einem Grundbesitzer im 14. Jahrhundert.", "Ihm gehörte viel Land in der Gegend, die damals zur Pfarrei Fulham gehörte. Die Station wurde 1914 eröffnet."], "Goodge Street": ["Benannt nach John Goodge, der das Land 1718 erwarb.", "Vor dem Bau der Häuser war hier eine Wiese namens Crab Tree Field. Seine Söhne bebauten sie ab etwa 1746. Die Station wurde 1907 als Tottenham Court Road eröffnet und ein Jahr später in Goodge Street umbenannt."], "Grange Hill": ["Eine „grange“ war ein Gutshof mit Scheunen, oft im Besitz eines Klosters.", "Dieser stand auf einem Hügel. Mit der Kinderserie Grange Hill hat der Name nichts zu tun."], "Great Portland Street": ["Benannt nach der Straße, die an die Herzöge von Portland erinnert.", "Das Land kam an die Herzöge, als der 2. Herzog 1734 die Erbin heiratete. Die Station wurde 1863 als Portland Road eröffnet."], "Green Park": ["Benannt nach dem Park, der 1746 in The Green Park umbenannt wurde.", "Zuerst hieß er Upper St James's Park. Der neue Name beschrieb wohl seine offene Wiese mit wenigen Bäumen und ohne Blumenbeete. Die Station wurde 1906 als Dover Street eröffnet."], "Greenford": ["„Greenford“ bedeutet die grüne Furt.", "Die Furt führte durch den Fluss Brent. 1857 eröffnete William Perkin hier eine Fabrik für Mauvein, den ersten synthetischen Farbstoff."], "Gunnersbury": ["„Gunnersbury“ bedeutet das Gut einer Frau namens Gunnhild.", "Gunnhild ist ein skandinavischer Name. Eine Legende verbindet ihn mit einer Nichte von König Knut, doch Beweise gibt es keine."], "Hainault": ["„Hainault“ bedeutet wahrscheinlich der Wald einer geistlichen Gemeinschaft.", "1221 wurde es Henehout geschrieben, altenglisch für einen Klosterwald, hier im Besitz der Abtei Barking. Die französisch wirkende Schreibweise kam später, durch eine irrige Verbindung mit Philippa von Hennegau (Hainaut), der Frau Eduards III."], "Hammersmith": ["„Hammersmith“ bedeutet wahrscheinlich ein Ort mit einer Hammerschmiede.", "Der Name ist seit 1294 belegt. Eine andere, weniger wahrscheinliche Theorie sieht darin den Landeplatz eines Mannes namens Hammoder."], "Hampstead": ["„Hampstead“ bedeutet einfach Gehöft.", "Der Name kommt von altenglisch hām-stede, wie bei Berkhamsted und Wheathampstead. Die 1907 eröffnete Station Hampstead hat die tiefsten Bahnsteige der U-Bahn."], "Hanger Lane": ["„Hanger“ bedeutet ein bewaldeter Hang.", "Es kommt von altenglisch hangra, ein Wald an einem steilen Hang. Dasselbe Wort steckt im nahen Hanger Hill."], "Harlesden": ["„Harlesden“ bedeutet der Hof eines Mannes namens Heoruwulf.", "Im Domesday Book von 1086 steht es als Herulvestune; -tune bedeutet Hof. Die Züge der Bakerloo Line halten hier seit 1917."], "Harrow & Wealdstone": ["Benannt nach Harrow und dem Wealdstone, dem Grenzstein von Harrow Weald.", "„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel. „Weald“ bedeutet Wald, und der Stein markierte den Rand der Wälder nördlich von Harrow. Der Bahnhof wurde 1837 an der London and Birmingham Railway eröffnet."], "Harrow-on-the-Hill": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich oben auf dem Hügel, wo heute die Kirche St Mary steht. Die Station wurde 1880 als Harrow eröffnet und erhielt 1894 den Zusatz „on-the-Hill“."], "Hatton Cross": ["„Hatton“ bedeutet der Hof auf der Heide.", "Die Heide war Hounslow Heath, wo heute der Flughafen Heathrow liegt. „Cross“ meint wahrscheinlich eine Kreuzung."], "Heathrow Terminal 4": ["„Heathrow“ bedeutet die Häuserreihe auf der Heide.", "1410 wurde es erstmals als La Hetherewe erwähnt, ein Weiler auf der Hounslow Heath. Terminal 4 wurde 1986 eröffnet, mit eigener Station an einer Schleife der Piccadilly Line."], "Heathrow Terminal 5": ["„Heathrow“ bedeutet die Häuserreihe auf der Heide.", "Der seit 1410 belegte Weiler verschwand, als in den 1940er-Jahren der Flughafen gebaut wurde. Terminal 5 und seine Station wurden 2008 eröffnet."], "Heathrow Terminals 2 & 3": ["„Heathrow“ bedeutet die Häuserreihe auf der Heide.", "Die Station wurde 1977 als Heathrow Central eröffnet. Seit 2016, nach der Schließung von Terminal 1, heißt sie Heathrow Terminals 2 & 3."], "Hendon Central": ["„Hendon“ bedeutet am hohen Hügel.", "Schon vor dem Domesday Book von 1086 wurde es Hendun geschrieben. Die Station wurde 1923 eröffnet."], "High Barnet": ["„Barnet“ bedeutet durch Brandrodung gewonnenes Land.", "Es kommt von altenglisch bærnet, Brennen. Die Stadt heißt auch Chipping Barnet, „chipping“ bedeutet Markt. 1471 wurde gleich nördlich der Stadt die Schlacht von Barnet ausgetragen, Teil der Rosenkriege."], "High Street Kensington": ["„Kensington“ bedeutet der Hof eines Sachsen namens Cynesige.", "Im Domesday Book steht es als Chenesitun. Die Station wurde 1868 an der Kensington High Street eröffnet, nahe dem Kensington-Palast."], "Highbury & Islington": ["„Highbury“ bedeutet das hohe Gut; „Islington“ der Hügel eines Mannes namens Gisla.", "Islington wurde um 1000 als Gislandune geschrieben. Das Gut Highbury lag auf einem Hügel über den anderen Gütern der Pfarrei. Die Station der Victoria Line wurde 1968 eröffnet."], "Highgate": ["Benannt nach einem hohen Tor auf dem Hügel, einer Mautstelle an der Straße nach Norden.", "Das Tor führte in den Jagdpark des Bischofs von London, und Reisende auf der Great North Road zahlten hier Maut. Highgate ist einer der höchsten Punkte Londons."], "Hillingdon": ["„Hillingdon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Hilla.", "Im Domesday Book von 1086 steht es als Hillendone; -done bedeutet Hügel. Die Station wurde 1923 eröffnet."], "Holborn": ["„Holborn“ bedeutet wahrscheinlich der Bach in der Senke.", "Der Bach war wahrscheinlich der Fleet selbst, längst unter der Erde verschwunden. Londoner sagen traditionell „Hoh-bn“."], "Holland Park": ["Benannt nach Holland House, einem Herrenhaus aus dem 17. Jahrhundert, dessen Gelände zum Park wurde.", "Das Haus ist nach Henry Rich, Earl of Holland, benannt; sein Titel kam von Holland in Lincolnshire, nicht von den Niederlanden. Später lebte dort die Familie Fox, die Barone Holland."], "Holloway Road": ["„Holloway“ bedeutet wahrscheinlich der Hohlweg, eine tief in den Boden eingefahrene Straße.", "Vieh auf dem Weg zu Londons Märkten hat den Weg über Jahrhunderte ausgehöhlt. Manche sehen darin eher einen „heiligen Weg“ für Pilger."], "Hornchurch": ["„Hornchurch“ bedeutet die Kirche mit Hörnern.", "Der Name ist 1222 belegt. Warum, weiß niemand genau, aber die Kirche St Andrew trägt an ihrer Ostseite noch heute einen Stierkopf mit Hörnern aus Kupfer."], "Hounslow Central": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Der „Hund“ kann ein Tier oder ein Mann mit dem Spitznamen Hund sein, der Hügel wohl ein Grabhügel. Die Station wurde 1886 als Heston Hounslow eröffnet und 1925 umbenannt."], "Hounslow East": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Der Name endet auf altenglisch hlāw, Hügel oder Grabhügel. Bis 1925 hieß die Station Hounslow Town."], "Hounslow West": ["„Hounslow“ bedeutet wahrscheinlich der Hügel des Hundes.", "Die Station wurde 1884 als Hounslow Barracks eröffnet, nach der nahen Kaserne, und 1925 in Hounslow West umbenannt."], "Hyde Park Corner": ["Benannt nach der Ecke des Hyde Park.", "Der Park war einst das Gut Hyde der Westminster Abbey; ein „hide“ war ein altes Flächenmaß. Heinrich VIII. übernahm es 1536 als Jagdgebiet."], "Ickenham": ["„Ickenham“ bedeutet das Gehöft eines Mannes namens Ticca.", "Das Domesday Book von 1086 nennt es Ticheham; mit der Zeit ging das T verloren. Die Dorfpumpe von 1866 steht noch auf der Dorfwiese."], "Kennington": ["„Kennington“ bedeutet wahrscheinlich der Hof eines Mannes namens Cena.", "Im Domesday Book von 1086 steht es als Chenintune. Kennington Park war einst eine Gemeindewiese, auf der große öffentliche Versammlungen stattfanden."], "Kensal Green": ["„Kensal“ bedeutet der Wald des Königs.", "Im 13. Jahrhundert wurde es Kingisholte geschrieben. Welcher König gemeint ist, weiß niemand. Die Wiese lag dort, wo heute der 1833 eröffnete Friedhof Kensal Green ist."], "Kensington (Olympia)": ["Benannt nach Olympia, einer 1886 eröffneten Ausstellungshalle.", "Die Halle ist wohl nach Olympia im antiken Griechenland benannt, der Heimat der Olympischen Spiele. Kensington bedeutet der Hof eines Sachsen namens Cynesige. Bis 1946 hieß die Station Kensington (Addison Road)."], "Kentish Town": ["Trotz des Namens hat Kentish Town, soweit bekannt, nichts mit Kent zu tun.", "1208 wurde es Kentisston geschrieben. Der Name kommt vielleicht von einer Familie namens Kentish oder von Wörtern für ein Bachbett, das des heute verborgenen Flusses Fleet."], "Kenton": ["„Kenton“ bedeutet wahrscheinlich der Hof eines Mannes namens Coena.", "Der Name endet auf altenglisch tūn, Hof oder Siedlung. Die Züge der Bakerloo Line halten hier seit 1917."], "Kew Gardens": ["Benannt nach den Königlichen Botanischen Gärten in Kew.", "„Kew“ wurde 1327 als Cayho erwähnt und bedeutet wahrscheinlich der Landvorsprung bei einer Anlegestelle an der Themse. Die Gärten gehören zum UNESCO-Welterbe."], "Kilburn": ["„Kilburn“ bedeutet wahrscheinlich der Bach der Kühe oder der Bach des Königs.", "Der Bach ist der Westbourne, heute unterirdisch. 1134 wurde der Name als Cuneburna erwähnt. Wo die Römerstraße den Bach kreuzte, stand ein Kloster."], "Kilburn Park": ["„Kilburn“ bedeutet wahrscheinlich der Bach der Kühe oder der Bach des Königs.", "Der Bach ist der Westbourne, heute unterirdisch. „Park“ kam für die neue Wohnsiedlung hinzu. Die Station wurde 1915 eröffnet."], "King's Cross St Pancras": ["Benannt nach einer Statue von König Georg IV. und der Kirche St Pancras.", "Die Gegend hieß früher Battle Bridge, nach einer Brücke über den Fleet. Ein Denkmal für Georg IV. stand hier etwa von 1830 bis 1845; es war unbeliebt und wurde bald entfernt. Der heilige Pankratius war ein Junge, der der Überlieferung nach 304 in Rom den Märtyrertod starb."], "Kingsbury": ["„Kingsbury“ bedeutet das Gut des Königs.", "Welcher König gemeint ist, weiß niemand: Zur Zeit des Domesday Book 1086 war das Land schon in privater Hand. Die Station wurde 1932 eröffnet."], "Knightsbridge": ["„Knightsbridge“ bedeutet die Brücke der jungen Männer.", "Altenglisch cniht bedeutete junger Mann oder Diener, noch nicht Ritter in Rüstung. Die Brücke führte über den Westbourne. Der Name ist um 1050 erstmals belegt."], "Ladbroke Grove": ["Benannt nach James Weller Ladbroke, der die Gegend Mitte des 19. Jahrhunderts bebaute.", "Er erbte das Land um 1821 von seinem Onkel, und die Hauptstraße wurde nach ihm benannt. Die Station wurde 1864 als Notting Hill eröffnet."], "Lambeth North": ["„Lambeth“ bedeutet der Landeplatz für Lämmer.", "1062 wurde es Lambehitha geschrieben: hithe ist ein altes Wort für einen Landeplatz am Fluss, wie in Rotherhithe. Die Station wurde 1906 eröffnet und heißt seit 1917 Lambeth North."], "Lancaster Gate": ["Benannt nach dem Tor Lancaster Gate der Kensington Gardens.", "Es wurde zu Ehren von Königin Victoria benannt, die auch Herzog von Lancaster war. Die Stadt Lancaster selbst ist nach einem römischen Kastell, einem „caster“, am Fluss Lune benannt."], "Latimer Road": ["Benannt nach Edward Latymer, einem Londoner Juristen, der 1627 starb.", "Er vermachte hier Land, um den Armen von Hammersmith zu helfen, und sein Geld gründete auch die Latymer School. Die Straße führte durch seinen Besitz. Die Station wurde 1868 eröffnet."], "Leicester Square": ["Benannt nach dem Earl of Leicester, der hier Leicester House baute.", "Der Platz wurde in den 1670er-Jahren vor seinem Haus angelegt. Die Stadt Leicester ist nach den Ligore benannt, den Leuten vom Fluss Soar, und nach „ceaster“, einer römischen Stadt."], "Leyton": ["„Leyton“ bedeutet der Hof am Fluss Lea.", "Der Lea, auch Lee geschrieben, fließt am Rand des Viertels entlang. Der Bahnhof wurde 1856 als Low Leyton eröffnet und kam 1947 zur Central Line."], "Leytonstone": ["„Leytonstone“ bedeutet Leyton am Stein.", "Leyton ist der Hof am Lea. Der Stein war wahrscheinlich ein alter römischer Meilenstein oder Grenzstein beim Hollybush Hill. Der Regisseur Alfred Hitchcock wurde hier 1899 geboren."], "Liverpool Street": ["Benannt nach Lord Liverpool, Premierminister von 1812 bis 1827.", "Die Straße wurde in den 1820er-Jahren nach ihm benannt. Sein Titel kommt von der Stadt Liverpool, 1190 als Liuerpul erwähnt, wahrscheinlich ein Teich oder Priel mit schlammigem Wasser. Die Station wurde 1875 als Bishopsgate eröffnet."], "London Bridge": ["Benannt nach der London Bridge, dem ältesten Themseübergang der Stadt.", "Schon seit der Römerzeit gibt es hier eine Brücke. Der Fernbahnhof wurde 1836 eröffnet und ist der älteste noch genutzte Kopfbahnhof im Zentrum Londons."], "Loughton": ["„Loughton“ bedeutet der Hof eines Mannes namens Luhha.", "Im Domesday Book von 1086 steht es als Lochintuna. Viel älter ist Loughton Camp, eine Wallanlage aus der Eisenzeit im nahen Wald."], "Maida Vale": ["Benannt nach einem Pub, dem Hero of Maida, der an eine Schlacht in Italien erinnerte.", "1806 besiegte eine britische Truppe unter General Sir John Stuart die Franzosen bei Maida in Kalabrien. Bald darauf eröffnete das Pub an der Edgware Road, und die Gegend übernahm seinen Namen."], "Manor House": ["Benannt nach dem Manor House, einem Pub an den Green Lanes.", "Der Gasthof stand an der Straße nach Norden und gab der Kreuzung ihren Namen. Die Station wurde 1932 eröffnet."], "Mansion House": ["Benannt nach dem Mansion House, dem Amtssitz des Lord Mayor der City of London.", "Das prächtige Haus wurde im 18. Jahrhundert gebaut. Die Stationen Bank und Cannon Street liegen sogar etwas näher daran."], "Marble Arch": ["Benannt nach dem weißen Marmorbogen von John Nash.", "Er wurde in den 1820er-Jahren als Eingang zum Buckingham Palace gebaut und 1851 hierher versetzt. In der Nähe stand der Galgen von Tyburn, jahrhundertelang Londons wichtigste Hinrichtungsstätte."], "Marylebone": ["„Marylebone“ bedeutet die Marienkirche am Bach.", "1453 wurde es Maryburne geschrieben, nach einer Marienkirche am Bach Tyburn; das „le“ kam später hinzu. Die Station wurde 1907 als Great Central eröffnet, nach der Eisenbahngesellschaft."], "Mile End": ["So benannt, weil es eine Meile von Aldgate entfernt liegt, dem alten Tor der City.", "Der Name wird seit dem 13. Jahrhundert für den Ort verwendet, an dem die erste Meile der Straße nach Essex endete."], "Mill Hill East": ["„Mill Hill“ bedeutet wahrscheinlich der Hügel mit der Windmühle.", "Von der Mühle ist nichts geblieben, aber ein Feld in der Nähe heißt noch Mill Field. Die Northern Line erreichte die Station 1941; sie sollte weiterführen, doch die Verlängerung wurde nie gebaut."], "Monument": ["Benannt nach dem Monument für den Großen Brand von London von 1666.", "Die Säule wurde von Christopher Wren und Robert Hooke entworfen. Sie ist 61 Meter hoch, genau so weit wie von ihrem Fuß bis zu der Stelle in der Pudding Lane, wo das Feuer ausbrach."], "Moor Park": ["Benannt nach Moor Park, einem palladianischen Herrenhaus in der Nähe.", "Es steht im alten Park von The More, einem Palast, der einst Kardinal Wolsey gehörte. Die Station wurde 1910 als Sandy Lodge eröffnet."], "Moorgate": ["Benannt nach dem Moorgate, einem kleinen Tor in der Stadtmauer der City.", "Es führte hinaus nach Moorfields, sumpfigem Gelände vor der Mauer. Das Tor wurde 1762 abgerissen."], "Morden": ["„Morden“ bedeutet wahrscheinlich der Hügel im Moor.", "Es kommt von altenglisch mōr, Moor, und dūn, Hügel. Morden ist die Endstation der Northern Line und die südlichste Station der U-Bahn."], "Mornington Crescent": ["Benannt nach dem Earl of Mornington, dem älteren Bruder des Herzogs von Wellington.", "Richard Wellesley, 2. Earl of Mornington, war Generalgouverneur von Indien und Außenminister. Die Station gab auch einem berühmten Nonsens-Spiel in der BBC-Radiokomödie I'm Sorry I Haven't a Clue den Namen."], "Neasden": ["„Neasden“ bedeutet der nasenförmige Hügel.", "Es kommt von altenglisch nēos, Nase, und dūn, Hügel. Die Station wurde 1880 als Kingsbury & Neasden eröffnet."], "Newbury Park": ["„Newbury“ bedeutet das neue Gut.", "Der Name ist mittelalterlich. Der Bahnhof wurde 1903 eröffnet, und die Central Line übernahm ihn 1947."], "Nine Elms": ["Benannt nach einer Reihe von neun Ulmen.", "Der Name wurde um 1645 erstmals erwähnt. Seit 1974 ist hier der New Covent Garden Market, und 2021 wurde die Station eröffnet."], "North Acton": ["„Acton“ bedeutet der Hof bei den Eichen.", "Der Name kommt von altenglisch āc, Eiche, und tūn, Hof. Die Station wurde 1923 nördlich des alten Ortskerns eröffnet."], "North Ealing": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name wurde um 700 als Gillingas erwähnt. Die Station North Ealing wurde 1903 eröffnet."], "North Greenwich": ["„Greenwich“ bedeutet der grüne Hafen oder Handelsplatz.", "Der Name ist seit dem frühen 10. Jahrhundert belegt. Die 1999 eröffnete Station liegt gut zwei Kilometer nordöstlich von Greenwich selbst, neben dem einstigen Millennium Dome."], "North Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Der Schrein stand wahrscheinlich auf dem Harrow Hill, wo heute die Kirche St Mary steht. Die Station North Harrow wurde 1915 eröffnet."], "North Wembley": ["„Wembley“ bedeutet die Lichtung eines Sachsen namens Wemba.", "Der Name endet auf altenglisch leah, eine Lichtung. Die Züge der Bakerloo Line halten hier seit 1917."], "Northfields": ["Benannt nach den nördlichen Feldern von Ealing.", "Die Felder blieben Ackerland, bis im frühen 20. Jahrhundert Häuser gebaut wurden. Die Station wurde 1908 als Northfield eröffnet."], "Northolt": ["„Northolt“ bedeutet der nördliche Landwinkel.", "Es kommt von altenglisch north und healh, Ecke oder Winkel. Sein Gegenstück im Süden ist Southall. Die Station wurde 1948 an der Central Line eröffnet."], "Northwick Park": ["Benannt nach Northwick Park, der Grünfläche neben der Station.", "Der Name soll von der Familie Rushout stammen, der das Ackerland hier gehörte und deren Landsitz Northwick Park in den Cotswolds war. Die Station wurde 1923 als Northwick Park & Kenton eröffnet."], "Northwood": ["„Northwood“ bedeutet der Wald im Norden.", "Es war der bewaldete Nordteil der alten Pfarrei Ruislip. Die Station wurde 1887 eröffnet."], "Northwood Hills": ["Benannt nach Northwood, dem Wald nördlich von Ruislip, und seinen Hügeln.", "Die Station wurde 1933 für eine neue Wohnsiedlung eröffnet. Seltsamerweise liegt sie etwas tiefer als die Station Northwood."], "Notting Hill Gate": ["„Notting“ bedeutet wahrscheinlich die Leute eines Mannes namens Cnotta.", "Der Name ist seit dem 14. Jahrhundert in vielen Schreibweisen belegt, etwa Knottynghull. Das „gate“ war eine Mautschranke an der Straße nach Uxbridge."], "Oakwood": ["Benannt nach dem Oakwood Park, der nach einem Haus namens Oak Lodge heißt.", "Der nahe Enfield Chase war ein königliches Jagdgebiet. Die Station wurde 1933 als Enfield West eröffnet und heißt seit 1946 Oakwood."], "Old Street": ["Benannt nach der Straße, um 1200 als Ealdestrate erwähnt.", "Der Name bedeutet einfach „alte Straße“; die Straße ist wahrscheinlich römisch. Wegen der vielen Tech-Firmen ringsum heißt der Kreisverkehr über der Station Silicon Roundabout."], "Osterley": ["„Osterley“ bedeutet wahrscheinlich die Lichtung mit einem Schafpferch.", "Der Name ist seit dem 13. Jahrhundert belegt. Osterley House wurde im 16. Jahrhundert für den Kaufmann Sir Thomas Gresham gebaut und später von Robert Adam umgestaltet."], "Oval": ["Benannt nach dem Cricketstadion The Oval.", "Der Name geht auf einen ovalen Straßenplan aus den 1790er-Jahren zurück; das Cricketfeld wurde darin angelegt. Der Surrey County Cricket Club spielt hier seit 1845."], "Oxford Circus": ["Ein „circus“ ist ein runder Platz, an dem Straßen zusammenkommen; einen Zirkus gab es nie.", "Hier kreuzen sich Oxford Street und Regent Street. Die Oxford Street war die Hauptstraße nach Westen, Richtung Oxford."], "Paddington": ["„Paddington“ bedeutet der Hof eines Mannes namens Padda.", "Der Name ist angelsächsisch; -ington bedeutet die Siedlung von jemandes Leuten. Die Station wurde 1863 an der ersten U-Bahn eröffnet."], "Park Royal": ["Benannt nach dem Ausstellungsgelände der Royal Agricultural Society, 1903 hier eröffnet.", "Die Landwirtschaftsschau blieb nur wenige Jahre, doch der Name blieb. Später wurde die Gegend zu einem der größten Gewerbegebiete Londons."], "Parsons Green": ["Benannt nach dem Pfarrhaus von Fulham, das an der Dorfwiese stand.", "Die Dorfwiese ist als kleiner Park erhalten. In der Nähe liegt Fulham Palace, jahrhundertelang der Landsitz der Bischöfe von London."], "Perivale": ["„Perivale“ bedeutet wahrscheinlich das Tal der Birnbäume.", "Der Name ist seit dem frühen 16. Jahrhundert als Pyryvale belegt. Die Station wurde 1904 als Perivale Halt eröffnet und kam 1947 zur Central Line."], "Piccadilly Circus": ["Benannt nach „piccadills“, steifen Spitzenkragen, die um 1600 in Mode waren.", "Ein Schneider, Robert Baker, wurde mit ihnen reich und baute hier ein Haus, das man Pickadilly Hall nannte. Der Name ging auf die Straße über und auf den „circus“, einen runden Platz."], "Pimlico": ["Woher der Name „Pimlico“ kommt, weiß niemand sicher.", "Eine beliebte Theorie verbindet ihn mit Ben Pimlico, einem für sein Bier berühmten Wirt, doch seine Schenke lag in Hoxton, am anderen Ende Londons. Die Station wurde 1972 mit der Victoria Line eröffnet."], "Pinner": ["„Pinner“ bedeutet wahrscheinlich der nadelförmige Hügel oder der Hügel eines Mannes namens Pinn.", "Der Name endet auf altenglisch ora, Hang oder Hügel; der Fluss Pinn wurde später nach dem Dorf benannt. Der Jahrmarkt von Pinner findet seit einer Urkunde von 1336 fast jedes Jahr statt."], "Plaistow": ["„Plaistow“ bedeutet wahrscheinlich ein Platz für Spiel oder Sport.", "Es kommt wohl von altenglisch plega, Spiel, und stōw, Ort, vielleicht dort, wo Spiele oder Mysterienspiele stattfanden. Andere verbinden es mit Sir Hugh de Plaiz, einem mittelalterlichen Grundherrn. Einheimische sagen „Plar-stow“."], "Preston Road": ["„Preston“ bedeutet der Hof der Priester.", "Es kommt von altenglisch prēost, Priester, und tūn, Hof. Die Station wurde 1908 für die Besucher des olympischen Tontaubenschießens in der Nähe eröffnet."], "Putney Bridge": ["Benannt nach der Putney Bridge, der Brücke nach Putney am anderen Ufer.", "„Putney“ bedeutet der Landeplatz eines Mannes namens Putta. Die Station liegt tatsächlich auf der Fulham-Seite der Themse. Das Ruderrennen zwischen Oxford und Cambridge beginnt nahe der Brücke."], "Queen's Park": ["Benannt nach Königin Victoria, die regierte, als das Viertel gebaut wurde.", "Park und Wohnsiedlung stammen aus dem späten 19. Jahrhundert. Die Züge der Bakerloo Line halten hier seit 1915."], "Queensbury": ["Ein erfundener Name, in den 1930er-Jahren als Gegenstück zum benachbarten Kingsbury gewählt.", "Man fragte die Einheimischen nach Vorschlägen, und Queensbury gewann. Der Name hat keinen historischen Hintergrund. Die Station wurde 1934 eröffnet."], "Queensway": ["Zu Ehren von Königin Victoria benannt.", "Sie soll als Mädchen auf diesem Weg geritten sein, als sie im nahen Kensington-Palast lebte. Die Straße hieß Queen's Road, die Station ebenso bis 1946."], "Ravenscourt Park": ["Ein Wortspiel mit einem Familiennamen: „raven“ heißt Rabe, auf Französisch „corbeau“.", "Im 18. Jahrhundert taufte der Besitzer Thomas Corbett sein Haus in Ravenscourt um; Raben waren in seinem Wappen. Das Gelände wurde zum öffentlichen Park. Die Station wurde 1873 als Shaftesbury Road eröffnet."], "Rayners Lane": ["Angeblich benannt nach Daniel Rayner, einem Bauern aus der Gegend.", "Als 1904 die Bahn kam, war die Gegend fast leer; die Station wurde 1906 eröffnet, und Häuser folgten erst in den 1930er-Jahren."], "Redbridge": ["Benannt nach einer roten Ziegelbrücke über den Fluss Roding.", "Die Brücke ist seit dem 17. Jahrhundert belegt und wurde Anfang der 1920er-Jahre abgerissen. Die 1947 eröffnete Station trug den Namen schon vor dem 1965 gegründeten Londoner Bezirk Redbridge."], "Regent's Park": ["Benannt nach dem Prinzregenten, dem späteren König Georg IV.", "Der Park wurde im frühen 19. Jahrhundert von John Nash angelegt, auf einem früheren Jagdgebiet Heinrichs VIII. Die Regent Street entstand zur selben Zeit."], "Richmond": ["Über Heinrich VII. nach Richmond in Yorkshire benannt.", "Bevor er König wurde, war Heinrich Earl of Richmond. Um 1500 baute er den königlichen Palast in Sheen neu und benannte ihn nach seiner Grafschaft. „Richmond“ ist französisch für „starker Hügel“."], "Rickmansworth": ["„Rickmansworth“ bedeutet die Einfriedung eines Mannes namens Ricmær.", "-worth ist ein altenglisches Wort für Einfriedung oder Hof. Das Domesday Book von 1086 nennt es Prichemareworde."], "Roding Valley": ["Benannt nach dem Fluss Roding, der durch das Tal fließt.", "Der Fluss ist nach den Rodings benannt, Dörfern der Leute eines sächsischen Anführers namens Hroda."], "Royal Oak": ["Benannt nach einem Pub namens Royal Oak.", "Der Pubname erinnert an die Eiche bei Boscobel in Shropshire, in der sich der spätere Karl II. 1651 vor den Soldaten des Parlaments versteckte. Die Station wurde 1871 eröffnet."], "Ruislip": ["„Ruislip“ bedeutet die Sprungstelle, an der Binsen wachsen.", "Es kommt von altenglisch rysc, Binse, und hlȳp, Sprung: wohl eine schmale Stelle am Fluss Pinn, über die man springen konnte. Die Station wurde 1904 eröffnet."], "Ruislip Gardens": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Die Sprungstelle war wohl eine schmale Stelle am Fluss Pinn. „Gardens“ stand für neue Vorstadtsiedlungen. Der Bahnhof wurde 1934 eröffnet; die Züge der Central Line kamen 1948."], "Ruislip Manor": ["Benannt nach einer Wohnsiedlung auf dem Land des alten Gutes Ruislip.", "Ruislip bedeutet die Sprungstelle, an der Binsen wachsen. Die Station wurde 1912 als kleiner Haltepunkt eröffnet, lange vor den meisten Häusern."], "Russell Square": ["Benannt nach der Familie Russell, den Herzögen von Bedford.", "Ihnen gehörte ein großer Teil von Bloomsbury, und sie legten den Platz um 1800 an. Die Gärten entwarf Humphry Repton. Das British Museum liegt gleich um die Ecke."], "St James's Park": ["Benannt nach dem St James's Park, der seinen Namen vom St James's Palace hat.", "Heinrich VIII. baute den Palast an der Stelle eines mittelalterlichen Hospitals für leprakranke Frauen, das dem heiligen Jakobus dem Jüngeren geweiht war. Der Park ist der älteste der königlichen Parks Londons."], "St John's Wood": ["Benannt nach den Johanniterrittern, denen die Wälder hier gehörten.", "Der Orden des heiligen Johannes von Jerusalem hatte sein Priorat in Clerkenwell und besaß im Mittelalter dieses bewaldete Land. Die Station wurde 1939 eröffnet."], "St Paul's": ["Benannt nach der St Paul's Cathedral, gleich südlich davon.", "Seit 604 steht auf diesem Hügel eine dem heiligen Paulus geweihte Kirche. Die Station wurde 1900 als Post Office eröffnet, nach dem nahen Hauptpostamt, und 1937 umbenannt."], "Seven Sisters": ["Benannt nach einem Ring aus sieben Bäumen auf dem Page Green.", "Der örtlichen Überlieferung nach pflanzten sieben Schwestern sie. Die ersten Bäume waren Ulmen; der Ring wurde mehrmals neu gepflanzt, zuletzt 1997 mit Hainbuchen."], "Shepherd's Bush": ["Woher „Shepherd's Bush“ kommt, weiß eigentlich niemand.", "Eine Idee ist, dass Schäfer hier mit ihren Herden auf dem Weg zum Smithfield-Markt in der City rasteten. Eine andere, dass der Name an einen Einheimischen namens Shepherd oder Sheppard erinnert."], "Shepherd's Bush Market": ["Benannt nach dem Straßenmarkt neben der Bahnstrecke in Shepherd's Bush.", "Bis 2008 hieß die Station Shepherd's Bush; dann wurde sie umbenannt, um Verwechslungen mit der Station der Central Line zu vermeiden. Woher „Shepherd's Bush“ kommt, weiß niemand sicher."], "Sloane Square": ["Benannt nach Sir Hans Sloane, Arzt und Sammler.", "Er kaufte 1712 das Gut Chelsea. Seine riesige Sammlung von Büchern, Pflanzen und Kuriositäten wurde nach seinem Tod 1753 zum Grundstock des British Museum."], "Snaresbrook": ["Woher „Snaresbrook“ kommt, weiß niemand sicher.", "Es könnte eine veränderte Form von „Sayers Brook“ sein, einem kleinen Bach, der in den Roding mündet. Der Bahnhof wurde 1856 eröffnet und hieß viele Jahre Snaresbrook & Wanstead."], "South Ealing": ["„Ealing“ bedeutet die Leute eines Sachsen namens Gilla.", "Der Name wurde um 700 als Gillingas erwähnt. Die Station South Ealing wurde 1883 eröffnet."], "South Harrow": ["„Harrow“ kommt von altenglisch hearg, ein heidnischer Tempel oder Schrein.", "Bevor die Häuser gebaut wurden, gab es hier nur Felder und den alten Weiler Roxeth. Die Station wurde 1903 eröffnet."], "South Kensington": ["Benannt nach Kensington, dem Hof eines Sachsen namens Cynesige.", "Das Viertel wuchs nach der Weltausstellung von 1851, deren Gewinn die Museen und Hochschulen hier finanzierte. Ein langer Tunnel führt von der Station zu den Museen."], "South Kenton": ["„Kenton“ bedeutet wahrscheinlich der Hof eines Mannes namens Coena.", "Der Name endet auf altenglisch tūn, Hof oder Siedlung. Die Station South Kenton wurde 1933 für neue Wohnhäuser eröffnet."], "South Ruislip": ["Benannt nach Ruislip, der Sprungstelle, an der Binsen wachsen.", "Die Station wurde 1908 als Northolt Junction eröffnet und heißt erst seit 1947 South Ruislip. Die Central Line kam 1948."], "South Wimbledon": ["Benannt nach Wimbledon, obwohl die Station eigentlich in Merton liegt.", "„Wimbledon“ bedeutet wahrscheinlich der Hügel eines Mannes namens Wynnmann. Viele Jahre hieß die Station South Wimbledon (Merton), um das klarzustellen."], "South Woodford": ["„Woodford“ bedeutet die Furt beim Wald.", "Die Furt führte durch den Fluss Roding. Der Bahnhof wurde 1856 als George Lane eröffnet, nach der Straße davor. 1947, als die Central Line kam, wurde er zu South Woodford."], "Southfields": ["Benannt nach den südlichen Feldern von Wandsworth, jahrhundertelang Ackerland.", "Sie wurden im 13. Jahrhundert erstmals erwähnt und blieben Felder bis etwa 1900. Während des Tennisturniers von Wimbledon ist dies die Station für die Plätze."], "Southgate": ["Benannt nach dem Südtor zum königlichen Jagdgebiet
