to Charles Canning, Viceroy of India, but the name was in use before he became famous. Others suggest his father, Prime Minister George Canning, or a local firm called Canning.", "links": [{"t": "Canning Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canning_Town"}, {"t": "Canning Town station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canning_Town_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.513584, 0.008322]]}, "Cannon Street": {"name": "Cannon Street", "q": "City of London", "zone": "1", "head": "'Cannon' has nothing to do with guns: it comes from candle-makers.", "text": "In the Middle Ages this was Candelwrichtestrete, the street of the candle-wrights. Over time the name was shortened to Cannon Street.", "links": [{"t": "Cannon Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cannon_Street"}, {"t": "Cannon Street station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cannon_Street_station%23London_Underground"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.51151, -0.090432]]}, "Canonbury": {"name": "Canonbury", "q": "Islington", "zone": "2", "head": "'Canonbury' means the manor of the canons.", "text": "The canons of St Bartholomew's Priory held the land in the Middle Ages. Canonbury Tower, built in the 16th century, still stands.", "links": [{"t": "Canonbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canonbury"}, {"t": "Canonbury railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canonbury_railway_station"}], "ll": [[51.548732, -0.092191]]}, "Canons Park": {"name": "Canons Park", "q": "Harrow", "zone": "5", "head": "Named after the canons of St Bartholomew's Priory, who owned land here.", "text": "After Henry VIII closed the priory, the estate passed to private owners. In the early 18th century the Duke of Chandos built a grand house here called Cannons, which was pulled down in 1747. Its grounds became Canons Park.", "links": [{"t": "Canons Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canons_Park"}, {"t": "Canons Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Canons_Park_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.607701, -0.294693]]}, "Carpenders Park": {"name": "Carpenders Park", "q": "Hertfordshire", "zone": "7", "head": "Named after Carpenders Park, a country estate with a manor house.", "text": "The area stayed rural until houses and bungalows were built in the 1930s. More homes followed in the 1950s.", "links": [{"t": "Carpenders Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Carpenders_Park"}, {"t": "Carpenders Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Carpenders_Park_railway_station"}], "ll": [[51.628351, -0.385939]]}, "Chadwell Heath": {"name": "Chadwell Heath", "q": "Redbridge", "zone": "5", "head": "'Chadwell' means the cold spring.", "text": "It was recorded in 1254 as Chaudewell, from Old English ceald, cold, and wella, spring. The heath beside it was open common land.", "links": [{"t": "Chadwell Heath", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chadwell_Heath"}, {"t": "Chadwell Heath railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chadwell_Heath_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.568039, 0.128958]]}, "Chalfont & Latimer": {"name": "Chalfont & Latimer", "q": "Buckinghamshire", "zone": "8", "head": "Named after the villages of Chalfont and Latimer.", "text": "'Chalfont' probably means the chalk stream, from Old English cealc funta. Latimer is named after the Latimer family, who held the land from the early 14th century. The station was called Chalfont Road until 1915.", "links": [{"t": "Little Chalfont", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Little_Chalfont"}, {"t": "Latimer, Buckinghamshire", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Latimer,_Buckinghamshire"}, {"t": "Chalfont & Latimer station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chalfont_&_Latimer_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.667985, -0.560689]]}, "Chalk Farm": {"name": "Chalk Farm", "q": "Camden", "zone": "2", "head": "'Chalk' has nothing to do with chalk: the name comes from Chalcot Farm.", "text": "Chalcot may come from Old English words for 'cold cottages'. The farm was a local landmark about 200 years ago.", "links": [{"t": "Chalk Farm", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chalk_Farm"}, {"t": "Chalk Farm tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chalk_Farm_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.544118, -0.153388]]}, "Chancery Lane": {"name": "Chancery Lane", "q": "City of London", "zone": "1", "head": "Named after the Chancery, a royal office and court of medieval England.", "text": "The Chancery kept the king's records and dealt with matters of fairness in law. The lane is still at the heart of legal London, near the Inns of Court.", "links": [{"t": "Chancery Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chancery_Lane"}, {"t": "Chancery Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chancery_Lane_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.518247, -0.111583]]}, "Charing Cross": {"name": "Charing Cross", "q": "Westminster", "zone": "1", "head": "'Charing' probably means a bend, and the Cross is a memorial to a queen.", "text": "The name may come from Old English cierring, a turning, perhaps the bend in the Thames. Edward I put up a cross here for his wife Eleanor, who died in 1290. A Victorian copy stands in front of the main line station.", "links": [{"t": "Charing Cross", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Charing_Cross"}, {"t": "Eleanor cross", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Eleanor_cross"}, {"t": "Charing Cross tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Charing_Cross_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.50741, -0.127277]]}, "Chesham": {"name": "Chesham", "q": "Buckinghamshire", "zone": "9", "head": "'Chesham' means the river meadow by a heap of stones.", "text": "It was recorded about a century before the Norman Conquest as Cæstæleshamm. Chesham is the end of a single-track branch of the Metropolitan line.", "links": [{"t": "Chesham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chesham"}, {"t": "Chesham tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chesham_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.705208, -0.611247]]}, "Cheshunt": {"name": "Cheshunt", "q": "Hertfordshire", "zone": "8", "head": "'Cheshunt' probably means the spring by the old Roman fort.", "text": "It probably comes from Old English ceaster, a Roman fort or town, and funta, a spring. The Domesday Book of 1086 records it as Cestrehunt.", "links": [{"t": "Cheshunt", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cheshunt"}, {"t": "Cheshunt railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cheshunt_railway_station"}], "ll": [[51.702876, -0.02396]]}, "Chigwell": {"name": "Chigwell", "q": "Epping Forest", "zone": "4", "head": "Nobody is quite sure what 'Chigwell' means.", "text": "It may be the well or spring of a man called Cicca, or it may come from a different word altogether. The village sits on the edge of Epping Forest.", "links": [{"t": "Chigwell", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chigwell"}, {"t": "Chigwell tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chigwell_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.617916, 0.075041]]}, "Chingford": {"name": "Chingford", "q": "Waltham Forest", "zone": "5", "head": "Chingford is named after an old ford, but nobody is sure what 'Ching' means.", "text": "The idea of a 'shingle ford' is now doubted; the ford may have crossed the River Ching or the Lea. On the edge of Epping Forest stands Queen Elizabeth's Hunting Lodge, built for Henry VIII in 1543.", "links": [{"t": "Chingford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chingford"}, {"t": "Queen Elizabeth's Hunting Lodge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Queen_Elizabeth's_Hunting_Lodge"}, {"t": "Chingford railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chingford_railway_station"}], "ll": [[51.633087, 0.009897]]}, "Chiswick Park": {"name": "Chiswick Park", "q": "Ealing", "zone": "3", "head": "'Chiswick' means the cheese farm.", "text": "The Old English name points to a farm making cheese near the Thames. The station opened in 1879 as Acton Green and became Chiswick Park in 1910.", "links": [{"t": "Chiswick", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chiswick"}, {"t": "Chiswick Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chiswick_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.494627, -0.267972]]}, "Chorleywood": {"name": "Chorleywood", "q": "Hertfordshire", "zone": "7", "head": "'Chorley' probably means a clearing of the ceorls, free peasants.", "text": "Ceorl is the Old English word that gave us 'churl'. The 'wood' part needs no explanation. The station was called Chorley Wood, in two words, until 1965.", "links": [{"t": "Chorleywood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chorleywood"}, {"t": "Chorleywood station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chorleywood_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.654358, -0.518461]]}, "Clapham Common": {"name": "Clapham Common", "q": "Lambeth", "zone": "2", "head": "Named after Clapham's common, a large open space.", "text": "'Clapham' probably means the homestead near a hill or hillock, from Old English clopp; another idea is a man called Cloppa. The common was once rough grazing land and is now a public park.", "links": [{"t": "Clapham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham"}, {"t": "Clapham Common", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_Common"}, {"t": "Clapham Common tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_Common_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.461742, -0.138317]]}, "Clapham High Street": {"name": "Clapham High Street", "q": "Lambeth", "zone": "2", "head": "Named after Clapham's high street; 'Clapham' probably means the homestead near a hill.", "text": "The Old English name may come from clopp, a lump or hillock. The station was called Clapham until 1989.", "links": [{"t": "Clapham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham"}, {"t": "Clapham High Street railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_High_Street_railway_station"}], "ll": [[51.465481, -0.132522]]}, "Clapham Junction": {"name": "Clapham Junction", "q": "Wandsworth", "zone": "", "head": "Named after Clapham, though the station is actually in Battersea.", "text": "When it opened in 1863, Clapham was the smarter-sounding name. It is one of the busiest railway stations in Europe by number of trains.", "links": [{"t": "Clapham Junction", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_Junction"}, {"t": "Clapham Junction railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_Junction_railway_station"}], "ll": [[51.464187, -0.170221]]}, "Clapham North": {"name": "Clapham North", "q": "Lambeth", "zone": "2", "head": "Named after Clapham, probably the homestead near a hill.", "text": "The Old English name may come from clopp, a lump or hillock, or from a man called Cloppa. This station opened in 1900 as Clapham Road and was renamed Clapham North in 1926.", "links": [{"t": "Clapham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham"}, {"t": "Clapham North tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_North_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.465135, -0.130016]]}, "Clapham South": {"name": "Clapham South", "q": "Wandsworth", "zone": "2/3", "head": "Named after Clapham, probably the homestead near a hill.", "text": "It opened in 1926; 'Nightingale Lane' had been considered as its name. Under the station is one of eight deep-level shelters built during the Second World War.", "links": [{"t": "Clapham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham"}, {"t": "Clapham South tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapham_South_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.452654, -0.147582]]}, "Clapton": {"name": "Clapton", "q": "Hackney", "zone": "2/3", "head": "'Clapton' means the farm on a hill.", "text": "It comes from Old English clopp, a lump or hill, and tūn, farm. The area runs down to the River Lea and the Hackney Marshes.", "links": [{"t": "Clapton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapton,_London"}, {"t": "Clapton railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Clapton_railway_station"}], "ll": [[51.561644, -0.057025]]}, "Cockfosters": {"name": "Cockfosters", "q": "Enfield", "zone": "5", "head": "Nobody knows for sure where 'Cockfosters' comes from.", "text": "It is first recorded in the 16th century. A popular idea is that it was the home of the 'cock forester', the chief forester of the royal hunting ground of Enfield Chase.", "links": [{"t": "Cockfosters", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cockfosters"}, {"t": "Cockfosters tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cockfosters_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.65152, -0.149171]]}, "Colindale": {"name": "Colindale", "q": "Barnet", "zone": "4", "head": "The name is thought to recall the Collin family, landowners in the 16th century.", "text": "Colindale was farmland until the 20th century; it is now home to the RAF Museum on the site of Hendon aerodrome.", "links": [{"t": "Colindale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Colindale"}, {"t": "Colindale tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Colindale_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.595424, -0.249919]]}, "Colliers Wood": {"name": "Colliers Wood", "q": "Merton", "zone": "3", "head": "Named after a wood used by colliers, or charcoal burners.", "text": "In the past a collier was someone who made charcoal, not a coal miner. The wood survived into the late 19th century.", "links": [{"t": "Colliers Wood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Colliers_Wood"}, {"t": "Colliers Wood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Colliers_Wood_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.41816, -0.178086]]}, "Covent Garden": {"name": "Covent Garden", "q": "Westminster", "zone": "1", "head": "'Covent' is an old form of 'convent'.", "text": "In the Middle Ages this was the garden of Westminster Abbey. The famous fruit and vegetable market began here in the 17th century and moved to Nine Elms in 1974.", "links": [{"t": "Covent Garden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Covent_Garden"}, {"t": "Covent Garden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Covent_Garden_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.513093, -0.124436]]}, "Crossharbour": {"name": "Crossharbour", "q": "Tower Hamlets", "zone": "2", "head": "The name refers to a crossing of Millwall Dock nearby.", "text": "For some years the station was called Crossharbour and London Arena, after a sports and concert hall that has since been demolished.", "links": [{"t": "Millwall Dock", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Millwall_Dock"}, {"t": "Crossharbour DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Crossharbour_DLR_station"}], "ll": [[51.495728, -0.014606]]}, "Crouch Hill": {"name": "Crouch Hill", "q": "Islington", "zone": "3", "head": "'Crouch' is an old word for a cross: the hill with a cross.", "text": "Middle English crouche meant cross, probably a wayside cross. The same word is in nearby Crouch End.", "links": [{"t": "Crouch Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Crouch_Hill"}, {"t": "Crouch Hill railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Crouch_Hill_railway_station"}], "ll": [[51.571302, -0.117149]]}, "Croxley": {"name": "Croxley", "q": "Hertfordshire", "zone": "7", "head": "'Croxley' probably means the clearing of a man called Crocc.", "text": "Leah, a clearing in a wood, is one of the most common endings in English place names. The station opened in 1925 as Croxley Green and was renamed Croxley in 1949.", "links": [{"t": "Croxley Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Croxley_Green"}, {"t": "Croxley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Croxley_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.647044, -0.441718]]}, "Crystal Palace": {"name": "Crystal Palace", "q": "Bromley", "zone": "3/4", "head": "Named after the Crystal Palace, the huge glass building of the Great Exhibition of 1851.", "text": "It was moved here from Hyde Park and reopened in 1854. It burnt down in 1936, but the Victorian dinosaur sculptures in the park survive.", "links": [{"t": "The Crystal Palace", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/The_Crystal_Palace"}, {"t": "Crystal Palace Dinosaurs", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Crystal_Palace_Dinosaurs"}, {"t": "Crystal Palace railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Crystal_Palace_railway_station"}], "ll": [[51.418109, -0.07261]]}, "Custom House": {"name": "Custom House", "q": "Newham", "zone": "3", "head": "Named after a custom house at the Royal Victoria Dock, where duty was paid on goods.", "text": "Ships unloading in the Royal Docks had their cargoes checked and taxed here. Today the station serves the ExCeL exhibition centre.", "links": [{"t": "Royal Victoria Dock", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Victoria_Dock"}, {"t": "Custom House railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Custom_House_railway_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.509769, 0.02673]]}, "Cutty Sark": {"name": "Cutty Sark", "q": "Greenwich", "zone": "2/3", "head": "Named after the Cutty Sark, a tea clipper of 1869, now a museum ship nearby.", "text": "'Cutty sark' is Scots for a short nightdress: the ship was named after the witch Nannie in Robert Burns's poem Tam o' Shanter, who wears one. Her figure is on the ship's bow.", "links": [{"t": "Cutty Sark", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cutty_Sark"}, {"t": "Cutty Sark DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cutty_Sark_DLR_station"}], "ll": [[51.481671, -0.01081]]}, "Cyprus": {"name": "Cyprus", "q": "Newham", "zone": "3", "head": "Named after the island of Cyprus, which came under British control in 1878.", "text": "Houses for workers at the Royal Docks and the Beckton gasworks were built here at the time, and the patriotic name stuck. Little remains of the old estate.", "links": [{"t": "Cyprus, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cyprus,_London"}, {"t": "Cyprus DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Cyprus_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.508473, 0.063925]]}, "Dagenham East": {"name": "Dagenham East", "q": "Barking and Dagenham", "zone": "5", "head": "'Dagenham' means the homestead of a Saxon called Dæcca.", "text": "It was first written down in 666 as Dæccanhaam, in a charter of Barking Abbey. The station opened in 1885 as Dagenham, District trains came in 1902, and it became Dagenham East in 1949.", "links": [{"t": "Dagenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dagenham"}, {"t": "Dagenham East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dagenham_East_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.544096, 0.166017]]}, "Dagenham Heathway": {"name": "Dagenham Heathway", "q": "Barking and Dagenham", "zone": "5", "head": "Named after Dagenham and the Heathway, the road to Becontree Heath.", "text": "Dagenham means the homestead of a Saxon called Dæcca. The station opened in 1932 as plain Heathway, to serve the new Becontree estate, and added 'Dagenham' in 1949.", "links": [{"t": "Dagenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dagenham"}, {"t": "Dagenham Heathway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dagenham_Heathway_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.541639, 0.147527]]}, "Dalston Junction": {"name": "Dalston Junction", "q": "Hackney", "zone": "2", "head": "'Dalston' means the farm of a man called Deorlaf.", "text": "It was recorded in 1294 as Derleston. The station closed in 1986 and reopened in 2010 for the new East London line.", "links": [{"t": "Dalston", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dalston"}, {"t": "Dalston Junction railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dalston_Junction_railway_station"}], "ll": [[51.546116, -0.075137]]}, "Dalston Kingsland": {"name": "Dalston Kingsland", "q": "Hackney", "zone": "2", "head": "'Kingsland' means the king's land.", "text": "It was recorded in 1395 as Kyngeslond, land owned by the king. Dalston means the farm of a man called Deorlaf.", "links": [{"t": "Kingsland, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kingsland,_London"}, {"t": "Dalston Kingsland railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dalston_Kingsland_railway_station"}], "ll": [[51.548148, -0.075701]]}, "Debden": {"name": "Debden", "q": "Epping Forest", "zone": "6", "head": "'Debden' means the deep valley.", "text": "The deep valley may be that of the River Roding. The station opened in 1865 on a railway line and was called Chigwell Lane until 1949, when the Central line took it over.", "links": [{"t": "Debden, Epping Forest", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Debden,_Epping_Forest"}, {"t": "Debden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Debden_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.645386, 0.083782]]}, "Denmark Hill": {"name": "Denmark Hill", "q": "Southwark", "zone": "2", "head": "Said to be named after Prince George of Denmark, husband of Queen Anne.", "text": "He is supposed to have had a house or hunted here around 1700. King's College Hospital is next to the station.", "links": [{"t": "Denmark Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Denmark_Hill"}, {"t": "Denmark Hill railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Denmark_Hill_railway_station"}], "ll": [[51.468203, -0.089361]]}, "Deptford Bridge": {"name": "Deptford Bridge", "q": "Greenwich", "zone": "2/3", "head": "'Deptford' means the deep ford.", "text": "The ford crossed the River Ravensbourne, later replaced by a bridge. Deptford was home to a royal dockyard founded by Henry VIII.", "links": [{"t": "Deptford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Deptford"}, {"t": "Deptford Bridge DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Deptford_Bridge_DLR_station"}], "ll": [[51.474215, -0.022438]]}, "Devons Road": {"name": "Devons Road", "q": "Tower Hamlets", "zone": "2", "head": "Named after Devons Road, the street beside the station.", "text": "Where the street's own name comes from is not recorded. The station opened with the first DLR line in 1987.", "links": [{"t": "Devons Road DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Devons_Road_DLR_station"}], "ll": [[51.522667, -0.017615]]}, "Dollis Hill": {"name": "Dollis Hill", "q": "Brent", "zone": "3", "head": "Nobody is quite sure where 'Dollis Hill' comes from.", "text": "One idea is a local family called Dalley. In the Second World War the Post Office Research Station here built Colossus, one of the first electronic computers, for the codebreakers at Bletchley Park. Churchill's emergency bunker, 'Paddock', is also nearby.", "links": [{"t": "Dollis Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dollis_Hill"}, {"t": "Dollis Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Dollis_Hill_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.551955, -0.239068]]}, "Ealing Broadway": {"name": "Ealing Broadway", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name, first recorded around 700 as Gillingas, slowly turned into Ylling and then Ealing. A 'broadway' is a wide main street, here the town's shopping street.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "Ealing Broadway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing_Broadway_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.515017, -0.301457]]}, "Ealing Common": {"name": "Ealing Common", "q": "Ealing", "zone": "3", "head": "Named after the common, a stretch of open grassland in Ealing.", "text": "'Ealing' means the people of a Saxon called Gilla. The station was called Ealing Common and West Acton for a time, from 1886 to 1910.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "Ealing Common tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing_Common_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.51014, -0.288265]]}, "Earl's Court": {"name": "Earl's Court", "q": "Kensington and Chelsea", "zone": "1/2", "head": "Named after the court of the Earls of Oxford, lords of the manor.", "text": "The de Vere family, Earls of Oxford, held the land from soon after the Norman Conquest for about 500 years. Their manor court, where local disputes were settled, stood near the station.", "links": [{"t": "Earls Court", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Earls_Court"}, {"t": "Earl's Court tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Earl's_Court_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.492063, -0.193378]]}, "East Acton": {"name": "East Acton", "q": "Hammersmith and Fulham", "zone": "2", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. East Acton was a separate hamlet east of the town, and its station opened in 1920.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "East Acton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Acton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.516612, -0.247248]]}, "East Finchley": {"name": "East Finchley", "q": "Barnet", "zone": "3", "head": "'Finchley' probably means the clearing where finches live.", "text": "It ends in Old English leah, a clearing in a wood. On the station stands a statue of an archer by Eric Aumonier, aiming his arrow towards central London.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "East Finchley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Finchley_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.587131, -0.165012]]}, "East Ham": {"name": "East Ham", "q": "Newham", "zone": "3/4", "head": "'Ham' means dry land in a river bend or between rivers.", "text": "The land here lies between the Thames, the Lea and the Roding. It was recorded about a century before the Normans as Hamme, and was split into East Ham and West Ham in Anglo-Saxon times.", "links": [{"t": "East Ham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Ham"}, {"t": "East Ham tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Ham_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.538948, 0.051186]]}, "East India": {"name": "East India", "q": "Tower Hamlets", "zone": "2/3", "head": "Named after the East India Docks, built in 1806 for the East India Company.", "text": "The company's big ships traded with India and China. The docks have been filled in, but parts of the old dock walls survive.", "links": [{"t": "East India Docks", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_India_Docks"}, {"t": "East India DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_India_DLR_station"}], "ll": [[51.509359, -0.002326]]}, "East Putney": {"name": "East Putney", "q": "Wandsworth", "zone": "2/3", "head": "'Putney' means the landing place of a man called Putta.", "text": "The Domesday Book of 1086 records it as Putelei. The landing place was on the Thames.", "links": [{"t": "Putney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney"}, {"t": "East Putney tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Putney_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.459205, -0.211]]}, "Eastcote": {"name": "Eastcote", "q": "Hillingdon", "zone": "5", "head": "'Eastcote' means the cottage or cottages to the east.", "text": "They lay east of Ruislip; Ascot, near Windsor, has the same origin. The walled garden and dovecote of Eastcote House survive, although the house itself was demolished in the 1960s.", "links": [{"t": "Eastcote", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Eastcote"}, {"t": "Eastcote tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Eastcote_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.576506, -0.397373]]}, "Edgware": {"name": "Edgware", "q": "Barnet", "zone": "5", "head": "'Edgware' probably means the fishing pool of a Saxon called Ecgi.", "text": "A 'wer' or weir was a pool or dam for catching fish. The Northern line reached Edgware in 1924 and was planned to go further, but the extension was never finished.", "links": [{"t": "Edgware", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware"}, {"t": "Edgware tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.613653, -0.274928]]}, "Edgware Road": {"name": "Edgware Road", "q": "Westminster", "zone": "1", "head": "Named after the road to Edgware, which follows the Roman Watling Street.", "text": "Edgware probably means the fishing pool of a Saxon called Ecgi. The road runs dead straight to the north-west, as Roman roads do.", "links": [{"t": "Edgware Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_Road"}, {"t": "Watling Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watling_Street"}, {"t": "Edgware Road tube station (Circle, District and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_Road_tube_station_(Circle,_District_and_Hammersmith_&_City_lines)"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.520299, -0.17015], [51.519858, -0.167832]]}, "Edmonton Green": {"name": "Edmonton Green", "q": "Enfield", "zone": "4", "head": "'Edmonton' means the farm of a man called Ēadhelm.", "text": "It is in the Domesday Book of 1086 as Adelmetone. The essayist Charles Lamb lived in Edmonton in his last years and is buried in the churchyard.", "links": [{"t": "Edmonton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edmonton,_London"}, {"t": "Edmonton Green railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edmonton_Green_railway_station"}], "ll": [[51.624929, -0.061112]]}, "Elephant & Castle": {"name": "Elephant & Castle", "q": "Southwark", "zone": "1/2", "head": "Most likely named after a coaching inn called the Elephant and Castle.", "text": "A popular story says the name comes from 'Infanta de Castile', a Spanish princess, but historians doubt it. An elephant carrying a castle was a common sign, used for example by the Cutlers' Company.", "links": [{"t": "Elephant and Castle", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elephant_and_Castle"}, {"t": "Elephant & Castle tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elephant_&_Castle_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.494536, -0.100606]]}, "Elm Park": {"name": "Elm Park", "q": "Havering", "zone": "6", "head": "The name was chosen in the 1930s for a new garden estate.", "text": "The estate was built on farmland between Hornchurch and Rainham, and the station opened in 1935 to serve it.", "links": [{"t": "Elm Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elm_Park"}, {"t": "Elm Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elm_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.549775, 0.19864]]}, "Elverson Road": {"name": "Elverson Road", "q": "Lewisham", "zone": "2/3", "head": "Named after Elverson Road, the street beside the station.", "text": "The origin of the street's name is not recorded. The station opened in 1999 on the DLR extension to Lewisham.", "links": [{"t": "Elverson Road DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elverson_Road_DLR_station"}], "ll": [[51.469074, -0.016728]]}, "Embankment": {"name": "Embankment", "q": "Westminster", "zone": "1", "head": "Named after the Victoria Embankment, built along the Thames in the 1860s.", "text": "Joseph Bazalgette built it to carry new sewers and the District Railway, and to create a riverside road. The station had many names with 'Charing Cross' in them before it became Embankment in 1976.", "links": [{"t": "Victoria Embankment", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Victoria_Embankment"}, {"t": "Embankment tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Embankment_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.507058, -0.122666]]}, "Emerson Park": {"name": "Emerson Park", "q": "Havering", "zone": "6", "head": "Named after an estate laid out from 1895 by the developer William Carter.", "text": "The name is said to come from Carter's son, Emerson. The station opened in 1909 to serve the new houses.", "links": [{"t": "Emerson Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Emerson_Park"}, {"t": "Emerson Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Emerson_Park_railway_station"}], "ll": [[51.568642, 0.220113]]}, "Enfield Town": {"name": "Enfield Town", "q": "Enfield", "zone": "5", "head": "'Enfield' means the open land of a man called Ēana, or where lambs were reared.", "text": "It comes from Old English feld, open country. In 1967 the world's first cash machine was installed at a bank in Enfield.", "links": [{"t": "Enfield Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Enfield_Town"}, {"t": "Enfield Town railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Enfield_Town_railway_station"}], "ll": [[51.652026, -0.079328]]}, "Epping": {"name": "Epping", "q": "Epping Forest", "zone": "6", "head": "'Epping' probably means the people of the upland.", "text": "It is in the Domesday Book of 1086 as Eppinges. The great forest nearby takes its name from the town, not the other way round.", "links": [{"t": "Epping", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Epping"}, {"t": "Epping tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Epping_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.69368, 0.113767]]}, "Euston": {"name": "Euston", "q": "Camden", "zone": "1", "head": "Named after Euston Hall in Suffolk, home of the Dukes of Grafton.", "text": "The dukes owned the land here, and Euston Road and Euston Square took the name of their country house. The Suffolk village of Euston probably means the farm of a man called Efe.", "links": [{"t": "Euston Hall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Hall"}, {"t": "Euston tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.527999, -0.133785]]}, "Euston Square": {"name": "Euston Square", "q": "Camden", "zone": "1", "head": "Named after Euston Square, the garden square near the main line station.", "text": "The name comes from Euston Hall in Suffolk, home of the Dukes of Grafton, who owned the land. The station opened in 1863 as Gower Street and was renamed in 1909.", "links": [{"t": "Euston Hall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Hall"}, {"t": "Euston Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Square_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.525604, -0.135829]]}, "Fairlop": {"name": "Fairlop", "q": "Redbridge", "zone": "4", "head": "Named after the Fairlop Oak, a giant tree in Hainault Forest.", "text": "From the early 18th century a fair was held every summer under the oak, started by a local man, Daniel Day. The tree was damaged by fire and blew down in the early 19th century.", "links": [{"t": "Fairlop", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fairlop"}, {"t": "Fairlop tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fairlop_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.595618, 0.091004]]}, "Farringdon": {"name": "Farringdon", "q": "Islington", "zone": "1", "head": "Named after Nicholas and William de Faringdon, aldermen of the City.", "text": "In 1279 the family bought the right to run this City ward, and their name passed to the ward, a street and the station. Farringdon was one of the first stations of the world's first underground railway, opened in 1863.", "links": [{"t": "Farringdon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Farringdon,_London"}, {"t": "Farringdon station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Farringdon_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.520252, -0.104913]]}, "Finchley Central": {"name": "Finchley Central", "q": "Barnet", "zone": "4", "head": "'Finchley' probably means the clearing where finches live.", "text": "The station opened in 1867 as Finchley and Hendon. It became Finchley (Church End) in 1894 and Finchley Central in 1940.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "Finchley Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Central_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.600921, -0.192527]]}, "Finchley Road": {"name": "Finchley Road", "q": "Camden", "zone": "2", "head": "Named after the road to Finchley, built as a turnpike from 1826.", "text": "Finchley probably means the clearing where finches live. The new road avoided the steep hills of Hampstead further east.", "links": [{"t": "Finchley Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Road"}, {"t": "Finchley Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Road_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.546825, -0.179845]]}, "Finchley Road & Frognal": {"name": "Finchley Road & Frognal", "q": "Camden", "zone": "2", "head": "'Frognal' means the nook where frogs live.", "text": "It comes from Old English frogga, frog, and healh, a nook. Finchley Road was built from 1826 as a new road to Finchley.", "links": [{"t": "Frognal", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Frognal"}, {"t": "Finchley Road & Frognal railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Road_&_Frognal_railway_station"}], "ll": [[51.550266, -0.183141]]}, "Finsbury Park": {"name": "Finsbury Park", "q": "Islington", "zone": "2", "head": "Named after a park opened in 1869, though it is not in Finsbury.", "text": "The park was planned for the people of the old borough of Finsbury, further south. 'Finsbury' probably means the manor of a man called Finn.", "links": [{"t": "Finsbury Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finsbury_Park"}, {"t": "Finsbury Park station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finsbury_Park_station%23London_Underground"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.564158, -0.106825]]}, "Forest Gate": {"name": "Forest Gate", "q": "Newham", "zone": "3", "head": "Named after a gate that kept animals from straying out of Epping Forest.", "text": "Cattle grazing in the forest could wander onto the main road to Romford, so a gate was put across a side road, today's Woodford Road. It was removed in 1881, but the name stayed.", "links": [{"t": "Forest Gate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Forest_Gate"}, {"t": "Forest Gate railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Forest_Gate_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.549432, 0.024353]]}, "Forest Hill": {"name": "Forest Hill", "q": "Lewisham", "zone": "3", "head": "Named after the Great North Wood, which once covered the hill.", "text": "The wood stretched across the hills of south London. Forest Hill is home to the Horniman Museum.", "links": [{"t": "Forest Hill, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Forest_Hill,_London"}, {"t": "Forest Hill railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Forest_Hill_railway_station"}], "ll": [[51.43928, -0.053157]]}, "Fulham Broadway": {"name": "Fulham Broadway", "q": "Hammersmith and Fulham", "zone": "2", "head": "'Fulham' means the riverside land of a man called Fulla.", "text": "It was recorded as Fulanham around 700. The station opened in 1880 as Walham Green, after the local village green, and was renamed Fulham Broadway in 1952.", "links": [{"t": "Fulham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fulham"}, {"t": "Fulham Broadway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fulham_Broadway_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.480081, -0.195422]]}, "Gallions Reach": {"name": "Gallions Reach", "q": "Newham", "zone": "3", "head": "Named after a stretch of the Thames, recalling the Galyon family.", "text": "The family owned property by the river in the 14th century. Rudyard Kipling mentions Gallions in his 1890 novel The Light that Failed.", "links": [{"t": "Gallions Reach", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gallions_Reach"}, {"t": "Gallions Reach DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gallions_Reach_DLR_station"}, {"t": "How the Royal Docks' 12 DLR stations got their names", "s": "Royal Docks", "u": "https://royaldocks.london/articles/how-the-royal-docks-12-dlr-stations-got-their-names"}], "ll": [[51.508941, 0.071555]]}, "Gants Hill": {"name": "Gants Hill", "q": "Redbridge", "zone": "4", "head": "Probably named after the le Gant family, stewards of Barking Abbey's lands.", "text": "The family is recorded here from the 13th century. The station, opened in 1947, has a long vaulted hall between the platforms, inspired by the Moscow Metro.", "links": [{"t": "Gants Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gants_Hill"}, {"t": "Gants Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gants_Hill_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.576544, 0.066185]]}, "Gidea Park": {"name": "Gidea Park", "q": "Havering", "zone": "6", "head": "Named after Gidea Hall, a mansion first recorded in the 13th century.", "text": "The name may mean 'the giddy or foolish hall', perhaps for an odd-looking building. In 1910–11 a garden suburb was built here, with a competition for the best-designed houses.", "links": [{"t": "Gidea Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gidea_Park"}, {"t": "Gidea Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gidea_Park_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.581904, 0.205964]]}, "Gloucester Road": {"name": "Gloucester Road", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Maria, Duchess of Gloucester, who built a house here in 1805.", "text": "Before that the road was called Hog Moore Lane. The station opened in 1868 as Brompton (Gloucester Road).", "links": [{"t": "Gloucester Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gloucester_Road"}, {"t": "Gloucester Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gloucester_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.494316, -0.182658]]}, "Golders Green": {"name": "Golders Green", "q": "Barnet", "zone": "3", "head": "Probably named after the Godyere family, who lived here in the 14th century.", "text": "The green was open land next to their property. The village grew quickly after the Underground arrived in 1907.", "links": [{"t": "Golders Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Golders_Green"}, {"t": "Golders Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Golders_Green_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.572259, -0.194039]]}, "Goldhawk Road": {"name": "Goldhawk Road", "q": "Hammersmith and Fulham", "zone": "2", "head": "Probably named after John Goldhawk, a landowner in the 14th century.", "text": "He held a large amount of land in the area, then part of the parish of Fulham. The station opened in 1914.", "links": [{"t": "Goldhawk Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goldhawk_Road"}, {"t": "Goldhawk Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goldhawk_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.502005, -0.226715]]}, "Goodge Street": {"name": "Goodge Street", "q": "Camden", "zone": "1", "head": "Named after John Goodge, who gained the land in 1718.", "text": "Before the houses were built it was a meadow called Crab Tree Field. His sons built on it from about 1746. The station opened in 1907 as Tottenham Court Road and was renamed Goodge Street a year later.", "links": [{"t": "Goodge Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodge_Street"}, {"t": "Goodge Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodge_Street_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.520599, -0.134361]]}, "Goodmayes": {"name": "Goodmayes", "q": "Redbridge", "zone": "4", "head": "Probably named after John Godemay, a 14th-century landowner.", "text": "His family's name survived as the name of a farm. The station opened in 1901, and the houses around it followed.", "links": [{"t": "Goodmayes", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodmayes"}, {"t": "Goodmayes railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodmayes_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.565579, 0.110807]]}, "Gospel Oak": {"name": "Gospel Oak", "q": "Camden", "zone": "2", "head": "Named after an oak tree where the gospel was read at the parish boundary.", "text": "When people walked the boundary of the parish each year, 'beating the bounds', they stopped under the tree to read from the Bible. It marked the border between Hampstead and St Pancras.", "links": [{"t": "Gospel Oak", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gospel_Oak"}, {"t": "Gospel Oak railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gospel_Oak_railway_station"}], "ll": [[51.555335, -0.15077]]}, "Grange Hill": {"name": "Grange Hill", "q": "Epping Forest", "zone": "4", "head": "A 'grange' was a farm with barns, often belonging to a monastery.", "text": "This one stood on a hill. The name has no link with the children's TV series Grange Hill.", "links": [{"t": "Grange Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Grange_Hill"}, {"t": "Grange Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Grange_Hill_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.613378, 0.092066]]}, "Great Portland Street": {"name": "Great Portland Street", "q": "Westminster", "zone": "1", "head": "Named after the street, which honours the Dukes of Portland.", "text": "The land came to the Dukes when the 2nd Duke married its heiress in 1734. The station opened in 1863 as Portland Road.", "links": [{"t": "Great Portland Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Great_Portland_Street"}, {"t": "Great Portland Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Great_Portland_Street_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.52384, -0.144262]]}, "Green Park": {"name": "Green Park", "q": "Westminster", "zone": "1", "head": "Named after the park, renamed The Green Park in 1746.", "text": "It was first called Upper St James's Park. The new name probably described its open grassland with few trees and no flower beds. The station opened in 1906 as Dover Street.", "links": [{"t": "Green Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Green_Park"}, {"t": "Green Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Green_Park_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [[51.506947, -0.142787]]}, "Greenford": {"name": "Greenford", "q": "Ealing", "zone": "4", "head": "'Greenford' means the green ford.", "text": "The ford crossed the River Brent. In 1857 William Perkin opened a factory here to make mauve, the first synthetic dye.", "links": [{"t": "Greenford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenford"}, {"t": "Greenford station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenford_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.542424, -0.34605]]}, "Greenwich": {"name": "Greenwich", "q": "Greenwich", "zone": "2/3", "head": "'Greenwich' means the green trading place or harbour.", "text": "It was first recorded in the early 10th century. Greenwich is home to the Royal Observatory and the prime meridian, the line of zero longitude that sets Greenwich Mean Time.", "links": [{"t": "Greenwich", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenwich"}, {"t": "Royal Observatory, Greenwich", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Royal_Observatory,_Greenwich"}, {"t": "Greenwich DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenwich_DLR_station"}], "ll": [[51.478087, -0.013673]]}, "Gunnersbury": {"name": "Gunnersbury", "q": "Hounslow", "zone": "3", "head": "'Gunnersbury' means the manor of a woman called Gunnhild.", "text": "Gunnhild is a Scandinavian name. A legend links it to a niece of King Canute, but there is no proof.", "links": [{"t": "Gunnersbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gunnersbury"}, {"t": "Gunnersbury station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gunnersbury_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [[51.491803, -0.275267]]}, "Hackney Central": {"name": "Hackney Central", "q": "Hackney", "zone": "2", "head": "'Hackney' means the island of a man called Haca.", "text": "The 'island' was dry raised ground in the marshes of the River Lea. It was recorded in 1198 as Hakeneia.", "links": [{"t": "Hackney Central", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Central"}, {"t": "Hackney Central railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Central_railway_station"}], "ll": [[51.547105, -0.056058]]}, "Hackney Downs": {"name": "Hackney Downs", "q": "Hackney", "zone": "2", "head": "Named after Hackney Downs, an open common in Hackney.", "text": "'Downs' means hill land. Hackney means the island of a man called Haca, a patch of dry ground in the marshes.", "links": [{"t": "Hackney Downs", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Downs"}, {"t": "Hackney Downs railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Downs_railway_station"}], "ll": [[51.548757, -0.060819]]}, "Hackney Wick": {"name": "Hackney Wick", "q": "Hackney", "zone": "2", "head": "'Wick' comes from Old English wīc, a farm or small settlement.", "text": "It was the part of Hackney beside the River Lea. Much of the London 2012 Olympic Park is next to it.", "links": [{"t": "Hackney Wick", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Wick"}, {"t": "Hackney Wick railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hackney_Wick_railway_station"}], "ll": [[51.54341, -0.02492]]}, "Haggerston": {"name": "Haggerston", "q": "Hackney", "zone": "2", "head": "'Haggerston' probably means the boundary stone of a man called Hærgod.", "text": "It is in the Domesday Book of 1086 as Hergotestane. A station first opened here in 1867; today's station opened in 2010.", "links": [{"t": "Haggerston", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Haggerston"}, {"t": "Haggerston railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Haggerston_railway_station"}], "ll": [[51.538705, -0.075666]]}, "Hainault": {"name": "Hainault", "q": "Redbridge", "zone": "4", "head": "'Hainault' probably means the wood of a religious community.", "text": "It was recorded in 1221 as Henehout, from Old English for a monastery wood, here belonging to Barking Abbey. The French-looking spelling came later, from a mistaken link with Philippa of Hainault, wife of Edward III.", "links": [{"t": "Hainault, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault,_London"}, {"t": "Hainault Forest", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault_Forest"}, {"t": "Hainault tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.603659, 0.093482]]}, "Hammersmith": {"name": "Hammersmith", "q": "Hammersmith and Fulham", "zone": "2", "head": "'Hammersmith' probably means a place with a hammer smithy, or forge.", "text": "It was first recorded in 1294. Another, less likely theory sees in it a landing place belonging to a man called Hammoder.", "links": [{"t": "Hammersmith", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hammersmith"}, {"t": "Hammersmith tube station (Circle and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hammersmith_tube_station_(Circle_and_Hammersmith_&_City_lines)"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.49339, -0.22503], [51.4923, -0.22362]]}, "Hampstead": {"name": "Hampstead", "q": "Camden", "zone": "2/3", "head": "'Hampstead' simply means homestead.", "text": "It comes from Old English hām-stede, like Berkhamsted and Wheathampstead. Hampstead station, opened in 1907, has the deepest platforms on the Underground.", "links": [{"t": "Hampstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead"}, {"t": "Hampstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.556239, -0.177464]]}, "Hampstead Heath": {"name": "Hampstead Heath", "q": "Camden", "zone": "2", "head": "Named after Hampstead Heath, one of London's largest open spaces.", "text": "'Hampstead' simply means homestead. The heath has bathing ponds and, on Parliament Hill, one of the best views over London.", "links": [{"t": "Hampstead Heath", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead_Heath"}, {"t": "Hampstead Heath railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead_Heath_railway_station"}], "ll": [[51.55521, -0.165705]]}, "Hanger Lane": {"name": "Hanger Lane", "q": "Ealing", "zone": "3", "head": "'Hanger' means a wooded slope.", "text": "It comes from Old English hangra, a wood on a steep hillside. The same word gives Hanger Hill nearby.", "links": [{"t": "Hanger Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanger_Lane"}, {"t": "Hanger Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanger_Lane_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [[51.530177, -0.292704]]}, "Hanwell": {"name": "Hanwell", "q": "Ealing", "zone": "4", "head": "'Hanwell' probably means the spring where cockerels or wild birds gather.", "text": "It was recorded in 959 as Hanewelle. Just west of the station is the Wharncliffe Viaduct, built by Isambard Kingdom Brunel for the Great Western Railway and opened in 1838.", "links": [{"t": "Hanwell", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanwell"}, {"t": "Wharncliffe Viaduct", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wharncliffe_Viaduct"}, {"t": "Hanwell railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanwell_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.511835, -0.338583]]}, "Harlesden": {"name": "Harlesden", "q": "Brent", "zone": "3", "head": "'Harlesden' means the farm of a man called Heoruwulf.", "text": "It is recorded in the Domesday Book of 1086 as Herulvestune, with -tune meaning a farm. Bakerloo trains have called here since 1917.", "links": [{"t": "Harlesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harlesden"}, {"t": "Harlesden station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harlesden_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.53631, -0.257883]]}, "Harold Wood": {"name": "Harold Wood", "q": "Havering", "zone": "6", "head": "Named after King Harold, who held land here before 1066.", "text": "Harold II was killed at the Battle of Hastings in 1066. His name survived in the wood, recorded in the 13th century as Horoldeswode.", "links": [{"t": "Harold Wood", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harold_Wood"}, {"t": "Harold Wood railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harold_Wood_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.592766, 0.233129]]}, "Harringay Green Lanes": {"name": "Harringay Green Lanes", "q": "Haringey", "zone": "3", "head": "'Harringay' means the enclosure of a man called Hæring.", "text": "The same name gave Haringey and Hornsey, three spellings of one old word. Green Lanes was probably an old drovers' road for taking cattle to London.", "links": [{"t": "Harringay", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harringay"}, {"t": "Harringay Green Lanes railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harringay_Green_Lanes_railway_station"}], "ll": [[51.577182, -0.098144]]}, "Harrow & Wealdstone": {"name": "Harrow & Wealdstone", "q": "Harrow", "zone": "5", "head": "Named after Harrow and Wealdstone, the boundary stone of Harrow Weald.", "text": "'Harrow' comes from Old English hearg, a heathen temple. 'Weald' means woodland, and the stone marked the edge of the woods north of Harrow. The station opened in 1837 on the London and Birmingham Railway.", "links": [{"t": "Wealdstone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wealdstone"}, {"t": "Harrow & Wealdstone station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow_&_Wealdstone_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [[51.592268, -0.335217]]}, "Harrow-on-the-Hill": {"name": "Harrow-on-the-Hill", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on top of the hill, where St Mary's Church stands today. The station opened in 1880 as Harrow and added 'on-the-Hill' in 1894.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "Harrow-on-the-Hill station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow-on-the-Hill_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.579195, -0.337225]]}, "Hatch End": {"name": "Hatch End", "q": "Harrow", "zone": "6", "head": "'Hatch End' means the district by the gate.", "text": "A hatch was a gate, probably into Pinner Park, a medieval deer park. Isabella Beeton, author of the famous Book of Household Management, lived here around 1860.", "links": [{"t": "Hatch End", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatch_End"}, {"t": "Hatch End railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatch_End_railway_station"}], "ll": [[51.609417, -0.368601]]}, "Hatton Cross": {"name": "Hatton Cross", "q": "Hillingdon", "zone": "5/6", "head": "'Hatton' means the farm on the heath.", "text": "The heath was Hounslow Heath, where Heathrow Airport now stands. 'Cross' probably refers to a crossroads.", "links": [{"t": "Hatton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatton,_London"}, {"t": "Hatton Cross tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatton_Cross_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.466747, -0.423191]]}, "Hayes & Harlington": {"name": "Hayes & Harlington", "q": "Hillingdon", "zone": "5", "head": "'Hayes' means land overgrown with brushwood; 'Harlington' the farm of Hygered's people.", "text": "Hayes comes from Old English hæs, brushwood. Harlington was recorded in 831 as Hygereding tun. Harlington now borders Heathrow Airport.", "links": [{"t": "Hayes, Hillingdon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hayes,_Hillingdon"}, {"t": "Harlington, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harlington,_London"}, {"t": "Hayes & Harlington railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hayes_&_Harlington_railway_station"}, {"t": "How the Elizabeth line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-elizabeth-line-stations-got-their-names"}], "ll": [[51.503096, -0.420683]]}, "Headstone Lane": {"name": "Headstone Lane", "q": "Harrow", "zone": "5", "head": "Named after Headstone Manor, a moated manor house nearby.", "text": "Its oldest part dates from the 14th century, making it one of the oldest timber buildings in the area. It is now the museum of Harrow.", "links": [{"t": "Headstone Manor", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Headstone_Manor"}, {"t": "Headstone Lane railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Headstone_Lane_railway_station"}], "ll": [[51.602649, -0.35722]]}, "Heathrow Terminal 4": {"name": "Heathrow Terminal 4", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "It was first recorded in 1410 as La Hetherewe, a hamlet on Hounslow Heath. Terminal 4 opened in 1986, with its own station on a loop of the Piccadilly line.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminal 4 tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminal_4_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.458524, -0.445771]]}, "Heathrow Terminal 5": {"name": "Heathrow Terminal 5", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "The hamlet, first recorded in 1410, disappeared when the airport was built in the 1940s. Terminal 5 and its station opened in 2008.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminal 5 station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminal_5_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.470052, -0.49056]]}, "Heathrow Terminals 2 & 3": {"name": "Heathrow Terminals 2 & 3", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "The station opened in 1977 as Heathrow Central. It became Heathrow Terminals 2 & 3 in 2016, after Terminal 1 closed.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminals 2 & 3 tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminals_2_&_3_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [[51.471235, -0.452265], [51.471987, -0.454788]]}, "Hendon Central": {"name": "Hendon Central", "q": "Barnet", "zone": "3/4", "head": "'Hendon' means at the high hill.", "text": "It was recorded as Hendun before the Domesday Book of 1086. The station opened in 1923.", "links": [{"t": "Hendon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hendon"}, {"t": "Hendon Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hendon_Central_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.583301, -0.226424]]}, "Heron Quays": {"name": "Heron Quays", "q": "Tower Hamlets", "zone": "2", "head": "Named after Heron Quays, a group of quays on the old West India Docks.", "text": "The quays were rebuilt in the 1980s as offices, beside Canary Wharf. The station opened with the first DLR line in 1987.", "links": [{"t": "West India Docks", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/West_India_Docks"}, {"t": "Heron Quays DLR station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heron_Quays_DLR_station"}], "ll": [[51.503379, -0.021421]]}, "High Barnet": {"name": "High Barnet", "q": "Barnet", "zone": "5", "head": "'Barnet' means land cleared by burning.", "text": "It comes from Old English bærnet, burning. The town is also called Chipping Barnet, 'chipping' meaning a market. In 1471 the Battle of Barnet, part of the Wars of the Roses, was fought just north of the town.", "links": [{"t": "Chipping Barnet", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chipping_Barnet"}, {"t": "High Barnet tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/High_Barnet_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.650541, -0.194298]]}, "High Street Kensington": {"name": "High Street Kensington", "q": "Kensington and Chelsea", "zone": "1", "head": "'Kensington' means the farm of a Saxon called Cynesige.", "text": "It is in the Domesday Book as Chenesitun. The station opened in 1868 on Kensington High Street, near Kensington Palace.", "links": [{"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "High Street Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/High_Street_Kensington_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [[51.501055, -0.192792]]}, "Highams Park": {"name": "Highams Park", "q": "Waltham Forest", "zone": "4", "head": "Named after the park of Highams, an 18th-century mansion.", "text": "'Higham' means the high homestead. The grounds were landscaped by Humphry Repton in the 1790s.", "links": [{"t": "Highams Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highams_Park"}, {"t": "Highams Park railway station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highams_Park_railway_station"}], "ll": [[51.60835, -0.000222]]}, "Highbury & Islington": {"name": "Highbury & Islington", "q": "Islington", "zone": "2", "head": "'Highbury' means the high manor; 'Islington' means the hill of a man called Gisla.", "text": "Islington was recorded around 1000 as Gislandune. Highbury manor stood on a hill above the other manors of the parish. The Victoria line station opened in 1968.", "links": [{"t": "Highbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highbury"}, {"t": "Islington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Islington"}, {"t": "Highbury & Islington station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highbury_&_Islington_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [[51.54635, -0.103324]]}, "Highgate": {"name": "Highgate", "q": "Haringey", "zone": "3", "head": "Named after a high gate on the hill, a toll gate on the road north.", "text": "The gate led into the Bishop of London's hunting park, and travellers on the Great North Road paid a toll here. Highgate is one of the highest points in London.", "links": [{"t": "Highgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highgate"}, {"t": "Highgate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highgate_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [[51.577532, -0.145857]]}, "Hillingdon": {"name": "Hillingdon", "q": "Hillingdon", "zone": "6", "head": "'Hillingdon' probably means the hill of a man called Hilla.", "text": "It is recorded in the Domesday Book of 1086 as Hillendone, with -done meaning a hill. The station opened in 1923.", "links": [{"t": "Hillingdon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hillingdon"}, {"t": "Hillingdon tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hillingdon_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [[51.553715, -0.449828]]}, "Holborn": {"name": "Holborn", "q": "Camden", "zone": "1", "head": "'Holborn' probably means the stream in the hollow.", "text": "The stream was probably the River Fleet itself, long since buried. Londoners traditionally say 'Hoe-bun'.", "links": [{"t": "Holborn", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holborn"}, {"t": "Holborn tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holborn_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/t
