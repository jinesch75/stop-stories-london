gdom Brunel"], "x": "Es nahm neue Abwasserkanäle und die District Railway auf und schuf eine Uferstraße."}}, {"id": "q22", "t": "quiz", "s": "Royal Oak", "g": [], "en": {"q": "Who hid in the oak tree at Boscobel in 1651, giving many pubs the name Royal Oak?", "a": "The future Charles II", "w": ["Henry VIII", "Oliver Cromwell", "Robin Hood"], "x": "He was hiding from Parliament's soldiers. A pub called the Royal Oak gave the station its name."}, "fr": {"q": "Qui se cacha dans le chêne de Boscobel en 1651, donnant à de nombreux pubs le nom de Royal Oak ?", "a": "Le futur Charles II", "w": ["Henri VIII", "Oliver Cromwell", "Robin des Bois"], "x": "Il se cachait des soldats du Parlement. Un pub appelé le Royal Oak a donné son nom à la station."}, "de": {"q": "Wer versteckte sich 1651 in der Eiche bei Boscobel, nach der viele Pubs Royal Oak heißen?", "a": "Der spätere Karl II.", "w": ["Heinrich VIII.", "Oliver Cromwell", "Robin Hood"], "x": "Er versteckte sich vor den Soldaten des Parlaments. Ein Pub namens Royal Oak gab der Station den Namen."}}, {"id": "q23", "t": "quiz", "s": "Colliers Wood", "g": [], "en": {"q": "In the past, what was a 'collier', as in Colliers Wood?", "a": "Someone who made charcoal", "w": ["A coal miner", "A ship's captain", "A seller of collars"], "x": "The wood used by the charcoal burners survived into the late 19th century."}, "fr": {"q": "Autrefois, qu'était un « collier », comme dans Colliers Wood ?", "a": "Quelqu'un qui fabriquait du charbon de bois", "w": ["Un mineur de charbon", "Un capitaine de navire", "Un vendeur de cols"], "x": "Le bois exploité par les charbonniers a subsisté jusqu'à la fin du XIXe siècle."}, "de": {"q": "Was war früher ein „collier“, wie in Colliers Wood?", "a": "Jemand, der Holzkohle herstellte", "w": ["Ein Bergmann", "Ein Schiffskapitän", "Ein Kragenhändler"], "x": "Der Wald der Köhler bestand bis ins späte 19. Jahrhundert."}}, {"id": "q24", "t": "quiz", "s": "Wembley Park", "g": [], "en": {"q": "What was started at Wembley Park in the 1890s but never finished?", "a": "A tower meant to rival the Eiffel Tower", "w": ["A canal to the Thames", "A cathedral", "A royal palace"], "x": "Wembley Stadium was later built on its site."}, "fr": {"q": "Qu'a-t-on commencé à Wembley Park dans les années 1890 sans jamais l'achever ?", "a": "Une tour censée rivaliser avec la tour Eiffel", "w": ["Un canal vers la Tamise", "Une cathédrale", "Un palais royal"], "x": "Le stade de Wembley fut construit plus tard à son emplacement."}, "de": {"q": "Was wurde in den 1890er-Jahren in Wembley Park begonnen, aber nie fertig?", "a": "Ein Turm als Konkurrenz zum Eiffelturm", "w": ["Ein Kanal zur Themse", "Eine Kathedrale", "Ein Königspalast"], "x": "Später entstand an seiner Stelle das Wembley-Stadion."}}, {"id": "q25", "t": "quiz", "s": "Queensbury", "g": [], "en": {"q": "The invented name Queensbury was chosen in the 1930s as a play on which neighbouring place?", "a": "Kingsbury", "w": ["Queensway", "Kingston", "Queen's Park"], "x": "Local people were asked for ideas, and Queensbury won."}, "fr": {"q": "Le nom inventé de Queensbury a été choisi dans les années 1930 en réponse à quelle localité voisine ?", "a": "Kingsbury", "w": ["Queensway", "Kingston", "Queen's Park"], "x": "On a demandé des idées aux habitants, et Queensbury l'a emporté."}, "de": {"q": "Der erfundene Name Queensbury wurde in den 1930er-Jahren als Gegenstück zu welchem Nachbarort gewählt?", "a": "Kingsbury", "w": ["Queensway", "Kingston", "Queen's Park"], "x": "Man fragte die Einheimischen nach Vorschlägen, und Queensbury gewann."}}, {"id": "q26", "t": "quiz", "s": "East Finchley", "g": [], "en": {"q": "What stands on East Finchley station, aiming towards central London?", "a": "A statue of an archer", "w": ["A statue of a finch", "A cannon", "A clock tower"], "x": "The archer is by the sculptor Eric Aumonier."}, "fr": {"q": "Qu'est-ce qui se dresse sur la station East Finchley, tourné vers le centre de Londres ?", "a": "La statue d'un archer", "w": ["La statue d'un pinson", "Un canon", "Une tour d'horloge"], "x": "L'archer est l'œuvre du sculpteur Eric Aumonier."}, "de": {"q": "Was steht auf der Station East Finchley und zielt Richtung Innenstadt?", "a": "Die Statue eines Bogenschützen", "w": ["Die Statue eines Finken", "Eine Kanone", "Ein Uhrturm"], "x": "Der Bogenschütze stammt vom Bildhauer Eric Aumonier."}}, {"id": "q27", "t": "quiz", "s": "Barons Court", "g": [], "en": {"q": "The invented name Barons Court was probably meant to pair with which nearby station?", "a": "Earl's Court", "w": ["King's Cross St Pancras", "Knightsbridge", "Queensway"], "x": "It was chosen around 1900 for new houses and has no known historical source."}, "fr": {"q": "Le nom inventé de Barons Court devait sans doute répondre à quelle station voisine ?", "a": "Earl's Court", "w": ["King's Cross St Pancras", "Knightsbridge", "Queensway"], "x": "Il a été choisi vers 1900 pour de nouveaux logements et n'a aucune origine historique connue."}, "de": {"q": "Zu welcher nahen Station sollte der erfundene Name Barons Court wohl passen?", "a": "Earl's Court", "w": ["King's Cross St Pancras", "Knightsbridge", "Queensway"], "x": "Er wurde um 1900 für neue Wohnhäuser gewählt und hat keine bekannte historische Grundlage."}}, {"id": "q28", "t": "quiz", "s": "Green Park", "g": [], "en": {"q": "What was Green Park called before it was renamed in 1746?", "a": "Upper St James's Park", "w": ["Hyde Park East", "The King's Meadow", "Piccadilly Gardens"], "x": "The new name probably described its open grassland with few trees and no flower beds."}, "fr": {"q": "Comment s'appelait Green Park avant d'être rebaptisé en 1746 ?", "a": "Upper St James's Park", "w": ["Hyde Park East", "The King's Meadow", "Piccadilly Gardens"], "x": "Le nouveau nom décrivait sans doute sa prairie dégagée, avec peu d'arbres et sans massifs de fleurs."}, "de": {"q": "Wie hieß der Green Park, bevor er 1746 umbenannt wurde?", "a": "Upper St James's Park", "w": ["Hyde Park East", "The King's Meadow", "Piccadilly Gardens"], "x": "Der neue Name beschrieb wohl seine offene Wiese mit wenigen Bäumen und ohne Blumenbeete."}}, {"id": "q29", "t": "quiz", "s": "King's Cross St Pancras", "g": ["george4"], "en": {"q": "Before King's Cross, what was this area called?", "a": "Battle Bridge", "w": ["Fleet Bridge", "Pancras Green", "Holborn Bar"], "x": "The name came from a crossing of the River Fleet. The 'king' was George IV, whose unpopular monument stood here."}, "fr": {"q": "Avant King's Cross, comment s'appelait ce quartier ?", "a": "Battle Bridge", "w": ["Fleet Bridge", "Pancras Green", "Holborn Bar"], "x": "Le nom venait d'un pont sur la Fleet. Le « roi » était George IV, dont le monument impopulaire se dressait ici."}, "de": {"q": "Wie hieß diese Gegend vor King's Cross?", "a": "Battle Bridge", "w": ["Fleet Bridge", "Pancras Green", "Holborn Bar"], "x": "Der Name kam von einer Brücke über den Fleet. Der „König“ war Georg IV., dessen unbeliebtes Denkmal hier stand."}}, {"id": "q30", "t": "quiz", "s": "Lambeth North", "g": [], "en": {"q": "What does the name 'Lambeth' mean?", "a": "The landing place for lambs", "w": ["The lambs' heath", "The lamb market", "The house of Lamb"], "x": "Hithe is an old word for a landing place on a river, as in Rotherhithe."}, "fr": {"q": "Que signifie le nom « Lambeth » ?", "a": "Le débarcadère des agneaux", "w": ["La lande des agneaux", "Le marché aux agneaux", "La maison de Lamb"], "x": "Hithe est un ancien mot pour un débarcadère sur une rivière, comme dans Rotherhithe."}, "de": {"q": "Was bedeutet der Name „Lambeth“?", "a": "Der Landeplatz für Lämmer", "w": ["Die Lämmerheide", "Der Lämmermarkt", "Das Haus von Lamb"], "x": "Hithe ist ein altes Wort für einen Landeplatz am Fluss, wie in Rotherhithe."}}, {"id": "q31", "t": "quiz", "s": "Highbury & Islington", "g": [], "en": {"q": "What does 'Highbury' mean?", "a": "The high manor", "w": ["The high bridge", "The high church", "The high burial mound"], "x": "It was the higher of two manors in the parish. Islington means the hill of a man called Gisla."}, "fr": {"q": "Que signifie « Highbury » ?", "a": "Le manoir d'en haut", "w": ["Le pont d'en haut", "L'église d'en haut", "Le tumulus d'en haut"], "x": "C'était le plus élevé des deux manoirs de la paroisse. Islington signifie la colline d'un homme nommé Gisla."}, "de": {"q": "Was bedeutet „Highbury“?", "a": "Das hohe Gut", "w": ["Die hohe Brücke", "Die hohe Kirche", "Der hohe Grabhügel"], "x": "Es war das höher gelegene von zwei Gütern der Pfarrei. Islington bedeutet der Hügel eines Mannes namens Gisla."}}, {"id": "q32", "t": "quiz", "s": "Camden Town", "g": [], "en": {"q": "Earl Camden's title came from a house in Kent, named after whom?", "a": "The historian William Camden", "w": ["A Roman general", "The architect John Nash", "A local brewer"], "x": "Charles Pratt, 1st Earl Camden, began letting his land here for building in 1791."}, "fr": {"q": "Le titre du comte de Camden venait d'une demeure du Kent, nommée d'après qui ?", "a": "L'historien William Camden", "w": ["Un général romain", "L'architecte John Nash", "Un brasseur local"], "x": "Charles Pratt, 1er comte de Camden, commença à louer ses terres ici pour y bâtir en 1791."}, "de": {"q": "Der Titel von Earl Camden kam von einem Haus in Kent, benannt nach wem?", "a": "Dem Historiker William Camden", "w": ["Einem römischen General", "Dem Architekten John Nash", "Einem örtlichen Brauer"], "x": "Charles Pratt, 1. Earl Camden, begann 1791, sein Land hier als Bauland zu verpachten."}}, {"id": "q33", "t": "quiz", "s": "Regent's Park", "g": ["george4"], "en": {"q": "The Prince Regent, after whom Regent's Park is named, later became which king?", "a": "George IV", "w": ["George III", "William IV", "Edward VII"], "x": "The park was laid out by John Nash in the early 19th century."}, "fr": {"q": "Le prince régent, qui a donné son nom à Regent's Park, devint ensuite quel roi ?", "a": "George IV", "w": ["George III", "Guillaume IV", "Édouard VII"], "x": "Le parc a été aménagé par John Nash au début du XIXe siècle."}, "de": {"q": "Der Prinzregent, nach dem der Regent's Park benannt ist, wurde später welcher König?", "a": "Georg IV.", "w": ["Georg III.", "Wilhelm IV.", "Eduard VII."], "x": "Der Park wurde im frühen 19. Jahrhundert von John Nash angelegt."}}, {"id": "q34", "t": "quiz", "s": "Upton Park", "g": [], "en": {"q": "Which football club's old stadium, the Boleyn Ground, was often called Upton Park?", "a": "West Ham United", "w": ["Arsenal", "Chelsea", "Tottenham Hotspur"], "x": "'Upton' means the farm on higher ground; 'Park' was added in the 1880s to sell new houses."}, "fr": {"q": "L'ancien stade de quel club, le Boleyn Ground, était souvent appelé Upton Park ?", "a": "West Ham United", "w": ["Arsenal", "Chelsea", "Tottenham Hotspur"], "x": "« Upton » signifie la ferme sur les hauteurs ; « Park » a été ajouté dans les années 1880 pour vendre de nouvelles maisons."}, "de": {"q": "Das alte Stadion welches Vereins, der Boleyn Ground, wurde oft Upton Park genannt?", "a": "West Ham United", "w": ["Arsenal", "Chelsea", "Tottenham Hotspur"], "x": "„Upton“ bedeutet der Hof auf der Anhöhe; „Park“ kam in den 1880er-Jahren hinzu, um neue Häuser zu verkaufen."}}, {"id": "q35", "t": "quiz", "s": "Vauxhall", "g": [], "en": {"q": "Vauxhall is named after the hall of a medieval knight. What was his name?", "a": "Falkes de Breauté", "w": ["Guy of Warwick", "Richard de Clare", "Hugh de Plaiz"], "x": "He built it in the 13th century; later the car maker took its name from the area."}, "fr": {"q": "Vauxhall doit son nom à la demeure d'un chevalier médiéval. Comment s'appelait-il ?", "a": "Falkes de Breauté", "w": ["Guy de Warwick", "Richard de Clare", "Hugh de Plaiz"], "x": "Il la fit construire au XIIIe siècle ; plus tard, le constructeur automobile a pris le nom du quartier."}, "de": {"q": "Vauxhall ist nach der Halle eines mittelalterlichen Ritters benannt. Wie hieß er?", "a": "Falkes de Breauté", "w": ["Guy von Warwick", "Richard de Clare", "Hugh de Plaiz"], "x": "Er baute sie im 13. Jahrhundert; später übernahm der Autohersteller den Namen des Viertels."}}, {"id": "q36", "t": "quiz", "s": "Southfields", "g": [], "en": {"q": "During which famous event is Southfields the station for the courts?", "a": "The Wimbledon tennis championships", "w": ["The Boat Race", "The London Marathon", "The Chelsea Flower Show"], "x": "The south fields of Wandsworth stayed farmland until about 1900."}, "fr": {"q": "Pendant quel événement célèbre Southfields est-elle la station des courts ?", "a": "Le tournoi de tennis de Wimbledon", "w": ["La course d'aviron Oxford-Cambridge", "Le marathon de Londres", "Le Chelsea Flower Show"], "x": "Les champs du sud de Wandsworth sont restés agricoles jusque vers 1900."}, "de": {"q": "Bei welchem berühmten Ereignis ist Southfields die Station für die Plätze?", "a": "Beim Tennisturnier von Wimbledon", "w": ["Beim Ruderrennen Oxford gegen Cambridge", "Beim London-Marathon", "Bei der Chelsea Flower Show"], "x": "Die südlichen Felder von Wandsworth blieben bis etwa 1900 Ackerland."}}];

function haversine([la1, lo1], [la2, lo2]){
  const R = 6371000, r = Math.PI / 180, dla = (la2 - la1) * r, dlo = (lo2 - lo1) * r;

  return 2 * R * Math.asin(Math.sqrt(a));
}
function locate(ok, fail){

}

// Shrink a long station name until it fits between the arrows
function fitTitle(){
  const el = app.querySelector(".sign h2");
  if (!el) return;
  el.style.fontSize = ""; el.style.overflowWrap = "normal";
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && size > 18) { size -= 1; el.style.fontSize = size + "px"; }
  if (el.scrollWidth > el.clientWidth + 1) el.style.overflowWrap = "anywhere";
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
window.addEventListener("resize", fitTitle);

app.addEventListener("touchstart", e => { if (e.touches.length === 1) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; } }, { passive: true });
app.addEventListener("touchend", e => {
  if (touchX === null || !stepNav || !sheet.hidden) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) (dx < 0 ? stepNav.next : stepNav.prev)();
}, { passive: true });

// Copy plain text, with a fallback for browsers that block the clipboard API
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

function feedbackText(e){
  return `Feedback on Stop Stories London
${e.line} line, station ${e.pos}: ${e.stop} (towards ${e.towards})
Issues: ${e.issues.length ? e.issues.join(", ") : "none selected"}
Comment: ${e.comment || "(none)"}
App language: ${e.lang.toUpperCase()}`;
}

// ---------- Quiz game ----------
const GAME_LEN = 5;
let GS = null; // current round, kept in memory so "Read the story" and Back return to the same question
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gq = (q, part) => (q[LANG] || q.en)[part];
const stopRoute = k => { const x = (STOP_LINES[k] || [])[0]; return x ? lineRoute(x) : null; };
function newRound(){
  let seen = []; try { seen = JSON.parse(store("gameSeen") || "[]"); } catch (e) {}
  const usable = GAME.filter(q => stopRoute(q.s));
  let fresh = usable.filter(q => !seen.includes(q.id));
  if (fresh.length < GAME_LEN + 3) { seen = []; fresh = usable; }
  const pick = [], groups = new Set();
  const take = (list, max) => { for (const q of shuffle(list)) {
    if (pick.length >= max) return;
    if (pick.includes(q) || q.g.some(g => groups.has(g))) continue;
    pick.push(q); q.g.forEach(g => groups.add(g)); } };
  const fg = fresh.filter(q => q.t === "guess");
  take(fg.length >= 2 ? fg : usable.filter(q => q.t === "guess"), 2);   // 2 x "Guess the station" (start over when all were seen)
  take(fresh.filter(q => q.t === "quiz"), GAME_LEN);       // 3 x quiz
  take(usable, GAME_LEN);                                  // safety net
  store("gameSeen", JSON.stringify(seen.concat(pick.map(q => q.id))));
  const qs = shuffle(pick);
  return { qs, order: qs.map(() => shuffle([0, 1, 2, 3])), i: 0, score: 0, picked: null, done: false };
}
function renderGame(){
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  setBand("about", t("gameTitle"), null);
  nav.hidden = true; app.classList.remove("has-acts", "stop-page"); stepNav = null;
  const best = +(store("gameBest") || 0);
  if (!GS) {
    app.innerHTML = `
    <section class="view game">
      <div class="game-card intro">
        <div class="game-icon" aria-hidden="true">${ICON_PLAY}</div>
        <h2>${esc(t("gameTitle"))}</h2>
        <p>${esc(t("gameIntro"))}</p>
        ${best ? `<p class="game-best">${esc(t("gameBest").replace("{n}", best))}</p>` : ""}
        <button class="btn primary" id="gameStart">${esc(t("gameStart"))}</button>
      </div>
    </section>`;
    document.getElementById("gameStart").onclick = () => { GS = newRound(); renderGame(); };
    return;
  }
  if (GS.done) {
    const n = GS.score, msg = t(n === GAME_LEN ? "gameMsg5" : n >= 4 ? "gameMsg4" : n >= 2 ? "gameMsg2" : "gameMsg0");
    app.innerHTML = `
    <section class="view game">
      <div class="game-card end">
        <p class="game-big">${esc(t("gameScore").replace("{n}", n).replace("{t}", GAME_LEN))}</p>
        <p class="game-msg">${esc(msg)}</p>
        ${best ? `<p class="game-best">${esc(t("gameBest").replace("{n}", best))}</p>` : ""}
        <button class="btn primary" id="gameAgain">${esc(t("gameAgain"))}</button>
      </div>
      <div class="game-card">
        <p class="label">${esc(t("gameStops"))}</p>
        <ul class="results">${GS.qs.map(q => { const k = q.s, s = STOPS[k], ls = STOP_LINES[k] || [];
          return `<li><button class="res" data-story="${esc(k)}"><span class="res-name"><b>${esc(s.name)}</b><small>${esc(s.q)}</small></span>
            <span class="res-lines">${ls.map(x => lineBadge(x.line)).join("")}</span></button></li>`; }).join("")}</ul>
      </div>
    </section>`;
    app.querySelectorAll("[data-story]").forEach(b => b.onclick = () => openStory(b.dataset.story));
    document.getElementById("gameAgain").onclick = () => { GS = newRound(); renderGame(); window.scrollTo(0, 0); };
    return;
  }
  const q = GS.qs[GS.i], opts = [gq(q, "a"), ...gq(q, "w")], ord = GS.order[GS.i];
  const answered = GS.picked !== null, right = answered && GS.picked === 0;
  const sname = STOPS[q.s].name;
  app.innerHTML = `
  <section class="view game">
    <div class="game-top">
      <span>${esc(t("gameQ").replace("{i}", GS.i + 1).replace("{n}", GAME_LEN))}</span>
      <span class="game-dots" aria-label="${esc(t("gameScoreLabel"))}: ${GS.score}">${GS.qs.map((_, j) => `<i class="${j < GS.i || (j === GS.i && answered) ? (GS.res?.[j] ? "ok" : "no") : j === GS.i ? "cur" : ""}"></i>`).join("")}</span>
    </div>
    <div class="game-card">
      <p class="game-kind">${esc(t(q.t === "guess" ? "gameGuess" : "gameQuiz"))}</p>
      <h2 class="game-q">${esc(gq(q, "q"))}</h2>
      <div class="game-opts">
        ${ord.map(o => `<button class="gopt${answered ? (o === 0 ? " right" : o === GS.picked ? " wrong" : " dim") : ""}" data-o="${o}"${answered ? " disabled" : ""}>${esc(opts[o])}${answered && o === 0 ? '<span class="gmark" aria-hidden="true">✓</span>' : answered && o === GS.picked ? '<span class="gmark" aria-hidden="true">✗</span>' : ""}</button>`).join("")}
      </div>
      <div class="game-fb" aria-live="polite">${answered ? `
        <p class="game-verdict ${right ? "ok" : "no"}">${esc(t(right ? "gameRight" : "gameWrong"))}${right ? "" : " " + esc(t("gameAnswerWas").replace("{a}", opts[0]))}</p>
        <p class="game-ex">${esc(gq(q, "x"))}</p>
        <div class="game-acts">
          <button class="btn" id="gameStory">${esc(t("gameRead"))}: ${esc(sname)}</button>
          <button class="btn primary" id="gameNext">${esc(t(GS.i + 1 < GAME_LEN ? "gameNext" : "gameSeeScore"))}</button>
        </div>` : ""}</div>
    </div>
  </section>`;
  // No highlight on an option just because the pointer happens to rest where the previous button was
  const optBox = app.querySelector(".game-opts");
  if (optBox) { optBox.classList.add("still"); const wake = () => { optBox.classList.remove("still"); window.removeEventListener("pointermove", wake); };
    setTimeout(() => window.addEventListener("pointermove", wake), 150); }
  app.querySelectorAll(".gopt:not([disabled])").forEach(b => b.onclick = () => {
    GS.picked = +b.dataset.o; (GS.res ||= [])[GS.i] = GS.picked === 0;
    if (GS.picked === 0) GS.score++;
    renderGame();
    const fb = app.querySelector(".game-fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  const st = document.getElementById("gameStory");
  if (st) st.onclick = () => openStory(q.s);
  const nx = document.getElementById("gameNext");
  if (nx) nx.onclick = () => {
    GS.i++; GS.picked = null;
    if (GS.i >= GAME_LEN) { GS.done = true; if (GS.score > best) store("gameBest", String(GS.score)); }
    renderGame(); window.scrollTo(0, 0);
  };
}

function route(){
  if (!sheet.hidden) closeSheet();
  if (location.hash === "#about") { renderAbout(); return; }
  if (location.hash === "#play") { renderGame(); window.scrollTo(0, 0); return; }
  const r = parse();
  if (!r.line) renderHome();
  else if (r.pos) renderStop(r);
  else renderList(r);
}
window.addEventListener("hashchange", route);
route();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
