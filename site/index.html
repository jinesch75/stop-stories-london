6612, -0.247248]}, "East Finchley": {"name": "East Finchley", "q": "Barnet", "zone": "3", "head": "'Finchley' probably means the clearing where finches live.", "text": "It ends in Old English leah, a clearing in a wood. On the station stands a statue of an archer by Eric Aumonier, aiming his arrow towards central London.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "East Finchley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Finchley_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.587131, -0.165012]}, "East Ham": {"name": "East Ham", "q": "Newham", "zone": "3/4", "head": "'Ham' means dry land in a river bend or between rivers.", "text": "The land here lies between the Thames, the Lea and the Roding. It was recorded about a century before the Normans as Hamme, and was split into East Ham and West Ham in the 12th century.", "links": [{"t": "East Ham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Ham"}, {"t": "East Ham tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Ham_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.538948, 0.051186]}, "East Putney": {"name": "East Putney", "q": "Wandsworth", "zone": "2/3", "head": "'Putney' means the landing place of a man called Putta.", "text": "The Domesday Book of 1086 records it as Putelei. The landing place was on the Thames, where Putney Bridge is today.", "links": [{"t": "Putney", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Putney"}, {"t": "East Putney tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/East_Putney_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.459205, -0.211]}, "Eastcote": {"name": "Eastcote", "q": "Hillingdon", "zone": "5", "head": "'Eastcote' means the cottage or cottages to the east.", "text": "They lay east of Ruislip. Ascot, near Windsor, has the same origin.", "links": [{"t": "Eastcote", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Eastcote"}, {"t": "Eastcote tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Eastcote_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.576506, -0.397373]}, "Edgware": {"name": "Edgware", "q": "Barnet", "zone": "5", "head": "'Edgware' probably means the fishing pool of a Saxon called Ecgi.", "text": "A 'wer' or weir was a pool or dam for catching fish. The Northern line reached Edgware in 1924 and was planned to go further, but the extension was never finished.", "links": [{"t": "Edgware", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware"}, {"t": "Edgware tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.613653, -0.274928]}, "Edgware Road": {"name": "Edgware Road", "q": "Westminster", "zone": "1", "head": "Named after the road to Edgware, which follows the Roman Watling Street.", "text": "Edgware probably means the fishing pool of a Saxon called Ecgi. The road runs dead straight to the north-west, as Roman roads do.", "links": [{"t": "Edgware Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_Road"}, {"t": "Watling Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Watling_Street"}, {"t": "Edgware Road tube station (Circle, District and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edgware_Road_tube_station_(Circle,_District_and_Hammersmith_&_City_lines)"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.520299, -0.17015]}, "Elephant & Castle": {"name": "Elephant & Castle", "q": "Southwark", "zone": "1/2", "head": "Most likely named after a coaching inn called the Elephant and Castle.", "text": "A popular story says the name comes from 'Infanta de Castile', a Spanish princess, but historians doubt it. An elephant carrying a castle was a common sign, used for example by the Cutlers' Company.", "links": [{"t": "Elephant and Castle", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elephant_and_Castle"}, {"t": "Elephant & Castle tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elephant_&_Castle_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.494536, -0.100606]}, "Elm Park": {"name": "Elm Park", "q": "Havering", "zone": "6", "head": "The name was chosen in the 1930s for a new garden estate.", "text": "The estate was built on farmland between Hornchurch and Rainham, and the station opened in 1935 to serve it.", "links": [{"t": "Elm Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elm_Park"}, {"t": "Elm Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Elm_Park_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.549775, 0.19864]}, "Embankment": {"name": "Embankment", "q": "Westminster", "zone": "1", "head": "Named after the Victoria Embankment, built along the Thames in the 1860s.", "text": "Joseph Bazalgette built it to carry new sewers and the District Railway, and to create a riverside road. The station had many names with 'Charing Cross' in them before it became Embankment in 1976.", "links": [{"t": "Victoria Embankment", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Victoria_Embankment"}, {"t": "Embankment tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Embankment_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.507058, -0.122666]}, "Epping": {"name": "Epping", "q": "Epping Forest", "zone": "6", "head": "'Epping' probably means the people of the upland.", "text": "It is in the Domesday Book of 1086 as Eppinges. The great forest nearby takes its name from the town, not the other way round.", "links": [{"t": "Epping", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Epping"}, {"t": "Epping tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Epping_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.69368, 0.113767]}, "Euston": {"name": "Euston", "q": "Camden", "zone": "1", "head": "Named after Euston Hall in Suffolk, home of the Dukes of Grafton.", "text": "The dukes owned the land here, and Euston Road and Euston Square took the name of their country house. The Suffolk village of Euston probably means the farm of a man called Efe.", "links": [{"t": "Euston Hall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Hall"}, {"t": "Euston tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.527999, -0.133785]}, "Euston Square": {"name": "Euston Square", "q": "Camden", "zone": "1", "head": "Named after Euston Square, the garden square near the main line station.", "text": "The name comes from Euston Hall in Suffolk, home of the Dukes of Grafton, who owned the land. The station opened in 1863 as Gower Street and was renamed in 1909.", "links": [{"t": "Euston Hall", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Hall"}, {"t": "Euston Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Euston_Square_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.525604, -0.135829]}, "Fairlop": {"name": "Fairlop", "q": "Redbridge", "zone": "4", "head": "Named after the Fairlop Oak, a giant tree in Hainault Forest.", "text": "From the early 18th century a fair was held every summer under the oak, started by a local man, Daniel Day. The tree was damaged by fire and blew down in the early 19th century.", "links": [{"t": "Fairlop", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fairlop"}, {"t": "Fairlop tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fairlop_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.595618, 0.091004]}, "Farringdon": {"name": "Farringdon", "q": "Islington", "zone": "1", "head": "Named after Nicholas and William de Faringdon, aldermen of the City.", "text": "They owned land here in the 13th century, and their name passed to a City ward, a street and the station. Farringdon was one of the first stations of the world's first underground railway, opened in 1863.", "links": [{"t": "Farringdon, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Farringdon,_London"}, {"t": "Farringdon station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Farringdon_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.520252, -0.104913]}, "Finchley Central": {"name": "Finchley Central", "q": "Barnet", "zone": "4", "head": "'Finchley' probably means the clearing where finches live.", "text": "The station opened on a railway line in 1867 and was called Finchley (Church End) until 1940, when it became Finchley Central.", "links": [{"t": "Finchley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley"}, {"t": "Finchley Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Central_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.600921, -0.192527]}, "Finchley Road": {"name": "Finchley Road", "q": "Camden", "zone": "2", "head": "Named after the road to Finchley, built in the 1820s as a turnpike.", "text": "Finchley probably means the clearing where finches live. The new road avoided the steep hills of Hampstead further east.", "links": [{"t": "Finchley Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Road"}, {"t": "Finchley Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finchley_Road_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.546825, -0.179845]}, "Finsbury Park": {"name": "Finsbury Park", "q": "Islington", "zone": "2", "head": "Named after a park opened in 1869, though it is not in Finsbury.", "text": "The park was planned for the people of the old borough of Finsbury, further south. 'Finsbury' probably means the manor of a man called Finn.", "links": [{"t": "Finsbury Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finsbury_Park"}, {"t": "Finsbury Park station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Finsbury_Park_station%23London_Underground"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.564158, -0.106825]}, "Fulham Broadway": {"name": "Fulham Broadway", "q": "Hammersmith and Fulham", "zone": "2", "head": "'Fulham' means the riverside land of a man called Fulla.", "text": "It was recorded as Fulanham around 700. The station opened in 1880 as Walham Green, after the local village green, and was renamed Fulham Broadway in 1952.", "links": [{"t": "Fulham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fulham"}, {"t": "Fulham Broadway tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Fulham_Broadway_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.480081, -0.195422]}, "Gants Hill": {"name": "Gants Hill", "q": "Redbridge", "zone": "4", "head": "Probably named after the le Gant family, stewards of Barking Abbey's lands.", "text": "The family is recorded here from the 13th century. The station, opened in 1947, has a long vaulted hall between the platforms, inspired by the Moscow Metro.", "links": [{"t": "Gants Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gants_Hill"}, {"t": "Gants Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gants_Hill_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.576544, 0.066185]}, "Gloucester Road": {"name": "Gloucester Road", "q": "Kensington and Chelsea", "zone": "1", "head": "Named after Maria, Duchess of Gloucester, who built a house here in 1805.", "text": "Before that the road was called Hog Moore Lane. The station opened in 1868 as Brompton (Gloucester Road).", "links": [{"t": "Gloucester Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gloucester_Road"}, {"t": "Gloucester Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gloucester_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.494316, -0.182658]}, "Golders Green": {"name": "Golders Green", "q": "Barnet", "zone": "3", "head": "Named after the Godyere family, who held land here in the 14th century.", "text": "The green was open land next to their property. The village grew quickly after the Underground arrived in 1907.", "links": [{"t": "Golders Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Golders_Green"}, {"t": "Golders Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Golders_Green_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.572259, -0.194039]}, "Goldhawk Road": {"name": "Goldhawk Road", "q": "Hammersmith and Fulham", "zone": "2", "head": "Probably named after John Goldhawk, a landowner in the 15th century.", "text": "He held a large amount of land in the area, then part of the parish of Fulham. The station opened in 1914.", "links": [{"t": "Goldhawk Road", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goldhawk_Road"}, {"t": "Goldhawk Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goldhawk_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.502005, -0.226715]}, "Goodge Street": {"name": "Goodge Street", "q": "Camden", "zone": "1", "head": "Named after John Goodge, who developed the land from 1746.", "text": "Before the houses were built it was a meadow called Crab Tree Field. The station opened in 1907 as Tottenham Court Road and was renamed Goodge Street a year later.", "links": [{"t": "Goodge Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodge_Street"}, {"t": "Goodge Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Goodge_Street_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.520599, -0.134361]}, "Grange Hill": {"name": "Grange Hill", "q": "Epping Forest", "zone": "4", "head": "A 'grange' was a farm with barns, often belonging to a monastery.", "text": "This one stood on a hill. The name has no link with the children's TV series Grange Hill.", "links": [{"t": "Grange Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Grange_Hill"}, {"t": "Grange Hill tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Grange_Hill_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.613378, 0.092066]}, "Great Portland Street": {"name": "Great Portland Street", "q": "Westminster", "zone": "1", "head": "Named after the street, which honours the Dukes of Portland.", "text": "The 2nd Duke of Portland owned the land from 1734. The station opened in 1863 as Portland Road.", "links": [{"t": "Great Portland Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Great_Portland_Street"}, {"t": "Great Portland Street tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Great_Portland_Street_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.52384, -0.144262]}, "Green Park": {"name": "Green Park", "q": "Westminster", "zone": "1", "head": "Named after the park, renamed The Green Park in 1746.", "text": "It was first called Upper St James's Park. The new name probably described its open grassland with few trees and no flower beds. The station opened in 1906 as Dover Street.", "links": [{"t": "Green Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Green_Park"}, {"t": "Green Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Green_Park_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.506947, -0.142787]}, "Greenford": {"name": "Greenford", "q": "Ealing", "zone": "4", "head": "'Greenford' means the green ford.", "text": "The ford crossed the River Brent, which still winds through the area between green banks.", "links": [{"t": "Greenford", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenford"}, {"t": "Greenford station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenford_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.542424, -0.34605]}, "Gunnersbury": {"name": "Gunnersbury", "q": "Hounslow", "zone": "3", "head": "'Gunnersbury' means the manor of a woman called Gunnhild.", "text": "Gunnhild is a Scandinavian name. A legend links it to a niece of King Canute, but there is no proof.", "links": [{"t": "Gunnersbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gunnersbury"}, {"t": "Gunnersbury station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Gunnersbury_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.491803, -0.275267]}, "Hainault": {"name": "Hainault", "q": "Redbridge", "zone": "4", "head": "'Hainault' probably means the wood of a religious community.", "text": "It was recorded in 1221 as Henehout, from Old English for a monastery wood, here belonging to Barking Abbey. The French-looking spelling came later, from a mistaken link with Philippa of Hainault, wife of Edward III.", "links": [{"t": "Hainault, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault,_London"}, {"t": "Hainault Forest", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault_Forest"}, {"t": "Hainault tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hainault_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.603659, 0.093482]}, "Hammersmith": {"name": "Hammersmith", "q": "Hammersmith and Fulham", "zone": "2", "head": "'Hammersmith' probably means a place with a hammer smithy, or forge.", "text": "It was first recorded in 1294. Another, less likely theory sees in it a landing place belonging to a man called Hammoder.", "links": [{"t": "Hammersmith", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hammersmith"}, {"t": "Hammersmith tube station (Circle and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hammersmith_tube_station_(Circle_and_Hammersmith_&_City_lines)"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.49339, -0.22503]}, "Hampstead": {"name": "Hampstead", "q": "Camden", "zone": "2/3", "head": "'Hampstead' simply means homestead.", "text": "It comes from Old English hām-stede, like Berkhamsted and Wheathampstead. Hampstead station, opened in 1907, has the deepest platforms on the Underground.", "links": [{"t": "Hampstead", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead"}, {"t": "Hampstead tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hampstead_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.556239, -0.177464]}, "Hanger Lane": {"name": "Hanger Lane", "q": "Ealing", "zone": "3", "head": "'Hanger' means a wooded slope.", "text": "It comes from Old English hangra, a wood on a steep hillside. The same word gives Hanger Hill nearby.", "links": [{"t": "Hanger Lane", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanger_Lane"}, {"t": "Hanger Lane tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hanger_Lane_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.530177, -0.292704]}, "Harlesden": {"name": "Harlesden", "q": "Brent", "zone": "3", "head": "'Harlesden' means the farm of a man called Heoruwulf.", "text": "It is recorded in the Domesday Book of 1086 as Herulvestune, with -tune meaning a farm. Bakerloo trains have called here since 1917.", "links": [{"t": "Harlesden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harlesden"}, {"t": "Harlesden station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harlesden_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.53631, -0.257883]}, "Harrow & Wealdstone": {"name": "Harrow & Wealdstone", "q": "Harrow", "zone": "5", "head": "Named after Harrow and Wealdstone, the boundary stone of Harrow Weald.", "text": "'Harrow' comes from Old English hearg, a heathen temple. 'Weald' means woodland, and the stone marked the edge of the woods north of Harrow. The station opened in 1837 on the London and Birmingham Railway.", "links": [{"t": "Wealdstone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wealdstone"}, {"t": "Harrow & Wealdstone station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow_&_Wealdstone_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.592268, -0.335217]}, "Harrow-on-the-Hill": {"name": "Harrow-on-the-Hill", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on top of the hill, where St Mary's Church stands today. The station opened in 1880 as Harrow and added 'on-the-Hill' in 1894.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "Harrow-on-the-Hill station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow-on-the-Hill_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.579195, -0.337225]}, "Hatton Cross": {"name": "Hatton Cross", "q": "Hillingdon", "zone": "5/6", "head": "'Hatton' means the farm on the heath.", "text": "The heath was Hounslow Heath, where Heathrow Airport now stands. 'Cross' probably refers to a crossroads.", "links": [{"t": "Hatton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatton,_London"}, {"t": "Hatton Cross tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hatton_Cross_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.466747, -0.423191]}, "Heathrow Terminal 4": {"name": "Heathrow Terminal 4", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "It was first recorded in 1410 as La Hetherewe, a hamlet on Hounslow Heath. Terminal 4 opened in 1986, with its own station on a loop of the Piccadilly line.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminal 4 tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminal_4_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.458524, -0.445771]}, "Heathrow Terminal 5": {"name": "Heathrow Terminal 5", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "The hamlet, first recorded in 1410, disappeared when the airport was built in the 1940s. Terminal 5 and its station opened in 2008.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminal 5 station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminal_5_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.470052, -0.49056]}, "Heathrow Terminals 2 & 3": {"name": "Heathrow Terminals 2 & 3", "q": "Hillingdon", "zone": "6", "head": "'Heathrow' means the row of houses on the heath.", "text": "The station opened in 1977 as Heathrow Central. It became Heathrow Terminals 2 & 3 in 2016, after Terminal 1 closed.", "links": [{"t": "Heathrow Airport", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Airport"}, {"t": "Heathrow Terminals 2 & 3 tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Heathrow_Terminals_2_&_3_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.471235, -0.452265]}, "Hendon Central": {"name": "Hendon Central", "q": "Barnet", "zone": "3/4", "head": "'Hendon' means at the high hill.", "text": "It was recorded in the Domesday Book of 1086 as Hendun. The station opened in 1923.", "links": [{"t": "Hendon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hendon"}, {"t": "Hendon Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hendon_Central_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.583301, -0.226424]}, "High Barnet": {"name": "High Barnet", "q": "Barnet", "zone": "5", "head": "'Barnet' means land cleared by burning.", "text": "It comes from Old English bærnet, burning. The town is also called Chipping Barnet, 'chipping' meaning a market. In 1471 the Battle of Barnet, part of the Wars of the Roses, was fought just north of the town.", "links": [{"t": "Chipping Barnet", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Chipping_Barnet"}, {"t": "High Barnet tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/High_Barnet_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.650541, -0.194298]}, "High Street Kensington": {"name": "High Street Kensington", "q": "Kensington and Chelsea", "zone": "1", "head": "'Kensington' means the farm of a Saxon called Cynesige.", "text": "It is in the Domesday Book as Chenesitun. The station opened in 1868 on Kensington High Street, near Kensington Palace.", "links": [{"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "High Street Kensington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/High_Street_Kensington_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.501055, -0.192792]}, "Highbury & Islington": {"name": "Highbury & Islington", "q": "Islington", "zone": "2", "head": "'Highbury' means the high manor; 'Islington' means the hill of a man called Gisla.", "text": "Islington was recorded around 1000 as Gislandune. Highbury was the higher of two manors in the parish. The Victoria line station opened in 1968.", "links": [{"t": "Highbury", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highbury"}, {"t": "Islington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Islington"}, {"t": "Highbury & Islington station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highbury_&_Islington_station"}, {"t": "How the Victoria line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-victoria-line-stations-got-their-names"}], "ll": [51.54635, -0.103324]}, "Highgate": {"name": "Highgate", "q": "Haringey", "zone": "3", "head": "Named after a high gate on the hill, a toll gate on the road north.", "text": "The gate led into the Bishop of London's hunting park, and travellers on the Great North Road paid a toll here. Highgate is one of the highest points in London.", "links": [{"t": "Highgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highgate"}, {"t": "Highgate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Highgate_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.577532, -0.145857]}, "Hillingdon": {"name": "Hillingdon", "q": "Hillingdon", "zone": "6", "head": "'Hillingdon' probably means the hill of a man called Hilla.", "text": "It is recorded in the Domesday Book of 1086 as Hillendone, with -done meaning a hill. The station opened in 1923.", "links": [{"t": "Hillingdon", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hillingdon"}, {"t": "Hillingdon tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hillingdon_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.553715, -0.449828]}, "Holborn": {"name": "Holborn", "q": "Camden", "zone": "1", "head": "'Holborn' probably means the stream in the hollow.", "text": "The stream was a tributary of the River Fleet, long since buried. Londoners traditionally say 'Hoe-bun'.", "links": [{"t": "Holborn", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holborn"}, {"t": "Holborn tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holborn_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.51758, -0.120475]}, "Holland Park": {"name": "Holland Park", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Holland House, a 17th-century mansion whose grounds became the park.", "text": "The house took its name from Henry Rich, Earl of Holland, whose title came from Holland in Lincolnshire, not the Netherlands. Later the Fox family, Barons Holland, lived there.", "links": [{"t": "Holland House", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_House"}, {"t": "Holland Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_Park"}, {"t": "Holland Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holland_Park_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.507143, -0.205679]}, "Holloway Road": {"name": "Holloway Road", "q": "Islington", "zone": "2", "head": "'Holloway' means the hollow way, a road worn deep into the ground.", "text": "Cattle and carts on their way to London's markets wore the road down over centuries. Another idea, a 'hallowed way' for pilgrims, is less likely.", "links": [{"t": "Holloway, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holloway,_London"}, {"t": "Holloway Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Holloway_Road_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.552697, -0.113244]}, "Hornchurch": {"name": "Hornchurch", "q": "Havering", "zone": "6", "head": "'Hornchurch' means the church with horns.", "text": "It was recorded in 1222. Nobody knows exactly why, but St Andrew's Church still has the head of a bull with real horns on its east end.", "links": [{"t": "Hornchurch", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hornchurch"}, {"t": "Hornchurch tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hornchurch_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.554093, 0.219116]}, "Hounslow Central": {"name": "Hounslow Central", "q": "Hounslow", "zone": "4", "head": "'Hounslow' probably means the mound of the hound.", "text": "The 'hound' may be a dog or a man nicknamed Hund, and the mound probably a burial mound. The station opened in 1886 as Heston Hounslow and was renamed in 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow Central tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_Central_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.471295, -0.366578]}, "Hounslow East": {"name": "Hounslow East", "q": "Hounslow", "zone": "4", "head": "'Hounslow' probably means the mound of the hound.", "text": "It ends in Old English hlāw, a mound or burial mound. The station was called Hounslow Town until 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_East_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.473213, -0.356474]}, "Hounslow West": {"name": "Hounslow West", "q": "Hounslow", "zone": "5", "head": "'Hounslow' probably means the mound of the hound.", "text": "The station opened in 1884 as Hounslow Barracks, after the army barracks nearby, and was renamed Hounslow West in 1925.", "links": [{"t": "Hounslow", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow"}, {"t": "Hounslow West tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hounslow_West_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.473469, -0.386544]}, "Hyde Park Corner": {"name": "Hyde Park Corner", "q": "Westminster", "zone": "1", "head": "Named after the corner of Hyde Park.", "text": "The park was once the manor of Hyde, owned by Westminster Abbey; 'hide' was an old measure of land. Henry VIII took it over in 1536 as a hunting ground.", "links": [{"t": "Hyde Park, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hyde_Park,_London"}, {"t": "Hyde Park Corner tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Hyde_Park_Corner_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.503035, -0.152441]}, "Ickenham": {"name": "Ickenham", "q": "Hillingdon", "zone": "6", "head": "'Ickenham' means the homestead of a man called Ticca.", "text": "The Domesday Book of 1086 records it as Ticheham. Over time the T was lost.", "links": [{"t": "Ickenham", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ickenham"}, {"t": "Ickenham tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ickenham_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.56177, -0.442225]}, "Kennington": {"name": "Kennington", "q": "Southwark", "zone": "1/2", "head": "'Kennington' means the farm of a man called Cena.", "text": "It is recorded in the Domesday Book of 1086 as Chenintune. Kennington Park was once a common where large public meetings were held.", "links": [{"t": "Kennington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kennington"}, {"t": "Kennington tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kennington_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.488337, -0.105963]}, "Kensal Green": {"name": "Kensal Green", "q": "Brent", "zone": "2", "head": "'Kensal' means the king's wood.", "text": "It was first recorded in the 13th century as Kingisholte. Nobody knows which king. The green lay where Kensal Green Cemetery, opened in 1833, is now.", "links": [{"t": "Kensal Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Green"}, {"t": "Kensal Green station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensal_Green_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.530539, -0.225016]}, "Kensington (Olympia)": {"name": "Kensington (Olympia)", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Olympia, an exhibition hall opened in 1886.", "text": "The hall was probably named after Olympia in ancient Greece, home of the Olympic Games. Kensington means the farm of a Saxon called Cynesige. The station was called Kensington (Addison Road) until 1946.", "links": [{"t": "Olympia London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Olympia_London"}, {"t": "Kensington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington"}, {"t": "Kensington (Olympia) station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kensington_(Olympia)_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.497624, -0.210015]}, "Kentish Town": {"name": "Kentish Town", "q": "Camden", "zone": "2", "head": "Despite the name, Kentish Town has nothing to do with Kent, as far as anyone knows.", "text": "The name was recorded in 1208 as Kentisston. It may come from a family called Kentish, or from words describing the bed of a stream, the now-hidden River Fleet.", "links": [{"t": "Kentish Town", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town"}, {"t": "Kentish Town station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kentish_Town_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.550312, -0.140733]}, "Kenton": {"name": "Kenton", "q": "Brent", "zone": "4", "head": "'Kenton' probably means the farm of a man called Coena.", "text": "It ends in Old English tūn, a farm or settlement. Bakerloo trains have called here since 1917.", "links": [{"t": "Kenton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton,_London"}, {"t": "Kenton station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kenton_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.581756, -0.31691]}, "Kew Gardens": {"name": "Kew Gardens", "q": "Richmond", "zone": "3/4", "head": "Named after the Royal Botanic Gardens at Kew.", "text": "'Kew' was first recorded in 1327 as Cayho and probably means the spur of land by a landing place on the Thames. The gardens are a UNESCO World Heritage Site.", "links": [{"t": "Kew Gardens", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew_Gardens"}, {"t": "Kew", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew"}, {"t": "Kew Gardens station (London)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kew_Gardens_station_(London)"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.477058, -0.285241]}, "Kilburn": {"name": "Kilburn", "q": "Brent", "zone": "2", "head": "'Kilburn' probably means the cows' stream, or the royal stream.", "text": "The stream is the River Westbourne, now underground. It was first recorded in 1134 as Cuneburna. A priory stood where the Roman road crossed the stream.", "links": [{"t": "Kilburn, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn,_London"}, {"t": "Kilburn tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.547183, -0.204248]}, "Kilburn Park": {"name": "Kilburn Park", "q": "Brent", "zone": "2", "head": "'Kilburn' probably means the cows' stream, or the royal stream.", "text": "The stream is the River Westbourne, now underground. 'Park' was added for the new housing estate. The station opened in 1915.", "links": [{"t": "Kilburn, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn,_London"}, {"t": "Kilburn Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kilburn_Park_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.534979, -0.194232]}, "King's Cross St Pancras": {"name": "King's Cross St Pancras", "q": "Camden", "zone": "1", "head": "Named after a statue of King George IV, and the church of St Pancras.", "text": "The area was once called Battle Bridge, after a crossing of the River Fleet. A monument to George IV stood here from about 1830 to 1845; it was unpopular and soon removed. St Pancras was a boy martyred in Rome, by tradition in 304.", "links": [{"t": "King's Cross, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King's_Cross,_London"}, {"t": "St Pancras Old Church", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/St_Pancras_Old_Church"}, {"t": "King's Cross St Pancras tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/King's_Cross_St_Pancras_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.530663, -0.123194]}, "Kingsbury": {"name": "Kingsbury", "q": "Brent", "zone": "4", "head": "'Kingsbury' means the king's manor.", "text": "Nobody knows which king: by the time of the Domesday Book in 1086, the land was already in private hands. The station opened in 1932.", "links": [{"t": "Kingsbury, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kingsbury,_London"}, {"t": "Kingsbury tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Kingsbury_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.584845, -0.27879]}, "Knightsbridge": {"name": "Knightsbridge", "q": "Kensington and Chelsea", "zone": "1", "head": "'Knightsbridge' means the bridge of the young men.", "text": "Old English cniht meant a young man or servant, not yet a knight in armour. The bridge crossed the River Westbourne. The name was first recorded in about 1050.", "links": [{"t": "Knightsbridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Knightsbridge"}, {"t": "Knightsbridge tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Knightsbridge_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.501669, -0.160508]}, "Ladbroke Grove": {"name": "Ladbroke Grove", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after James Weller Ladbroke, who developed the area in the mid-19th century.", "text": "His family had owned the land since at least the early 17th century, and he named the main road after himself. The station opened in 1864 as Notting Hill.", "links": [{"t": "Ladbroke Grove", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ladbroke_Grove"}, {"t": "Ladbroke Grove tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ladbroke_Grove_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.517449, -0.210391]}, "Lambeth North": {"name": "Lambeth North", "q": "Lambeth", "zone": "1", "head": "'Lambeth' means the landing place for lambs.", "text": "It was recorded in 1062 as Lambehitha: hithe is an old word for a landing place on a river, as in Rotherhithe. The station opened in 1906 and was renamed Lambeth North in 1917.", "links": [{"t": "Lambeth", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lambeth"}, {"t": "Lambeth North tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lambeth_North_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.498808, -0.112315]}, "Lancaster Gate": {"name": "Lancaster Gate", "q": "Westminster", "zone": "1", "head": "Named after the Lancaster Gate entrance to Kensington Gardens.", "text": "It was named in honour of Queen Victoria, who was also Duke of Lancaster. The city of Lancaster itself takes its name from a Roman fort, a 'caster', on the River Lune.", "links": [{"t": "Lancaster Gate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lancaster_Gate"}, {"t": "Lancaster Gate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Lancaster_Gate_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.511723, -0.175494]}, "Latimer Road": {"name": "Latimer Road", "q": "Kensington and Chelsea", "zone": "2", "head": "Named after Edward Latymer, a London merchant who died in 1627.", "text": "He left land here in his will to help poor people of Hammersmith, and his money also founded Latymer School. The road ran through his property. The station opened in 1868.", "links": [{"t": "Edward Latymer", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Edward_Latymer"}, {"t": "Latimer Road tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Latimer_Road_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.513389, -0.217799]}, "Leicester Square": {"name": "Leicester Square", "q": "Westminster", "zone": "1", "head": "Named after the Earl of Leicester, who built Leicester House here.", "text": "The square was laid out in front of his house in the 1670s. The city of Leicester takes its name from a Celtic tribe and 'ceaster', a Roman town.", "links": [{"t": "Leicester Square", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leicester_Square"}, {"t": "Leicester Square tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leicester_Square_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.511386, -0.128426]}, "Leyton": {"name": "Leyton", "q": "Waltham Forest", "zone": "3", "head": "'Leyton' means the farm on the River Lea.", "text": "The Lea, or Lee, runs along the edge of the area. The station first opened in 1856 as Low Leyton and joined the Central line in 1947.", "links": [{"t": "Leyton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton"}, {"t": "Leyton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leyton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.556589, -0.005523]}, "Leytonstone": {"name": "Leytonstone", "q": "Waltham Forest", "zone": "3/4", "head": "'Leytonstone' means Leyton at the stone.", "text": "Leyton is the farm on the River Lea. The stone was probably an old Roman milestone or boundary stone near Hollybush Hill. Film director Alfred Hitchcock was born here in 1899.", "links": [{"t": "Leytonstone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone"}, {"t": "Leytonstone tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Leytonstone_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.568324, 0.008194]}, "Liverpool Street": {"name": "Liverpool Street", "q": "City of London", "zone": "1", "head": "Named after Lord Liverpool, Prime Minister from 1812 to 1827.", "text": "The street was named after him in the 1820s. His title comes from the city of Liverpool, first recorded in 1190 as Liuerpul, probably a pool or creek with muddy water. The station opened in 1875 as Bishopsgate.", "links": [{"t": "Robert Jenkinson, 2nd Earl of Liverpool", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Robert_Jenkinson,_2nd_Earl_of_Liverpool"}, {"t": "Liverpool Street station#Underground stations", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Liverpool_Street_station%23Underground_stations"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.517372, -0.083182]}, "London Bridge": {"name": "London Bridge", "q": "Southwark", "zone": "1", "head": "Named after London Bridge, the oldest crossing of the Thames in the city.", "text": "There has been a bridge here since Roman times. The main line station opened in 1836 and is the oldest railway terminus in central London still in use.", "links": [{"t": "London Bridge", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Bridge"}, {"t": "London Bridge station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/London_Bridge_station%23London_Underground"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.505721, -0.088873]}, "Loughton": {"name": "Loughton", "q": "Epping Forest", "zone": "6", "head": "'Loughton' means the farm of a man called Luhha.", "text": "It is in the Domesday Book of 1086 as Lochintuna. Much older is Loughton Camp, an Iron Age earthwork in the forest nearby.", "links": [{"t": "Loughton", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Loughton"}, {"t": "Loughton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Loughton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.641443, 0.055476]}, "Maida Vale": {"name": "Maida Vale", "q": "Westminster", "zone": "2", "head": "Named after a pub, the Hero of Maida, which recalled a battle in Italy.", "text": "In 1806 a British force under General Sir John Stuart beat the French at Maida, in Calabria. The pub opened beside the Edgware Road soon after, and the area took its name.", "links": [{"t": "Maida Vale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maida_Vale"}, {"t": "Battle of Maida", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Battle_of_Maida"}, {"t": "Maida Vale tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Maida_Vale_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.529777, -0.185758]}, "Manor House": {"name": "Manor House", "q": "Hackney", "zone": "2/3", "head": "Named after the Manor House, a pub on Green Lanes.", "text": "The inn stood on the road to the north and gave its name to the crossroads. The station opened in 1932.", "links": [{"t": "Manor House, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_House,_London"}, {"t": "Manor House tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Manor_House_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.570738, -0.096118]}, "Mansion House": {"name": "Mansion House", "q": "City of London", "zone": "1", "head": "Named after Mansion House, the official home of the Lord Mayor of the City of London.", "text": "The grand house was built in the 18th century. Bank and Cannon Street stations are actually a little closer to it.", "links": [{"t": "Mansion House, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mansion_House,_London"}, {"t": "Mansion House tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mansion_House_tube_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.512117, -0.094009]}, "Marble Arch": {"name": "Marble Arch", "q": "Westminster", "zone": "1", "head": "Named after the white marble arch designed by John Nash.", "text": "It was built in the 1820s as an entrance to Buckingham Palace and moved here in 1851. Nearby stood the Tyburn gallows, London's main place of execution for centuries.", "links": [{"t": "Marble Arch", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marble_Arch"}, {"t": "Marble Arch tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marble_Arch_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.513424, -0.158953]}, "Marylebone": {"name": "Marylebone", "q": "Westminster", "zone": "1", "head": "'Marylebone' means St Mary's church by the stream.", "text": "It was recorded in 1453 as Maryburne, after a church of St Mary by the Tyburn stream; the 'le' was added later. The station opened in 1907 as Great Central, after the railway company.", "links": [{"t": "Marylebone", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marylebone"}, {"t": "Marylebone station#London Underground", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Marylebone_station%23London_Underground"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.522322, -0.163207]}, "Mile End": {"name": "Mile End", "q": "Tower Hamlets", "zone": "2", "head": "Named because it lies one mile from Aldgate, the old City gate.", "text": "The name has been used since the 13th century, for the place where the first mile of the road to Essex ended.", "links": [{"t": "Mile End", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mile_End"}, {"t": "Mile End tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mile_End_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.525122, -0.03364]}, "Mill Hill East": {"name": "Mill Hill East", "q": "Barnet", "zone": "4", "head": "'Mill Hill' probably means the hill with a windmill.", "text": "No trace of the mill remains, but a nearby field is still called Mill Field. The Northern line reached the station in 1941; it was meant to go further, but the extension was never built.", "links": [{"t": "Mill Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mill_Hill"}, {"t": "Mill Hill East tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mill_Hill_East_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.608229, -0.209986]}, "Monument": {"name": "Monument", "q": "City of London", "zone": "1", "head": "Named after the Monument to the Great Fire of London of 1666.", "text": "The column was designed by Christopher Wren and Robert Hooke. It is 61 metres tall, which is the distance from its base to the place in Pudding Lane where the fire began.", "links": [{"t": "Monument to the Great Fire of London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Monument_to_the_Great_Fire_of_London"}, {"t": "Bank and Monument stations", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Bank_and_Monument_stations"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.5107, -0.085969]}, "Moor Park": {"name": "Moor Park", "q": "Hertfordshire", "zone": "6/7", "head": "Named after Moor Park, a Palladian mansion nearby.", "text": "It stands on the site of an earlier house called The More, which belonged to Cardinal Wolsey. The station opened in 1910 as Sandy Lodge.", "links": [{"t": "Moor Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moor_Park"}, {"t": "Moor Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moor_Park_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.629845, -0.432454]}, "Moorgate": {"name": "Moorgate", "q": "City of London", "zone": "1", "head": "Named after the Moorgate, a small gate in the City wall.", "text": "It led out to Moorfields, marshy ground outside the wall. The gate was demolished in 1762.", "links": [{"t": "Moorgate", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moorgate"}, {"t": "Moorgate station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Moorgate_station"}, {"t": "How the Circle line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-circle-line-stations-got-their-names"}], "ll": [51.518176, -0.088322]}, "Morden": {"name": "Morden", "q": "Merton", "zone": "4", "head": "'Morden' probably means the hill in the marshland.", "text": "It comes from Old English mōr, marsh, and dūn, hill. Morden is the end of the Northern line and the southernmost station on the Underground.", "links": [{"t": "Morden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Morden"}, {"t": "Morden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Morden_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.402142, -0.194839]}, "Mornington Crescent": {"name": "Mornington Crescent", "q": "Camden", "zone": "2", "head": "Named after the Earl of Mornington, elder brother of the Duke of Wellington.", "text": "Richard Wellesley, 2nd Earl of Mornington, was Governor-General of India and Foreign Secretary. The station also gave its name to a famous nonsense game on the BBC radio comedy I'm Sorry I Haven't a Clue.", "links": [{"t": "Mornington Crescent", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mornington_Crescent"}, {"t": "Mornington Crescent tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Mornington_Crescent_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.534679, -0.138789]}, "Neasden": {"name": "Neasden", "q": "Brent", "zone": "3", "head": "'Neasden' means the nose-shaped hill.", "text": "It comes from Old English næs, nose, and dūn, hill. The station opened in 1880 as Kingsbury & Neasden.", "links": [{"t": "Neasden", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Neasden"}, {"t": "Neasden tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Neasden_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.553986, -0.249837]}, "Newbury Park": {"name": "Newbury Park", "q": "Redbridge", "zone": "4", "head": "'Newbury' means the new manor.", "text": "The name is medieval. The station opened in 1947, when the Central line took over a branch railway.", "links": [{"t": "Newbury Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Newbury_Park"}, {"t": "Newbury Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Newbury_Park_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.575726, 0.090004]}, "Nine Elms": {"name": "Nine Elms", "q": "Wandsworth", "zone": "1", "head": "Named after a row of nine elm trees.", "text": "The name was first recorded around 1645. Since 1974 the area has been home to New Covent Garden Market, and the station opened in 2021.", "links": [{"t": "Nine Elms", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Nine_Elms"}, {"t": "Nine Elms tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Nine_Elms_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.479912, -0.128476]}, "North Acton": {"name": "North Acton", "q": "Ealing", "zone": "2/3", "head": "'Acton' means the farm by the oak trees.", "text": "It comes from Old English āc, oak, and tūn, farm. The station opened in 1923, north of the old town centre.", "links": [{"t": "Acton, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Acton,_London"}, {"t": "North Acton tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Acton_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.523524, -0.259755]}, "North Ealing": {"name": "North Ealing", "q": "Ealing", "zone": "3", "head": "'Ealing' means the people of a Saxon called Gilla.", "text": "The name was first recorded around 700 as Gillingas. North Ealing station opened in 1903.", "links": [{"t": "Ealing", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Ealing"}, {"t": "North Ealing tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Ealing_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.517505, -0.288868]}, "North Greenwich": {"name": "North Greenwich", "q": "Greenwich", "zone": "2/3", "head": "'Greenwich' means the green harbour or trading place.", "text": "It was first recorded in the early 10th century. The station, opened in 1999, is about two miles north-east of Greenwich itself, next to what was built as the Millennium Dome.", "links": [{"t": "Greenwich", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Greenwich"}, {"t": "North Greenwich tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Greenwich_tube_station"}, {"t": "How the Jubilee line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/jubilee-stations-etymology"}], "ll": [51.50047, 0.004287]}, "North Harrow": {"name": "North Harrow", "q": "Harrow", "zone": "5", "head": "'Harrow' comes from Old English hearg, a heathen temple or shrine.", "text": "The shrine probably stood on Harrow Hill, where St Mary's Church stands today. North Harrow station opened in 1915.", "links": [{"t": "Harrow, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Harrow,_London"}, {"t": "North Harrow tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Harrow_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.584872, -0.362408]}, "North Wembley": {"name": "North Wembley", "q": "Brent", "zone": "4", "head": "'Wembley' means the clearing of a Saxon called Wemba.", "text": "It ends in Old English leah, a clearing. Bakerloo trains have called here since 1917.", "links": [{"t": "Wembley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Wembley"}, {"t": "North Wembley station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/North_Wembley_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.562551, -0.304]}, "Northfields": {"name": "Northfields", "q": "Ealing", "zone": "3", "head": "Named after the north fields of Ealing.", "text": "The fields were farmland until houses were built in the early 20th century. The station opened in 1908 as Northfield Halt.", "links": [{"t": "Northfields, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northfields,_London"}, {"t": "Northfields tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northfields_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.499319, -0.314719]}, "Northolt": {"name": "Northolt", "q": "Ealing", "zone": "5", "head": "'Northolt' means the northern nook of land.", "text": "It comes from Old English north and healh, a corner or nook. Its partner to the south is Southall. The station opened on the Central line in 1948.", "links": [{"t": "Northolt", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northolt"}, {"t": "Northolt tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northolt_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.548236, -0.368699]}, "Northwick Park": {"name": "Northwick Park", "q": "Brent", "zone": "4", "head": "Named after Northwick Park, the open space beside the station.", "text": "The name is said to come from the Rushout family, who owned the farmland here and whose country seat was Northwick Park in the Cotswolds. The station opened in 1923 as Northwick Park & Kenton.", "links": [{"t": "Northwick Park", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwick_Park"}, {"t": "Northwick Park tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwick_Park_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.578481, -0.318056]}, "Northwood": {"name": "Northwood", "q": "Hillingdon", "zone": "6", "head": "'Northwood' means the wood to the north.", "text": "It was the wooded northern part of the old parish of Ruislip. The station opened in 1887.", "links": [{"t": "Northwood, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood,_London"}, {"t": "Northwood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.611053, -0.423829]}, "Northwood Hills": {"name": "Northwood Hills", "q": "Hillingdon", "zone": "6", "head": "Named after Northwood, the wood to the north of Ruislip, and its hills.", "text": "The station opened in 1933 for a new housing estate. Oddly, it stands a little lower than Northwood station.", "links": [{"t": "Northwood Hills", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_Hills"}, {"t": "Northwood Hills tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Northwood_Hills_tube_station"}, {"t": "How the Metropolitan line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/metropolitan-line-stations-names-etymology"}], "ll": [51.600572, -0.409464]}, "Notting Hill Gate": {"name": "Notting Hill Gate", "q": "Kensington and Chelsea", "zone": "1/2", "head": "'Notting' probably means the people of a man called Cnotta.", "text": "The name was recorded from the 14th century in many spellings, such as Knottynghull. The 'gate' was a toll gate on the road to Uxbridge.", "links": [{"t": "Notting Hill", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Notting_Hill"}, {"t": "Notting Hill Gate tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Notting_Hill_Gate_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.509128, -0.196104]}, "Oakwood": {"name": "Oakwood", "q": "Enfield", "zone": "5", "head": "Named after Oakwood Park, which takes its name from the oaks of Enfield Chase.", "text": "Enfield Chase was a royal hunting ground. The station opened in 1933 as Enfield West and became Oakwood in 1946.", "links": [{"t": "Oakwood, London", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oakwood,_London"}, {"t": "Oakwood tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oakwood_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.647726, -0.132182]}, "Old Street": {"name": "Old Street", "q": "Islington", "zone": "1", "head": "Named after the street, recorded as Ealdestrate around 1200.", "text": "The name simply means 'old street'. The road is probably Roman, nearly 2,000 years old.", "links": [{"t": "Old Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Old_Street"}, {"t": "Old Street station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Old_Street_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.525864, -0.08777]}, "Osterley": {"name": "Osterley", "q": "Hounslow", "zone": "4", "head": "'Osterley' probably means the clearing with a sheepfold.", "text": "It was first recorded in the 13th century. Osterley House was built for the merchant Sir Thomas Gresham in the 16th century and later remodelled by Robert Adam.", "links": [{"t": "Osterley", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Osterley"}, {"t": "Osterley tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Osterley_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.481274, -0.352224]}, "Oval": {"name": "Oval", "q": "Lambeth", "zone": "2", "head": "Named after the Oval cricket ground.", "text": "The name goes back to an oval-shaped street plan of the 1790s; the cricket ground was laid out inside it. Surrey County Cricket Club has played here since 1845.", "links": [{"t": "The Oval", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/The_Oval"}, {"t": "Oval tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oval_tube_station"}, {"t": "How the Northern line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-northern-line-stations-got-their-names"}], "ll": [51.48185, -0.112439]}, "Oxford Circus": {"name": "Oxford Circus", "q": "Westminster", "zone": "1", "head": "A 'circus' is a round place where roads meet; there was never a circus.", "text": "It is the crossing of Oxford Street and Regent Street. Oxford Street was the main road west towards Oxford.", "links": [{"t": "Oxford Circus", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Circus"}, {"t": "Oxford Street", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Street"}, {"t": "Oxford Circus tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Oxford_Circus_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.515224, -0.141903]}, "Paddington": {"name": "Paddington", "q": "Westminster", "zone": "1", "head": "'Paddington' means the farm of a man called Padda.", "text": "The name is Anglo-Saxon, with -ington meaning the settlement of someone's people. The station opened in 1863 on the first underground railway.", "links": [{"t": "Paddington", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Paddington"}, {"t": "Paddington tube station (Circle and Hammersmith & City lines)", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Paddington_tube_station_(Circle_and_Hammersmith_&_City_lines)"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.516581, -0.175689]}, "Park Royal": {"name": "Park Royal", "q": "Ealing", "zone": "3", "head": "Named after the Royal Agricultural Society's showground, opened here in 1903.", "text": "The show only stayed for a few years, but the name remained. The area later became one of London's largest industrial estates.", "links": [{"t": "Park Royal", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Park_Royal"}, {"t": "Park Royal tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Park_Royal_tube_station"}, {"t": "How the Piccadilly line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/piccadilly-line-stations-etymology"}], "ll": [51.527123, -0.284341]}, "Parsons Green": {"name": "Parsons Green", "q": "Hammersmith and Fulham", "zone": "2", "head": "Named after the parsonage of Fulham, which stood beside the green.", "text": "The village green still survives as a small park.", "links": [{"t": "Parsons Green", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Parsons_Green"}, {"t": "Parsons Green tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Parsons_Green_tube_station"}, {"t": "How the District line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/district-line-station-names"}], "ll": [51.475277, -0.20117]}, "Perivale": {"name": "Perivale", "q": "Ealing", "zone": "4", "head": "'Perivale' probably means the valley of pear trees.", "text": "It was first recorded in the early 16th century as Pyryvale. The station opened in 1904 as Perivale Halt and joined the Central line in 1947.", "links": [{"t": "Perivale", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Perivale"}, {"t": "Perivale tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Perivale_tube_station"}, {"t": "How the Central line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/how-the-central-line-stations-got-their-names"}], "ll": [51.536717, -0.323446]}, "Piccadilly Circus": {"name": "Piccadilly Circus", "q": "Westminster", "zone": "1", "head": "Named after 'piccadills', stiff lace collars fashionable around 1600.", "text": "A tailor, Robert Baker, made his fortune selling them and built a house here, nicknamed Pickadilly Hall. The name spread to the street and the circus, a round junction of roads.", "links": [{"t": "Piccadilly Circus", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly_Circus"}, {"t": "Piccadilly", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly"}, {"t": "Piccadilly Circus tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Piccadilly_Circus_tube_station"}, {"t": "How the Bakerloo line stations got their names", "s": "Londonist", "u": "https://londonist.com/london/transport/bakerloo_etymology"}], "ll": [51.51005, -0.133798]}, "Pimlico": {"name": "Pimlico", "q": "Westminster", "zone": "1", "head": "Nobody knows for sure where the name 'Pimlico' comes from.", "text": "One popular theory links it to Ben Pimlico, an innkeeper famous for his ale, but his tavern was in Hoxton, on the other side of London. The station opened with the Victoria line in 1972.", "links": [{"t": "Pimlico", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pimlico"}, {"t": "Pimlico tube station", "s": "Wikipedia", "u": "https://en.wikipedia.org/wiki/Pimlico_tube_station"}, {"t": "How the Victoria line stations g
